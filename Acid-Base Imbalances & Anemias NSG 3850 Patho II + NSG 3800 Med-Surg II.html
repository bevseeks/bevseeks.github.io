either makes big (megaloblastic) cells."], ["Reticulocytes", "Immature RBCs; a high count means the marrow is responding (hemolysis, bleeding); low means it cannot (aplastic, nutrient lack)."], ["Hct ≈ Hgb × 3", "Rule of thumb in a normally hydrated person (Patho slide)."]], "keyTerms": [["Anemia", "fewer RBCs, less hemoglobin, or lower hematocrit; ==never normal: look for the cause=="], ["Pancytopenia", "low RBCs, WBCs, and platelets"]], "whyItMatters": "Every anemia is a break in this chain: no signal, no raw material, a failed factory, or cells destroyed or lost too early.", "links": ["ida", "b12", "fol", "apl", "thal", "scd", "pv"], "cat": "Anemias & RBC Disorders"}, {"id": "cbc", "title": "Reading a CBC: size, color, and response", "color": "#475569", "summary": "Anemias are named by cell **size** (-cytic) and **color** (-chromic). Size comes from MCV, color from MCH/MCHC, and marrow response from the reticulocyte count.", "parts": [["MCV (size)", "↓ microcytic (iron deficiency, thalassemia); ↑ macrocytic (B12, folate); normal (aplastic, sickle cell, acute bleeding)."], ["MCH / MCHC (color)", "↓ hypochromic = pale cells with less hemoglobin (iron deficiency, thalassemia)."], ["RDW", "Variation in cell size; helps detect mixed anemias."], ["Reticulocytes", "↑ in hemolysis and bleeding; ↓ in aplastic and nutrient deficiency."], ["Hemolysis markers", "↑ indirect bilirubin (Galen 0.2 to 0.8 mg/dL), ↑ LDH (Galen 100 to 190 IU/L), ↓ haptoglobin."], ["Iron studies", "Ferritin = storage (falls first); serum iron = circulating; TIBC ↑ when iron is low (Galen 250 to 460 mcg/dL)."]], "whyItMatters": "Sort by size first and the list of possible anemias shrinks to two or three.", "check": {"prompt": "A client has low Hgb, high MCV, and a low reticulocyte count. Which two anemias are you thinking of, and what one assessment separates them?", "model": "B12 deficiency and folate deficiency (both macrocytic, poor marrow output). A neurologic exam separates them: paresthesia, lost position or vibration sense, or ataxia means B12.", "id": "bc-cbc", "keys": [{"label": "B12 deficiency", "any": ["b12", "cobalamin", "pernicious"]}, {"label": "folate deficiency", "any": ["folate", "folic"]}, {"label": "neuro exam separates them", "any": ["neuro", "nerve", "paresthes", "numb", "tingl", "balance", "position", "vibration", "gait"]}]}, "links": ["ida", "thal", "b12", "fol", "apl", "scd"], "cat": "Anemias & RBC Disorders"}, {"id": "b12fol", "title": "B12 and folate: two shared jobs, one unique job", "color": "#6d28d9", "summary": "Vitamin B12 and folate work together to build DNA, so a lack of either stops red cell precursors from dividing. ==Only B12 is also needed for myelin==, the insulation on nerves and spinal cord tracts. That single difference is the whole exam question.", "flow": ["Folate and B12 both feed the DNA-building pathway in dividing cells", "B12 activates the enzymes that move folate into a usable form", "Without either, cells grow but cannot divide → megaloblasts", "B12 alone also maintains myelin and nerve fatty acids", "Lose B12 → big cells + nerve damage; lose folate → big cells only"], "parts": [["Absorption differs", "B12 needs **intrinsic factor** from the stomach and absorption in the **ileum**; folate is absorbed in the proximal small intestine and needs no carrier."], ["Storage differs", "B12 stores last **years**; folate stores last **months** (Brunner), so folate deficiency appears faster."], ["Sources differ", "B12: animal foods (meat, seafood, egg yolk, dairy). Folate: green leafy vegetables, liver, citrus, beans, nuts, fortified grains."], ["Causes differ", "B12: absorption failure (pernicious anemia, gastrectomy, ileal disease, metformin, PPIs) and older age. Folate: alcohol, poor diet, pregnancy, hemolytic anemia, some drugs."], ["Masking", "Folic acid alone fixes the **blood count** of B12 deficiency but ==not the nerves==, so damage continues silently."]], "keyTerms": [["Megaloblast", "a very large, immature marrow cell that cannot divide normally"], ["Intrinsic factor", "stomach protein that carries B12 to the ileum; ==absent in pernicious anemia=="], ["Proprioception", "position sense; lost with B12-related spinal cord damage"]], "whyItMatters": "When you see big red cells, ask about nerves, the stomach and ileum, alcohol, and pregnancy. Those four questions sort B12 from folate.", "check": {"prompt": "Explain why a client with pernicious anemia given only folic acid could have a better Hgb but worse walking.", "model": "Folic acid restores DNA synthesis, so the marrow makes normal red cells and Hgb rises. It does nothing for myelin, which needs B12, so demyelination of peripheral nerves and spinal cord columns continues and gait and position sense worsen.", "id": "bc-b12fol", "keys": [{"label": "folic acid restores DNA synthesis so RBCs/Hgb improve", "any": ["dna", "red cell", "rbc", "hgb", "hemoglobin", "count", "anemia", "blood"]}, {"label": "it does not fix myelin (needs B12)", "any": ["myelin", "nerve", "neuro"]}, {"label": "so nerve damage continues", "any": ["continu", "progress", "worse", "still", "keep", "ongoing"]}, {"label": "affecting gait/position sense/spinal cord", "any": ["walk", "gait", "balance", "position", "spinal", "proprio", "numb"]}]}, "links": ["b12", "fol"], "cat": "Anemias & RBC Disorders"}], "readings": [{"id": "bru10", "chapter": "Chapter 10", "title": "Fluid and Electrolytes: Balance and Disturbance (acid-base section)", "source": "Hinkle & Cheever, Brunner & Suddarth's Textbook of Medical-Surgical Nursing, 15th ed., pp. 258 to 264 (syllabus)", "color": "#a3460a", "summary": "This section explains how buffers, lungs, and kidneys hold pH between 7.35 and 7.45 using the 20:1 bicarbonate-to-carbonic-acid ratio, then walks through the four single disturbances with causes, signs, ABG findings, and treatment, plus mixed disorders, compensation, and blood gas analysis.", "keyPoints": ["==It is the 20:1 ratio of HCO₃⁻ to H₂CO₃, not the absolute values, that sets pH.==", "Kidneys compensate in hours to days and cannot compensate when they cause the acidosis; lungs compensate in minutes.", "Metabolic acidosis: anion gap (normal 8 to 12 without K⁺) separates acid gain (high gap) from bicarbonate loss (normal gap).", "==K⁺ rises in acidosis and can fall quickly when acidosis is corrected==; monitor the ECG.", "Metabolic alkalosis: vomiting, gastric suction, diuretics; signs come from low ionized calcium; treat with normal saline, KCl, acid-reducing drugs, or acetazolamide in heart failure.", "Respiratory acidosis: improve ventilation; ==give O₂ cautiously when PaCO₂ is chronically > 50== (hypoxic drive); lower CO₂ gradually on a ventilator.", "Respiratory alkalosis: lightheadedness from cerebral vasoconstriction, tingling from low ionized calcium; slow breathing or rebreathe; check a toxicology screen for salicylates.", "A normal pH with abnormal PaCO₂ and HCO₃⁻ suggests a compensated or mixed disorder; always interpret ABGs with the history and electrolytes.", "Note: Brunner lists HCO₃⁻ 22 to 26 mEq/L; ==this guide uses Galen's 22 to 28==."], "links": ["ra", "rk", "ma", "mk"], "book": "Med-Surg: Brunner & Suddarth", "short": "Fluid and Electrolytes: Balance and Disturbance"}, {"id": "bru29", "chapter": "Chapter 29", "title": "Management of Patients with Nonmalignant Hematologic Disorders (anemias)", "source": "Hinkle & Cheever, Brunner & Suddarth 15th ed., pp. 909 to 925 (syllabus)", "color": "#9f1239", "summary": "Anemia is a sign of an underlying disorder, classified as hypoproliferative (low production), bleeding, or hemolytic. The chapter covers assessment and nursing care for anemia, then iron deficiency, aplastic, megaloblastic (folate and B12), and hemolytic anemias including sickle cell disease and thalassemia.", "keyPoints": ["Classify anemia by production, bleeding, or destruction; reticulocytes, MCV, and bilirubin point the way (Table 29-1).", "==In iron deficiency, blood loss is the cause until proven otherwise==; GI bleeding in men and postmenopausal women, menorrhagia and pregnancy in younger women.", "Oral iron: empty stomach with vitamin C, black stools expected, continue 6 to 12 months; IV iron carries anaphylaxis risk (Charts 29-2, 29-3).", "Aplastic anemia is T-cell mediated pancytopenia; HSCT can cure clients under 60; ATG plus cyclosporine otherwise; infection and bleeding cause most deaths.", "==Megaloblastic anemias: neurologic signs occur only with B12 deficiency and persist unless B12 is replaced==; pernicious anemia needs lifelong B12, usually monthly IM.", "Folate stores last months, B12 stores years; alcohol, pregnancy, and hemolytic anemia raise folate needs; folic acid 1 mg daily treats most cases.", "Hemolysis: ↑ reticulocytes, ↑ indirect bilirubin, ↓ haptoglobin.", "Sickle cell disease: hydration, oxygen, prompt pain control (PCA), warmth not ice, vaccines, incentive spirometry; ==acute chest syndrome and stroke are leading killers==; hydroxyurea raises fetal hemoglobin.", "Thalassemias: impaired globin chains, microcytosis, hemolysis; major forms need transfusion and iron chelation."], "keyTerms": [["Hypoproliferative", "anemia from too little production"], ["Hemolysis", "early destruction of red cells"], ["Acute chest syndrome", "fever, respiratory distress, and new infiltrates in sickle cell disease"]], "links": ["ida", "apl", "b12", "fol", "thal", "scd"], "book": "Med-Surg: Brunner & Suddarth", "short": "Management of Patients with Nonmalignant Hematologic Disorders"}, {"id": "bru30", "chapter": "Chapter 30", "title": "Management of Patients with Hematologic Neoplasms (polycythemia vera)", "source": "Hinkle & Cheever, Brunner & Suddarth 15th ed., pp. 965 to 966 (syllabus)", "color": "#7a5a00", "summary": "Polycythemia vera is a myeloproliferative neoplasm in which a hypercellular marrow raises RBCs, WBCs, and platelets, thickening the blood. Care centers on preventing thrombosis without causing bleeding, with phlebotomy, low-dose aspirin, and cytoreductive drugs.", "keyPoints": ["Viscosity causes headache, dizziness, vision changes, ruddy complexion, angina, claudication, hypertension; ==pruritus after water contact== and burning fingers/toes are classic.", "Uric acid rises, causing gout and kidney stones; diagnosis includes the JAK2 mutation.", "==Thrombosis (stroke, MI) is the most common cause of death==; bleeding can also occur.", "==Phlebotomy keeps Hct below 45%== and induces iron deficiency so RBC production slows.", "Low-dose aspirin is recommended for all clients unless bleeding; hold aspirin if bleeding occurs.", "Hydroxyurea, interferon-alfa, and ruxolitinib reduce counts; anagrelide is reserved for refractory cases.", "Nursing: fatigue and pruritus care (tepid baths), DVT prevention, bleeding teaching, ==avoid iron supplements=="], "links": ["pv"], "book": "Med-Surg: Brunner & Suddarth", "short": "Management of Patients with Hematologic Neoplasms"}, {"id": "ban13", "chapter": "Chapter 13 (Patho)", "title": "Alterations in Oxygen Transport", "source": "Banasik, Pathophysiology 7th ed., Ch. 13, pp. 271 to 297 (cited on your Patho slides)", "color": "#6d28d9", "summary": "Banasik explains oxygen transport by hemoglobin, the general effects of anemia, and each anemia's etiology, laboratory features, manifestations, and treatment, then the polycythemias. Table 13.5 compares laboratory findings across erythrocyte disorders.", "keyPoints": ["About 97% of oxygen is carried on hemoglobin; only 3% is dissolved and measured as PaO₂.", "General anemia effects come from tissue hypoxia plus compensation: pallor, tachycardia, tachypnea, dyspnea, ischemic pain.", "==B12 and folate deficiency both disrupt DNA synthesis in blast cells → megaloblasts==, macrocytosis, hypersegmented neutrophils, and low counts (not as low as aplastic).", "==Pernicious anemia lacks intrinsic factor (autoimmune); neurologic disease (paresthesias, lost vibration and position sense, spastic ataxia, megaloblastic madness) is characteristic of B12, not folate.==", "Folate deficiency: dietary, alcoholism, cirrhosis, pregnancy, infancy; may show depression, irritability, and sleep loss but not the spinal cord disease.", "Pre-pregnancy folic acid 1 mg/day is the largest dose that will not mask B12 deficiency; hypokalemia can follow B12 therapy.", "Iron deficiency: microcytic, hypochromic, ferritin < 10 ng/mL, TIBC ↑; most common cause men occult GI bleeding, women menorrhagia.", "Thalassemia: defective globin chains, microcytic, but serum iron, TIBC, and ferritin normal (Table 13.5).", "Sickle cell: HbS polymerizes when deoxygenated; Polycythemia vera: neoplastic stem cell with ↑ all three lines and low EPO."], "links": ["ida", "b12", "fol", "apl", "thal", "scd", "pv"], "book": "Patho: Banasik", "short": "Alterations in Oxygen Transport"}, {"id": "fp9", "chapter": "F&P Chapter 9", "title": "Drug Therapy for Coagulation Disorders (anagrelide)", "source": "Frandsen & Pennington, Abrams' Clinical Drug Therapy, 13th ed. (2025), Ch. 9; syllabus assigns anagrelide", "color": "#7a5a00", "summary": "The chapter covers anticoagulant, antiplatelet, and thrombolytic drugs. Anagrelide inhibits platelet aggregation at higher doses but is used at smaller doses to reduce platelet production in disorders with excess platelets.", "keyPoints": ["Antiplatelet drugs prevent arterial clots by stopping platelets from clumping.", "==Anagrelide lowers the platelet count==; doses to reduce production are smaller than those to inhibit aggregation.", "Watch for bleeding with any antiplatelet drug, especially combined with aspirin or anticoagulants."], "links": ["pv"], "book": "Pharmacology: Frandsen & Pennington", "short": "Drug Therapy for Coagulation Disorders (anagrelide)"}, {"id": "fp13", "chapter": "F&P Chapter 13", "title": "Drug Therapy to Decrease Immunity (cyclosporine, ATG)", "source": "Frandsen & Pennington, Abrams' Clinical Drug Therapy, 13th ed., Ch. 13", "color": "#475569", "summary": "Immunosuppressants prevent the immune system from attacking transplanted tissue or the body's own cells. ATG (equine Atgam or rabbit Thymoglobulin) destroys T lymphocytes and is used for aplastic anemia in clients who are not transplant candidates; cyclosporine blocks T-cell activation.", "keyPoints": ["ATG contains antibodies that ==lower circulating T cells==, suppressing the immune attack.", "Atgam requires a skin test for horse-serum allergy; ==emergency airway and allergy equipment must be at the bedside==.", "ATG carries an FDA warning restricting use to experienced prescribers.", "Cyclosporine requires level monitoring and watching for nephrotoxicity, hypertension, and infection."], "links": ["apl"], "book": "Pharmacology: Frandsen & Pennington", "short": "Drug Therapy to Decrease Immunity (cyclosporine, ATG)"}, {"id": "fp16", "chapter": "F&P Chapter 16", "title": "Drug Therapy to Decrease Pain, Fever, and Inflammation (ibuprofen)", "source": "Frandsen & Pennington, Abrams' Clinical Drug Therapy, 13th ed., Ch. 16", "color": "#7c2d12", "summary": "NSAIDs such as ibuprofen block prostaglandin synthesis to relieve mild to moderate pain, fever, and inflammation. Older adults on long-term ibuprofen are monitored for GI blood loss, kidney dysfunction, edema, and hypertension.", "keyPoints": ["Ibuprofen relieves mild to moderate pain, inflammation, and fever.", "==Monitor for GI bleeding and kidney dysfunction==, especially in older adults and long-term use.", "A gastroprotective agent is recommended when upper GI bleeding risk is high."], "links": ["scd"], "book": "Pharmacology: Frandsen & Pennington", "short": "Drug Therapy to Decrease Pain, Fever, and Inflammation (ibuprofen)"}, {"id": "fp33", "chapter": "F&P Chapter 33", "title": "Drug Therapy for Asthma, Airway Inflammation, and Bronchoconstriction (albuterol, ipratropium)", "source": "Frandsen & Pennington, Abrams' Clinical Drug Therapy, 13th ed., Ch. 33", "color": "#a3460a", "summary": "Bronchodilators open airways. Albuterol, the prototype short-acting beta₂ agonist, is a rescue inhaler; ipratropium, related to atropine, blocks muscarinic receptors to prevent bronchoconstriction and mucus secretion, mainly for maintenance in COPD.", "keyPoints": ["==Albuterol is the rescue (short-acting) bronchodilator==; long-acting agents are for maintenance.", "Ipratropium: onset 5 to 15 minutes; blocks acetylcholine at bronchial muscarinic receptors.", "Ipratropium is contraindicated with allergy to atropine or related drugs.", "Both improve ventilation, which is how they treat respiratory acidosis."], "links": ["ra"], "book": "Pharmacology: Frandsen & Pennington", "short": "Drug Therapy for Asthma, Airway Inflammation, and Bronchoconstriction (albuterol, ipratropium)"}, {"id": "fp35", "chapter": "F&P Chapter 35", "title": "Nutritional Support Products, Vitamins, and Mineral Supplements (folic acid, B12, ferrous sulfate, KCl, sodium bicarbonate)", "source": "Frandsen & Pennington, Abrams' Clinical Drug Therapy, 13th ed., Ch. 35", "color": "#1d4ed8", "summary": "This chapter covers vitamin and mineral replacement. B12 and folic acid deficiencies both cause megaloblastic anemia, so the deficient vitamin must be identified before treatment; ferrous sulfate is the prototype iron; electrolyte agents correct potassium and acid-base problems.", "keyPoints": ["==Pernicious anemia: B12 must be injected (oral forms are not absorbed without IF) and continued for life.==", "==Folic acid alone relieves the anemia of pernicious anemia but lets neurologic deterioration continue==; it is contraindicated in undiagnosed anemia.", "B12 adverse effect: hypokalemia; folic acid's most serious (rare) effect: bronchospasm.", "Folic acid before and during pregnancy reduces neural tube defects.", "Metformin and omeprazole reduce B12 absorption; methotrexate and phenytoin antagonize folate; alcohol impairs folate storage.", "Ferrous sulfate contains 20% elemental iron; only 10 to 15% of dietary iron is absorbed; excess iron turns stool dark green or black."], "links": ["b12", "fol", "ida", "mk", "ma"], "book": "Pharmacology: Frandsen & Pennington", "short": "Nutritional Support Products, Vitamins, and Mineral Supplements (folic acid, B12, ferrous sulfate, KCl, sodium bicarbonate)"}, {"id": "fp37", "chapter": "F&P Chapter 37", "title": "Drug Therapy for Peptic Ulcer Disease and Hyperacidity (cimetidine)", "source": "Frandsen & Pennington, Abrams' Clinical Drug Therapy, 13th ed., Ch. 37", "color": "#1f7a45", "summary": "H₂ receptor antagonists such as cimetidine reduce gastric acid secretion and are available by prescription and over the counter. Cimetidine inhibits liver drug metabolism and can increase the toxic effects of other drugs.", "keyPoints": ["H₂ blockers reduce HCl production by parietal cells; in metabolic alkalosis this reduces acid lost to gastric suction.", "==Cimetidine inhibits hepatic drug metabolism==, raising levels of drugs such as warfarin and phenytoin.", "Long-term acid suppression can reduce B12 and iron absorption."], "links": ["mk"], "book": "Pharmacology: Frandsen & Pennington", "short": "Drug Therapy for Peptic Ulcer Disease and Hyperacidity (cimetidine)"}, {"id": "fp49", "chapter": "F&P Chapter 49", "title": "Drug Therapy with Opioids (hydromorphone, PCA)", "source": "Frandsen & Pennington, Abrams' Clinical Drug Therapy, 13th ed., Ch. 49", "color": "#7c2d12", "summary": "Opioids bind CNS receptors to relieve severe pain. Hydromorphone is a Schedule II semisynthetic morphine derivative. Patient-controlled analgesia lets a cognitively able client self-administer preset IV doses with a lockout interval.", "keyPoints": ["==PCA requires a client who is cognitively able to participate== (Box 49.2).", "Know whether the client is opioid-tolerant or opioid-naive before PCA.", "Assess pain and sedation after starting PCA, after any setting change, and per protocol.", "Respiratory depression is the life-threatening opioid effect; naloxone is the antidote."], "links": ["scd"], "book": "Pharmacology: Frandsen & Pennington", "short": "Drug Therapy with Opioids (hydromorphone, PCA)"}]};

/* ---------- visual pathophysiology ---------- */
function arrowSVG(){return '<svg class="pv-arrow" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 1v22M4 16l8 9 8-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function flowNodes(steps,lab){
  lab=lab||{};var n=steps.length;
  return steps.map(function(s,i){
    var txt=typeof s==='string'?s:s.t;
    var kind=i===0?'trigger':(i===n-1?'result':'mid');
    var tag=i===0?(lab.first||'Trigger'):(i===n-1?(lab.last||'Net result'):'Step '+(i+1));
    var pct=n>1?Math.round(8+i/(n-1)*20):16;
    return '<div class="pv-node '+kind+'" style="--p:'+pct+'%"><span class="pv-tag">'+tag+'</span><p>'+md(txt)+'</p></div>'+(i<n-1?arrowSVG():'');
  }).join('');
}
function pathoVisual(c){
  var p=c.patho,h='<div class="pv"><div class="pv-main"><div class="pv-col">'+flowNodes(p.chain)+'</div>';
  if(p.compensation||p.tip){
    h+='<div class="pv-side">';
    if(p.compensation)h+='<div class="pv-comp"><span class="pv-tag">Body compensates</span><p>'+md(p.compensation)+'</p></div>';
    if(p.tip)h+='<div class="pv-tip"><span class="pv-tag">Memory aid</span><p>'+md(p.tip)+'</p></div>';
    h+='</div>';
  }
  h+='</div><div class="pv-signs">'+arrowSVG()+'<span class="pv-tag">What the nurse sees</span><div class="chipsrow">'+
    c.manifestations.map(function(m){return '<span class="chipsign">'+md(m[0])+'</span>'}).join('')+'</div></div></div>';
  return h;
}

/* ---------- drug cards ---------- */
function listUL(a){return a&&a.length?'<ul class="plain">'+a.map(function(x){return '<li>'+md(x)+'</li>'}).join('')+'</ul>':'<p class="muted">Not listed in your materials.</p>'}
function drugKey(c,d){return 'd-'+c.id+'-'+String(d.id||d.generic).replace(/[^a-z0-9]+/gi,'-').toLowerCase()}
function vf(d,f){return d.verify&&d.verify.indexOf(f)>-1?'<span class="vfy" title="Not found in your materials. Verify before relying on it.">\u2691 Verify</span>':''}
function dsec(n,title,badge,body,wide){return '<section class="ds'+(wide?' wide':'')+'"><h5><span class="dnum">'+n+'</span>'+title+badge+'</h5>'+body+'</section>'}
function pairRows(list){return list&&list.length?list.map(function(r){return '<div class="row"><b>'+md(r[0])+'</b>'+(r[1]?'<span class="val">'+md(r[1])+'</span>':'')+'</div>'}).join(''):'<p class="muted">Not listed in your materials.</p>'}
var VLAB={names:'names and class',moa:'mechanism',indications:'indications',dose:'dose and route',assess:'assessments and labs',effects:'side effects',avoid:'contraindications and interactions',teach:'patient education'};
function drugCard(c,d,openFirst){
  var k=drugKey(c,d),isOpen=S.dopen[k]!==undefined?S.dopen[k]:!!openFirst;
  var e=d.effects||{},a=d.assess||{},v=d.avoid||{};
  var h='<details class="card drug" id="'+k+'" style="--c:'+c.color+'"'+(isOpen?' open':'')+'><summary><span class="dn"><b>'+esc(d.generic)+'</b>'+(d.brands&&d.brands.length?'<small>'+esc(d.brands.join(', '))+'</small>':'')+'</span><span class="dpills"><span class="dpill">'+esc(d.cls)+'</span>'+(d.suffix?'<span class="dpill sfx">'+esc(d.suffix)+'</span>':'')+'</span></summary><div class="body">';
  if(e.boxed)h+='<div class="boxed"><b>\u26D4 Black box warning:</b> '+md(e.boxed)+'</div>';
  h+='<div class="dgrid">';
  h+=dsec('1','Names, class, suffix',vf(d,'names'),'<div class="names"><b>Generic</b><span>'+esc(d.generic)+'</span><b>Brand</b><span>'+(d.brands&&d.brands.length?esc(d.brands.join(', ')):'Not listed')+'</span><b>Class</b><span>'+md(d.cls)+'</span><b>Suffix</b><span>'+(d.suffix?esc(d.suffix):'No standard suffix')+'</span></div>');
  h+=dsec('2','Mechanism of action',vf(d,'moa'),'<p>'+md(d.moa)+'</p>');
  h+=dsec('3','Indications: why it is prescribed',vf(d,'indications'),listUL(d.indications));
  h+=dsec('4','Safe dose and route',vf(d,'dose'),'<div>'+(d.dose||[]).map(function(r){return '<div class="drow"><b>'+md(r[0])+'</b><span>'+md(r[1])+'</span></div>'}).join('')+'</div>');
  h+=dsec('5','Key assessments and labs',vf(d,'assess'),'<div class="sub">Before giving</div>'+pairRows(a.before)+'<div class="sub">After giving and ongoing</div>'+pairRows(a.after),true);
  h+=dsec('6','Side effects and adverse reactions',vf(d,'effects'),'<div class="fx"><div class="ok"><h6>Common and expected</h6>'+listUL(e.common)+'</div><div class="no"><h6>Life-threatening: report or hold</h6>'+listUL(e.serious)+'</div></div>',true);
  h+=dsec('7','Contraindications and interactions',vf(d,'avoid'),'<div class="sub">Who should not take it</div>'+listUL(v.contra)+'<div class="sub">Major drug and food clashes</div>'+listUL(v.interactions));
  h+=dsec('8','Patient education: teach and report',vf(d,'teach'),listUL(d.teach));

  return h+'</div></details>';
}
function medsHTML(c){

var PLAB={indication:'why it is done',steps:'steps',before:'before',during:'during',after:'after',complications:'complications',teach:'patient teaching'};

/* ---------- ABG interpreter (Galen ranges) ---------- */
var ABG={ph:7.40,co2:40,hco3:24,show:{}};
var CASES=[
 ['Post-op client on opioid PCA, RR 8',7.28,58,26],
 ['Client with type 1 diabetes, deep rapid breathing',7.29,30,15],
 ['Panic attack, tingling fingers',7.52,28,24],
 ['NG suction for 3 days, K⁺ 2.9',7.53,48,36],
 ['Long-standing COPD, stable clinic visit',7.37,58,33],
 ['Severe diarrhea for 4 days',7.30,40,17],
 ['Patho slide: pH 7.28, HCO₃⁻ 16, PaCO₂ 40',7.28,40,16],
 ['Patho slide: compensated metabolic acidosis',7.36,30,17],
 ['Cardiac arrest during resuscitation',7.12,60,16],
 ['Overuse of antacids',7.49,42,33]
];
function interp(ph,co2,hco3){
 var st=[],pd=ph<7.35?'acid':ph>7.45?'alk':'norm';
 var cd=co2>45?'acid':co2<35?'alk':'norm';
 var hd=hco3<22?'acid':hco3>28?'alk':'norm';
 function w(x){return x==='acid'?'acidosis':x==='alk'?'alkalosis':'normal'}
 st.push('pH '+ph.toFixed(2)+': '+(pd==='norm'?'within 7.35 to 7.45':pd==='acid'?'below 7.35, so <b>acidosis</b>':'above 7.45, so <b>alkalosis</b>')+'.');
 st.push('PaCO₂ '+co2+' mmHg: '+(cd==='norm'?'normal (35 to 45)':cd==='acid'?'high, the lungs are pushing toward acidosis':'low, the lungs are pushing toward alkalosis')+'.');
 st.push('HCO₃⁻ '+hco3+' mEq/L: '+(hd==='norm'?'normal (22 to 28, Galen)':hd==='acid'?'low, the kidneys/metabolism are pushing toward acidosis':'high, pushing toward alkalosis')+'.');
 var name,comp;
 if(pd==='norm'){
  if(cd==='norm'&&hd==='norm'){return {name:'Normal ABG',steps:st.concat(['All three values are within Galen ranges.'])}}
  var dir=ph<7.40?'acid':'alk';
  if(cd!=='norm'&&hd!=='norm'&&cd!==hd){
   var prim=cd===dir?'Respiratory':'Metabolic';
   name='Fully compensated '+prim.toLowerCase()+' '+w(dir);
   st.push('pH is normal but both other values are abnormal, so the body has fully compensated. pH '+(dir==='acid'?'below':'at or above')+' 7.40 points to an original '+w(dir)+', and the '+(prim==='Respiratory'?'PaCO₂':'HCO₃⁻')+' matches that direction, so it is the primary problem.');
   return {name:name,steps:st};
  }
  return {name:'Check values',steps:st.concat(['pH is normal with only one abnormal value. Recheck the numbers or consider a lab or early-change situation.'])};
 }
 var r=cd===pd,m=hd===pd;
 if(r&&m){name='Mixed respiratory and metabolic '+w(pd);st.push('Both PaCO₂ and HCO₃⁻ push the pH the same way, so two problems are present at once. This is dangerous: no system is compensating.');return {name:name,steps:st}}
 if(!r&&!m){return {name:'Check values',steps:st.concat(['Neither PaCO₂ nor HCO₃⁻ explains this pH. Recheck the numbers.'])}}
 var prim2=r?'Respiratory':'Metabolic',other=r?hd:cd;
 comp=other==='norm'?'Uncompensated':'Partially compensated';
 st.push((r?'PaCO₂':'HCO₃⁻')+' matches the pH direction, so the primary problem is <b>'+prim2.toLowerCase()+'</b>. ROME: '+(r?'Respiratory Opposite (pH and PaCO₂ move opposite).':'Metabolic Equal (pH and HCO₃⁻ move the same way).'));
 st.push(other==='norm'?('The '+(r?'HCO₃⁻':'PaCO₂')+' is normal, so the '+(r?'kidneys':'lungs')+' have not compensated yet: <b>uncompensated</b>.'):('The '+(r?'HCO₃⁻':'PaCO₂')+' is moving the opposite way to pull pH back, but pH is still abnormal: <b>partially compensated</b>.'));
 return {name:comp+' '+prim2.toLowerCase()+' '+w(pd),steps:st};
}
function tagv(v,lo,hi){return v<lo?'<span class="tagv lo">LOW</span>':v>hi?'<span class="tagv hi">HIGH</span>':'<span class="tagv ok">NORMAL</span>'}
function abgOut(){
 var r=interp(ABG.ph,ABG.co2,ABG.hco3);
 return '<h3>'+r.name+'</h3><ol>'+r.steps.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>';
}

}
function abgView(){
 var h='<p class="intro">Move the sliders and read the step-by-step interpretation. Ranges are Galen Standardized Values (HCO₃⁻ 22 to 28). Then try the practice cases: decide first, then reveal.</p><div class="abg"><div class="card">'+
  slider('ph','pH',6.9,7.8,0.01,ABG.ph.toFixed(2),7.35,7.45,'')+slider('co2','PaCO₂',15,90,1,ABG.co2,35,45,'mmHg')+slider('hco3','HCO₃⁻',8,50,1,ABG.hco3,22,28,'mEq/L')+
  '<div class="note"><b>Steps:</b> 1) pH: acid or base? 2) PaCO₂: lung. 3) HCO₃⁻: kidney. 4) Which one matches the pH? That is the primary. 5) Is the other moving opposite? That is compensation.</div></div>'+
  '<div class="card res" id="abgres">'+abgOut()+'</div></div><div class="ttl">Practice cases</div>';

 });

}

    [['Situation',c.sbar.s],['Background',c.sbar.b],['Assessment',c.sbar.a],['Recommendation',c.sbar.r]].map(function(r){return '<div class="seg"><b>'+r[0]+'</b>'+md(r[1])+'</div>'}).join('')+'</div>';
  if(ci===0||S.shownorm){h+=normalsHTML()}else{h+='<button class="lnk" data-a="shownorm" style="margin-top:14px">Show the Galen normal values</button>'}
  h+=pager('cond',ci,D.conditions.length,condLabel,true);
  return h;
}

/* ---------- explain-it-back grading (meaning, not wording) ---------- */
var SC={drafts:{},res:{},busy:{}};
try{SC.drafts=JSON.parse(localStorage.getItem('sg:'+ID+':scd')||'{}')||{}}catch(e){}
var CHECKS={};
(D.selfChecks||[]).forEach(function(x){if(x.id)CHECKS[x.id]=x});
(D.basics||[]).forEach(function(b){if(b.check&&b.check.id)CHECKS[b.check.id]=b.check});
var SAMPLE=null,SAMPLE_OFF=false;
try{if(window.claude&&claude.use)claude.use('sample').then(function(s){SAMPLE=s}).catch(function(){})}catch(e){}
function selfCheckHTML(chk,color){
  var id=chk.id||'',r=SC.res[id];
  return '<div class="selfcheck" style="--c:'+color+'"><b>Stop and explain it back</b><p>'+md(chk.prompt)+'</p>'+
   '<textarea data-sc="'+esc(id)+'" placeholder="Explain it in your own words. Your wording does not need to match; the reasoning does." aria-label="Your explanation">'+esc(SC.drafts[id]||'')+'</textarea>'+
   '<div class="scbtns"><button class="btn primary" data-a="scgrade" data-v="'+esc(id)+'">Check my answer</button><button class="btn" data-a="model">Show model answer</button></div>'+
   '<div class="model note">'+md(chk.model)+'</div>'+
   '<div class="scres" id="scres-'+esc(id)+'" aria-live="polite">'+(r?scResHTML(r):'')+'</div></div>';
}
function scResHTML(r){
  var lab={correct:['ok','✓ Correct','Your reasoning matches. Wording does not have to be exact.'],partly:['warn','Almost there',''],not_yet:['bad','Not yet','']}[r.verdict]||['warn','Checked',''];
  var h='<div class="scv '+lab[0]+'"><b>'+lab[1]+'</b> '+esc(r.feedback||lab[2]);
  if(r.missing&&r.missing.length&&r.verdict!=='correct')h+='<div class="scmiss">Add: '+r.missing.map(esc).join('; ')+'</div>';
  if(r.how)h+='<small>'+esc(r.how)+'</small>';
  return h+'</div>';
}
function norm(t){return ' '+String(t).toLowerCase().replace(/[₀-₉]/g,function(c){return String(c.charCodeAt(0)-8320)}).replace(/[⁺]/g,'+').replace(/[^a-z0-9+]+/g,' ')+' '}
function localGrade(text,chk){
  var t=norm(text),keys=chk.keys||[],hit=[],miss=[];
  keys.forEach(function(k){(k.any.some(function(w){return t.indexOf(norm(w).trim())>-1})?hit:miss).push(k.label)});
  var ratio=keys.length?hit.length/keys.length:0,words=t.trim().split(' ').length;
  var v=words<5?'not_yet':ratio>=0.6?'correct':ratio>=0.34?'partly':'not_yet';
  return {verdict:v,feedback:v==='correct'?'Your explanation covers the key ideas.':v==='partly'?'You have part of the reasoning.':'Your explanation is missing most of the key ideas.',missing:v==='correct'?[]:miss,how:'Checked offline by key ideas. Compare with the model answer.'};
}
function gradePrompt(chk,ans){
  return 'You are a supportive nursing instructor grading a student\'s "explain it back" answer for a pathophysiology/med-surg study guide.\n'+
   'Judge MEANING, not wording. The student does not need to match the model answer word for word. Mark "correct" when the core reasoning is right and the main mechanism is present, even if phrased differently, simplified, or missing minor details. Mark "partly" only if a central idea is missing or there is a real error. Mark "not_yet" if the reasoning is wrong or absent.\n\n'+
   'QUESTION: '+chk.prompt.replace(/\*\*|==/g,'')+'\n\nMODEL ANSWER: '+chk.model.replace(/\*\*|==/g,'')+'\n\nKEY IDEAS: '+(chk.keys||[]).map(function(k){return k.label}).join('; ')+'\n\nSTUDENT ANSWER: '+ans.slice(0,3000)+'\n\n'+
   'Reply with only JSON: {"verdict":"correct"|"partly"|"not_yet","feedback":"1-2 warm, specific sentences addressed to the student","missing":["short phrases for key ideas still missing; empty if correct"]}';
}
function scGrade(id,btn){
  var chk=CHECKS[id],ta=document.querySelector('textarea[data-sc="'+id+'"]'),out=document.getElementById('scres-'+id);
  if(!chk||!ta||SC.busy[id])return;
  var ans=ta.value.trim();
  if(ans.length<10){out.innerHTML='<div class="scv warn">Type your explanation first, then check it.</div>';return}
  function done(r){SC.res[id]=r;SC.busy[id]=false;btn.disabled=false;btn.textContent='Check my answer';var o=document.getElementById('scres-'+id);if(o)o.innerHTML=scResHTML(r)}
  if(!SAMPLE||SAMPLE_OFF){done(localGrade(ans,chk));return}
  SC.busy[id]=true;btn.disabled=true;btn.textContent='Checking…';out.innerHTML='<div class="scv">Thinking…</div>';
  SAMPLE.json(gradePrompt(chk,ans),{modelTier:'quick'}).then(function(j){
    var v=(j&&j.verdict)||'partly';if(['correct','partly','not_yet'].indexOf(v)<0)v='partly';
    done({verdict:v,feedback:String(j.feedback||''),missing:Array.isArray(j.missing)?j.missing.map(String).slice(0,4):[],how:'Checked by Claude for meaning, not exact wording.'});
  }).catch(function(e){
    var code=e&&e.code;if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(code)>-1)SAMPLE_OFF=true;
    var r=localGrade(ans,chk);if(code==='rate_limited')r.how='Claude is busy right now, so this was checked offline by key ideas.';done(r);
  });
}
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.sc!==undefined){SC.drafts[t.dataset.sc]=t.value;try{localStorage.setItem('sg:'+ID+':scd',JSON.stringify(SC.drafts))}catch(x){}}});
document.addEventListener('click',function(e){var t=e.target.closest('[data-a="scgrade"]');if(t)scGrade(t.dataset.v,t)});

/* ---------- glossary ---------- */
function glossView(){
  return '<p class="intro">Every abbreviation used in this guide, spelled out.</p><input class="search" id="gs" type="search" placeholder="Search the glossary" aria-label="Search the glossary"><div class="tablewrap"><table id="gt"><thead><tr><th>Abbreviation</th><th>Meaning</th></tr></thead><tbody>'+
   D.glossary.map(function(g){return '<tr><td><b>'+esc(g[0])+'</b></td><td>'+esc(g[1])+'</td></tr>'}).join('')+'</tbody></table></div>';
}

/* ---------- sidebar ---------- */
function startSide(){return ''}
function sideCondHTML(c){
  var secs=secsFor(c),done=0,op=!!S.open[c.id],h='';
  secs.forEach(function(s){if(S.rev[rk(c.id,s[0])])done++});
  var cur=c.id===S.cond&&S.view==='study';
  h+='<div class="sc'+(cur?' cur':'')+'" style="--c:'+c.color+'"><button class="scb" data-a="sc" data-v="'+c.id+'" aria-expanded="'+op+'"><i></i><span class="scn">'+esc(c.short||c.name)+'</span><small>'+done+'/'+secs.length+'</small><span class="chev"></span></button>';
  if(op){
    h+='<ul class="sbr">';
    secs.forEach(function(s){
      var cs=cur&&S.sec===s[0],d=S.rev[rk(c.id,s[0])];
      h+='<li><button class="sbb'+(cs?' cur':'')+(d?' done':'')+'" data-a="go" data-c="'+c.id+'" data-s="'+s[0]+'"'+(cs?' aria-current="true"':'')+'><span aria-hidden="true">'+s[1]+'</span> '+s[2]+'</button></li>';
    });
    h+='</ul>';
  }
  return h+'</div>';
}
function sideHTML(){
  var h='<div class="sidehd"><b>Menu</b><span><button class="lnk" data-a="expall">Expand all</button><button class="lnk" data-a="colall">Collapse all</button><button class="sidehide" data-a="sidehide" aria-label="Hide the topics menu">« Hide</button></span></div>';
  var cats=[],ci={};
  D.conditions.forEach(function(c){var k=c.cat||c.group||'Conditions';if(!(k in ci)){ci[k]=cats.length;cats.push({n:k,color:c.catColor||c.color,subs:[],si:{}})}var g=cats[ci[k]],sk=c.sub||'';if(!(sk in g.si)){g.si[sk]=g.subs.length;g.subs.push({n:sk,items:[]})}g.subs[g.si[sk]].items.push(c)});
  cats.forEach(function(g){
    var key='cat:'+g.n,go=S.gopen[key]!==false,cnt=g.subs.reduce(function(a,s){return a+s.items.length},0);
    h+='<div class="cat" style="--c:'+g.color+'"><button class="catb" data-a="sgrp" data-v="'+esc(key)+'" aria-expanded="'+go+'"><span class="catn">'+esc(g.n)+'</span><small>'+cnt+' topics</small><span class="chev"></span></button>';
    if(go){
      h+='<div class="catbody">';
      var bs=(D.basics||[]).filter(function(b){return b.cat===g.n});
      if(bs.length){
        h+='<div class="subh">Basics: start here</div><ul class="sbr basics">'+bs.map(function(b){var cur=S.view==='basics'&&D.basics[S.bi]===b;return '<li><button class="sbb'+(cur?' cur':'')+'" data-a="jump" data-w="basics" data-v="b-'+esc(b.id)+'"><span aria-hidden="true">📘</span> '+esc(b.title)+'</button></li>'}).join('')+'</ul>';
      }
      g.subs.forEach(function(s){
        if(s.n)h+='<div class="subh">'+esc(s.n)+'</div>';
        s.items.forEach(function(c){h+=sideCondHTML(c)});
      });
      h+='</div>';
    }
    h+='</div>';
  });
  if(HASR){
    var rk0='__readings',ro=S.gopen[rk0]!==false;
    h+='<div class="cat" style="--c:var(--accent)"><button class="catb" data-a="sgrp" data-v="'+rk0+'" aria-expanded="'+ro+'"><span class="catn">Required readings</span><small>'+D.readings.length+' chapters</small><span class="chev"></span></button>';
    if(ro){
      var books=[],bi={};
      D.readings.forEach(function(r,i){var b=r.book||'Readings';if(!(b in bi)){bi[b]=books.length;books.push({n:b,items:[]})}books[bi[b]].items.push([r,i])});
      h+='<div class="catbody">'+books.map(function(b){return '<div class="subh">'+esc(b.n)+'</div><ul class="sbr basics">'+b.items.map(function(x){var r=x[0],cur=S.view==='readings'&&S.ri===x[1];return '<li><button class="sbb'+(cur?' cur':'')+'" data-a="jump" data-w="readings" data-v="r-'+esc(r.id)+'">'+esc(r.chapter)+': '+esc(r.short||r.title)+'</button></li>'}).join('')+'</ul>'}).join('')+'</div>';
    }
    h+='</div>';
  }
  var other=(D.basics||[]).filter(function(b){return !b.cat});
  if(other.length)h+='<div class="subh">Other basics</div><ul class="sbr basics">'+other.map(function(b){return '<li><button class="sbb" data-a="jump" data-w="basics" data-v="b-'+esc(b.id)+'">'+esc(b.title)+'</button></li>'}).join('')+'</ul>';
  return h;
}

/* ---------- render ---------- */
function applyTheme(){
  var r=document.documentElement;
  if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
  var dark=S.theme==='dark'||(S.theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.body.setAttribute('data-dark',dark?'1':'0');
  $('#themebtn').textContent='Theme: '+S.theme;
}
function setHdr(){var hd=$('header.top');if(hd)document.documentElement.style.setProperty('--hdr',hd.offsetHeight+'px')}
function render(keep){
  var y=window.scrollY,sy=$('#side')?$('#side').scrollTop:0;
  $('#ttl').innerHTML=esc(D.meta.title)+'<small>'+esc(D.meta.course+' \u00B7 '+D.meta.unit+(D.meta.source?' \u00B7 Built from '+D.meta.source:''))+'</small>';
  $('#tabs').innerHTML=TABS.map(function(t){return '<button role="tab" data-a="tab" data-v="'+t[0]+'" aria-selected="'+(S.view===t[0])+'">'+t[1]+'</button>'}).join('');
  $('#side').innerHTML=sideHTML();
  var v=S.view,h=v==='study'?studyView():v==='map'?mapView():v==='guide'?guideView():v==='drugs'?drugsView():v==='procs'?procsView():v==='basics'?basicsView():v==='readings'?readingsView():v==='cmp'?cmpView():v==='quiz'?quizView():v==='cards'?cardsView():v==='abg'?abgView():glossView();
  $('#app').innerHTML=h+'<footer>Study aid built from your course materials. Not clinical advice. Doses and drug facts are for studying only: check anything unclear against your slides, your drug guide, and your instructor.</footer>';
  document.body.classList.toggle('self',S.self);
  document.body.classList.toggle('nohy',!S.hy);
  document.body.classList.toggle('noside',!S.side);
  document.body.classList.toggle('drawer',S.drawer);
  $('#selftest').checked=S.self;$('#hytoggle').checked=S.hy;
  var open=isMobile()?S.drawer:S.side;
  $('#topicsbtn').setAttribute('aria-expanded',open?'true':'false');
  applyTheme();setHdr();
  if(keep){window.scrollTo(0,y);$('#side').scrollTop=sy}
}
function goTo(cid,sec){
  S.cond=cid;S.sec=sec;S.open[cid]=true;store.set('sopen2',S.open);S.drawer=false;
  var target=null;
  S.view='study';S.dopen['s-'+cid+'-'+sec]=true;target='s-'+cid+'-'+sec;
  render(false);
  var el=target&&document.getElementById(target);
  if(el)el.scrollIntoView({block:'start'});else window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a;
  if(a==='reveal'){t.classList.toggle('shown');return}
  if(a==='model'){var mm=t.closest('.selfcheck');mm=mm&&mm.querySelector('.model');if(mm){mm.classList.toggle('show');t.textContent=mm.classList.contains('show')?'Hide model answer':'Show model answer'}return}
  if(a==='pg'){var k=t.dataset.k,v=+t.dataset.v;if(k==='cond'){S.cond=D.conditions[v].id;S.open[S.cond]=true;store.set('sopen2',S.open)}else if(k==='basics'){S.bi=v;store.set('bi',v)}else if(k==='readings'){S.ri=v;store.set('ri',v)}else if(k==='cmp'){S.ci=v}else if(k==='quiz'){S.qi=v}render(false);window.scrollTo(0,0);return}
  if(a==='sidehide'){if(isMobile()){S.drawer=false}else{S.side=false;store.set('side',false)}render(true);return}
  if(a==='sideshow'){S.side=true;store.set('side',true);render(true);return}
  if(a==='shownorm'){S.shownorm=true;render(true);return}
  if(a==='tab'){S.view=t.dataset.v;S.drawer=false;render(false);window.scrollTo(0,0)}
  else if(a==='cond'){S.cond=t.dataset.v;S.c2=null;S.open[S.cond]=true;store.set('sopen2',S.open);render(true)}
  else if(a==='sec'){S.sec=t.dataset.v;var sid='s-'+S.cond+'-'+S.sec;S.dopen[sid]=true;render(true);var se=document.getElementById(sid);if(se)se.scrollIntoView({block:'start',behavior:'smooth'})}
  else if(a==='rev'){var k=rk(S.cond,t.dataset.s||S.sec);S.rev[k]=!S.rev[k];store.set('rev',S.rev);render(true)}
  else if(a==='opt'){var q=+t.dataset.q;if(S.qa[q]===undefined){S.qa[q]=+t.dataset.o;render(true)}}
  else if(a==='qreset'){S.qa={};render(false)}
  else if(a==='flip'){S.flip=!S.flip;render(true)}
  else if(a==='cnext'){S.card=(S.card+1)%S.deck.length;S.flip=false;render(true)}
  else if(a==='cprev'){S.card=(S.card-1+S.deck.length)%S.deck.length;S.flip=false;render(true)}
  else if(a==='cshuf'){S.deck=shuffle(ALLCARDS);S.card=0;S.flip=false;render(true)}
  else if(a==='sc'){var id=t.dataset.v;if(S.view!=='study'||S.cond!==id){S.view='study';S.cond=id;S.c2=null;S.open[id]=true;S.drawer=false;store.set('sopen2',S.open);render(false);window.scrollTo(0,0)}else{S.open[id]=!S.open[id];store.set('sopen2',S.open);render(true)}}
  else if(a==='sgrp'){var g=t.dataset.v;S.gopen[g]=S.gopen[g]===false;store.set('gopen2',S.gopen);render(true)}
  else if(a==='expall'||a==='colall'){var ex=(a==='expall');D.conditions.forEach(function(c){S.open[c.id]=ex;S.gopen['cat:'+(c.cat||c.group||'Conditions')]=ex});S.gopen.__readings=ex;store.set('sopen2',S.open);store.set('gopen2',S.gopen);render(true)}
  else if(a==='go'){goTo(t.dataset.c,t.dataset.s)}
  else if(a==='scrim'){S.drawer=false;render(true)}
  else if(a==='dfilter'){S.dfilter=t.dataset.v;render(false);window.scrollTo(0,0)}
  else if(a==='pfilter'){S.pfilter=t.dataset.v;render(false);window.scrollTo(0,0)}
  else if(a==='goc'){goTo(t.dataset.v,'path')}
  else if(a==='jump'){var jid=t.dataset.v,w=t.dataset.w;S.view=w;S.drawer=false;var key=jid.slice(2);if(w==='basics'){D.basics.forEach(function(b,k){if(b.id===key){S.bi=k;store.set('bi',k)}})}else if(w==='readings'){D.readings.forEach(function(r,k){if(r.id===key){S.ri=k;store.set('ri',k)}})}render(false);window.scrollTo(0,0)}
  else if(a==='bexp'||a==='bcol'){D.basics.forEach(function(b){S.dopen['b-'+b.id]=(a==='bexp')});render(true)}
  else if(a==='rexp'||a==='rcol'){D.readings.forEach(function(r){S.dopen['r-'+r.id]=(a==='rexp')});render(true)}
  else if(a==='gexp'||a==='gcol'){D.conditions.forEach(function(c){secsFor(c).forEach(function(s){S.dopen['s-'+c.id+'-'+s[0]]=(a==='gexp')})});render(true)}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='selftest'){S.self=t.checked;store.set('self',S.self);render(true)}
  else if(t.id==='hytoggle'){S.hy=t.checked;store.set('hy',S.hy);render(true)}
  else if(t.dataset&&t.dataset.a==='cmp'){S.cmp=t.checked;render(true)}
  else if(t.dataset&&t.dataset.a==='c2'){S.c2=t.value;render(true)}
  else if(t.id==='condsel'){S.cond=t.value;S.open[S.cond]=true;store.set('sopen2',S.open);render(false);window.scrollTo(0,0)}
  else if(t.id==='cmpsel'){S.ci=+t.value;render(false);window.scrollTo(0,0)}
});
document.addEventListener('toggle',function(e){
  var el=e.target;if(el&&el.tagName==='DETAILS'&&el.id&&(el.classList.contains('sec')||el.classList.contains('drug')))S.dopen[el.id]=el.open;
},true);
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='gs'){var q=e.target.value.toLowerCase();document.querySelectorAll('#gt tbody tr').forEach(function(r){r.style.display=r.textContent.toLowerCase().indexOf(q)>-1?'':'none'})}
  else if(id==='ps'){var q3=e.target.value.toLowerCase();document.querySelectorAll('#pl details.drug').forEach(function(r){var hit=r.textContent.toLowerCase().indexOf(q3)>-1;r.style.display=hit?'':'none';if(hit&&q3)r.open=true})}
  else if(id==='ds'){var q2=e.target.value.toLowerCase();document.querySelectorAll('#dl details.drug').forEach(function(r){var hit=r.textContent.toLowerCase().indexOf(q2)>-1;r.style.display=hit?'':'none';if(hit&&q2)r.open=true})}
});
document.addEventListener('keydown',function(e){
  var el=e.target;
  if(el&&el.matches&&el.matches('.row.reveal')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.classList.toggle('shown')}
  if(e.key==='Escape'&&S.drawer){S.drawer=false;render(true)}
});
$('#topicsbtn').addEventListener('click',function(){
  if(isMobile()){S.drawer=!S.drawer}else{S.side=!S.side;store.set('side',S.side)}
  render(true);
});
$('#themebtn').addEventListener('click',function(){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';store.set('theme',S.theme);applyTheme()});
window.addEventListener('resize',setHdr);
render(false);
})();
</script>
