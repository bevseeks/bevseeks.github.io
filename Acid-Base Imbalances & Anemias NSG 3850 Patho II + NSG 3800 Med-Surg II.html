 "steps": [["Verify order, consent, and type and crossmatch", "ABO/Rh compatibility prevents hemolytic reactions (Banasik)"], ["==Two-person bedside check of client identity and blood unit==", "most fatal reactions come from identification errors"], ["Prime with normal saline only, per policy", "dextrose solutions damage red cells"], ["Stay with the client and infuse slowly for the first 15 minutes", "most acute reactions appear early"], ["Complete within the time limit set by facility policy", "bacterial growth risk"]], "before": [["Baseline vital signs and lung sounds", "to detect a reaction or overload"], ["Patent IV of the size your policy requires", "red cells need adequate flow"], ["Ask about prior reactions", "predicts risk"]], "during": [["Monitor for fever, chills, back pain, hives, dyspnea, hypotension", "signs of a reaction"], ["==If a reaction occurs: stop the transfusion, keep the IV open with saline, notify==", "limits the dose of incompatible blood"]], "after": [["Vital signs per policy after the transfusion", "late reactions"], ["Recheck Hgb/Hct or platelet count as ordered", "confirms response"], ["Watch for fluid overload (dyspnea, crackles)", "transfusion-associated circulatory overload (Banasik)"], ["Monitor ferritin over time", "repeated transfusions cause iron overload (Brunner)"]], "complications": ["==Acute hemolytic reaction==", "Febrile or allergic reaction, anaphylaxis", "TACO (circulatory overload) and TRALI (acute lung injury)", "Iron overload with repeated transfusions"], "teach": ["Report chills, itching, back pain, or trouble breathing right away", "Repeated transfusions may require iron monitoring"], "verify": ["steps", "before"]}], "bridge": [["Pathophysiology", "Defective globin chains → unstable Hgb precipitates → rigid cells hemolyze; iron absorption rises."], ["Med-Surg", "So you give and monitor transfusions, avoid unnecessary iron, and refer for genetic counseling."]], "cat": "Anemias & RBC Disorders", "sub": "Increased destruction: hemolytic, inherited", "catColor": "#9f1239"}, {"id": "scd", "name": "Sickle cell anemia / sickle cell disease", "short": "Sickle cell", "group": "Anemia · hemolytic, genetic (HgbS)", "color": "#7c2d12", "pair": "thal", "sig": ["HgbS", "Retic ↑", "Bilirubin ↑", "Vaso-occlusion"], "hook": "A one-letter genetic typo builds **hemoglobin S**. When oxygen drops, HgbS clumps into rigid rods and bends the cell into a sickle that **jams small vessels** and **breaks apart early**.", "patho": {"chain": ["Point mutation in the beta-globin gene (glutamic acid → valine) builds ==**hemoglobin S (HgbS)**==: a hemoglobin synthesis defect", "**Instability:** when HgbS releases oxygen, the valine creates a sticky patch", "**Insolubility (polymerization):** sticky HgbS molecules lock into long rigid fibers that stiffen the cell into a **sickle**", "Triggers that increase sickling: ==**stress, dehydration, hypoxia, vasoconstriction**== (cold, smoking, alcohol, caffeine, high altitude)", "Sickled cells clump and **occlude small vessels** → ischemia and severe pain (vaso-occlusive crisis); fragile cells hemolyze in **10 to 20 days** (normal RBC ~120 days)", "Net result: chronic hemolytic anemia + recurrent painful vaso-occlusive episodes + organ damage"], "compensation": "Marrow increases production (↑ reticulocytes). Heart and lungs compensate for hypoxia. Compensation fails during crisis because hypoxia causes more sickling, which causes more hypoxia (a vicious cycle).", "tip": "**Sickle crisis priorities: Oxygen, Fluids, Pain (O-F-P).** Keep warm, keep hydrated, keep oxygenated."}, "manifestations": [["Severe pain in extremities, joints, bones (recurrent painful episodes)", "sickled cells block blood flow, causing ischemia; like a foot \"falling asleep\" but far worse"], ["Tachycardia, fatigue, pallor", "chronic anemia from early destruction of cells"], ["Jaundice, itching, dark urine", "rapid hemolysis raises bilirubin; liver involvement (bile)"], ["Splenomegaly, abdominal pain, organ dysfunction", "sickled cells are trapped and destroyed in the spleen"], ["==Priapism (persistent painful erection)==", "sickled cells block outflow from penile tissue"], ["==Acute chest syndrome: chest pain, dyspnea, low SaO₂==", "vaso-occlusion in pulmonary vessels"], ["Stroke, leg ulcers", "occlusion of cerebral and skin vessels"], ["Infections", "spleen damage impairs clearing of bacteria"]], "labs": [["Hemoglobin electrophoresis", "==**HgbS present** (diagnostic)=="], ["Blood smear", "Sickled RBCs"], ["CBC", "↓ Hgb/Hct; MCV normal or ↑ (reticulocytosis)"], ["Reticulocyte count", "↑ marrow compensation"], ["Bilirubin and LDH", "↑ during crises (hemolysis); Galen total bilirubin 0.3 to 1 mg/dL, LDH 100 to 190 IU/L"], ["SaO₂", "May be low during crisis"]], "risks": [["Genetic", "Inherited. One parent with the gene: child makes some normal and some abnormal Hgb (trait), usually without symptoms"], ["Population", "Almost exclusively in African Americans (per slides)"], ["Crisis triggers", "Physical stress (illness, pregnancy), emotional stress, dehydration, hypoxia (strenuous sports, illness), vasoconstriction (cold, smoking, alcohol, caffeine, high altitude)"]], "management": [["Oxygen", "raises oxygen tension so less HgbS sickles"], ["IV or oral fluids; **IV fluids should be hypotonic** (Med-Surg slide)", "hydrates cells and dilutes blood so sickled cells can move through vessels"], ["Pain management: morphine is most often given; your syllabus also assigns hydromorphone with patient-controlled analgesia (PCA) and ibuprofen", "the ischemic pain is severe and needs opioids"], ["Warm compresses to joints, ROM exercises", "warmth dilates vessels and improves flow; never ice"], ["Genetic counseling (interdisciplinary)", "the risk factor is not modifiable, but counseling explains inheritance"]], "nursing": {"assess": [["Pain: location, intensity, character", "pain is the main sign of vaso-occlusion"], ["SaO₂, respiratory status, chest pain", "early acute chest syndrome"], ["Neuro checks", "stroke from cerebral occlusion"], ["Frequent circulation checks", "detects new occlusion in extremities"], ["Hydration status, I&O", "dehydration triggers sickling"], ["Jaundice, abdominal pain, spleen", "liver and spleen complications"]], "act": [["==Oxygen and head of bed up==", "reverses the hypoxia that drives sickling", 1], ["==Hydration: oral or hypotonic IV fluids== (2 to 3 L during crisis per Brunner), avoiding overload", "dilutes blood so sickled cells move", 1], ["==Prompt pain control== (morphine/hydromorphone PCA as ordered); reassess pain and sedation", "severe ischemic pain; prompt treatment shortens stays (Brunner)", 1], ["Assess for acute chest syndrome and stroke: SaO₂, chest pain, neuro checks", "leading causes of death", 1], ["Warmth: room > 72°F, warm (never cold) compresses; remove restrictive clothing; no SCDs/TED hose", "prevents vasoconstriction and stasis", 2], ["Incentive spirometry hourly while awake", "reduces acute chest syndrome", 2], ["Support and elevate swollen joints; ROM once pain subsides", "preserves joint function", 3], ["Teach crisis prevention, vaccinations, hydration; genetic counseling", "reduces future crises", 3]], "order": "Oxygen, fluids, and pain relief break the sickling cycle and must happen at once; then prevent stasis and lung complications; then teaching."}, "education": [["Hydration", "==drink **3 to 4 liters of fluid per day**=="], ["Avoid vasoconstriction", "no smoking, alcohol, caffeine, extreme temperatures, or high-altitude travel"], ["Avoid hypoxia", "avoid strenuous physical activity"], ["Prevent illness", "good nutrition, vaccinations, treat illness early"], ["Pregnancy", "increases oxygen demand and stress on the body"], ["Emotional stress", "identify and avoid triggering situations where possible"]], "complications": ["Sickle cell crisis", "Stroke (CVA), heart attack, small-vessel damage", "Acute chest syndrome, pulmonary hypertension", "Kidney injury/failure, heart failure", "Liver complications (jaundice, itching); spleen complications (abdominal pain)", "Priapism, leg ulcers, infections", "Dehydration and hypoxia (both cause and effect)"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Chest pain, dyspnea, or falling SaO₂ (acute chest syndrome); sudden weakness, speech change, or facial droop (stroke); priapism; severe abdominal pain; fever."}, {"type": "watch", "label": "Exam traps", "in": "rn", "text": "Ice packs, fluid restriction, SCDs/TED hose, and iron supplements are **wrong** in sickle cell crisis. Warmth, fluids, oxygen, and pain control are right."}, {"type": "book", "label": "Textbook: Table 29-2 Complications (paraphrased)", "in": "comp", "text": "Spleen infarcts (autosplenectomy → infections), lungs (acute chest syndrome, pulmonary hypertension), brain (stroke), kidney (cannot concentrate urine → dehydration), bones (avascular necrosis of the hips), liver (jaundice, gallstones), skin (leg ulcers), eye (retinal damage), penis (priapism → impotence). ==Acute chest syndrome is a leading cause of death in young adults.==", "source": "Brunner & Suddarth 15e, Ch. 29, Table 29-2"}], "sbar": {"title": "SBAR: sickle cell crisis with chest symptoms", "s": "Client in sickle cell crisis reports new chest pain and shortness of breath.", "b": "Admitted 12 hours ago for severe leg and joint pain after a cold-weather hike; receiving morphine and IV fluids.", "a": "SaO₂ 88% on room air, RR 28, HR 122, temp 100.8°F. Hgb 8.0 g/dL, reticulocytes elevated, bilirubin 2.0 mg/dL.", "r": "Concerned about acute chest syndrome. Oxygen applied, head of bed raised; request immediate evaluation, chest x-ray, and review of fluid and pain orders."}, "drugs": [{"generic": "morphine", "brands": ["Duramorph", "MS Contin", "Infumorph"], "cls": "Opioid agonist analgesic", "moa": "Binds opioid receptors in the CNS and changes the perception of pain, relieving the ==severe ischemic pain of vaso-occlusion==.", "indications": ["Severe pain of sickle cell crisis (Med-Surg slide: morphine is most often given)"], "dose": [["PO, opioid-naive adults (Davis)", "30 mg every 3 to 4 hours initially"], ["IV/PCA in crisis", "Ordered by the provider; not in your slides. Check your drug guide and PCA protocol."]], "assess": {"before": [["Pain type, location, intensity", "baseline; reassess 20 minutes after IV, 1 hour after PO (Davis)"], ["==Respiratory rate, sedation level, BP==", "respiratory depression is the life-threatening effect"], ["Other CNS depressants (benzodiazepines, alcohol)", "combined respiratory depression"]], "after": [["Sedation and RR; if RR < 10, assess sedation and notify", "oversedation precedes respiratory depression"], ["Bowel function", "constipation"], ["Naloxone available", "antidote"]]}, "effects": {"common": ["Constipation, nausea, itching", "Drowsiness, dizziness"], "serious": ["==Respiratory depression==", "Hypotension, bradycardia", "Addiction, misuse"], "boxed": "Risk of addiction and misuse; life-threatening respiratory depression; profound sedation and death with benzodiazepines or other CNS depressants."}, "avoid": {"contra": ["Severe respiratory depression without monitoring", "Paralytic ileus"], "interactions": ["Benzodiazepines, alcohol, sedatives ↑ CNS and respiratory depression", "MAO inhibitors (severe reactions)", "Avoid alcohol"]}, "teach": ["Ask for pain medication before pain is severe", "Change position slowly; call for help to walk", "Prevent constipation with fluids and fiber", "Do not drink alcohol"], "verify": ["effects"]}, {"generic": "hydromorphone", "brands": ["Dilaudid", "Exalgo"], "cls": "Opioid agonist analgesic (Schedule II)", "moa": "A stronger semisynthetic morphine derivative that binds CNS opioid receptors; often given by ==patient-controlled analgesia (PCA)== for crisis pain.", "indications": ["Moderate to severe pain; syllabus assigns hydromorphone with PCA for this unit"], "dose": [["PO adults ≥ 50 kg (Davis)", "4 to 8 mg every 3 to 4 hours initially (some clients respond to 2 mg)"], ["IV/PCA", "Bolus, lockout, and basal settings are ordered by the provider; verify with a second nurse per policy"]], "assess": {"before": [["==Cognition: can the client press the button appropriately?==", "PCA requires a client who can participate (Abrams Box 49.2)"], ["Opioid-tolerant vs opioid-naive", "naive clients are at higher risk of respiratory depression"], ["Baseline RR, SaO₂, sedation score, pain score", "to compare after"]], "after": [["Pain and sedation scores after start and after any pump change", "per protocol"], ["RR < 10 → assess sedation, decrease dose 25 to 50% per order (Davis)", "prevents respiratory arrest"], ["Naloxone available", "antidote"]]}, "effects": {"common": ["Constipation, nausea, sedation, dizziness"], "serious": ["==Respiratory depression==", "Hypotension", "Addiction"], "boxed": "Addiction and misuse; life-threatening respiratory depression; risk with benzodiazepines; medication errors from confusing high-potency formulations."}, "avoid": {"contra": ["Severe respiratory depression without monitoring"], "interactions": ["Other CNS depressants and benzodiazepines", "MAO inhibitors", "Avoid alcohol"]}, "teach": ["Only you press the PCA button; family must not press it", "Report trouble breathing or extreme sleepiness", "Do not stop abruptly after long use"], "verify": ["effects", "dose"]}, {"generic": "ibuprofen", "brands": ["Advil", "Motrin"], "cls": "Nonsteroidal anti-inflammatory drug (NSAID)", "moa": "Blocks prostaglandin synthesis, reducing inflammation and pain; useful for moderate crisis pain or with opioids (Brunner).", "indications": ["Moderate sickle cell pain, alone or with opioids (syllabus drug for this unit)"], "dose": [["PO adults, analgesic (Davis)", "200 to 400 mg every 4 to 6 hours (OTC max 1,200 mg/day)"], ["PO adults, anti-inflammatory (Davis)", "400 to 800 mg 3 to 4 times daily (max 3,200 mg/day)"]], "assess": {"before": [["Kidney function (BUN, creatinine)", "NSAIDs reduce renal blood flow; sickle cell already damages the kidneys"], ["GI bleeding history", "NSAIDs injure gastric mucosa"], ["Asthma, aspirin allergy, nasal polyps", "higher hypersensitivity risk"]], "after": [["==Signs of GI bleeding== (tarry stools, dizziness, hypotension)", "most common serious effect"], ["Urine output, BUN, creatinine", "renal dysfunction"], ["Note the ceiling effect", "higher doses add risk, not relief (Brunner)"]]}, "effects": {"common": ["Dyspepsia, nausea", "Edema"], "serious": ["==GI bleeding==", "Acute kidney injury", "MI, stroke, heart failure"], "boxed": "Increased risk of serious cardiovascular thrombotic events and of GI bleeding, ulceration, and perforation."}, "avoid": {"contra": ["Active GI bleeding or ulcer", "NSAID or aspirin allergy"], "interactions": ["Reduces the antiplatelet effect of low-dose aspirin", "Anticoagulants ↑ bleeding", "Alcohol ↑ GI bleeding"]}, "teach": ["Take with a full glass of water and stay upright 15 to 30 minutes", "Report black stools or stomach pain", "Do not exceed the daily maximum"], "verify": ["effects"]}], "procedures": [{"name": "Patient-controlled analgesia (PCA) management", "aka": "PCA", "kind": "therapeutic", "indication": "Severe vaso-occlusive pain is often treated with IV opioids by PCA (Brunner; syllabus: hydromorphone and PCA).", "steps": [["Confirm the client can understand and press the button (Abrams Box 49.2)", "PCA is safe only when the client controls dosing"], ["==Independent double-check of drug, concentration, and pump settings== per policy", "programming errors can be fatal"], ["Teach: only the client presses the button", "family pressing defeats the sedation safety net"], ["Document pain and sedation scores per protocol", "titrate to relief without oversedation"]], "before": [["Opioid-naive or tolerant?", "naive clients are at higher risk"], ["Baseline RR, SaO₂, sedation, pain", "comparison"]], "after": [["Pain and sedation after start and after any change", "per protocol"], ["RR < 10 or rising sedation: stop PCA per protocol and notify; naloxone available", "respiratory depression"]], "complications": ["==Respiratory depression==", "Oversedation, hypotension", "Programming errors"], "teach": ["Press the button when pain starts, not after it is severe", "Family must not press it"], "verify": ["steps"]}, {"name": "Incentive spirometry during vaso-occlusive crisis", "kind": "therapeutic", "indication": "==Significantly reduces acute chest syndrome== during crises (Brunner Ch. 29).", "steps": [["Upright position", "lung expansion"], ["Slow deep inhalation, hold 3 to 5 seconds", "opens alveoli"], ["10 times every hour while awake", "prevents atelectasis that triggers sickling in the lungs"]], "before": [["Pain control first", "pain limits deep breathing"]], "after": [["SaO₂, RR, chest pain", "early acute chest syndrome"]], "complications": ["Report new chest pain, fever, or falling SaO₂ (acute chest syndrome)"], "teach": ["Keep using the spirometer every hour while awake"], "verify": ["steps"]}], "bridge": [["Pathophysiology", "HgbS polymerizes when deoxygenated → rigid sickles occlude small vessels and hemolyze early."], ["Med-Surg", "So oxygen, fluids, warmth, and prompt pain control break the cycle; watch for acute chest syndrome and stroke."]], "cat": "Anemias & RBC Disorders", "sub": "Increased destruction: hemolytic, inherited", "catColor": "#9f1239"}, {"id": "pv", "name": "Polycythemia vera (not an anemia)", "short": "Polycythemia vera", "group": "Opposite of anemia · too many cells (myeloproliferative)", "color": "#7a5a00", "pair": "apl", "sig": ["Hct ↑", "RBC ↑", "WBC ↑ / Plt ↑", "EPO ↓"], "hook": "A **blood cancer** of the marrow stem cells: the marrow makes too many RBCs (and WBCs and platelets), so blood becomes **thick**. Taught with anemias because the same labs evaluate it.", "patho": {"chain": ["**Neoplastic transformation** (gene mutation) of bone marrow stem cells: a myeloproliferative neoplasm", "Marrow overproduces RBCs, WBCs, and platelets (**pancytosis**) without regulation", "==**↑ RBC mass and hematocrit → ↑ blood viscosity**== and blood volume", "Sluggish thick blood → **thrombosis**, hypertension, poor microcirculation; dysfunctional platelets → **mucosal hemorrhage**", "High cell turnover → **↑ uric acid** → gout and kidney stones", "Net result: hyperviscous blood with both clotting and bleeding risk; no cure"], "compensation": "The kidney senses plenty of oxygen and **lowers EPO**, but the neoplastic marrow ignores it. This is why EPO is low.", "tip": "**Flushed = too much.** Ruddy face + headache + high Hct → think PV. Treatment removes or thins the blood: phlebotomy, antiplatelets, fluids."}, "manifestations": [["==Ruddy (flushed) complexion==", "too many RBCs in skin capillaries"], ["Headache, dizziness", "thick blood slows cerebral blood flow"], ["Hypertension", "increased blood volume and viscosity"], ["Burning in fingers and toes", "sluggish flow and microvascular occlusion"], ["Pruritus (itching), fatigue", "symptom management targets on the Med-Surg slide"], ["Dyspnea, weakness, backache, joint complaints, weight loss", "hyperviscosity impairs oxygen delivery; high turnover raises metabolic demand and uric acid"], ["==Thrombosis (DVT, stroke, MI) and mucosal hemorrhage==", "thick blood clots; abnormal platelets bleed"]], "labs": [["RBC, Hgb, Hct", "Absolute ↑ (Patho example: RBC 7.6 million, Hgb 18.9 g/dL, Hct 58%)"], ["WBC and platelets", "↑ (leukocytosis, thrombocytosis)"], ["Erythropoietin (EPO)", "==Low=="], ["Uric acid", "↑ from cell proliferation"]], "risks": [["Cause", "Gene mutation in blood cell production (myeloproliferative neoplasm); rare"], ["Prognosis", "Untreated PV has a poor prognosis; median survival with treatment 10 to 15 years"]], "management": [["==Phlebotomy==", "removes RBC volume to lower Hct and viscosity, preventing thrombosis"], ["Aspirin (acetylsalicylic acid)", "antiplatelet effect reduces thrombosis risk"], ["Anagrelide (antiplatelet; on your syllabus drug list)", "lowers platelet count and clotting risk"], ["Fluids", "dilute the blood"]], "nursing": {"assess": [["Signs of thrombosis: calf pain/swelling, chest pain, neuro changes", "hyperviscosity causes clots"], ["Signs of hemorrhage: GI, nose, gums", "dysfunctional platelets"], ["Blood pressure", "hypertension from volume and viscosity"], ["Joint pain, flank pain", "gout and kidney stones from uric acid"]], "act": [["Monitor for ==thrombosis== (stroke, MI, DVT signs) and hemorrhage", "the life-threatening complications (Brunner)", 1], ["Hold aspirin and notify if bleeding occurs", "aspirin worsens bleeding (Brunner)", 1], ["Assist with phlebotomy; orthostatic precautions afterward", "volume removal causes hypotension", 2], ["Encourage fluids; discourage leg crossing, tight stockings, sitting long", "reduces viscosity and stasis", 2], ["Pruritus care: tepid baths, gentle drying, oatmeal or cocoa-butter lotion", "itching worsens with water and heat (Brunner)", 3], ["Teach to avoid iron supplements (including multivitamins with iron)", "iron fuels RBC production", 3]], "order": "Clots and bleeding are the lethal complications, so they come first; then the treatments that lower viscosity; then comfort and teaching."}, "education": [["Report thrombosis signs immediately", "leg swelling, chest pain, sudden weakness or speech change"], ["Report bleeding", "dark stools, nosebleeds, bleeding gums"], ["Stay hydrated", "thins the blood"], ["Ongoing phlebotomy", "it is lifelong management, not a cure"]], "complications": ["Thrombosis: DVT, stroke, myocardial infarction", "Mucosal hemorrhage", "Gout and kidney stones", "Hypertension", "Poor prognosis if untreated"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Signs of stroke, chest pain, unilateral leg swelling, or significant bleeding."}, {"type": "book", "label": "Textbook: PV nursing management", "in": "rn", "text": "Phlebotomy keeps Hct below 45%; ==low-dose aspirin for all clients== unless bleeding. Thrombosis is the most common cause of death. Teach DVT prevention (no leg crossing or tight stockings), tepid baths for pruritus, and ==no iron supplements==.", "source": "Brunner & Suddarth 15e, Ch. 30, Polycythemia Vera"}], "sbar": null, "drugs": [{"generic": "aspirin", "brands": ["Bayer", "Ecotrin"], "cls": "Salicylate; antiplatelet agent", "moa": "Irreversibly blocks platelet cyclooxygenase so platelets cannot clump, ==lowering thrombosis risk in thick PV blood==.", "indications": ["Polycythemia vera: low-dose aspirin for all clients to prevent thrombosis (Brunner Ch. 30; Med-Surg slide)"], "dose": [["PO, PV", "Low-dose daily as ordered; exact low dose not in your materials (check your drug guide)"], ["PO, pain/fever (Davis, for contrast)", "325 to 1,000 mg every 4 to 6 hours, max 4 g/day"]], "assess": {"before": [["Bleeding history; platelet count", "==hold aspirin if PV bleeding occurs== (Brunner)"], ["Asthma, nasal polyps, aspirin allergy", "hypersensitivity risk"]], "after": [["Bleeding: gums, nose, stool, urine", "antiplatelet effect plus PV mucosal bleeding"], ["Tinnitus", "sign of salicylate toxicity"]]}, "effects": {"common": ["Dyspepsia, nausea"], "serious": ["==GI bleeding==", "Tinnitus/salicylate toxicity", "Hypersensitivity, bronchospasm"]}, "avoid": {"contra": ["Bleeding disorders, thrombocytopenia", "Children/teens with viral illness (Reye syndrome)"], "interactions": ["Warfarin, heparin, other NSAIDs ↑ bleeding", "Ibuprofen reduces aspirin's antiplatelet effect", "Alcohol ↑ GI bleeding"]}, "teach": ["Take with food or a full glass of water", "Report black stools, nosebleeds, or ringing in the ears", "Avoid other aspirin-containing OTC products"], "verify": ["dose"]}, {"generic": "anagrelide", "brands": ["Agrylin"], "cls": "Platelet-reducing agent (antiplatelet)", "moa": "Reduces platelet production by megakaryocytes (and at higher doses inhibits platelet aggregation), lowering clot risk (Abrams Ch. 9).", "indications": ["Lowers platelet counts in myeloproliferative disorders; listed on your Med-Surg PV slide", "Brunner reserves it for PV refractory to other cytoreductive agents"], "dose": [["PO", "Ordered by the provider. Not in your materials: look it up in your drug guide."]], "assess": {"before": [["Platelet count", "guides dosing"], ["Cardiac history", "drug can cause palpitations and tachycardia"]], "after": [["Platelet count trend", "shows response"], ["Bleeding signs, palpitations, edema", "adverse effects"]]}, "effects": {"common": ["Headache, palpitations", "Diarrhea, fluid retention"], "serious": ["Bleeding", "Heart failure, dysrhythmias"]}, "avoid": {"contra": ["Severe hepatic impairment"], "interactions": ["Aspirin and anticoagulants ↑ bleeding", "No major food clashes in your materials"]}, "teach": ["Report palpitations, chest pain, swelling, or bleeding", "Keep platelet count appointments"], "verify": ["names", "dose", "assess", "effects", "avoid", "teach"]}], "procedures": [{"name": "Therapeutic phlebotomy", "kind": "therapeutic", "indication": "==Mainstay of PV therapy==: removes blood to keep Hct below 45%, lowering viscosity and depleting iron so RBC production slows (Brunner Ch. 30).", "steps": [["Verify order and baseline Hct", "target is Hct < 45%"], ["Position reclining", "prevents fainting"], ["Blood is removed per facility protocol (initially about 500 mL once or twice weekly, Brunner)", "volume removal lowers Hct"], ["Apply pressure; offer fluids and a snack", "replaces volume"]], "before": [["Baseline BP, HR, Hct", "hypotension risk"], ["Hydration", "fainting risk"]], "during": [["Watch for dizziness, pallor, hypotension", "vasovagal reaction or volume loss"]], "after": [["==Orthostatic BP; sit before standing==", "volume removal"], ["Hct trend", "response"]], "complications": ["Hypotension, syncope", "Iron deficiency (intended effect)"], "teach": ["Rise slowly and drink fluids after phlebotomy", "Do not take iron supplements, including multivitamins with iron (Brunner)"], "verify": ["steps"]}], "bridge": [["Pathophysiology", "A neoplastic stem cell overproduces all lines → hyperviscosity, thrombosis, and high uric acid; EPO is low."], ["Med-Surg", "So you assist with phlebotomy, give low-dose aspirin, watch for clots and bleeding, and teach to avoid iron."]], "cat": "Anemias & RBC Disorders", "sub": "Too many cells (not an anemia)", "catColor": "#9f1239"}], "selfChecks": [{"after": "ra", "prompt": "Why does a client with chronic COPD often have a near-normal pH even though their PaCO₂ is 55 mmHg, while a client with an opioid overdose and the same PaCO₂ has a pH of 7.25?", "model": "Kidney compensation is slow, taking hours to several days. In chronic COPD the CO₂ has been high for a long time, so the kidneys have had time to excrete H⁺ and retain HCO₃⁻, pulling pH back toward normal (compensated). An acute overdose raises CO₂ in minutes, before the kidneys can respond, so the pH falls (uncompensated).", "id": "sc-ra", "keys": [{"label": "kidneys do the compensating", "any": ["kidney", "renal"]}, {"label": "kidney compensation is slow (hours to days)", "any": ["slow", "days", "hours", "time", "takes a while", "long time"]}, {"label": "kidneys retain bicarbonate / excrete H+", "any": ["bicarb", "hco3", "base", "excrete", "hydrogen"]}, {"label": "chronic gives time to compensate; acute does not", "any": ["chronic", "long term", "long-term", "years", "acute", "sudden", "overdose", "fast", "quick"]}]}, {"after": "ma", "prompt": "Explain why acidosis causes hyperkalemia and alkalosis causes hypokalemia, even when total body potassium has not changed.", "model": "Cells act as a buffer by trading H⁺ for K⁺. In acidosis there is excess H⁺ in the ECF, so H⁺ moves into cells and K⁺ moves out, raising serum K⁺. In alkalosis H⁺ is scarce in the ECF, so H⁺ moves out of cells and K⁺ moves in, lowering serum K⁺. It is a shift, not a gain or loss.", "id": "sc-ma", "keys": [{"label": "H+ moves into cells", "any": ["hydrogen", "h+", "acid"]}, {"label": "K+ moves out of cells", "any": ["potassium", "k+"]}, {"label": "it is a shift/exchange to balance charge", "any": ["shift", "swap", "exchange", "trade", "move", "charge", "balance"]}, {"label": "serum K+ rises without a total-body gain", "any": ["not gain", "total", "redistribut", "not more", "same amount", "not because", "rises", "goes up", "high", "increase", "hyperkalemia"]}]}, {"after": "mk", "prompt": "Why do both respiratory and metabolic alkalosis cause tingling and tetany?", "model": "A high pH makes albumin more negatively charged, so it binds more calcium. Total calcium may be normal, but ionized (free, active) calcium falls. Low ionized calcium lowers the threshold for nerves and muscles to fire, causing paresthesia, carpopedal spasm, tetany, and seizures.", "id": "sc-mk", "keys": [{"label": "albumin binds more calcium at high pH", "any": ["albumin", "protein"]}, {"label": "calcium is the electrolyte affected", "any": ["calcium"]}, {"label": "ionized (free) calcium falls", "any": ["ionized", "free", "active", "low", "hypocalc", "less", "drop", "fall"]}, {"label": "nerves/muscles become excitable", "any": ["excit", "fire", "irritab", "twitch", "tingl", "spasm", "tetany", "cramp", "seizure"]}]}, {"after": "b12", "prompt": "Both B12 and folate deficiency cause macrocytic anemia. Explain why only B12 deficiency causes numbness and confusion, and why pernicious anemia needs lifelong treatment.", "model": "Both B12 and folate are needed for DNA synthesis in RBC precursors, so both produce large megaloblastic cells. B12 is also needed to maintain myelin, so B12 deficiency causes peripheral nerve degeneration and neuropsychiatric changes; folate is not part of that pathway. In pernicious anemia the immune system destroys intrinsic factor, which is required to absorb B12, so dietary B12 can never be absorbed and replacement is lifelong.", "id": "sc-b12", "keys": [{"label": "both are needed for DNA synthesis", "any": ["dna", "divid", "synthes"]}, {"label": "only B12 maintains myelin/nerves", "any": ["myelin", "nerve", "neuro"]}, {"label": "pernicious = no intrinsic factor so B12 cannot be absorbed", "any": ["intrinsic", "absorb"]}, {"label": "so replacement is lifelong", "any": ["lifelong", "life", "forever", "always", "permanent", "injection", "shot", "monthly"]}]}, {"after": "scd", "prompt": "Walk through why cold, dehydration, and hypoxia each trigger a sickle cell crisis, and why that makes oxygen, fluids, and warmth the core interventions.", "model": "HgbS polymerizes into rigid fibers when it releases oxygen, so hypoxia directly causes sickling. Dehydration concentrates the blood, making sickled cells more likely to clump and occlude vessels. Cold causes vasoconstriction, narrowing vessels so sickled cells jam more easily. Each occlusion causes more local hypoxia and more sickling. Oxygen reverses the trigger, fluids dilute the blood, and warmth dilates vessels, breaking the cycle.", "id": "sc-scd", "keys": [{"label": "low oxygen makes HbS sickle/polymerize", "any": ["sickl", "polymer", "deoxygen", "low oxygen", "low o2", "hypox", "oxygen"]}, {"label": "dehydration thickens blood so cells clump", "any": ["dehydrat", "viscos", "thick", "concentrat", "clump", "sludg"]}, {"label": "cold causes vasoconstriction", "any": ["cold", "vasoconstrict", "narrow", "constrict"]}, {"label": "oxygen, fluids, and warmth break the cycle", "any": ["fluid", "warm", "hydrat", "heat", "iv "]}]}], "compare": [{"title": "The four acid-base imbalances at a glance", "columns": ["Feature", "Respiratory acidosis", "Respiratory alkalosis", "Metabolic acidosis", "Metabolic alkalosis"], "rows": [["**Primary value**", "**PaCO₂ ↑ (> 45)**", "**PaCO₂ ↓ (< 35)**", "**HCO₃⁻ ↓ (< 22)**", "**HCO₃⁻ ↑ (> 28)**"], ["pH", "↓ < 7.35", "↑ > 7.45", "↓ < 7.35", "↑ > 7.45"], ["Compensation", "Kidneys retain HCO₃⁻, excrete H⁺ (days)", "Kidneys excrete HCO₃⁻, retain H⁺ (days)", "Lungs hyperventilate / Kussmaul (minutes)", "Lungs hypoventilate (minutes, limited)"], ["Classic causes", "COPD, pneumonia, opioid overdose, GBS, chest surgery pain", "Anxiety, pain, crying, alcohol withdrawal, head injury, early aspirin", "DKA, renal failure, diarrhea, lactic acid, poisoning", "Vomiting, NG suction, diuretics, antacids, massive transfusion"], ["K⁺", "↑", "↓", "↑", "↓"], ["Neuro picture", "Depressed: headache, somnolence (↑ ICP)", "Excitable: paresthesia, carpopedal spasm", "Depressed: headache, lethargy, coma", "Excitable: tetany, seizures, confusion"], ["Key treatment", "Improve ventilation: bronchodilators, O₂, TCDB, ventilator", "Slow breathing, rebreathe CO₂, anxiolytics", "Treat cause, sodium bicarbonate", "Normal saline, KCl, H₂ blocker"]]}, {"title": "Reading an ABG: uncompensated vs. compensated", "columns": ["State", "pH", "PaCO₂ and HCO₃⁻", "Example (respiratory acidosis)"], "rows": [["**Uncompensated**", "Abnormal", "Only the primary value is abnormal; the other is normal", "pH 7.30, PaCO₂ 52, HCO₃⁻ 25"], ["**Partially compensated**", "Abnormal", "Both abnormal, moving in the compensating direction", "pH 7.32, PaCO₂ 56, HCO₃⁻ 31"], ["**Fully compensated**", "Normal (use 7.40 as the midline to name the primary)", "Both abnormal", "pH 7.37, PaCO₂ 58, HCO₃⁻ 33"], ["**Mixed**", "Very abnormal", "Both values push pH the same way", "pH 7.15, PaCO₂ 60, HCO₃⁻ 17 (respiratory + metabolic acidosis)"]], "note": "Use the **ABG interpreter** tab to practice. Galen HCO₃⁻ range (22 to 28) is used throughout."}, {"title": "Anemia lab patterns (classify by cell size first)", "columns": ["Condition", "MCV (size)", "Key labs", "The one distinguishing feature"], "rows": [["Iron deficiency", "↓ microcytic", "↓ MCH, ↓ ferritin, ↓ serum iron, **↑ TIBC**", "Low ferritin + pica / spoon nails"], ["Thalassemia", "↓ microcytic", "↓ MCH, target cells, **ferritin normal/↑**", "Small cells but iron stores are fine; genetic"], ["B12 / Pernicious", "↑ macrocytic", "↓ B12, anti-IF antibodies (pernicious)", "**Neurologic signs**"], ["Folate", "↑ macrocytic", "↓ folate, **B12 normal**", "Macrocytic with **no** neuro signs; alcohol, pregnancy"], ["Aplastic", "Normal", "**Pancytopenia**, ↓ reticulocytes, fatty hypocellular marrow", "All three lines low; infection + bleeding"], ["Sickle cell", "Normal or ↑", "HgbS on electrophoresis, ↑ retics, ↑ bilirubin & LDH in crisis", "Vaso-occlusive pain"], ["Anemia of chronic disease (Patho slide)", "Normal or slightly ↓", "↓ serum iron, **↓ TIBC**, ferritin normal/↑", "Iron is trapped in storage"], ["Polycythemia vera (not anemia)", "—", "↑ RBC, Hgb, Hct, WBC, platelets; ↓ EPO; ↑ uric acid", "Ruddy face, thick blood"]]}, {"title": "B12 deficiency vs. folate deficiency: how to tell them apart", "columns": ["Feature", "Vitamin B12 deficiency / pernicious anemia", "Folate deficiency"], "rows": [["**Neuro exam (the deciding cue)**", "==Paresthesias, lost vibration and position sense, ataxia, megaloblastic madness==", "**Normal** (may have irritability, depression, sleep loss, but no numbness or ataxia)"], ["Why", "B12 is needed for DNA **and myelin**", "Folate is needed for DNA only"], ["MCV / smear", "↑ macrocytic, hypersegmented neutrophils", "↑ macrocytic, hypersegmented neutrophils (same)"], ["Key lab", "↓ B12; ↑ methylmalonic acid and homocysteine; **IF antibodies + in pernicious**", "↓ folate; **B12 normal**"], ["Schilling test (Patho)", "Abnormal in pernicious anemia", "Normal"], ["Absorption site", "Ileum, needs intrinsic factor from the stomach", "Proximal small intestine, no carrier"], ["Body stores", "Years (slow onset)", "Months (fast onset)"], ["Main causes", "Pernicious anemia, gastrectomy/bariatric surgery, ileal disease, metformin, PPIs/H₂ blockers, vegan diet", "Alcohol, poor diet, pregnancy, hemolytic anemia, liver disease, celiac, methotrexate/phenytoin/oral contraceptives"], ["Who", "Older adults; family history (pernicious)", "Alcohol use disorder, pregnant clients"], ["Treatment", "B12: ==IM monthly for life in pernicious anemia==; oral if diet-only", "Folic acid 1 mg PO daily; IM if malabsorption"], ["Danger of the wrong drug", "Folic acid alone fixes the count, nerves keep degenerating", "Not applicable (B12 would not help)"], ["Unique complications", "Permanent neuropathy, falls, gastric cancer, hypokalemia on treatment", "Neural tube defects in pregnancy"], ["Diet teaching", "Meat, seafood, egg yolk, dairy", "Leafy greens, liver, citrus, beans, nuts, fortified grains"]], "note": "Rule: **big cells + nerves = B12**. Big cells + alcohol or pregnancy + normal neuro exam = folate. If in doubt, the B12 level comes before folic acid."}, {"title": "B12 deficiency vs. pernicious anemia vs. folate deficiency (instructor's table)", "columns": ["Feature", "Vitamin B12 deficiency", "Pernicious anemia", "Folate deficiency"], "rows": [["MCV", "↑ Macrocytic", "↑ Macrocytic", "↑ Macrocytic"], ["Megaloblasts", "Yes", "Yes", "Yes"], ["**Neurologic symptoms**", "**Yes**", "**Yes**", "**No**"], ["Cause", "Not enough B12 intake/absorption", "Autoimmune destruction of intrinsic factor", "Lack of folate intake/absorption"], ["Intrinsic factor problem?", "Sometimes", "Always", "No"], ["Common risk factors", "Vegan diet, gastric surgery, Crohn's", "Autoimmune disease, older adults", "Alcoholism, malnutrition, pregnancy"]], "note": "Patho slide case clues: macrocytic + numb feet → B12. Macrocytic + alcohol use + no neuro signs → folate. Macrocytic + positive IF antibodies + neuro → pernicious."}, {"title": "Iron deficiency vs. thalassemia (both small, pale cells)", "columns": ["Feature", "Iron deficiency", "Thalassemia"], "rows": [["**Ferritin**", "**↓**", "**Normal or ↑**"], ["Cause", "Blood loss, low intake/absorption, pregnancy", "Inherited defective globin chain production"], ["Hemolysis signs", "No", "Yes: jaundice, splenomegaly, hepatomegaly"], ["Iron supplements", "Treatment", "Avoid unless ordered (absorption already ↑)"], ["Unique cues", "Pica, spoon nails, blue sclerae, mouth fissures", "Bone deformities, delayed development, target cells"]]}, {"title": "Aplastic anemia vs. polycythemia vera (opposite marrow problems)", "columns": ["Feature", "Aplastic anemia", "Polycythemia vera"], "rows": [["Marrow", "Fails: too few of everything (**pancytopenia**)", "Neoplastic: too many of everything (**pancytosis**)"], ["Skin", "Pale, bruised, petechiae", "**Ruddy**, itchy"], ["Main danger", "Infection and bleeding", "Thrombosis (and mucosal bleeding)"], ["Treatment", "HSCT; cyclosporine + ATG; transfusions", "Phlebotomy, aspirin, anagrelide, fluids"], ["Priority nursing", "Neutropenic + bleeding precautions", "Monitor for thrombosis and hemorrhage"]]}, {"title": "Blood products and their use (Med-Surg slide)", "columns": ["Product", "Use"], "rows": [["Fresh frozen plasma (FFP)", "Replace clotting factors and blood volume"], ["Packed red blood cells (PRBCs)", "Replace RBCs, usually after trauma or surgery; thalassemia major"], ["Platelet transfusions", "Replace platelets, usually for active bleeding or scheduled invasive procedures (aplastic anemia)"], ["WBC transfusions", "Rarely given to neutropenic clients"]]}, {"title": "Sickle cell prevention teaching (Med-Surg slides)", "columns": ["Precipitating factor", "Possible causes", "Teaching"], "rows": [["Physical stress", "Illness, pregnancy, congested vascular space", "Nutrition, vaccinations, treat illness early; pregnancy raises oxygen demand"], ["Emotional stress", "Certain situations (client-dependent)", "Identify and avoid triggering situations where possible"], ["Dehydration", "Inadequate fluid balance", "Drink 3 to 4 L of fluid a day"], ["Hypoxia", "Sports, illness", "Avoid strenuous physical activity"], ["Vasoconstriction", "Cold, smoking, alcohol, caffeine, high altitude, stress", "Avoid these"]]}, {"title": "Unit 2 medications at a glance", "columns": ["Drug", "Condition", "Key check before giving", "Hold / report"], "rows": [["Cyanocobalamin (B12)", "B12 / pernicious", "Confirm deficiency; baseline K⁺", "K⁺ < 3.5 in first 48 h; anaphylaxis"], ["Folic acid", "Folate", "==B12 level is normal==", "New paresthesia"], ["Ferrous sulfate", "Iron deficiency", "Anemia is truly iron deficiency", "Tarry stools with pain; IV: anaphylaxis"], ["Cyclosporine + ATG", "Aplastic", "Creatinine, BP; ATG: skin test, emergency equipment", "Rising creatinine; anaphylaxis; fever"], ["Morphine / hydromorphone PCA", "Sickle cell", "RR, sedation, cognition for PCA", "RR < 10, rising sedation"], ["Ibuprofen", "Sickle cell", "Kidney function, GI bleed history", "Black stools, ↓ urine output"], ["Aspirin (low dose)", "Polycythemia vera", "Bleeding history", "Active bleeding"], ["Albuterol / ipratropium", "Resp. acidosis", "Lung sounds, HR", "Paradoxical bronchospasm"], ["Lorazepam / diazepam", "Resp. alkalosis", "Rule out hypoxia; RR, LOC", "Respiratory depression"], ["Sodium bicarbonate", "Metab. acidosis", "ABG, K⁺, Ca²⁺", "Tetany, alkalosis"], ["Potassium chloride", "Metab. alkalosis", "K⁺, urine output", "==Never IV push==; peaked T waves"], ["Cimetidine / acetazolamide", "Metab. alkalosis", "Gastric output / K⁺, sulfa allergy", "Confusion / hypokalemia"]]}, {"title": "Drug suffix cheat sheet: the ending tells you the class", "columns": ["Suffix", "Class", "Drugs in this guide"], "rows": [["-terol", "Short-acting beta₂-adrenergic agonist (SABA) bronchodilator", "albuterol"], ["-azepam", "Benzodiazepine (antianxiety)", "diazepam, lorazepam"], ["-tidine", "Histamine-2 (H₂) receptor antagonist", "cimetidine"], ["-zolamide", "Carbonic anhydrase inhibitor (diuretic)", "acetazolamide"]]}], "quiz": [{"step": "Recognize Cues", "q": "Which ABG indicates uncompensated respiratory acidosis?", "o": ["A. pH 7.50, PaCO₂ 28 mmHg, HCO₃⁻ 24 mEq/L", "B. pH 7.30, PaCO₂ 52 mmHg, HCO₃⁻ 25 mEq/L", "C. pH 7.36, PaCO₂ 55 mmHg, HCO₃⁻ 31 mEq/L", "D. pH 7.30, PaCO₂ 40 mmHg, HCO₃⁻ 17 mEq/L"], "a": 1, "w": "**Answer: B.** Why: low pH with high PaCO₂ (opposite directions, ROME) and a normal HCO₃⁻ means the kidneys have not compensated yet. D is metabolic acidosis (low HCO₃⁻, normal PaCO₂). C has a normal pH with both values abnormal, so it is fully compensated respiratory acidosis, not uncompensated. A is respiratory alkalosis."}, {"step": "Analyze Cues", "q": "A client with type 1 diabetes has deep, rapid respirations. ABG: pH 7.29, PaCO₂ 30 mmHg, HCO₃⁻ 15 mEq/L. How should the nurse interpret this?", "o": ["A. Uncompensated respiratory alkalosis", "B. Partially compensated metabolic acidosis", "C. Fully compensated metabolic acidosis", "D. Mixed respiratory and metabolic acidosis"], "a": 1, "w": "**Answer: B.** Why: pH and HCO₃⁻ are both low (Metabolic Equal), and the low PaCO₂ shows the lungs are blowing off CO₂ (Kussmaul), but pH is still abnormal, so compensation is partial. A ignores the low pH. C would need a normal pH. D would need a high PaCO₂ pushing the same direction."}, {"step": "Analyze Cues", "q": "A client who has been vomiting for 2 days has pH 7.52, HCO₃⁻ 34 mEq/L, PaCO₂ 44 mmHg, K⁺ 3.0 mEq/L. Which explanation for the potassium is correct?", "o": ["A. The kidneys are retaining K⁺ to raise pH", "B. Alkalosis shifts K⁺ into cells and vomiting loses K⁺", "C. Hemolysis has released K⁺", "D. Acidosis shifts K⁺ out of cells"], "a": 1, "w": "**Answer: B.** Why: in alkalosis H⁺ leaves cells and K⁺ enters them, and gastric losses add to the deficit. D describes acidosis (the opposite). A is not the mechanism and K⁺ is low, not retained. C would raise, not lower, K⁺."}, {"step": "Take Action", "q": "A post-op client receiving opioids by PCA has RR 8, SaO₂ 88%, and is difficult to arouse. What is the nurse's first action?", "o": ["A. Stop the PCA and stimulate the client to breathe while raising the head of the bed", "B. Administer the next scheduled dose of anti-anxiety medication", "C. Encourage the client to use the incentive spirometer later", "D. Draw a serum potassium level"], "a": 0, "w": "**Answer: A.** Why: the opioid is depressing ventilation and causing CO₂ retention (respiratory acidosis); removing the cause and supporting breathing comes first, then notify the provider. D is useful but not first. C delays action and the client cannot participate now. B is a respiratory depressant and would worsen the situation."}, {"step": "Generate Solutions", "q": "A client is hyperventilating during a panic attack and reports tingling in the fingers. Which interventions are appropriate? (Choose the best set.)", "o": ["A. Coach slow breathing, stay with the client, rebreathe into a closed system as ordered, give anxiolytic if ordered", "B. Restrict fluids and give a potassium supplement", "C. Encourage rapid deep breaths to improve oxygenation", "D. Give sodium bicarbonate and start oxygen at a high flow"], "a": 0, "w": "**Answer: A.** Why: these raise PaCO₂ and treat the anxiety driving respiratory alkalosis. D: bicarbonate would worsen alkalosis. C: faster breathing blows off more CO₂. B: unrelated to the cause."}, {"step": "Prioritize Hypotheses", "q": "A client on continuous NG suction for 3 days has HCO₃⁻ 35 mEq/L. Which finding is the nurse's highest priority?", "o": ["A. Mild nausea", "B. Positive Chvostek sign and new irregular heart rhythm", "C. Urine output 45 mL/hr", "D. Thirst and dry mucous membranes"], "a": 1, "w": "**Answer: B.** Why: tetany signs (low ionized calcium) and dysrhythmia (low K⁺) can progress to seizure and cardiac arrest. D shows volume depletion, important but less immediately dangerous. C is adequate output. A is expected and minor."}, {"step": "Generate Solutions", "q": "A client has metabolic alkalosis from gastric suction. Which order should the nurse anticipate?", "o": ["A. Fluid restriction", "B. Antacids every 4 hours", "C. IV normal saline with potassium chloride", "D. Sodium bicarbonate IV"], "a": 2, "w": "**Answer: C.** Why: saline restores volume and chloride so the kidneys can excrete bicarbonate; KCl replaces K⁺ and Cl⁻. D and B add more base. A would perpetuate the volume-driven alkalosis."}, {"step": "Recognize Cues", "q": "Which client is at greatest risk for metabolic acidosis?", "o": ["A. A client with severe diarrhea for 4 days", "B. A client with prolonged vomiting", "C. A client taking a loop diuretic", "D. A client receiving a massive citrated blood transfusion"], "a": 0, "w": "**Answer: A.** Why: diarrhea loses bicarbonate in stool. D: citrate is converted to bicarbonate (alkalosis). C: diuretics cause alkalosis (H⁺ and K⁺ loss, volume depletion). B: loss of stomach acid causes alkalosis."}, {"step": "Analyze Cues", "q": "A child is brought in after swallowing an unknown number of aspirin tablets. Which acid-base finding does the nurse expect at presentation?", "o": ["A. Respiratory acidosis", "B. Metabolic acidosis", "C. Metabolic alkalosis", "D. Normal ABG"], "a": 1, "w": "**Answer: B.** Why (Patho slides): adults often show respiratory alkalosis first from medulla stimulation, then metabolic acidosis, but children commonly present already in metabolic acidosis. C and A are not part of salicylate toxicity. D is unlikely after a significant ingestion."}, {"step": "Evaluate Outcomes", "q": "After treatment for metabolic acidosis, which finding shows the treatment is working?", "o": ["A. K⁺ 6.0 mEq/L with peaked T waves", "B. pH 7.31, HCO₃⁻ 18 mEq/L, Kussmaul respirations", "C. Increasing lethargy", "D. pH 7.38, HCO₃⁻ 23 mEq/L, respirations 16 and regular"], "a": 3, "w": "**Answer: D.** Why: pH and HCO₃⁻ are in Galen range and breathing no longer needs to compensate. B shows ongoing acidosis. A shows dangerous hyperkalemia. C shows worsening CNS depression."}, {"step": "Analyze Cues", "q": "Which ABG is fully compensated?", "o": ["A. pH 7.31, PaCO₂ 58 mmHg, HCO₃⁻ 33 mEq/L", "B. pH 7.48, PaCO₂ 30 mmHg, HCO₃⁻ 24 mEq/L", "C. pH 7.28, PaCO₂ 40 mmHg, HCO₃⁻ 16 mEq/L", "D. pH 7.37, PaCO₂ 58 mmHg, HCO₃⁻ 33 mEq/L"], "a": 3, "w": "**Answer: D.** Why: pH is back in 7.35 to 7.45 with both values abnormal. pH 7.37 is below 7.40, so the primary problem was acidosis, and the high PaCO₂ matches acidosis: compensated respiratory acidosis (as in chronic COPD). A is partially compensated (pH still low). C is uncompensated metabolic acidosis. B is uncompensated respiratory alkalosis."}, {"step": "Recognize Cues", "q": "A 45-year-old woman reports fatigue and craving ice. Hgb 8.5 g/dL, MCV low, ferritin low. Which additional finding supports iron deficiency anemia?", "o": ["A. Elevated ferritin", "B. Ruddy complexion", "C. Paresthesia of the feet", "D. Spoon-shaped nails"], "a": 3, "w": "**Answer: D.** Why: koilonychia is a classic iron deficiency cue, along with pica. C points to B12 deficiency. B suggests polycythemia vera. A contradicts the diagnosis (ferritin is low because stores are depleted)."}, {"step": "Take Action", "q": "The nurse is teaching a client starting oral iron. Which statement shows a need for more teaching?", "o": ["A. \"If my stools turn black, I should stop the iron right away.\"", "B. \"I'll take my iron between meals.\"", "C. \"I'll use a straw when I take the liquid form.\"", "D. \"I'll drink plenty of fluids to prevent constipation.\""], "a": 0, "w": "**Answer: A.** Why: black or tarry stools are an expected effect of iron and are not a reason to stop. B, D, and C are all correct teaching from the Rx Corner slide."}, {"step": "Prioritize Hypotheses", "q": "A 68-year-old man has new iron deficiency anemia. Which question is the most important for the nurse to ask?", "o": ["A. \"Do you follow a vegan diet?\"", "B. \"Have you noticed black, tarry stools or vomited blood?\"", "C. \"Has anyone in your family had sickle cell disease?\"", "D. \"Do you drink alcohol daily?\""], "a": 1, "w": "**Answer: B.** Why: the most common cause of iron deficiency in men is GI bleeding, and anemia is never normal, so find the source. A relates more to B12 deficiency. C is a genetic hemolytic anemia. D relates more to folate deficiency."}, {"step": "Analyze Cues", "q": "A client has Hgb 9.4 g/dL, MCV 115 fL, glossitis, numb feet, and positive intrinsic factor antibodies. Which teaching is most appropriate?", "o": ["A. \"Iron supplements will reverse this anemia.\"", "B. \"This will resolve once your tongue heals.\"", "C. \"Eating more meat and dairy will correct this.\"", "D. \"You will need vitamin B12 replacement for the rest of your life.\""], "a": 3, "w": "**Answer: D.** Why: pernicious anemia means intrinsic factor is destroyed, so B12 cannot be absorbed from food; replacement is lifelong. C fails because diet B12 cannot be absorbed without IF. A treats a different (microcytic) anemia. B is false."}, {"step": "Analyze Cues", "q": "Which finding differentiates folate deficiency from vitamin B12 deficiency?", "o": ["A. Fatigue", "B. Absence of paresthesia", "C. Glossitis", "D. Increased MCV"], "a": 1, "w": "**Answer: B.** Why: folate deficiency does not involve the nervous system. C, A, and D occur in both."}, {"step": "Generate Solutions", "q": "Which meal choice best supports a client with folate deficiency?", "o": ["A. White rice and chicken broth", "B. Coffee and a plain bagel", "C. Cheese pizza and soda", "D. Spinach salad with dried beans and an orange"], "a": 3, "w": "**Answer: D.** Why: green leafy vegetables, dried beans, and citrus fruits are folate sources on your slides. A, B, and C are low in folate."}, {"step": "Take Action", "q": "A client with aplastic anemia has WBC 2,300/mm³ and platelets 45,000/mm³. Which nursing action is the priority?", "o": ["A. Provide a high-fiber diet", "B. Implement neutropenic and bleeding precautions", "C. Administer oral iron", "D. Encourage daily walks in the hallway"], "a": 1, "w": "**Answer: B.** Why: pancytopenia makes infection and bleeding the most dangerous problems. D exposes the client to pathogens and fall/bleeding risk. C does not treat marrow failure. A does not address the priority."}, {"step": "Recognize Cues", "q": "A client with aplastic anemia receiving cyclosporine and ATG has a temperature of 100.9°F. What should the nurse do?", "o": ["A. Give acetaminophen and document", "B. Encourage oral fluids and rest", "C. Recheck the temperature in 4 hours", "D. Notify the provider immediately"], "a": 3, "w": "**Answer: D.** Why: with few neutrophils and immunosuppression, fever may be the only sign of a life-threatening infection. C delays care. A may mask the fever without addressing the cause. B is supportive but not the priority."}, {"step": "Analyze Cues", "q": "A client has low Hgb, low MCV, low MCH, normal ferritin, and target cells on the smear. Which condition is most likely?", "o": ["A. Iron deficiency anemia", "B. Thalassemia", "C. Aplastic anemia", "D. Folate deficiency"], "a": 1, "w": "**Answer: B.** Why: microcytic, hypochromic cells with normal iron stores and target cells point to thalassemia. A has low ferritin. D is macrocytic. C shows pancytopenia with normal MCV."}, {"step": "Take Action", "q": "Which intervention is the priority during a sickle cell crisis?", "o": ["A. Apply sequential compression devices (SCDs)", "B. Apply ice packs to painful joints", "C. Start IV fluids and administer oxygen", "D. Restrict fluids to prevent fluid overload"], "a": 2, "w": "**Answer: C.** Why: oxygen reverses the hypoxia that drives sickling and fluids decrease viscosity. B: cold causes vasoconstriction and more sickling. D: dehydration worsens sickling. A: the slides say no SCDs or TED hose because compression impairs flow."}, {"step": "Recognize Cues", "q": "A client in sickle cell crisis reports new chest pain. SaO₂ is 87% and RR is 30. What does the nurse suspect?", "o": ["A. Iron overload", "B. Anxiety", "C. Expected pain from vaso-occlusion in the joints", "D. Acute chest syndrome"], "a": 3, "w": "**Answer: D.** Why: chest pain, hypoxemia, and tachypnea in sickle cell disease indicate vaso-occlusion in the lungs (acute chest syndrome), a medical emergency. C: this is chest, not joint pain, with hypoxia. B ignores objective hypoxemia. A is not acute."}, {"step": "Evaluate Outcomes", "q": "Which statement by a client with sickle cell disease shows teaching was effective?", "o": ["A. \"I can have a few drinks to relax when I'm stressed.\"", "B. \"A cold shower helps when my joints hurt.\"", "C. \"I should push myself during hard workouts to build stamina.\"", "D. \"I'll drink 3 to 4 liters of fluid a day and avoid high-altitude trips.\""], "a": 3, "w": "**Answer: D.** Why: hydration and avoiding altitude prevent sickling. B: cold causes vasoconstriction. A: alcohol causes vasoconstriction and dehydration. C: strenuous activity causes hypoxia."}, {"step": "Analyze Cues", "q": "A 60-year-old man has a flushed face, headache, Hct 58%, and low erythropoietin. Which intervention prevents complications?", "o": ["A. Iron supplements", "B. Bed rest", "C. High-iron diet", "D. Routine phlebotomy"], "a": 3, "w": "**Answer: D.** Why: polycythemia vera thickens the blood; phlebotomy lowers Hct and viscosity and prevents thrombosis. A and C feed RBC production. B increases clot risk."}, {"step": "Take Action", "q": "A client with polycythemia vera taking aspirin and anagrelide reports new swelling and pain in the left calf. What is the nurse's best action?", "o": ["A. Encourage the client to walk it off", "B. Massage the calf to relieve pain", "C. Apply a heating pad and reassess tomorrow", "D. Notify the provider of possible thrombosis"], "a": 3, "w": "**Answer: D.** Why: hyperviscosity makes thrombosis the major complication; unilateral calf swelling suggests DVT. B could dislodge a clot. A and C delay evaluation."}, {"step": "Generate Solutions", "q": "Which blood product would the nurse anticipate for a client with aplastic anemia who is actively bleeding with platelets of 12,000/mm³?", "o": ["A. Platelet transfusion", "B. Fresh frozen plasma", "C. Oral iron", "D. WBC transfusion"], "a": 0, "w": "**Answer: A.** Why: platelets are given for active bleeding with low counts. B replaces clotting factors and volume, not platelets. D is rare and for neutropenia. C does not address bleeding."}, {"step": "Analyze Cues", "q": "Why might a client with severe anemia develop metabolic acidosis?", "o": ["A. Low hemoglobin reduces oxygen delivery, so cells use anaerobic metabolism and produce lactic acid", "B. Anemia causes the lungs to retain CO₂", "C. Iron is an acid, so low iron raises pH", "D. Anemia causes the kidneys to lose chloride"], "a": 0, "w": "**Answer: A.** Why: this is the link the Patho slides make between the two halves of the unit. B describes respiratory acidosis. D relates to alkalosis. C is false."}, {"step": "Recognize Cues", "q": "Two clients have Hgb 9 g/dL and MCV 116 fL. Which additional finding indicates vitamin B12 deficiency rather than folate deficiency?", "o": ["A. Hypersegmented neutrophils on the smear", "B. Glossitis", "C. Loss of vibration sense in both feet", "D. Fatigue and pallor"], "a": 2, "w": "**Answer: C.** Why: B12 is needed for myelin, so peripheral nerve and posterior-column damage (lost vibration and position sense) occurs only with B12 deficiency. B, D, and A occur in both megaloblastic anemias because both disrupt DNA synthesis."}, {"step": "Analyze Cues", "q": "A client with a 20-year history of alcohol use disorder has macrocytic anemia, a normal B12 level, and a normal neurologic exam. Which is most likely?", "o": ["A. Aplastic anemia", "B. Folate deficiency", "C. Pernicious anemia", "D. Iron deficiency anemia"], "a": 1, "w": "**Answer: B.** Why: alcohol lowers folate intake and liver storage, and folate deficiency causes macrocytic anemia without neuropathy. C would show low B12 and often neuro signs. D is microcytic. A shows pancytopenia with normal MCV."}, {"step": "Take Action", "q": "A provider orders folic acid 1 mg daily for a client with newly found macrocytic anemia. The B12 level has not resulted. What should the nurse do?", "o": ["A. Give folic acid with an iron supplement", "B. Hold all medications for 24 hours", "C. Clarify the order until the B12 level is known", "D. Give the folic acid; it treats all macrocytic anemias"], "a": 2, "w": "**Answer: C.** Why: folic acid alone corrects the blood count of B12 deficiency while nerve damage continues (masking), so the deficient vitamin must be identified first. D is the masking error. A adds a drug for a microcytic anemia. B is unnecessary and delays other care."}, {"step": "Evaluate Outcomes", "q": "Which statement by a client with pernicious anemia shows understanding of treatment?", "o": ["A. \"I will need B12 shots every month for the rest of my life.\"", "B. \"Eating more red meat will let me stop the injections.\"", "C. \"Folic acid pills will work just as well as the shots.\"", "D. \"Once my blood count is normal I can stop the shots.\""], "a": 0, "w": "**Answer: A.** Why: without intrinsic factor, B12 cannot be absorbed from food, so replacement is lifelong. D causes relapse. B fails because dietary B12 is not absorbed. C masks the deficiency while nerve damage progresses."}, {"step": "Prioritize Hypotheses", "q": "Two days after starting IM cyanocobalamin for severe pernicious anemia, a client reports muscle weakness and palpitations. What should the nurse suspect?", "o": ["A. Vitamin B12 overdose causing hypertension", "B. Folate toxicity", "C. An expected effect that needs no action", "D. Hypokalemia from rapid red cell production"], "a": 3, "w": "**Answer: D.** Why: new red cells take up potassium quickly in the first 48 hours of B12 therapy, so K⁺ can fall (Davis; Banasik). B is not a concept here. A is not the mechanism. C ignores a potentially dangerous dysrhythmia risk."}, {"step": "Generate Solutions", "q": "Which client is at greatest risk for vitamin B12 (not folate) deficiency?", "o": ["A. A pregnant client in the first trimester", "B. A client with sickle cell disease", "C. A 70-year-old 6 years after gastric bypass who takes omeprazole", "D. A client who drinks a pint of liquor daily"], "a": 2, "w": "**Answer: C.** Why: bariatric surgery removes intrinsic factor production, PPIs reduce B12 absorption, and older age raises risk. A, B, and D increase folate requirements or reduce folate intake."}, {"step": "Take Action", "q": "A client with B12-related neuropathy is admitted. Which nursing intervention has the highest priority?", "o": ["A. Teach foods high in vitamin B12", "B. Encourage soft, bland foods", "C. Schedule rest periods between activities", "D. Implement fall precautions and assist with ambulation"], "a": 3, "w": "**Answer: D.** Why: lost proprioception and ataxia make falls the most immediate threat. A, B, and C are appropriate but lower priority than injury prevention."}, {"step": "Take Action", "q": "Before administering a scheduled dose of potassium chloride IV, which finding requires the nurse to hold the dose and notify the provider?", "o": ["A. Nausea after the previous oral dose", "B. K⁺ 3.2 mEq/L", "C. Urine output of 15 mL/hr for the past 3 hours", "D. Heart rate 88"], "a": 2, "w": "**Answer: C.** Why: K⁺ is excreted by the kidneys; oliguria risks dangerous hyperkalemia. B is the reason for the dose. A is a common GI effect. D is normal."}, {"step": "Analyze Cues", "q": "A client in sickle cell crisis receives hydromorphone by PCA. Which finding requires immediate action?", "o": ["A. Respiratory rate 9 and difficult to arouse", "B. Nausea", "C. Pain rated 6 of 10", "D. Client presses the button 3 times in an hour"], "a": 0, "w": "**Answer: A.** Why: slow respirations with excessive sedation signal opioid-induced respiratory depression; stop the PCA per protocol, support breathing, and notify (naloxone available). C needs reassessment but is not an emergency. B is a common effect. D is within normal use when lockout limits doses."}, {"step": "Generate Solutions", "q": "Before the first dose of antithymocyte globulin (Atgam) for aplastic anemia, which action is most important?", "o": ["A. Encourage visitors to boost morale", "B. Give the dose IV push to finish quickly", "C. Give an iron supplement", "D. Ensure emergency airway and anaphylaxis equipment is at the bedside"], "a": 3, "w": "**Answer: D.** Why: ATG can cause anaphylaxis with bronchospasm and hypotension; skin testing and emergency readiness are required (Abrams Ch. 13). B is unsafe. A increases infection risk. C is unrelated."}, {"step": "Evaluate Outcomes", "q": "Which statement shows a client needs more teaching about oral ferrous sulfate?", "o": ["A. \"I'll increase fiber and fluids.\"", "B. \"I'll take it with orange juice an hour before breakfast.\"", "C. \"My stools may turn black.\"", "D. \"I'll take my iron with a glass of milk to protect my stomach.\""], "a": 3, "w": "**Answer: D.** Why: dairy greatly reduces iron absorption (Brunner Chart 29-3; Davis). B, C, and A are correct teaching."}, {"step": "Take Action", "q": "A client receiving packed red blood cells reports chills and low back pain 10 minutes after the start. What is the first action?", "o": ["A. Slow the rate and recheck in 15 minutes", "B. Stop the transfusion and keep the IV open with normal saline", "C. Remove the IV catheter", "D. Give acetaminophen and continue"], "a": 1, "w": "**Answer: B.** Why: back pain and chills early in a transfusion suggest an acute hemolytic reaction; stop the blood immediately but keep IV access with saline, then notify. A and D keep infusing incompatible blood. C loses the access needed for treatment."}, {"step": "Recognize Cues", "q": "After a therapeutic phlebotomy for polycythemia vera, which finding should the nurse address first?", "o": ["A. Mild bruising at the site", "B. Dizziness and BP drop when the client stands", "C. Client asks for a snack", "D. Hct decreased from 58% to 52%"], "a": 1, "w": "**Answer: B.** Why: volume removal causes orthostatic hypotension and fall risk. D is the intended effect. A is minor. C is appropriate and encouraged."}, {"step": "Generate Solutions", "q": "A client with chronic COPD has PaCO₂ 62 mmHg and SaO₂ 86%. Which oxygen order is most appropriate to anticipate?", "o": ["A. Paper-bag rebreathing", "B. Non-rebreather mask at 15 L/min", "C. Low-concentration oxygen titrated to the ordered saturation target", "D. No oxygen because it will stop breathing"], "a": 2, "w": "**Answer: C.** Why: with chronic CO₂ retention, hypoxemia drives breathing, so oxygen is given cautiously at low concentrations (Brunner Quality and Safety Alert). B risks removing the hypoxic drive. D leaves dangerous hypoxemia. A raises CO₂ further."}], "flashcards": [["Normal pH, PaCO₂, HCO₃⁻ (Galen)?", "pH 7.35 to 7.45 · PaCO₂ 35 to 45 mmHg · HCO₃⁻ 22 to 28 mEq/L"], ["ROME?", "Respiratory Opposite (pH and PaCO₂ move opposite). Metabolic Equal (pH and HCO₃⁻ move the same way)."], ["Which system compensates fast? Slow?", "Lungs: minutes (adjust CO₂). Kidneys: hours to days (adjust HCO₃⁻ and H⁺)."], ["Three buffers in the blood?", "Bicarbonate (most important extracellular), hemoglobin, protein. Normal HCO₃⁻ : carbonic acid ratio is 20:1."], ["CO₂ + H₂O → ?", "H₂CO₃ (carbonic acid) → H⁺ + HCO₃⁻. More CO₂ = more acid."], ["Why does respiratory acidosis cause headache and somnolence?", "High CO₂ dilates cerebral vessels → ↑ intracranial pressure; CO₂ and acidosis depress neurons."], ["Acidosis and K⁺?", "H⁺ moves into cells, K⁺ moves out → hyperkalemia → peaked T waves, dysrhythmias."], ["Alkalosis and calcium?", "High pH → more Ca²⁺ binds albumin → ionized Ca²⁺ falls → paresthesia, carpopedal spasm, tetany, seizures."], ["Kussmaul respirations mean?", "Deep, rapid breathing compensating for metabolic acidosis (classic in DKA). Do not suppress it."], ["Diarrhea vs vomiting acid-base?", "Diarrhea loses base → metabolic acidosis. Vomiting loses stomach acid → metabolic alkalosis."], ["Aspirin toxicity sequence?", "Respiratory alkalosis first (medulla stimulated), then metabolic acidosis. Children often present in metabolic acidosis."], ["Massive citrated transfusion causes?", "Metabolic alkalosis: the liver converts citrate to bicarbonate."], ["Why give normal saline in metabolic alkalosis?", "Restores volume and chloride so the kidneys can excrete excess bicarbonate."], ["Why paper bag in respiratory alkalosis?", "Rebreathing exhaled CO₂ raises PaCO₂ and lowers pH."], ["Carbon monoxide poisoning acid-base?", "Metabolic (lactic) acidosis: CO blocks oxygen delivery → anaerobic metabolism. Skin may look cherry-pink."], ["Rule #1 of anemia?", "Anemia is never normal. Always look for the cause."], ["What three nutrients does RBC production require?", "Iron, vitamin B12, folate (plus erythropoietin from the kidney)."], ["Ferritin vs serum iron vs TIBC?", "Ferritin = iron in storage. Serum iron = iron in circulation. TIBC ↑ when iron is low."], ["Iron deficiency cell size?", "Microcytic, hypochromic (small and pale)."], ["Most common cause of iron deficiency in men vs women?", "Men: GI bleeding. Women: menorrhagia."], ["Pica, spoon nails, blue sclerae →", "Iron deficiency anemia."], ["IM iron technique?", "Z-track."], ["B12 vs folate: the differentiator?", "Neurologic symptoms (paresthesia, megaloblastic madness) occur only with B12 deficiency."], ["What is intrinsic factor and where is it made?", "A stomach protein required to absorb B12 in the small intestine. Lost in pernicious anemia and gastrectomy."], ["Pernicious anemia treatment length?", "Lifelong B12 replacement."], ["Megaloblastic madness?", "B12 neuropsychiatric signs: paranoia, delusions, hallucinations, cognitive dysfunction."], ["Low folate in pregnancy risk?", "Neural tube defects."], ["Aplastic anemia triad?", "Anemia + leukopenia + thrombocytopenia = pancytopenia. Low reticulocytes."], ["Most common cause of aplastic anemia?", "Iatrogenic: chemotherapy and irradiation."], ["Aplastic anemia drugs?", "Cyclosporine + antithymocyte globulin (ATG). HSCT can cure clients < 60 with a donor."], ["Thalassemia vs iron deficiency?", "Both microcytic; thalassemia has normal/high ferritin and target cells."], ["Alpha vs beta thalassemia timing?", "Alpha: fetus/newborn. Beta: after 6 months; beta major is transfusion-dependent."], ["Sickle cell crisis triggers?", "Stress, dehydration, hypoxia, vasoconstriction (cold, smoking, alcohol, caffeine, altitude)."], ["Sickle cell crisis priorities?", "Oxygen, IV fluids (hypotonic), pain control (morphine), warmth; no SCDs/TED hose, no ice."], ["Why jaundice in hemolytic anemias?", "RBCs break down early → hemoglobin → bilirubin faster than the liver can clear."], ["Hemolysis lab pattern?", "↑ reticulocytes, ↑ LDH, ↑ indirect bilirubin, ↓ haptoglobin."], ["Polycythemia vera labs?", "↑ RBC, Hgb, Hct, WBC, platelets; ↓ EPO; ↑ uric acid."], ["Polycythemia vera main complication and treatment?", "Thrombosis. Phlebotomy, aspirin, anagrelide, fluids."], ["What does FFP replace?", "Clotting factors and blood volume."], ["Hct rule of thumb?", "Hct ≈ Hgb × 3 in a normally hydrated person."], ["Big red cells + numb feet + poor balance →", "Vitamin B12 deficiency (pernicious anemia if IF antibodies are positive)."], ["Big red cells + alcohol use + normal neuro exam →", "Folate deficiency."], ["Why does only B12 deficiency damage nerves?", "B12 is needed for myelin and nerve fatty acid metabolism; folate is not."], ["Which spinal cord tracts degenerate in B12 deficiency?", "Dorsal (posterior) and lateral columns → lost vibration and position sense, spastic ataxia."], ["B12 stores vs folate stores?", "B12: years. Folate: months."], ["Where is B12 absorbed and what does it need?", "Terminal ileum; needs intrinsic factor from gastric parietal cells."], ["What does 'folic acid masks B12 deficiency' mean?", "Folic acid fixes the blood count, but nerve damage from B12 lack keeps progressing."], ["Drugs that lower B12 absorption?", "Metformin, PPIs (omeprazole), H₂ blockers (cimetidine), antacids."], ["Drugs that antagonize folate?", "Methotrexate and phenytoin; oral contraceptives and sulfasalazine lower absorption."], ["Electrolyte to watch in the first 48 h of B12 therapy?", "Potassium (hypokalemia)."], ["Pernicious anemia route and duration?", "IM (or deep subcut/nasal) B12, monthly, for life."], ["Folic acid dose for folate deficiency (Brunner)?", "1 mg PO daily; IM if malabsorption."], ["Pernicious anemia long-term cancer risk?", "Gastric cancer (gastric atrophy) → periodic endoscopy."], ["Folate mood symptoms (Banasik)?", "Irritability, depression, blunted affect, sleep deprivation, memory loss: but no peripheral neuropathy."], ["Anion gap normal and meaning?", "8 to 12 mEq/L (without K⁺); high gap = acid gained, normal gap = bicarbonate lost."], ["Why give O₂ cautiously in chronic CO₂ retainers?", "PaCO₂ chronically > 50 makes hypoxemia the drive to breathe."], ["PV phlebotomy goal?", "Hct below 45%."], ["Iron deficiency: cause until proven otherwise?", "Blood loss (GI bleeding)."]], "glossary": [["ABG", "Arterial blood gas"], ["ABO", "Blood group system (A, B, AB, O)"], ["ACE", "Angiotensin-converting enzyme"], ["ANC", "Absolute neutrophil count"], ["ARB", "Angiotensin II receptor blocker"], ["ARDS", "Acute respiratory distress syndrome"], ["ATG", "Antithymocyte globulin"], ["B12", "Vitamin B12 (cobalamin)"], ["BP", "Blood pressure"], ["BUN", "Blood urea nitrogen"], ["Ca²⁺", "Calcium (ionized)"], ["CBC", "Complete blood count"], ["Cl⁻", "Chloride"], ["CMP", "Complete (comprehensive) metabolic profile"], ["CNS", "Central nervous system"], ["CO", "Carbon monoxide"], ["COPD", "Chronic obstructive pulmonary disease"], ["CO₂", "Carbon dioxide"], ["CSLO", "Course student learning outcome"], ["CVA", "Cerebrovascular accident (stroke)"], ["CXR", "Chest x-ray"], ["CYP", "Cytochrome P450 (liver drug-metabolizing enzymes)"], ["CYP3A4", "Cytochrome P450 3A4 enzyme"], ["DKA", "Diabetic ketoacidosis"], ["DMARD", "Disease-modifying antirheumatic drug"], ["DNA", "Deoxyribonucleic acid"], ["DVT", "Deep vein thrombosis"], ["ECF", "Extracellular fluid"], ["ECG / EKG", "Electrocardiogram"], ["EPO", "Erythropoietin"], ["ESRD", "End-stage renal disease"], ["F", "Female"], ["F&P", "Frandsen & Pennington (Abrams' Clinical Drug Therapy)"], ["FDA", "U.S. Food and Drug Administration"], ["FFP", "Fresh frozen plasma"], ["fL", "Femtoliter (unit of MCV)"], ["GABA", "Gamma-aminobutyric acid"], ["GBS", "Guillain-Barré syndrome"], ["GI", "Gastrointestinal"], ["HbS", "Hemoglobin S (same as HgbS)"], ["HCl", "Hydrochloric acid"], ["HCO₃⁻", "Bicarbonate"], ["Hct", "Hematocrit"], ["HFA", "Hydrofluoroalkane (inhaler propellant)"], ["Hgb", "Hemoglobin"], ["HgbS", "Hemoglobin S (sickle hemoglobin)"], ["HIV", "Human immunodeficiency virus"], ["HR", "Heart rate"], ["HSCT", "Hematopoietic stem cell transplant"], ["H⁺", "Hydrogen ion"], ["H₂", "Histamine-2 (as in H₂ receptor antagonist)"], ["H₂CO₃", "Carbonic acid"], ["H₂O", "Water"], ["I&O", "Intake and output"], ["IBD", "Inflammatory bowel disease"], ["ICF", "Intracellular fluid"], ["ICP", "Intracranial pressure"], ["IF", "Intrinsic factor"], ["IM", "Intramuscular"], ["INR", "International normalized ratio"], ["IU", "International units"], ["IV", "Intravenous"], ["JAK2", "Janus kinase 2 (gene mutated in polycythemia vera)"], ["KCl", "Potassium chloride"], ["K⁺", "Potassium"], ["LDH", "Lactate (lactic) dehydrogenase"], ["LOC", "Level of consciousness"], ["M", "Male"], ["MAO", "Monoamine oxidase"], ["MCH", "Mean corpuscular hemoglobin"], ["MCHC", "Mean corpuscular hemoglobin concentration"], ["MCV", "Mean corpuscular volume"], ["MDI", "Metered-dose inhaler"], ["Mg²⁺", "Magnesium"], ["MI", "Myocardial infarction"], ["MMA", "Methylmalonic acid"], ["Na⁺", "Sodium"], ["NCJMM", "NCSBN Clinical Judgment Measurement Model"], ["NCLEX", "National Council Licensure Examination"], ["NCSBN", "National Council of State Boards of Nursing"], ["NG", "Nasogastric"], ["NSAID", "Nonsteroidal anti-inflammatory drug"], ["NSG", "Nursing (course prefix)"], ["OFP", "Oxygen, Fluids, Pain (sickle crisis memory aid)"], ["OT", "Occupational therapy"], ["OTC", "Over the counter"], ["O₂", "Oxygen"], ["PaCO₂", "Partial pressure of arterial carbon dioxide"], ["PACU", "Post-anesthesia care unit"], ["PaO₂", "Partial pressure of arterial oxygen"], ["PCA", "Patient-controlled analgesia"], ["PE", "Pulmonary embolism"], ["pg", "Picogram (unit of MCH)"], ["Plt", "Platelets"], ["PPI", "Proton pump inhibitor"], ["PRBCs", "Packed red blood cells"], ["PT", "Prothrombin time"], ["PT (therapy)", "Physical therapy (context: referrals); PT also means prothrombin time in labs"], ["PTH", "Parathyroid hormone"], ["PTT / aPTT", "Partial thromboplastin time / activated partial thromboplastin time"], ["PV", "Polycythemia vera"], ["PVC", "Premature ventricular contraction"], ["RBC", "Red blood cell"], ["RDW", "Red cell distribution width"], ["REMS", "Risk Evaluation and Mitigation Strategy"], ["Retic", "Reticulocyte (immature RBC)"], ["ROM", "Range of motion"], ["ROME", "Respiratory Opposite, Metabolic Equal"], ["RR", "Respiratory rate"], ["RTA", "Renal tubular acidosis"], ["SABA", "Short-acting beta₂-adrenergic agonist"], ["SaO₂", "Arterial oxygen saturation"], ["SBAR", "Situation, Background, Assessment, Recommendation"], ["SCDs", "Sequential compression devices"], ["SOAPIE", "Subjective, Objective, Assessment, Plan, Intervention, Evaluation"], ["SOB", "Shortness of breath"], ["TACO", "Transfusion-associated circulatory overload"], ["TCDB", "Turn, cough, deep breathe"], ["TED", "Thromboembolic deterrent (hose)"], ["TIA", "Transient ischemic attack"], ["TIBC", "Total iron binding capacity"], ["TRALI", "Transfusion-related acute lung injury"], ["UA", "Urinalysis"], ["USLO", "Unit student learning outcome"], ["WBC", "White blood cell"]], "basics": [{"id": "ph", "title": "pH, buffers, lungs, and kidneys", "color": "#a3460a", "summary": "pH measures hydrogen ion (H⁺) concentration. The body holds arterial pH at ==7.35 to 7.45== (Galen) because enzymes and cell membranes fail outside that range. Three systems defend it: buffers (seconds), lungs (minutes), kidneys (hours to days).", "flow": ["Cells make acid all day: CO₂ and metabolic acids", "Buffers (bicarbonate, hemoglobin, protein) absorb H⁺ at once", "The lungs adjust CO₂ (the acid side) within minutes", "The kidneys adjust HCO₃⁻ and H⁺ (the base side) over hours to days", "The 20:1 bicarbonate-to-carbonic-acid ratio keeps pH 7.35 to 7.45"], "parts": [["More H⁺ = lower pH", "Acidosis is pH < 7.35; alkalosis is pH > 7.45."], ["CO₂ is an acid in disguise", "CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻. Breathing out CO₂ removes acid."], ["Bicarbonate is the main extracellular buffer", "It takes up H⁺ to form carbonic acid, then CO₂ and water that the lungs exhale."], ["Hemoglobin is also a buffer", "It binds small amounts of acid inside red cells (Patho slide), linking anemia to acid-base."], ["Compensation goes the opposite way", "Metabolic problem → lungs change CO₂; respiratory problem → kidneys change HCO₃⁻. The kidneys cannot compensate when they are the cause."]], "keyTerms": [["PaCO₂", "==35 to 45 mmHg== (lung/acid side)"], ["HCO₃⁻", "==22 to 28 mEq/L== per Galen (kidney/base side)"], ["ROME", "Respiratory Opposite, Metabolic Equal"]], "whyItMatters": "Every acid-base condition is one system failing while the other compensates. Know which side each system controls and you can predict the ABG.", "check": {"prompt": "Why do the lungs compensate faster than the kidneys?", "model": "The lungs change CO₂ by changing rate and depth of breathing, which happens within minutes. The kidneys must change how much H⁺ they excrete and HCO₃⁻ they reabsorb or make, which takes hours to days.", "id": "bc-ph", "keys": [{"label": "lungs change CO₂ by breathing rate/depth", "any": ["breath", "ventilat", "respirat", "lung", "exhal", "blow"]}, {"label": "lungs work in minutes", "any": ["minute", "fast", "quick", "rapid", "immediate"]}, {"label": "kidneys must change H⁺/HCO₃⁻ handling", "any": ["kidney", "renal", "bicarb", "hco3", "excret", "reabsorb", "hydrogen"]}, {"label": "which takes hours to days", "any": ["hour", "day", "slow", "longer", "time"]}]}, "links": ["ra", "rk", "ma", "mk"], "cat": "Acid-Base Imbalances"}, {"id": "shifts", "title": "How pH moves potassium and calcium", "color": "#b4372b", "summary": "Cells trade H⁺ for K⁺ to keep electrical charge balanced, and albumin binds more calcium when blood is alkaline. These two normal relationships explain most of the dangerous signs in this unit.", "flow": ["Extra H⁺ in the blood (acidosis)", "H⁺ moves into cells; K⁺ moves out", "Serum K⁺ rises (hyperkalemia)", "Fewer H⁺ (alkalosis): the reverse, serum K⁺ falls", "High pH also makes albumin bind Ca²⁺, so ionized Ca²⁺ falls"], "parts": [["Acidosis → hyperkalemia", "A shift, not a gain: peaked T waves and dysrhythmias."], ["Alkalosis → hypokalemia", "U waves, PVCs, weakness, ileus."], ["Alkalosis → low ionized calcium", "Total calcium may read normal (Galen 9 to 10.5 mg/dL) but the active fraction drops: tingling, carpopedal spasm, tetany, seizures."], ["Correction reverses the shift", "Treating acidosis drives K⁺ back into cells, so K⁺ can fall fast (Brunner)."]], "whyItMatters": "Rhythm and neuromuscular signs, not the pH number, are often what you see first at the bedside.", "links": ["ra", "ma", "mk", "rk"], "cat": "Acid-Base Imbalances"}, {"id": "rbc", "title": "Making red blood cells", "color": "#9f1239", "summary": "Red cells are made in the bone marrow from stem cells, live about 120 days, and carry oxygen on hemoglobin. Production needs a signal (erythropoietin) and raw materials (iron, vitamin B12, folate).", "flow": ["Kidney senses low oxygen", "Releases erythropoietin (EPO)", "Marrow stem cells divide and mature (needs B12 and folate for DNA)", "Iron is built into heme → hemoglobin", "Reticulocytes enter the blood and mature into RBCs (~120-day life)"], "parts": [["Myeloid line", "Makes RBCs, platelets, and granulocytes (Patho slide: myeloid = many jobs)."], ["Iron", "Needed for heme; most body iron sits in red cells; stores are ferritin."], ["B12 and folate", "Needed for DNA so precursors can divide; lack of
