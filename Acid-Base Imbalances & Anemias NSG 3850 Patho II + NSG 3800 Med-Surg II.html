"the artery sampled must not be the hand's only blood supply"], ["Sample is drawn into a heparinized syringe; air bubbles are removed", "air changes the O₂ and CO₂ values"], ["==Hold firm pressure on the site until bleeding stops==, longer with anticoagulants", "an artery bleeds under pressure"], ["Label with time, O₂ setting, and temperature; send immediately per facility policy", "results are only valid fresh and interpreted against the O₂ the client receives"]], "before": [["Note O₂ therapy and temperature", "needed to interpret the gas"], ["Check for anticoagulants or low platelets", "bleeding risk"], ["Explain the brief sharp stick", "reduces anxiety, which can change breathing"]], "during": [["Watch breathing and comfort", "pain and anxiety shift PaCO₂"]], "after": [["Inspect site for bleeding or hematoma", "arterial bleeding"], ["Check hand warmth, color, pulse, sensation", "arterial injury or spasm"], ["Interpret with ROME and trend with the clinical picture", "one value is a snapshot (Brunner Ch. 10)"]], "complications": ["Bleeding or hematoma", "==Loss of circulation to the hand== (cool, pale, numb)", "Infection"], "teach": ["Report numbness, coldness, or pain in the hand", "Keep the wrist still while pressure is held"], "verify": ["steps"]}, {"name": "Incentive spirometry and turn, cough, deep breathe (TCDB)", "kind": "therapeutic", "indication": "Opens alveoli and clears secretions so CO₂ can be exhaled (Med-Surg slide nursing management).", "steps": [["Sit the client upright", "diaphragm drops and lungs expand"], ["Exhale, seal lips on the mouthpiece, inhale slowly and deeply", "slow deep breaths open collapsed alveoli"], ["Hold the breath 3 to 5 seconds, then exhale", "keeps alveoli open longer"], ["Repeat 10 times every hour while awake, then cough", "clears loosened secretions"], ["Splint incisions with a pillow when coughing", "reduces pain that limits breathing"]], "before": [["Assess pain and premedicate as ordered", "pain limits deep breathing (chest surgery is a cause)"], ["Baseline RR, SaO₂, breath sounds", "to compare"]], "after": [["Reassess breath sounds and SaO₂", "shows improvement"], ["Record volumes achieved", "trend"]], "complications": ["Dizziness from deep breathing", "Increasing drowsiness or falling RR (worsening CO₂ retention) needs a report"], "teach": ["Use the spirometer 10 times every hour while awake", "Splint and cough after each set"], "verify": ["steps"]}], "bridge": [["Pathophysiology", "Hypoventilation traps CO₂ → carbonic acid → H⁺ ↑, pH ↓; kidneys compensate slowly by keeping HCO₃⁻."], ["Med-Surg", "So you assess RR, depth, LOC, and SaO₂, position upright, give bronchodilators, cautious O₂, and prepare for ventilation."]], "figures": [{"title": "The bicarbonate buffer equation", "in": "path", "source": "Redrawn from Brunner Ch. 10 text", "steps": ["CO₂ + H₂O", "⇄ H₂CO₃ (carbonic acid)", "⇄ H⁺ + HCO₃⁻", "More CO₂ pushes the equation right → more H⁺ → acidosis", "Less CO₂ pulls it left → fewer H⁺ → alkalosis"], "caption": "Normal ratio is ==20 parts HCO₃⁻ to 1 part H₂CO₃==; the ratio, not the absolute values, sets the pH."}], "cat": "Acid-Base Imbalances", "sub": "Respiratory (lungs, CO₂)", "catColor": "#a3460a"}, {"id": "rk", "name": "Respiratory alkalosis", "short": "Resp. alkalosis", "group": "Acid-base · lung problem (CO₂ blown off)", "color": "#0f766e", "pair": "mk", "sig": ["pH ↑", "PaCO₂ ↓ (< 35)", "HCO₃⁻ ↓ if compensating"], "hook": "Breathing too fast blows off too much CO₂. Less acid means pH rises. Think: **anxiety, pain, crying, alcohol withdrawal, head injury, early aspirin toxicity**.", "patho": {"chain": ["**Hyperventilation** (anxiety, panic, acute pain, prolonged crying, alcohol withdrawal, head injury affecting the brainstem, fever, high altitude, early salicylate toxicity)", "Too much CO₂ is exhaled, so **==PaCO₂ falls below 35 mmHg==**", "Less CO₂ forms less carbonic acid, so fewer H⁺ ions: **pH rises above 7.45**", "Alkaline blood makes albumin more negatively charged, so it binds more calcium → **==ionized (free) calcium falls==** → nerves and muscles become excitable", "Low CO₂ constricts cerebral vessels → less blood flow to the brain → confusion", "Net result: **high pH + low PaCO₂**; HCO₃⁻ normal (uncompensated) or falling (kidneys compensating)"], "compensation": "The **kidneys** decrease H⁺ excretion (retain acid) and excrete more HCO₃⁻. Slow: hours to days. Most episodes are short, so the ABG is usually uncompensated.", "tip": "**ROME:** Respiratory = Opposite. pH ↑ and PaCO₂ ↓."}, "manifestations": [["Paresthesia: tingling or numbness of fingers, toes, around the mouth", "alkalosis lowers ionized calcium, which lowers the threshold for nerves to fire"], ["==Carpal and pedal spasms==", "low ionized calcium causes neuromuscular hyperexcitability in hands and feet"], ["Confusion, lightheadedness", "low CO₂ causes cerebral vasoconstriction, reducing blood flow to the brain"], ["Rapid, deep breathing; restlessness", "this is the cause itself, usually driven by anxiety, pain, or brainstem stimulation"], ["Hypocalcemia on labs (ionized)", "more calcium is bound to albumin at high pH, even when total calcium is normal"]], "labs": [["ABG", "pH > 7.45, **PaCO₂ < 35 mmHg** (primary). HCO₃⁻ normal if uncompensated; < 22 if compensating"], ["Calcium", "Ionized calcium falls (Galen total calcium 9 to 10.5 mg/dL may still read normal)"], ["Potassium", "May fall (alkalosis shifts K⁺ into cells); Galen 3.5 to 5 mEq/L"], ["Look for the cause", "Salicylate level if aspirin toxicity is possible; neuro evaluation after head injury"]], "risks": [["Psychological", "==Anxiety, panic, psychological distress, prolonged crying=="], ["Physiologic drive", "Acute pain, fever, sepsis, high altitude"], ["Neurologic", "Head injury or brain tumor affecting the brainstem breathing centers"], ["Withdrawal / toxins", "Alcohol withdrawal (nervous system overactivity); early salicylate (aspirin) toxicity stimulates the medulla"], ["Iatrogenic", "Mechanical ventilator rate set too high"]], "management": [["Treat the underlying cause (pain control, fever control, adjust ventilator rate)", "removes the stimulus to hyperventilate"], ["Increase inspired CO₂: slow breathing or rebreathe into a closed system (paper bag, per your slides)", "rebreathing exhaled air raises PaCO₂ back toward normal and brings pH down"], ["Anti-anxiety medications: benzodiazepines (diazepam, lorazepam) as ordered", "calms the anxiety that is driving the rapid breathing"]], "nursing": {"assess": [["Respiratory rate and pattern", "the cause; slowing breathing is the treatment"], ["LOC and confusion", "reflects reduced cerebral blood flow"], ["Neuromuscular signs: tingling, carpopedal spasm", "show how far ionized calcium has dropped"], ["Anxiety level and pain score", "identifies the trigger you can actually treat"]], "act": [["==Rule out hypoxia first== (check SaO₂) before treating as anxiety", "hyperventilation can be the body's response to hypoxemia, sepsis, or aspirin toxicity", 1], ["Stay with the client and coach slow breathing; rebreathe into a closed system if ordered", "raises PaCO₂ and lowers pH", 1], ["Seizure and fall precautions if tetany or confusion", "low ionized calcium and cerebral vasoconstriction", 1], ["Give anxiolytic if ordered; monitor RR and LOC", "treats the trigger without oversedation", 2], ["Maintain IV access; check K⁺, Ca²⁺, phosphate", "alkalosis lowers all three (Brunner)", 2], ["Teach anxiety management and early warning signs", "prevents recurrence", 3]], "order": "Make sure the fast breathing is not hiding hypoxia, then slow the breathing and keep the client safe, then treat the trigger and teach."}, "education": [["Recognize early hyperventilation", "tingling lips and fingers are an early warning; slow down breathing"], ["Anxiety management", "paced breathing and relaxation techniques prevent episodes"], ["Aspirin safety", "overdose first causes fast breathing, then acid buildup; keep out of reach of children"]], "complications": ["Tetany and seizures from low ionized calcium", "Dysrhythmias from hypokalemia", "Syncope from cerebral vasoconstriction", "With salicylates: progression to metabolic acidosis (mixed disorder)"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Carpopedal spasm or tetany, seizure, worsening confusion, or a client with rapid breathing after aspirin ingestion or head injury."}, {"type": "watch", "label": "Salicylate (aspirin) toxicity is two disorders in sequence", "in": "risk", "text": "Aspirin first stimulates the medulla → hyperventilation → **respiratory alkalosis**. Later it disrupts cellular metabolism → lactic and other acids → **metabolic acidosis**. Adults may show both (mixed); **==children often present already in metabolic acidosis==**."}], "sbar": null, "drugs": [{"generic": "lorazepam", "brands": ["Ativan"], "cls": "Benzodiazepine (antianxiety)", "suffix": "-azepam", "moa": "Enhances GABA, the brain's main inhibitory messenger, calming the anxiety that is ==driving the hyperventilation==.", "indications": ["Anxiety-driven respiratory alkalosis (Med-Surg slide)"], "dose": [["PO adults, anxiety (Davis)", "1 to 3 mg 2 to 3 times daily (up to 10 mg/day)"]], "assess": {"before": [["RR, BP, level of consciousness", "baseline; avoid in CNS depression"], ["Other CNS depressants (opioids, alcohol)", "combined respiratory depression"]], "after": [["Sedation, RR", "oversedation"], ["Fall risk, especially older adults", "ataxia, drowsiness"]]}, "effects": {"common": ["Drowsiness, dizziness", "Confusion in older adults"], "serious": ["==Respiratory depression (with opioids)==", "Apnea or cardiac arrest with rapid IV use", "Dependence"], "boxed": "Concurrent opioids can cause profound sedation, respiratory depression, coma, and death; risk of abuse, misuse, addiction, and dependence."}, "avoid": {"contra": ["Pre-existing CNS depression, severe hypotension, sleep apnea", "Angle-closure glaucoma"], "interactions": ["Opioids, alcohol, other sedatives", "Antidote: flumazenil", "Avoid alcohol"]}, "teach": ["Do not drive until you know the effect", "Do not stop suddenly after regular use", "Avoid alcohol"], "verify": ["effects"]}, {"generic": "diazepam", "brands": ["Valium"], "cls": "Benzodiazepine (antianxiety)", "suffix": "-azepam", "moa": "Potentiates GABA to depress the CNS and relieve anxiety, slowing the breathing rate so CO₂ can accumulate.", "indications": ["Anxiety-driven respiratory alkalosis (Med-Surg slide)"], "dose": [["PO adults, antianxiety (Davis)", "2 to 10 mg 2 to 4 times daily"], ["IM/IV adults (Davis)", "2 to 10 mg; may repeat in 3 to 4 hours"]], "assess": {"before": [["BP, pulse, RR", "CNS and respiratory depression"], ["IV site", "phlebitis and venous thrombosis"]], "after": [["Bed rest and observation ≥ 3 hours after parenteral dose (Davis)", "sedation and hypotension"], ["Sedation and RR", "oversedation"]]}, "effects": {"common": ["Drowsiness, dizziness, ataxia"], "serious": ["==Respiratory depression==", "Hypotension (IV)", "Dependence"], "boxed": "Concurrent opioids: profound sedation, respiratory depression, coma, death; abuse and dependence risk."}, "avoid": {"contra": ["Severe pulmonary impairment, sleep apnea, myasthenia gravis", "Pre-existing CNS depression"], "interactions": ["Opioids, alcohol, sedatives", "Do not confuse with diltiazem", "Avoid alcohol"]}, "teach": ["Avoid alcohol and driving", "Do not stop abruptly"], "verify": ["effects"]}], "procedures": [{"name": "Arterial blood gas (ABG) sampling", "aka": "ABG draw", "kind": "diagnostic", "indication": "Confirms respiratory alkalosis: ==pH > 7.45 with PaCO₂ < 35 mmHg==, HCO₃⁻ usually normal (uncompensated).", "steps": [["Verify the order and identify the client with two identifiers", "prevents a wrong-client result"], ["Check collateral circulation to the hand before a radial stick, as your skills lab teaches", "the artery sampled must not be the hand's only blood supply"], ["Sample is drawn into a heparinized syringe; air bubbles are removed", "air changes the O₂ and CO₂ values"], ["==Hold firm pressure on the site until bleeding stops==, longer with anticoagulants", "an artery bleeds under pressure"], ["Label with time, O₂ setting, and temperature; send immediately per facility policy", "results are only valid fresh and interpreted against the O₂ the client receives"]], "before": [["Note O₂ therapy and temperature", "needed to interpret the gas"], ["Check for anticoagulants or low platelets", "bleeding risk"], ["Explain the brief sharp stick", "reduces anxiety, which can change breathing"]], "during": [["Watch breathing and comfort", "pain and anxiety shift PaCO₂"]], "after": [["Inspect site for bleeding or hematoma", "arterial bleeding"], ["Check hand warmth, color, pulse, sensation", "arterial injury or spasm"], ["Interpret with ROME and trend with the clinical picture", "one value is a snapshot (Brunner Ch. 10)"]], "complications": ["Bleeding or hematoma", "==Loss of circulation to the hand== (cool, pale, numb)", "Infection"], "teach": ["Report numbness, coldness, or pain in the hand", "Keep the wrist still while pressure is held"], "verify": ["steps"]}, {"name": "Rebreathing CO₂ into a closed system (paper bag or rebreather mask)", "kind": "therapeutic", "indication": "Raises inspired CO₂ so PaCO₂ rises and pH falls in anxiety-driven hyperventilation (Med-Surg slide; Brunner Ch. 10).", "steps": [["Rule out hypoxia and other medical causes first", "hyperventilation from hypoxemia, sepsis, or aspirin is not treated by rebreathing"], ["Stay with the client; coach slow breathing", "calm presence slows the rate"], ["Use the closed system only as ordered", "allows CO₂ to accumulate"], ["Stop when tingling resolves and breathing slows", "goal is a normal PaCO₂"]], "before": [["==Check SaO₂ and assess for hypoxia==", "rebreathing in a hypoxic client is dangerous"], ["Assess anxiety and pain", "the treatable trigger"]], "during": [["Monitor SaO₂ and level of consciousness", "detect falling oxygen"]], "after": [["Reassess tingling, carpopedal spasm, LOC", "shows correction"], ["Teach slow breathing techniques", "prevents recurrence"]], "complications": ["Hypoxemia if used in a client with lung or cardiac disease"], "teach": ["Recognize early tingling and slow your breathing", "Relaxation and paced breathing"], "verify": ["steps", "before", "during"]}], "bridge": [["Pathophysiology", "Hyperventilation blows off CO₂ → pH ↑ → calcium binds albumin and cerebral vessels constrict."], ["Med-Surg", "So you check for hypoxia, coach slow breathing or rebreathing, give anxiolytics, and watch for tetany."]], "cat": "Acid-Base Imbalances", "sub": "Respiratory (lungs, CO₂)", "catColor": "#a3460a"}, {"id": "ma", "name": "Metabolic acidosis", "short": "Metab. acidosis", "group": "Acid-base · kidney/metabolic problem (HCO₃⁻ low)", "color": "#b4372b", "pair": "ra", "sig": ["pH ↓", "HCO₃⁻ ↓ (< 22)", "PaCO₂ ↓ if compensating"], "hook": "Either the body **makes too much acid** or **loses bicarbonate (base)**. The lungs try to rescue pH with deep, fast Kussmaul breathing.", "patho": {"chain": ["**Acid gain** (diabetic ketoacidosis [DKA], lactic acid from tissue anoxia, burns, end-stage renal disease [ESRD], salicylate/methanol/ethylene glycol poisoning, carbon monoxide [CO] poisoning) **or base loss** (severe diarrhea, GI fistula, intestinal decompression, renal tubular acidosis [RTA], severe hyperparathyroidism)", "Bicarbonate buffers the extra H⁺: H⁺ + HCO₃⁻ → H₂CO₃ → CO₂ + H₂O, so **==HCO₃⁻ is used up and falls below 22 mEq/L==**", "When buffering is overwhelmed, H⁺ accumulates and **pH falls below 7.35**", "H⁺ moves into cells and K⁺ moves out → **==hyperkalemia==** → cardiac and GI smooth muscle irritability", "Brainstem senses low pH → **hyperventilation / Kussmaul respirations** to blow off CO₂", "Net result: low pH + low HCO₃⁻; PaCO₂ normal if uncompensated, low if the lungs are compensating"], "compensation": "**==Lungs first and fast==** (minutes): deep, rapid breathing excretes carbonic acid as CO₂ and water. **Kidneys later** (hours to days): excrete more H⁺ and reabsorb more HCO₃⁻, unless the kidneys are the cause.", "tip": "**ROME:** Metabolic = Equal. pH ↓ and HCO₃⁻ ↓ move together."}, "manifestations": [["==Kussmaul respirations (deep, rapid)==", "the lungs blow off CO₂ to lower carbonic acid and raise pH (compensation, not the cause)"], ["Headache, confusion, lethargy → coma", "acidosis depresses neurons; the trend in LOC tracks how low pH is"], ["Tachycardia", "the heart works harder to perfuse tissues"], ["Dehydration", "the kidneys make more urine to excrete acid, and fast breathing loses water from the lungs"], ["Abdominal pain / cramping, nausea", "acid irritates the stomach lining and reduces gut blood flow; hyperkalemia makes intestinal smooth muscle contract more"], ["Hyperkalemia → dysrhythmias", "H⁺ shifts into cells and K⁺ shifts out"], ["Cherry-pink skin (CO poisoning only)", "carboxyhemoglobin looks red even though tissues are starving for oxygen"]], "labs": [["ABG", "pH < 7.35, **HCO₃⁻ < 22 mEq/L** (primary). PaCO₂ normal (35 to 45) if uncompensated; < 35 if compensating"], ["Serum K⁺", "Often > 5 mEq/L (shift out of cells)"], ["Look for the cause", "Glucose and ketones (DKA; Galen glucose 70 to 110 mg/dL), BUN 10 to 20 and creatinine (renal failure), salicylate level"], ["ECG", "Peaked T waves / dysrhythmias from hyperkalemia"]], "risks": [["Increased metabolic acid", "DKA (fat breakdown → ketones), tissue anoxia/shock (anaerobic metabolism → lactic acid), burns, ESRD, CO poisoning, poisoning/overdose (salicylates, methanol, ethylene glycol)"], ["Loss of base (bicarbonate)", "==Severe or prolonged diarrhea, GI fistula draining intestinal or pancreatic secretions, intestinal decompression=="], ["Kidney cannot handle acid", "Renal tubular acidosis (cannot excrete acid or retain HCO₃⁻); severe hyperparathyroidism (excess parathyroid hormone [PTH] reduces HCO₃⁻ reabsorption)"]], "management": [["Treat the underlying cause (for example insulin and fluids for DKA, restore perfusion, dialysis)", "stops acid production or base loss at the source"], ["Sodium bicarbonate IV as ordered (Med-Surg slide)", "directly replaces the depleted base and raises pH; a bridge while the cause is treated"], ["ABG monitoring", "confirms the trend and whether compensation is holding"]], "nursing": {"assess": [["LOC and neuro status", "most sensitive bedside trend of worsening acidosis"], ["Respiratory pattern", "Kussmaul breathing means compensation is working; slowing or tiring means it is failing"], ["Cardiac monitoring and K⁺", "hyperkalemia causes dangerous dysrhythmias"], ["Intake and output (I&O) and hydration status", "acid excretion and fast breathing dehydrate the client"]], "act": [["==Continuous cardiac monitoring==; report peaked T waves or dysrhythmia", "hyperkalemia from the H⁺/K⁺ shift can be lethal", 1], ["Do not suppress Kussmaul breathing; report if breathing slows as the client tires", "it is protective compensation", 1], ["Safety and aspiration precautions for decreased LOC", "CNS depression", 1], ["IV access; give fluids, insulin, or sodium bicarbonate as ordered", "treats the cause and buffers acid", 2], ["==Monitor K⁺ closely as acidosis is corrected==", "K⁺ moves back into cells and hypokalemia may follow (Brunner)", 2], ["Strict I&O; repeat ABGs", "tracks response", 2], ["Teach diabetes sick-day management and poison prevention", "prevents recurrence", 3]], "order": "Circulation (rhythm) and breathing first because hyperkalemia and exhaustion kill quickly, then treat the cause and watch K⁺ as it shifts back, then teach."}, "education": [["Diabetes management", "consistent insulin use and monitoring prevents DKA"], ["Hydration with diarrhea", "prolonged diarrhea loses base; seek care early"], ["Poison prevention", "store aspirin, methanol, antifreeze (ethylene glycol) safely; working CO detectors"], ["When to seek help", "deep fast breathing, confusion, persistent vomiting, or an irregular heartbeat"]], "complications": ["Hyperkalemia → dysrhythmias, cardiac arrest", "CNS depression → coma", "Shock and organ failure from the underlying cause", "Respiratory muscle fatigue when compensation is exhausted"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Decreasing LOC, new dysrhythmia or peaked T waves, K⁺ above 5 mEq/L with ECG changes, or a client whose deep rapid breathing is slowing as they tire."}, {"type": "info", "label": "Why anemia connects to acidosis (Patho slide 1)", "in": "path", "text": "Low hemoglobin → less oxygen delivery → anaerobic metabolism → lactic acid → metabolic acidosis. When oxygen delivery fails, acid builds."}, {"type": "book", "label": "Textbook: Concept Mastery Alert (anion gap)", "in": "lab", "text": "Metabolic acidosis = low pH + low HCO₃⁻. The **anion gap** (normal 8 to 12 mEq/L without K⁺) is calculated to find the cause: ==high gap = acid gained== (DKA, lactic acid, salicylates, renal failure, methanol); normal gap = bicarbonate lost (diarrhea, fistulas).", "source": "Brunner & Suddarth 15e, Ch. 10, Metabolic Acidosis"}], "sbar": {"title": "SBAR: DKA with worsening acidosis", "s": "Client with type 1 diabetes is drowsy with deep, rapid breathing.", "b": "Two days of vomiting; skipped insulin because they were not eating.", "a": "pH 7.22, HCO₃⁻ 12 mEq/L, PaCO₂ 28 mmHg, K⁺ 5.9 mEq/L, glucose 540 mg/dL. HR 124, peaked T waves on monitor.", "r": "Request immediate evaluation; IV access established; continuous cardiac monitoring; anticipate insulin, IV fluids, and bicarbonate per orders; hourly neuro checks and repeat K⁺."}, "drugs": [{"generic": "sodium bicarbonate", "brands": ["No common brand for IV use (baking soda orally)"], "cls": "Alkalinizing agent (bicarbonate buffer)", "moa": "Releases bicarbonate, which binds free H⁺ to form carbonic acid, then CO₂ and water, so ==pH rises==.", "indications": ["Metabolic acidosis (Med-Surg slide: MD orders)", "A bridge while the cause is treated"], "dose": [["IV, urgent situations (Davis)", "1 mEq/kg; may repeat 0.5 mEq/kg every 10 minutes"], ["IV, less urgent (Davis)", "2 to 5 mEq/kg as a 4 to 8 hour infusion"]], "assess": {"before": [["ABG (pH, HCO₃⁻)", "confirms severity (Galen pH 7.35 to 7.45, HCO₃⁻ 22 to 28)"], ["==Serum K⁺ and calcium==", "correction drives K⁺ into cells and lowers ionized calcium"], ["Fluid status, lung sounds", "sodium load"]], "after": [["Repeat ABGs frequently", "avoid overcorrection to alkalosis"], ["K⁺ and rhythm", "hypokalemia as acidosis reverses (Brunner)"], ["Tetany, paresthesia", "alkalosis/hypocalcemia"], ["IV site", "irritant"]]}, "effects": {"common": ["Fluid retention, edema"], "serious": ["==Metabolic alkalosis==", "Hypokalemia, hypocalcemia (tetany)", "Hypernatremia, fluid overload"]}, "avoid": {"contra": ["Metabolic or respiratory alkalosis", "Hypocalcemia, hypernatremia"], "interactions": ["Flush the line; incompatible with calcium and many arrest drugs", "Calcium antacids → milk-alkali syndrome", "Avoid milk products with oral use"]}, "teach": ["It is a temporary bridge while the cause is treated", "Report tingling, muscle twitching, or swelling"], "verify": []}], "procedures": [{"name": "Arterial blood gas (ABG) sampling", "aka": "ABG draw", "kind": "diagnostic", "indication": "Confirms metabolic acidosis: ==pH < 7.35 with HCO₃⁻ < 22 mEq/L==; low PaCO₂ shows lung compensation. Med-Surg slide lists ABG as the diagnostic.", "steps": [["Verify the order and identify the client with two identifiers", "prevents a wrong-client result"], ["Check collateral circulation to the hand before a radial stick, as your skills lab teaches", "the artery sampled must not be the hand's only blood supply"], ["Sample is drawn into a heparinized syringe; air bubbles are removed", "air changes the O₂ and CO₂ values"], ["==Hold firm pressure on the site until bleeding stops==, longer with anticoagulants", "an artery bleeds under pressure"], ["Label with time, O₂ setting, and temperature; send immediately per facility policy", "results are only valid fresh and interpreted against the O₂ the client receives"]], "before": [["Note O₂ therapy and temperature", "needed to interpret the gas"], ["Check for anticoagulants or low platelets", "bleeding risk"], ["Explain the brief sharp stick", "reduces anxiety, which can change breathing"]], "during": [["Watch breathing and comfort", "pain and anxiety shift PaCO₂"]], "after": [["Inspect site for bleeding or hematoma", "arterial bleeding"], ["Check hand warmth, color, pulse, sensation", "arterial injury or spasm"], ["Interpret with ROME and trend with the clinical picture", "one value is a snapshot (Brunner Ch. 10)"]], "complications": ["Bleeding or hematoma", "==Loss of circulation to the hand== (cool, pale, numb)", "Infection"], "teach": ["Report numbness, coldness, or pain in the hand", "Keep the wrist still while pressure is held"], "verify": ["steps"]}, {"name": "Continuous cardiac monitoring", "kind": "monitoring", "indication": "Acidosis shifts K⁺ out of cells; hyperkalemia causes peaked T waves and dysrhythmias (Med-Surg slide nursing management).", "steps": [["Apply leads per facility policy and set alarms", "continuous rhythm surveillance"], ["Print and interpret a strip at baseline", "comparison"], ["Watch for ==peaked T waves== and new dysrhythmias", "early sign of hyperkalemia"]], "before": [["Baseline K⁺", "links rhythm to lab"], ["Skin prep at electrode sites", "clear tracing"]], "after": [["Correlate rhythm changes with K⁺ results", "guides treatment"], ["As acidosis is corrected, watch for U waves", "K⁺ moves back into cells and may fall (Brunner)"]], "complications": ["Lethal dysrhythmias from hyperkalemia", "Alarm fatigue: never silence without assessing"], "teach": ["Explain why monitoring is needed and to report palpitations"], "verify": ["steps"]}], "bridge": [["Pathophysiology", "Acid gain or HCO₃⁻ loss uses up the buffer; H⁺ enters cells and K⁺ leaves; the lungs blow off CO₂ (Kussmaul)."], ["Med-Surg", "So you monitor the cardiac rhythm and K⁺, never suppress Kussmaul breathing, give bicarbonate or treat the cause, and watch K⁺ fall as pH corrects."]], "cat": "Acid-Base Imbalances", "sub": "Metabolic (kidneys, HCO₃⁻)", "catColor": "#a3460a"}, {"id": "mk", "name": "Metabolic alkalosis", "short": "Metab. alkalosis", "group": "Acid-base · kidney/metabolic problem (HCO₃⁻ high)", "color": "#1f7a45", "pair": "rk", "sig": ["pH ↑", "HCO₃⁻ ↑ (> 28)", "PaCO₂ ↑ if compensating"], "hook": "The body **loses acid** (vomiting, gastric suction, diuretics) or **gains base** (antacids, massive citrated transfusion). Nerves get twitchy, potassium drops, and breathing slows.", "patho": {"chain": ["**Acid loss**: vomiting or nasogastric (NG) suction removes stomach hydrochloric acid (HCl); diuretics and hyperaldosteronism excrete H⁺ and K⁺ in urine. **Base gain**: excess bicarbonate or antacids (Tums), massive citrated blood transfusion (liver converts citrate to HCO₃⁻)", "Extracellular fluid (ECF) volume deficit makes the kidneys reabsorb sodium, water, **and bicarbonate**, which keeps the alkalosis going", "Fewer H⁺ ions: **==HCO₃⁻ rises above 28 mEq/L==** and **pH rises above 7.45**", "H⁺ moves out of cells and K⁺ moves in → **hypokalemia**; high pH increases calcium binding to albumin → **low ionized calcium**", "Lungs compensate by **hypoventilating** to retain CO₂, limited because it also lowers oxygen", "Net result: high pH + high HCO₃⁻; PaCO₂ normal if uncompensated, high if compensating"], "compensation": "**Lungs** hypoventilate (retain CO₂/carbonic acid) within minutes, but only a little, because falling oxygen restarts the drive to breathe. **Kidneys** excrete extra HCO₃⁻ over hours to days, but only if enough chloride and volume are available.", "tip": "**ROME:** Metabolic = Equal. pH ↑ and HCO₃⁻ ↑."}, "manifestations": [["Hypokalemia → dysrhythmias, weakness", "K⁺ shifts into cells, and vomiting/diuretics also lose K⁺"], ["==Tetany, muscle cramps, seizures==", "high pH binds calcium to albumin, so ionized calcium falls and nerves fire easily"], ["Confusion, lethargy, coma", "hypokalemia and low ionized calcium disrupt brain and muscle function"], ["Postural (orthostatic) hypotension", "ECF volume depletion from vomiting or diuretics leaves too little volume to maintain BP when standing"], ["Slow, shallow respirations", "the lungs retain CO₂ to lower pH (compensation)"]], "labs": [["ABG", "pH > 7.45, **HCO₃⁻ > 28 mEq/L** (Galen; Patho slide uses > 26). PaCO₂ normal if uncompensated; > 45 if compensating"], ["Serum K⁺", "Often < 3.5 mEq/L"], ["Chloride", "Often low (< 98 mEq/L) with vomiting, suction, or diuretics"], ["Urinalysis (UA)", "Listed on Med-Surg slide as a diagnostic"], ["Severity marker", "Patho slide notes: death can occur at pH 7.8"]], "risks": [["Loss of acid", "==Emesis, gastric (NG) suction, diuretic therapy, hyperaldosteronism=="], ["Gain of base", "Excessive bicarbonate or antacid intake, massive citrated blood transfusion"], ["Volume deficit", "ECF volume deficit (vomiting, diuretics, large urine output) makes kidneys hold on to HCO₃⁻"]], "management": [["Treat the underlying disorder", "stops ongoing acid loss or base intake"], ["==Restore volume with sodium chloride (normal saline) IV==", "continued volume depletion perpetuates the alkalosis; chloride lets the kidneys reabsorb sodium with chloride and excrete the extra bicarbonate"], ["Potassium chloride (KCl) replacement", "replaces both K⁺ and Cl⁻ losses"], ["H₂ receptor antagonists such as cimetidine", "reduce gastric HCl production, so less acid is lost through gastric suction"], ["Carbonic anhydrase inhibitors for clients who cannot tolerate rapid volume expansion (for example heart failure)", "increase renal bicarbonate excretion without a big fluid load"]], "nursing": {"assess": [["Strict I&O, NG output, vomiting volume", "volume and acid loss are the cause and must be tracked"], ["Cardiac rhythm and K⁺", "hypokalemia causes dysrhythmias"], ["Neuromuscular signs: tingling, tetany, seizure activity", "reflect low ionized calcium"], ["Orthostatic BP", "shows ECF volume depletion"], ["Respiratory rate and SaO₂", "compensatory hypoventilation can drop oxygen"]], "act": [["Cardiac monitoring; replace K⁺ as ordered ==(never IV push)==", "hypokalemia causes dysrhythmias; rapid K⁺ is fatal", 1], ["Seizure precautions for tetany or carpopedal spasm", "low ionized calcium", 1], ["Monitor RR and SaO₂", "compensatory hypoventilation can cause hypoxemia", 1], ["IV normal saline boluses as ordered; strict I&O", "restores volume and chloride so kidneys excrete HCO₃⁻", 2], ["Measure NG output; give H₂ blocker/PPI as ordered", "reduces ongoing acid loss", 2], ["Fall precautions; change position slowly", "orthostatic hypotension", 2], ["Teach antacid and diuretic safety", "prevents recurrence", 3]], "order": "Rhythm, seizures, and oxygenation can deteriorate fastest, so they come first; then fix volume, chloride, and acid loss; then teach."}, "education": [["Antacid and baking soda use", "overuse adds base; follow directions"], ["Diuretic therapy", "report muscle weakness, cramps, or palpitations (signs of low K⁺)"], ["Vomiting", "seek care for vomiting that does not stop; it removes stomach acid"]], "complications": ["Dysrhythmias from hypokalemia", "Tetany and seizures", "Hypoventilation with hypoxemia", "Coma; death possible at pH 7.8"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Seizure, tetany or carpopedal spasm, new dysrhythmia, K⁺ below 3.5 mEq/L with ECG changes, or slow respirations with falling SaO₂."}, {"type": "watch", "label": "Classic exam set-ups (Patho notes)", "in": "risk", "text": "Client vomited every 4 hours during an 8-hour shift → metabolic alkalosis. Overuse of diuretics → metabolic alkalosis. Large Foley urine output with fluid volume deficit → metabolic alkalosis."}, {"type": "book", "label": "Textbook: Why hypokalemia causes alkalosis", "in": "path", "text": "Low serum K⁺ makes nephrons reabsorb K⁺ while secreting H⁺ into urine, and K⁺ leaving cells is replaced by H⁺ moving in. Both remove H⁺ from the blood, so ==hypokalemia and metabolic alkalosis feed each other==.", "source": "Brunner & Suddarth 15e, Ch. 10, Metabolic Alkalosis"}], "sbar": {"title": "SBAR: NG suction and falling potassium", "s": "Client on continuous NG suction reports tingling fingers and has a new irregular rhythm.", "b": "Day 3 after bowel surgery, NG output 1,800 mL in 24 hours, on furosemide.", "a": "pH 7.53, HCO₃⁻ 36 mEq/L, PaCO₂ 48 mmHg, K⁺ 2.9 mEq/L, Cl⁻ 90 mEq/L. Orthostatic BP drop; RR 10.", "r": "Request evaluation and orders for normal saline and KCl replacement; ask whether an H₂ antagonist is appropriate; seizure precautions and continuous cardiac monitoring."}, "drugs": [{"generic": "potassium chloride", "brands": ["Klor-Con", "K-Tab", "Micro-K"], "cls": "Electrolyte replacement", "moa": "Replaces both K⁺ and Cl⁻ lost through vomiting, suction, or diuretics; chloride lets the kidney excrete the extra bicarbonate.", "indications": ["Metabolic alkalosis with hypokalemia (Med-Surg slide; Brunner Ch. 10)"], "dose": [["PO adults, hypokalemia (Davis)", "40 to 100 mEq/day in divided doses"], ["IV adults, K⁺ > 2.5 (Davis)", "Infusion ==not to exceed 10 mEq/hr==; peripheral concentration up to 40 mEq/L"], ["IV adults, K⁺ < 2 with symptoms (Davis)", "Rate generally not above 20 mEq/hr with cardiac monitoring"]], "assess": {"before": [["Serum K⁺ (Galen 3.5 to 5 mEq/L)", "confirms need"], ["==Urine output and kidney function==", "K⁺ is excreted by the kidney; oliguria risks hyperkalemia"], ["Serum Mg²⁺", "low magnesium makes hypokalemia hard to correct"]], "after": [["ECG during IV therapy", "peaked T waves = too much; U waves = still low"], ["IV site", "burning and phlebitis"], ["Repeat K⁺", "target range"]]}, "effects": {"common": ["Nausea, GI upset", "IV site irritation"], "serious": ["==Hyperkalemia → dysrhythmias, cardiac arrest==", "GI ulceration (solid forms)"], "boxed": "High Alert: ==never give IV push or bolus==; fatal errors have occurred with too-rapid infusion (Davis)."}, "avoid": {"contra": ["Hyperkalemia", "Severe renal impairment"], "interactions": ["Potassium-sparing diuretics, ACE inhibitors, ARBs ↑ hyperkalemia", "Food: salt substitutes contain potassium"]}, "teach": ["Take oral forms with food and a full glass of water; do not crush extended-release tablets", "Report weakness, palpitations, or black stools"], "verify": []}, {"generic": "cimetidine", "brands": ["Tagamet"], "cls": "Histamine-2 (H₂) receptor antagonist", "suffix": "-tidine", "moa": "Blocks histamine at parietal-cell H₂ receptors, so the stomach makes less HCl and ==less acid is lost through gastric suction==.", "indications": ["Metabolic alkalosis from gastric suction (Med-Surg slide; Brunner now names PPIs such as omeprazole for this)"], "dose": [["PO adults, ulcer (Davis, for reference)", "300 mg 4 times daily or 400 to 600 mg twice daily (max 2.4 g/day)"], ["For metabolic alkalosis", "Ordered by the provider; not in your materials"]], "assess": {"before": [["Gastric output volume", "guides response"], ["Mental status in older adults", "cimetidine can cause confusion"]], "after": [["CBC periodically", "rare agranulocytosis/aplastic anemia"], ["Confusion", "report promptly"]]}, "effects": {"common": ["Diarrhea, constipation, headache"], "serious": ["Dysrhythmias", "Agranulocytosis, aplastic anemia", "Confusion (older adults)"]}, "avoid": {"contra": ["Hypersensitivity"], "interactions": ["Inhibits liver metabolism (CYP enzymes) → ↑ warfarin, phenytoin, theophylline levels", "Reduces B12 and iron absorption over time", "No major food clashes"]}, "teach": ["Report confusion, sore throat, or unusual bruising", "Avoid other OTC acid reducers unless approved"], "verify": ["dose"]}, {"generic": "acetazolamide", "brands": ["Diamox (verify)"], "cls": "Carbonic anhydrase inhibitor (diuretic)", "suffix": "-zolamide", "moa": "Blocks carbonic anhydrase in the nephron so ==bicarbonate is excreted in the urine==, lowering pH without a big fluid load (Brunner Ch. 10).", "indications": ["Metabolic alkalosis in clients who cannot tolerate rapid volume expansion, such as heart failure (Med-Surg slide names the class)"], "dose": [["PO/IV", "Ordered by the provider. Not in your materials: look it up in your drug guide."]], "assess": {"before": [["ABG, K⁺", "it wastes potassium and bicarbonate"], ["Sulfonamide allergy", "cross-sensitivity"]], "after": [["K⁺ and ABG", "risk of hypokalemia and acidosis"], ["I&O and weight", "diuretic effect"]]}, "effects": {"common": ["Paresthesia, increased urination, taste change"], "serious": ["Metabolic acidosis", "Hypokalemia"]}, "avoid": {"contra": ["Sulfonamide allergy", "Hypokalemia, severe kidney or liver disease"], "interactions": ["Other diuretics ↑ K⁺ loss", "No major food clashes in your materials"]}, "teach": ["Report tingling, muscle weakness, or confusion"], "verify": ["names", "dose", "assess", "effects", "avoid", "teach"]}], "procedures": [{"name": "Nasogastric (NG) suction management with strict intake and output", "aka": "NG suction and I&O", "kind": "monitoring", "indication": "Gastric suction removes HCl and causes metabolic alkalosis; output must be measured and replaced (Med-Surg slide: strict I&O).", "steps": [["Verify tube placement per facility policy before use", "prevents aspiration"], ["Set suction as ordered", "excess suction injures the mucosa"], ["==Measure and record NG output every shift== (or as ordered)", "output is acid lost from the body"], ["Irrigate only with the solution ordered (usually normal saline)", "plain water pulls electrolytes out with the suction"], ["Total intake and output; report a negative balance", "volume depletion perpetuates the alkalosis"]], "before": [["Baseline K⁺, Cl⁻, ABG", "electrolytes lost with gastric fluid"], ["Orthostatic BP", "volume status"]], "after": [["Daily weight, I&O trend", "volume"], ["Signs of low K⁺ and tetany", "complications of alkalosis"]], "complications": ["Hypokalemia and dysrhythmias", "Tetany and seizures", "Dehydration"], "teach": ["Do not drink large amounts of plain water while on suction unless allowed (washes out electrolytes)"], "verify": ["steps"]}, {"name": "Arterial blood gas (ABG) sampling", "aka": "ABG draw", "kind": "diagnostic", "indication": "Confirms metabolic alkalosis: ==pH > 7.45 with HCO₃⁻ > 28 mEq/L== (Galen); high PaCO₂ shows hypoventilation compensation.", "steps": [["Verify the order and identify the client with two identifiers", "prevents a wrong-client result"], ["Check collateral circulation to the hand before a radial stick, as your skills lab teaches", "the artery sampled must not be the hand's only blood supply"], ["Sample is drawn into a heparinized syringe; air bubbles are removed", "air changes the O₂ and CO₂ values"], ["==Hold firm pressure on the site until bleeding stops==, longer with anticoagulants", "an artery bleeds under pressure"], ["Label with time, O₂ setting, and temperature; send immediately per facility policy", "results are only valid fresh and interpreted against the O₂ the client receives"]], "before": [["Note O₂ therapy and temperature", "needed to interpret the gas"], ["Check for anticoagulants or low platelets", "bleeding risk"], ["Explain the brief sharp stick", "reduces anxiety, which can change breathing"]], "during": [["Watch breathing and comfort", "pain and anxiety shift PaCO₂"]], "after": [["Inspect site for bleeding or hematoma", "arterial bleeding"], ["Check hand warmth, color, pulse, sensation", "arterial injury or spasm"], ["Interpret with ROME and trend with the clinical picture", "one value is a snapshot (Brunner Ch. 10)"]], "complications": ["Bleeding or hematoma", "==Loss of circulation to the hand== (cool, pale, numb)", "Infection"], "teach": ["Report numbness, coldness, or pain in the hand", "Keep the wrist still while pressure is held"], "verify": ["steps"]}], "bridge": [["Pathophysiology", "Acid loss or base gain raises HCO₃⁻; volume and chloride depletion make the kidneys keep HCO₃⁻; K⁺ and ionized Ca²⁺ fall."], ["Med-Surg", "So you track NG output and I&O, give normal saline and KCl, use seizure precautions, and monitor the rhythm."]], "cat": "Acid-Base Imbalances", "sub": "Metabolic (kidneys, HCO₃⁻)", "catColor": "#a3460a"}, {"id": "ida", "name": "Iron deficiency anemia", "short": "Iron deficiency", "group": "Anemia · microcytic, hypochromic (production)", "color": "#9f1239", "pair": "thal", "sig": ["Hgb ↓", "MCV ↓ (small)", "Ferritin ↓", "TIBC ↑"], "hook": "**==Most common nutritional deficiency in the world and most common cause of anemia==.** No iron, no heme, so the marrow makes small, pale red cells.", "patho": {"chain": ["Iron supply falls below need: **low intake, increased demand (pregnancy), diminished absorption (chronic disease, GI problems), or blood loss** (hemorrhage, GI bleed, menorrhagia, hemodialysis)", "Iron stores (ferritin) are used up first; about 70% of body iron sits in red blood cells (RBCs)", "Without iron, hemoglobin (Hgb) cannot be synthesized", "The marrow releases **small (microcytic), pale (hypochromic)** RBCs carrying less Hgb", "Oxygen-carrying capacity falls → tissue hypoxia", "Net result: anemia with low MCV, low MCH, low ferritin, high TIBC"], "compensation": "The kidney senses low oxygen and releases **erythropoietin (EPO)** to push the marrow; the heart and lungs speed up to increase oxygen delivery; fatigue forces rest to decrease demand. EPO cannot fix the problem without iron.", "tip": "**Iron = small and pale.** Most common cause in men: **GI bleeding**. In women: **menorrhagia**. Rule #1: anemia is never normal, so always look for the source."}, "manifestations": [["Fatigue, weakness, low stamina, activity intolerance", "less oxygen reaches muscle, so the body forces rest to decrease oxygen demand (compensation)"], ["Pallor (especially lips, gums, conjunctiva)", "less hemoglobin means less red color in the skin and mucosa, and blood is shunted away from the skin to vital organs"], ["Tachycardia, palpitations", "the heart pumps faster to move the fewer oxygen carriers around more often"], ["Exertional dyspnea, increased respirations", "the body tries to load more oxygen per minute"], ["==Pica (craving ice, dirt, clay, starch, cardboard, hair)==", "exact cause unknown (Patho notes); a classic cue to recognize"], ["==Koilonychia (spoon-shaped nails); brittle nails, dry hair==", "poor blood flow weakens the connective tissue under the nail"], ["Blue sclerae", "the thin sclera lets the pigmented layer beneath show through"], ["Erosions/fissures at the corners of the mouth", "iron-poor tissue breaks down at stress points"]], "labs": [["Hgb / Hematocrit (Hct)", "↓ (Galen Hgb: male 14 to 18, female 12 to 16 g/dL; Hct male 42 to 52%, female 37 to 47%). Hct ≈ Hgb × 3"], ["Mean corpuscular volume (MCV)", "↓ microcytic (small cells)"], ["Mean corpuscular hemoglobin (MCH) / MCHC", "↓ hypochromic (pale cells)"], ["Serum ferritin", "==↓ iron **in storage** (first to fall)=="], ["Serum iron", "↓ iron **in circulation** (Galen: male 80 to 180, female 60 to 160 mcg/dL)"], ["Total iron binding capacity (TIBC)", "↑ (Galen 250 to 460 mcg/dL): transferrin has many empty seats because iron is low"], ["Look for blood loss", "Stool for occult blood when GI bleed is suspected"]], "risks": [["Blood loss", "==GI bleeding (most common in men), menorrhagia (most common in women)==, hemorrhage, hemodialysis"], ["Low intake", "Poor nutrition from food choices or food availability"], ["Poor absorption", "Chronic disease, GI disorders"], ["Increased demand", "Pregnancy"], ["Demographics", "More common in women and in older adults (Med-Surg slide)"]], "management": [["Find and treat the cause (for example a GI bleed)", "replacing iron while a bleed continues only refills a leaking tank"], ["Iron supplements: oral, IM, or IV (ferrous sulfate is on your syllabus drug list)", "supplies the raw material for heme so the marrow can make normal-size, normally colored cells"], ["Iron-rich diet with a dietary consult", "organ meats, red meat, egg yolks, cereals, green leafy vegetables, kidney beans, raisins"], ["Packed red blood cells (PRBCs) if severe or bleeding", "immediately raises oxygen-carrying capacity"]], "nursing": {"assess": [["Hypoxia cues: SOB, fatigue, HR, SaO₂, pallor", "show how well compensation is keeping up"], ["Signs of GI bleed: black tarry stools, blood in emesis, abdominal pain", "the slide asks: do they have a GI bleed and how do you assess for it?"], ["Diet and access to food", "guides dietary and social work consults"], ["Nails, mouth, pica history", "iron-specific cues"]], "act": [["Give oxygen and raise the head of the bed for hypoxia; monitor SaO₂ with activity", "improves oxygen loading", 1], ["==Assess for active GI bleeding== (melena, coffee-ground emesis, dizziness, Hgb drop)", "blood loss is the cause until proven otherwise (Brunner)", 1], ["Give iron as ordered: oral between meals; IM by Z-track; IV with anaphylaxis watch", "replaces the missing raw material", 2], ["Fall precautions if dizzy; cluster care", "activity intolerance", 2], ["Dietary and social work consults; teach iron-rich foods with vitamin C", "addresses intake and access", 3]], "order": "Oxygenation and a possible active bleed come first, then replacement and safety, then nutrition and access."}, "education": [["Iron-rich foods", "organ meats, red meat, egg yolks, cereals, green leafy vegetables, kidney beans, raisins"], ["Expect black or tarry stools on iron", "an expected effect, not necessarily bleeding; report if accompanied by abdominal pain or dizziness"], ["Constipation", "drink plenty of fluids"], ["Take between meals", "minimizes GI upset per the Rx Corner slide"], ["Report bleeding", "heavy periods or dark stools before starting iron need evaluation"]], "complications": ["Worsening hypoxia: chest pain, dyspnea at rest", "Heart strain from prolonged tachycardia", "Undetected GI bleed or malignancy as the cause", "Falls from dizziness or orthostatic changes"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Chest pain, dyspnea at rest, syncope, hematemesis, or a sudden drop in Hgb (suggests active bleeding)."}, {"type": "info", "label": "SOAPIE: chronic iron deficiency", "in": "edu", "text": "**S:** \"I'm always tired and I crave ice.\" **O:** Hgb 8.5 g/dL, MCV low, ferritin low, spoon nails, HR 104. **A:** Activity intolerance related to decreased oxygen-carrying capacity. **P:** Oral iron between meals, iron-rich diet, dietary consult, rest periods. **I:** Taught iron schedule, black stool expectation, fluids for constipation. **E:** Client states three iron-rich foods and when to take iron; recheck CBC at follow-up."}, {"type": "book", "label": "Textbook: Chart 29-3 Taking Oral Iron (paraphrased)", "in": "meds", "text": "Take iron on an empty stomach with a vitamin C source; build up the dose gradually to limit GI upset; expect black stools; add fiber for constipation; give liquid iron through a straw and rinse. ==Antacids and dairy greatly reduce absorption.==", "source": "Brunner & Suddarth 15e, Ch. 29, Chart 29-3"}], "sbar": null, "drugs": [{"generic": "ferrous sulfate", "brands": ["Feosol", "Fer-In-Sol", "Slow Fe"], "cls": "Iron supplement (antianemic)", "moa": "Supplies the iron that becomes part of hemoglobin and iron stores, so the marrow can make normal-size, normally colored red cells.", "indications": ["Treatment and prevention of iron deficiency anemia", "Parenteral iron (IV) only when oral iron is not tolerated or absorbed"], "dose": [["PO adults, deficiency (Davis)", "120 to 240 mg/day of **elemental** iron in 2 to 4 divided doses (ferrous sulfate 324 mg tablet ≈ standard tablet)"], ["PO adults, prophylaxis (Davis)", "60 to 100 mg/day elemental iron"], ["Duration (Brunner)", "Continue 6 to 12 months to refill stores even after symptoms resolve"]], "assess": {"before": [["Diet history, bowel pattern", "constipation is common; guides teaching"], ["Hgb, Hct, reticulocytes, ferritin", "baseline (Galen iron: male 80 to 180, female 60 to 160 mcg/dL; TIBC 250 to 460)"], ["Is the anemia actually iron deficiency?", "iron is contraindicated in anemias not caused by iron deficiency (thalassemia, hemochromatosis)"]], "after": [["Hgb/Hct and reticulocytes every 3 weeks for 2 months (Davis)", "rising values show response"], ["IV iron: BP, HR, and ==signs of anaphylaxis==", "parenteral iron can cause hypotension and anaphylaxis"], ["Stool color", "black stools are expected; report tarry stools with pain or dizziness"]]}, "effects": {"common": ["Constipation, nausea, epigastric pain", "Dark green or black stools", "Teeth staining (liquid)"], "serious": ["IM/IV: ==anaphylaxis==, hypotension, seizures", "GI bleeding", "Accidental overdose in children (fatal)"]}, "avoid": {"contra": ["Hemochromatosis or iron overload", "Anemias not due to iron deficiency"], "interactions": ["Antacids, H₂ blockers, PPIs ↓ absorption", "Iron ↓ absorption of tetracyclines, fluoroquinolones, levothyroxine (separate doses)", "Food: ==food, dairy, coffee, tea, eggs ↓ absorption 33 to 50%==; vitamin C ↑ absorption"]}, "teach": ["Take 1 hour before or 2 hours after meals with orange juice; with food only if GI upset", "Liquid iron through a straw; rinse mouth", "Stools will be black (harmless); eat fiber and drink fluids for constipation", "Keep out of reach of children (overdose can be fatal)"], "verify": []}], "procedures": [{"name": "Z-track intramuscular iron injection", "aka": "Z-track IM", "kind": "therapeutic", "indication": "Parenteral iron must be given by Z-track (Med-Surg Rx Corner slide) because iron stains and irritates subcutaneous tissue.", "steps": [["Use a new needle after drawing up the drug", "iron on the needle stains the skin track"], ["Choose a large muscle per your skills lab (ventrogluteal)", "deep muscle holds the volume"], ["==Pull the skin laterally and hold it== while injecting", "creates a zig-zag track that seals the drug in the muscle"], ["Inject slowly, wait 10 seconds, withdraw, then release the skin", "lets the drug disperse before the track closes"], ["Do not massage the site", "massage pushes drug back into the tissue"]], "before": [["Check for a test-dose order and allergy history", "IM/IV iron can cause anaphylaxis"], ["Stop oral iron before parenteral iron (Davis)", "avoids overload"]], "after": [["Observe for anaphylaxis and hypotension", "serious effect of parenteral iron"], ["Check the site for staining or pain", "local reaction"]], "complications": ["==Anaphylaxis==", "Skin staining", "Pain, sterile abscess"], "teach": ["Do not rub the site", "Report rash, itching, or trouble breathing"], "verify": ["steps"]}, {"name": "Stool test for occult blood", "kind": "diagnostic", "indication": "Iron deficiency is blood loss until proven otherwise; stool is tested for occult blood (Brunner Ch. 29).", "steps": [["Collect the sample per test instructions", "contamination changes results"], ["Follow dietary or drug restrictions the test requires", "some foods and drugs cause false results"], ["Send or develop per facility policy", "timely result"]], "before": [["Ask about recent black stools and iron use", "iron darkens stool but should not cause a false positive (Brunner)"]], "after": [["Report a positive result", "GI source needs evaluation (colonoscopy or endoscopy)"]], "complications": ["False results from diet or drugs"], "teach": ["Black stool from iron is expected; tarry stool with dizziness or pain is not"], "verify": ["steps", "before"]}], "bridge": [["Pathophysiology", "No iron → no heme → small, pale RBCs; ferritin falls first, TIBC rises."], ["Med-Surg", "So you look for the bleed, give iron correctly (between meals, Z-track), and teach iron-rich foods."]], "cat": "Anemias & RBC Disorders", "sub": "Decreased production: nutrient lack", "catColor": "#9f1239"}, {"id": "b12", "name": "Vitamin B12 deficiency & pernicious anemia", "short": "B12 / Pernicious", "group": "Anemia · macrocytic, megaloblastic", "color": "#6d28d9", "pair": "fol", "sig": ["MCV ↑ (big)", "B12 ↓", "Neuro signs ✓"], "hook": "B12 is needed for DNA synthesis **and for myelin**. Without it, red cell precursors grow but cannot divide (giant, fragile cells) **and the nerves and spinal cord degenerate**. ==Pernicious anemia is B12 deficiency caused by autoimmune loss of intrinsic factor (IF)==.", "patho": {"chain": ["B12 intake is low (strict vegan diet) **or, far more often, absorption fails**: no intrinsic factor (autoimmune pernicious anemia, gastrectomy, bariatric surgery), ileal resection, Crohn's/IBD, chronic diarrhea, tapeworm, long-term metformin, PPIs, H₂ blockers, antacids", "**Intrinsic factor** from the stomach's parietal cells binds B12 and carries it to the **ileum** for absorption; without IF, oral B12 passes through unabsorbed", "B12 stores in the liver are large, so ==deficiency takes years to show== and the anemia is often severe before symptoms appear", "No B12 → disrupted DNA synthesis in blast cells → **megaloblasts** (MCV often > 110 fL), hypersegmented neutrophils; many cells die in the marrow, so RBC, WBC, and platelets fall", "B12 is also needed for myelin and nerve fatty acid metabolism → **peripheral nerve degeneration + posterior and lateral spinal column degeneration**", "Macrocytic anemia **plus** neurologic damage that keeps progressing until B12 is replaced"], "compensation": "Slow onset lets the heart and lungs compensate (↑ HR, ↑ RR) and EPO rise, so the client may look well until the anemia is severe. ==There is no compensation for nerve damage==: it is reversible only if caught early (signs present < 3 months may fully reverse; recovery is slow, up to 6 to 12 months).", "tip": "**B12 = Brain + Big cells + Bowel/stomach absorption.** Folate = big cells, **no** nerve damage. Ask: \"Are there **paresthesias, balance or position-sense problems**?\" Yes → B12."}, "manifestations": [["Fatigue, weakness, low stamina, activity intolerance", "less oxygen reaches muscle, so the body forces rest to decrease oxygen demand (compensation)"], ["Pallor (especially lips, gums, conjunctiva)", "less hemoglobin means less red color in the skin and mucosa, and blood is shunted away from the skin to vital organs"], ["Tachycardia, palpitations", "the heart pumps faster to move the fewer oxygen carriers around more often"], ["Exertional dyspnea, increased respirations", "the body tries to load more oxygen per minute"], ["==Paresthesia: symmetric numbness and tingling in feet and hands==", "demyelination of peripheral nerves; this is the **finding that separates B12 from folate**"], ["Loss of vibration and position sense (proprioception), unsteady gait, spastic ataxia, falls", "degeneration of the **dorsal (posterior) and lateral columns of the spinal cord**"], ["\"Megaloblastic madness\": paranoia, delusions, hallucinations, dementia, cognitive dysfunction, memory impairment", "demyelination and neuronal dysfunction in the brain"], ["Smooth, sore, beefy-red tongue (glossitis); mild diarrhea", "rapidly dividing tongue and gut cells cannot make DNA"], ["Extreme pallor with a pale-yellow tint; mild jaundice in the sclera", "megaloblastic cells hemolyze in the marrow, raising bilirubin"], ["Vitiligo and premature graying (pernicious anemia)", "they travel with the autoimmune process"], ["Low RBC, WBC, and platelets", "DNA failure affects every rapidly dividing marrow line (counts are lower than normal but not as low as aplastic anemia)"]], "labs": [["Hgb/Hct", "↓ (Galen Hgb male 14 to 18, female 12 to 16 g/dL)"], ["MCV", "↑ macrocytic, often > 110 fL; MCH ↑ or normal, MCHC normal"], ["Serum vitamin B12", "↓ (first test ordered)"], ["Methylmalonic acid and homocysteine", "↑: more sensitive for B12 deficiency than the B12 level itself (Brunner)"], ["Intrinsic factor antibody", "==Positive in pernicious anemia== (autoimmune marker)"], ["Schilling test (Patho slide)", "Measures how well oral B12 is absorbed; abnormal in pernicious anemia, normal in folate deficiency (Banasik Table 13.5). Largely replaced by newer tests."], ["CBC / smear", "Pancytopenia (Patho slide: RBC 500,000 to 750,000/mm³, WBC 4,000 to 5,000/mm³, platelets ~50,000/mm³), oval macrocytes, hypersegmented neutrophils"], ["Bone marrow; gastric analysis", "Megaloblastic dysplasia; achlorhydria (no free stomach HCl)"], ["Serum K⁺ during treatment", "Watch for ==hypokalemia in the first 48 hours of B12 therapy== (new cells pull K⁺ in); Galen 3.5 to 5 mEq/L"]], "risks": [["Absorption problems (most common)", "Pernicious anemia (no IF), gastrectomy, bariatric surgery, ileal resection, Crohn's/IBD, chronic diarrhea, tapeworm, pancreatic disease"], ["Medications", "Long-term metformin, proton pump inhibitors (PPIs), H₂ blockers, antacids (all reduce B12 absorption)"], ["Low intake", "Strict vegan diet without supplements or fortified foods"], ["Age", "==Older adults==: nearly 20% have low B12 (Brunner); pernicious anemia is a disease of older adults and runs in families"], ["Course difference to know", "Med-Surg slide says no genetic, cultural, or age-related risk for B12 deficiency; Brunner and the Patho table list older adults and family history for **pernicious** anemia. Answer by the course you are testing in."]], "management": [["Vitamin B12 (cyanocobalamin) replacement", "restores DNA synthesis (reticulocytes rise in about 1 week, counts normal in 4 to 8 weeks) and stops further nerve damage"], ["Pernicious anemia or malabsorption: IM (or deep subcut/intranasal) B12, ==monthly for life==", "without intrinsic factor, oral B12 cannot be absorbed in normal doses, so the route bypasses the stomach"], ["Diet-only deficiency (vegan): oral B12 or fortified foods", "absorption works; only intake was missing"], ["Potassium monitoring/replacement in the first days", "rapid new RBC production shifts K⁺ into cells"], ["Endoscopic screening for gastric cancer (pernicious anemia)", "gastric atrophy increases gastric cancer risk"]], "nursing": {"assess": [["==Neurologic exam: paresthesia, vibration and position sense, gait, balance, cognition==", "demyelination is the dangerous, B12-specific part and may be permanent"], ["Tongue, mouth, skin, sclera (with natural light)", "glossitis, pallor-plus-jaundice, vitiligo"], ["GI history: gastric/bowel surgery, IBD, metformin or PPI use, diet", "finds the absorption cause"], ["Serum K⁺ during the first 48 hours of therapy", "risk of sudden hypokalemia"], ["Hypoxia cues: HR, SaO₂, activity tolerance", "shared anemia picture"]], "act": [["==Fall precautions==; assist with ambulation; PT/OT referral for assistive devices", "loss of position sense and ataxia make falls the most immediate danger", 1], ["Give B12 as ordered (IM/deep subcut) and check K⁺", "definitive treatment; prevents worsening neuropathy and catches hypokalemia", 1], ["Protect numb extremities: check bath water temperature, inspect feet, avoid heat and cold", "the client cannot feel injury", 2], ["Soft, bland foods and mouth care for glossitis", "reduces pain so the client can eat", 2], ["Rest periods, oxygen if hypoxic", "reduces oxygen demand", 3], ["Dietary and social work consults; teach self-injection if long-term", "supports lifelong adherence", 3]], "order": "Safety first (falls from proprioception loss and severe hypoxia can injure the client today), then the treatment that stops nerve damage, then comfort, nutrition, and lifelong teaching."}, "education": [["==Lifelong replacement for pernicious anemia==", "monthly injections (or prescribed daily supplements) continue even when you feel well; stopping brings back the anemia and nerve damage"], ["Self-injection", "you or a family member can learn to give the monthly injection"], ["Foods high in B12", "meats, seafood, egg yolk, fermented cheeses, milk, poultry (helps diet-only deficiency, not pernicious anemia)"], ["After gastric or bariatric surgery", "the stomach makes intrinsic factor, so B12 supplementation is expected"], ["Report", "new or worsening numbness, tingling, balance problems, confusion, or mood changes"], ["Follow-up", "periodic CBC and endoscopy screening for gastric cancer"]], "complications": ["==Permanent peripheral neuropathy and spinal cord damage if treated late==", "Falls and injury", "Cognitive decline, psychosis (megaloblastic madness)", "Heart failure from severe chronic anemia", "Hypokalemia during the first days of B12 therapy", "Gastric cancer (pernicious anemia)", "Bleeding and infection from low platelets and WBCs"], "callouts": [{"type": "emergency", "label": "Notify the provider", "text": "New or worsening confusion or hallucinations, a fall, rapidly progressing numbness or weakness, signs of heart failure, or K⁺ below 3.5 mEq/L after starting B12."}, {"type": "good", "label": "The question your instructor always asks", "in": "man", "text": "Both B12 and folate deficiency make big red cells. ==Only B12 deficiency (including pernicious anemia) causes neurologic damage==: paresthesia, loss of position and vibration sense, ataxia. Folate deficiency can cause irritability and depression but **not** numbness or balance loss."}, {"type": "watch", "label": "Never treat \"big cells\" with folic acid alone", "in": "tx", "text": "Folic acid corrects the anemia of B12 deficiency on the blood count, but ==the nerve damage keeps progressing==. This is why folic acid is contraindicated in undiagnosed anemia and why the deficient vitamin must be identified first (Abrams Ch. 35; Banasik Ch. 13)."}, {"type": "book", "label": "Textbook: Megaloblastic anemias", "in": "path", "text": "Both deficiencies cause the same marrow and blood changes because both are needed for DNA synthesis. Folate stores run out within **months**; B12 stores last **years**. Neurologic signs occur only with B12 deficiency and ==persist if B12 is not replaced==, so a careful distinction must be made.", "source": "Brunner & Suddarth 15e, Ch. 29, Megaloblastic Anemias"}, {"type": "book", "label": "Textbook: Neurologic picture", "in": "man", "text": "Symmetric paresthesias of feet and hands with lost vibration and position sense progress to **spastic ataxia** from dorsal and lateral spinal column degeneration. Damage present less than 3 months may fully reverse; maximal recovery takes up to 6 months.", "source": "Banasik 7e, Ch. 13, Anemia Related to B12 or Folate Deficiency"}], "figures": [{"title": "How B12 is absorbed (and where it fails)", "in": "path", "source": "Redrawn from Brunner Ch. 29 and Abrams Ch. 35 text", "steps": ["B12 is eaten in animal foods", "Stomach acid frees it; parietal cells secrete intrinsic factor", "IF binds B12 and carries it to the terminal ileum", "B12 is absorbed and stored in the liver for years", "Used for DNA synthesis (RBCs) and myelin (nerves)"], "caption": "Each arrow is a failure point: diet, ==stomach (pernicious anemia, gastrectomy, PPIs)==, ileum (resection, Crohn's). Only a diet failure is fixed by oral B12 in normal doses."}], "bridge": [["Pathophysiology", "No B12 → failed DNA synthesis (megaloblastic, macrocytic cells) **and** failed myelin (peripheral nerves and posterior/lateral spinal columns degenerate)."], ["Med-Surg", "So you assess **neuro status, gait, and position sense**, prevent falls, give lifelong IM B12 for pernicious anemia, and watch K⁺ in the first 48 hours."]], "sbar": {"title": "SBAR: fall risk in a client with pernicious anemia", "s": "Client admitted with Hgb 7.9 g/dL nearly fell twice walking to the bathroom and cannot feel the floor under her feet.", "b": "72-year-old, history of gastric bypass 8 years ago; takes omeprazole; no B12 supplementation since surgery.", "a": "MCV 118 fL, B12 low, IF antibody pending. Absent vibration sense in both feet, positive Romberg, new confusion at night. HR 108, SaO₂ 95%.", "r": "Bed alarm and fall precautions in place; request B12 replacement order, baseline K⁺ with recheck in 24 to 48 hours, and PT consult."}, "drugs": [{"generic": "cyanocobalamin", "brands": ["Nascobal (nasal)", "Vitamin B12"], "cls": "Antianemic; water-soluble vitamin (vitamin B12)", "moa": "Supplies the coenzyme needed for **DNA synthesis** in blood-forming cells and for **myelin**, so megaloblastic indices, GI lesions, and neurologic damage are corrected.", "indications": ["Vitamin B12 deficiency (parenteral or nasal when caused by malabsorption)", "==Pernicious anemia: parenteral first==; oral or nasal only after hematologic remission and no CNS signs"], "dose": [["IM or deep subcut, pernicious anemia (Davis)", "100 mcg once daily for 6 to 7 days; then every other day for 7 doses; then every 3 to 4 days for 2 to 3 weeks; then ==100 mcg once monthly for life=="], ["IM or subcut, B12 deficiency (Davis)", "30 mcg daily for 5 to 10 days, then 100 to 200 mcg once monthly"], ["PO, pernicious anemia maintenance only (Davis)", "1,000 to 2,000 mcg once daily after remission"]], "assess": {"before": [["Neuro status, tongue, pallor", "baseline to judge response (Davis)"], ["CBC, reticulocytes, B12, folate, iron levels", "confirms the deficiency; iron or folate deficiency blunts the response"], ["Serum K⁺", "rapid cell production can drop K⁺"]], "after": [["==Serum K⁺ during the first 48 hours==", "hypokalemia can occur as new RBCs take up potassium (Davis; Banasik)"], ["Reticulocyte count about 1 week, CBC at 1 month then every 3 to 6 months", "reticulocytes rise first if therapy works"], ["Neuro checks over months", "nerve recovery is slow and may be incomplete"]]}, "effects": {"common": ["Pain at IM site", "Diarrhea, itching"], "serious": ["==Hypokalemia==", "Heart failure, pulmonary edema", "Hypersensitivity reactions including anaphylaxis"]}, "avoid": {"contra": ["Hypersensitivity to B12 or cobalt", "Hereditary optic nerve atrophy (use cautiously)"], "interactions": ["Metformin, omeprazole/PPIs, cimetidine, colchicine, alcohol ↓ oral absorption", "Chloramphenicol ↓ response", "Food: give oral form with meals; vitamin C in juice destabilizes it, so take promptly"]}, "teach": ["==Pernicious anemia needs B12 for life==, even when you feel well", "Learn self-injection or have a family member taught", "Foods high in B12: meats, seafood, egg yolk, fermented cheeses", "Report palpitations, muscle weakness (low K⁺), new numbness, or confusion"], "verify": ["names"]}], "procedures": [{"name": "Intramuscular vitamin B12 injection", "kind": "therapeutic", "indication": "==Pernicious anemia requires parenteral B12== because oral B12 cannot be absorbed without intrinsic factor (Brunner; Davis).", "steps": [["Verify order, dose, and client", "high-alert for consistency"], ["Select site per skills lab (deltoid or ventrogluteal)", "IM absorption"], ["Inject IM or deep subcut as ordered", "bypasses the stomach and ileum"], ["Document and schedule the next dose", "therapy is lifelong"]], "before": [["Baseline K⁺, CBC, reticulocytes", "response and hypokalemia risk"], ["Allergy to cobalt or B12", "anaphylaxis is rare but possible"]], "after": [["==Check K⁺ within 48 hours of starting therapy==", "hypokalemia as new cells form"], ["Reticulocytes in about 1 week", "early response"]], "complications": ["Hypokalemia", "Anaphylaxis (rare)", "Injection-site pain"], "teach": ["Monthly injections continue for life", "Self-injection can be taught"], "verify": ["steps"]}, {"name": "Bone marrow aspiration and biopsy", "kind": "diagnostic", "indication": "Shows megaloblastic dysplasia (Patho slide diagnostic test); rarely needed once B12 level and antibodies are known.", "steps": [["Consent and positioning as for any marrow biopsy (posterior iliac crest per facility)", "usual site"], ["Local anesthetic; aspiration then core biopsy", "aspiration causes brief sharp pain"], ["Pressure dressing", "bleeding control"]], "before": [["Platelet count and coagulation tests (Galen PT 11 to 12.5 sec, INR 0.9 to 1.2)", "bleeding risk"], ["Pain medication or anxiolytic as ordered", "procedure discomfort"]], "after": [["==Check the site for bleeding==", "low platelets"], ["Bed rest as ordered", "pressure on site"]], "complications": ["Bleeding, hematoma", "Infection"], "teach": ["Mild soreness for a few days; report bleeding or fever"], "verify": ["steps", "before", "after"]}], "cat": "Anemias & RBC Disorders", "sub": "Decreased production: nutrient lack", "catColor": "#9f1239"}, {"id": "fol", "name": "Folic acid (folate) deficiency anemia", "short": "Folate", "group": "Anemia · macrocytic, megaloblastic", "color": "#1d4ed8", "pair": "b12", "sig": ["MCV ↑ (big)", "Folate ↓", "B12 normal", "No neuro signs"], "hook": "The same big-cell anemia as B12 deficiency, because folate is also needed for DNA synthesis. ==No peripheral nerve or spinal cord damage==, because folate is not required for myelin. Think **alcohol, poor diet, and pregnancy**.", "patho": {"chain": ["Folate intake falls or need rises: ==alcohol use disorder==, poor diet (no fresh vegetables), liver cirrhosis, pregnancy, infancy, chronic hemolytic anemia, small-bowel disease (celiac), oral contraceptives and some drugs (methotrexate, phenytoin, sulfasalazine)", "**Folate stores are small**, so they run out within **months** (not years like B12)", "Alcohol both lowers intake and blocks liver storage and processing of folate", "Without folate, DNA synthesis fails → megaloblasts → **macrocytic** RBCs, low WBCs and platelets", "Myelin pathway is spared → **no paresthesias, normal position and vibration sense**", "Macrocytic anemia with low folate and **normal B12**"], "compensation": "Same anemia compensation: ↑ HR, ↑ RR, EPO release, fatigue forces rest. Because onset is over months, compensation hides mild anemia.", "tip": "**Folate = Food, Fetus, Fermented drinks (alcohol).** Low folate in pregnancy → ==neural tube defects==."}, "manifestations": [["Fatigue, weakness, low stamina, activity intolerance", "less oxygen reaches muscle, so the body forces rest to decrease oxygen demand (compensation)"], ["Pallor (especially lips, gums, conjunctiva)", "less hemoglobin means less red color in the skin and mucosa, and blood is shunted away from the skin to vital organs"], ["Tachycardia, palpitations", "the heart pumps faster to move the fewer oxygen carriers around more often"], ["Exertional dyspnea, increased respirations", "the body tries to load more oxygen per minute"], ["Glossitis, mouth soreness, GI upset, weight loss", "rapidly dividing oral and gut cells cannot make DNA"], ["Irritability, depression, blunted affect, sleep deprivation, memory loss (cerebral, not peripheral)", "Banasik lists these mood and cerebral changes with **pure folate** deficiency; the Patho slide lists them with megaloblastic anemias"], ["==No paresthesia, no loss of position or vibration sense, normal gait==", "folate is not part of the myelin pathway; this is how you tell it apart from B12"], ["Mild jaundice, pallor", "megaloblastic cells hemolyze in the marrow"]], "labs": [["Hgb/Hct", "↓"], ["MCV", "↑ macrocytic; hypersegmented neutrophils on smear"], ["Serum folate", "↓ (RBC folate is more sensitive but less often ordered)"], ["Vitamin B12", "==Normal==: the lab that rules out B12 deficiency"], ["Intrinsic factor antibody / Schilling test", "Negative / normal (no IF problem)"], ["Look for the cause", "Alcohol history, liver function, pregnancy test"]], "risks": [["Poor intake", "Malnutrition, no uncooked vegetables, ==alcohol use disorder=="], ["Increased requirement", "==Pregnancy==, infancy, chronic hemolytic anemias (sickle cell, thalassemia), liver disease"], ["Poor absorption", "Celiac and other small-bowel disease (sprue)"], ["Medications", "Oral contraceptives, methotrexate and phenytoin (folate antagonists), sulfasalazine, cholestyramine"]], "management": [["Folic acid replacement, typically 1 mg PO daily (Brunner); IM if malabsorption", "restores DNA synthesis so normal-size cells are made"], ["Confirm B12 is normal before giving folic acid alone", "folic acid would fix the blood count of a hidden B12 deficiency while nerve damage continues"], ["Folate-rich diet", "green leafy vegetables, liver, yeast, citrus fruits, dried beans, nuts, fortified grains"], ["Address alcohol use; continue folic acid as long as drinking continues", "alcohol blocks folate intake and liver storage"], ["Supplement anyone who may become pregnant", "prevents neural tube defects"]], "nursing": {"assess": [["Diet and ==alcohol history== (amount and duration)", "the most common causes"], ["Pregnancy status or plans", "need rises and low folate causes neural tube defects"], ["Neuro exam (expect normal)", "a normal neuro exam supports folate deficiency; new paresthesia means check B12"], ["Mood, sleep, memory", "folate deficiency can cause irritability and depression"], ["Hypoxia cues", "shared anemia picture"]], "act": [["Monitor for signs of hypoxia and give oxygen/rest as needed", "severe anemia can strain the heart", 1], ["Verify the B12 level is normal before giving folic acid alone; report any paresthesia", "prevents masking B12 deficiency", 1], ["Give folic acid as ordered", "definitive treatment", 2], ["Dietary consult; teach folate-rich foods", "prevents recurrence", 2], ["Refer for alcohol-use support", "removes the main cause", 3]], "order": "Oxygenation and the masking safety check come first, then replacement, then diet and alcohol counseling that prevent recurrence."}, "education": [["Folate foods", "green leafy vegetables, liver, yeast, citrus fruits, dried beans, nuts, fortified cereals; uncooked vegetables keep more folate"], ["Pregnancy", "start folic acid before conception if you may become pregnant"], ["Alcohol", "reducing alcohol lets folate levels recover; keep taking folic acid while drinking continues"], ["Medications", "tell the provider if you take phenytoin, methotrexate, or oral contraceptives"], ["Report", "any numbness, tingling, unner).", "steps": [["Private room; strict hand hygiene for all", "hands carry most pathogens"], ["Screen visitors for illness", "prevents exposure"], ["No fresh flowers or standing water per policy", "sources of bacteria and fungi"], ["Temperature at least every 4 hours", "fever may be the only sign"]], "before": [["Know the ANC", "guides precaution level"]], "after": [["Report temperature ≥ the threshold in your policy immediately", "early antibiotics save lives"]], "complications": ["==Sepsis=="], "teach": ["Hand hygiene, avoid crowds, report fever"], "verify": ["steps"]}], "bridge": [["Pathophysiology", "T cells destroy marrow stem cells → fat replaces marrow → pancytopenia."], ["Med-Surg", "So infection and bleeding precautions come first, plus ATG/cyclosporine monitoring and transfusion support."]], "cat": "Anemias & RBC Disorders", "sub": "Decreased production: marrow failure", "catColor": "#9f1239"}, {"id": "thal", "name": "Thalassemia (hemolytic anemia)", "short": "Thalassemia", "group": "Anemia · hemolytic, genetic (globin chains)", "color": "#a21caf", "pair": "ida", "sig": ["MCV ↓ (small)", "Ferritin normal/↑", "Hemolysis", "Genetic"], "hook": "An inherited defect in **globin chain production** makes too little hemoglobin and fragile RBCs that are destroyed early. Small cells like iron deficiency, but **iron stores are normal or high**.", "patho": {"chain": ["Mutant genes (inherited from parents) cause **defective globin chain synthesis**: alpha or beta", "Imbalanced Hgb production → **decreased hemoglobin synthesis** and fragile RBCs", "RBCs are destroyed early (**hemolysis**) → shorter lifespan", "The marrow tries to compensate with **erythroblastic hyperplasia** (lots of immature RBCs) → bone expansion and deformities; spleen and liver enlarge clearing broken cells", "Hemolysis releases Hgb → bilirubin → jaundice; **iron absorption increases**", "Net result: microcytic anemia with signs of hemolysis and normal or high iron stores"], "compensation": "Marrow overproduction (erythroblastic hyperplasia) and extramedullary production in the spleen and liver; heart and lungs compensate for hypoxia.", "tip": "**Alpha = A comes first** → problems early (fetal/newborn); 4 alpha genes missing is incompatible with life. **Beta = B comes later** → symptoms after 6 months; beta major is transfusion-dependent."}, "manifestations": [["General anemia symptoms: fatigue, pallor, tachycardia", "less functional Hgb"], ["==Jaundice==", "hemolysis releases Hgb, which is broken down into bilirubin faster than the liver clears it"], ["Splenomegaly, hepatomegaly", "these organs work overtime removing defective cells and making blood"], ["Bone deformities", "marrow expands inside bones (erythroblastic hyperplasia)"], ["Delayed development", "chronic hypoxia and high metabolic demand in children"], ["Leg ulcers", "chronic poor oxygen delivery to the skin"]], "labs": [["CBC", "↓ Hgb/Hct, ↓ MCV, ↓ MCH (microcytic, hypochromic)"], ["Ferritin", "==**Normal or ↑** (iron stores intact): the key difference from iron deficiency=="], ["Peripheral smear", "==Target cells=="], ["Bone marrow", "Erythroblastic hyperplasia (many immature RBCs)"], ["Hemolysis markers", "↑ indirect bilirubin (Galen indirect 0.2 to 0.8 mg/dL), ↑ LDH (Galen 100 to 190 IU/L), ↓ haptoglobin, ↑ reticulocytes"]], "risks": [["Genetic", "Inherited mutant genes from both parents; family history matters"], ["Alpha thalassemia", "Shows in the fetus/newborn"], ["Beta thalassemia", "Shows after about 6 months of age"]], "management": [["==Packed RBC transfusions (beta major is transfusion-dependent)==", "replace the oxygen-carrying capacity the defective cells cannot provide"], ["Treat complications of hypoxia; treat/prevent causes (Med-Surg anemia process slide)", "supportive care"], ["**Do not give iron unless ordered**", "iron stores are already normal or high and absorption is increased"], ["Genetic counseling", "the disorder is inherited"]], "nursing": {"assess": [["Jaundice, dark urine, spleen/liver size, abdominal pain", "signs of hemolysis and organ enlargement"], ["Hypoxia cues", "shared anemia picture"], ["Growth and development (children)", "chronic anemia delays development"], ["Transfusion reactions during PRBCs", "frequent transfusions"]], "act": [["Monitor for transfusion reactions during PRBCs", "acute hemolytic reactions are life-threatening", 1], ["Oxygen and rest for hypoxia", "reduces demand", 1], ["Give PRBCs as ordered", "main supportive therapy", 2], ["==Question iron supplement orders==", "iron absorption is already high and transfusions add iron (Brunner)", 2], ["Refer for genetic and preconception counseling", "inherited disorder", 3]], "order": "Transfusion safety and oxygenation first, then supportive therapy and iron-overload prevention, then counseling."}, "education": [["Inheritance", "both parents contribute the genes; family members may be tested"], ["Avoid iron supplements unless prescribed", "the body already absorbs extra iron"], ["Report", "increasing jaundice, abdominal pain, or worsening fatigue"]], "complications": ["Iron accumulation", "Bone deformities, delayed development", "Splenomegaly and hepatomegaly", "Leg ulcers", "Alpha with all 4 genes deleted: incompatible with life"], "callouts": [{"type": "emergency", "label": "Notify the provider", "text": "Signs of a transfusion reaction (fever, chills, back pain, dyspnea), severe abdominal pain, or rapidly worsening jaundice."}, {"type": "info", "label": "Slide gap", "in": "tx", "text": "Your Unit 2 slides do not list specific thalassemia treatments beyond transfusion dependence and general anemia care. Check Brunner & Suddarth Ch. 29 (your assigned reading) before the exam."}], "sbar": null, "procedures": [{"name": "Blood product transfusion (packed red blood cells or platelets)", "aka": "Transfusion", "kind": "therapeutic", "indication": "Beta-thalassemia major is ==transfusion-dependent==; PRBCs restore oxygen-carrying capacity (Patho notes; Brunner).",
