tetany== from low calcium (or low magnesium); positive results support the diagnosis and track the response to calcium.", "steps": [["Chvostek: tap the facial nerve in front of the ear, below the cheekbone", "irritable nerve triggers facial muscle twitching"], ["Observe the corner of the mouth and cheek for twitching", "positive = twitch"], ["Trousseau: place a BP cuff on the upper arm and inflate about 20 mmHg above systolic", "ischemia of the nerve provokes spasm in an irritable nerve"], ["Hold for 2 to 5 minutes (Banasik: about 3) and watch the hand", "positive = carpal spasm"], ["Deflate promptly and document", "relieves ischemia"]], "before": [["Explain both tests; warn that the cuff will be tight", "comfort and cooperation"], ["Know the baseline: Chvostek may be positive in some healthy people and normal newborns", "interpret with other findings"]], "after": [["Report a positive result with the serum calcium", "guides urgency"], ["Check circulation in the arm after Trousseau", "cuff-related ischemia"]], "complications": ["Carpopedal spasm or progression to tetany", "Laryngospasm"], "teach": ["Report tingling or muscle spasms"], "verify": ["steps"]}]}, {"id": "hyperCa", "name": "Hypercalcemia (high Ca²⁺)", "short": "Hypercalcemia", "group": "Ca²⁺ > 10.5 · threshold ↑ · nerves and muscles depressed", "cat": "Calcium Imbalances", "sub": "High Ca²⁺: threshold raised (depressed)", "catColor": "#6d28d9", "color": "#475569", "pair": "hypoCa", "sig": ["Ca²⁺ > 10.5 mg/dL", "↓ DTRs, weakness", "Constipation, polyuria", "Stones, bones"], "hook": "Too much calcium raises the threshold nerve and muscle cells must reach to fire, so everything slows: muscles weaken, the gut stalls, the brain dulls, and the kidneys lose water and form stones.", "patho": {"chain": ["Calcium ==shifts out of bone== (hyperparathyroidism, ==malignancy== that releases bone-resorbing factors, prolonged immobility, Paget disease, bone tumors), ↑ intake or absorption (vitamin D excess, milk-alkali syndrome, overuse of supplements), or ↓ excretion (thiazide diuretics)", "Serum calcium rises above 10.5 mg/dL (Galen)", "High calcium raises the threshold potential, so excitable cells need more stimulus to fire", "Skeletal and smooth muscle tone falls; cardiac conduction is delayed; the kidneys cannot concentrate urine and calcium precipitates", "Depressed nerves and muscles, polyuria and dehydration, kidney stones, and fragile bone"], "compensation": "PTH secretion falls and calcitonin from the thyroid rises, reducing bone resorption and increasing calcium excretion. Polyuria and the vomiting it often brings cause dehydration, which raises calcium further (a vicious cycle), which is why saline hydration is the first treatment.", "tip": "\"**Stones, bones, groans, moans**\": kidney stones, bone pain and fractures, abdominal groans (constipation, nausea), and psychic moans (lethargy, confusion). Your slides: too much construction = sidewalks too rigid."}, "manifestations": [["==Muscle weakness==, fatigue, ==hypoactive deep tendon reflexes==, incoordination", "raised threshold depresses neuromuscular excitability"], ["==Constipation==, anorexia, nausea, vomiting, abdominal pain", "decreased smooth muscle tone in the gut"], ["Polyuria and polydipsia, dehydration", "high calcium impairs the kidney's ability to concentrate urine"], ["Calcium (kidney) stones, flank pain", "calcium precipitates in concentrated urine"], ["Deep bone pain, pathologic fractures", "calcium is being pulled out of bone"], ["Lethargy, confusion, personality change, coma", "depressed central nervous system"], ["Bradycardia, heart block, shortened QT, cardiac arrest", "altered cardiac action potential and delayed AV conduction; lethal dysrhythmias near 18 mg/dL (Brunner)"], ["Hypertension", "calcium increases vascular smooth muscle tone (Brunner)"]], "labs": [["Serum calcium", "==> 10.5 mg/dL== (Galen 9 to 10.5); Brunner uses > 10.4. Severe or > 14 mg/dL = emergency (F&P)."], ["ECG", "==Shortened QT== and ST segment, bradycardia, heart block (opposite of hypocalcemia)"], ["PTH", "↑ in hyperparathyroidism, suppressed in malignancy"], ["Phosphate", "Inversely related; often low"], ["X-ray", "Bone changes, urinary calculi"], ["Health history and assessment", "Cancer, immobility, thiazides, supplements, vitamin D"]], "risks": [["Shift from bone", "Hyperparathyroidism and malignancy (most common): breast, lung, kidney cancer, multiple myeloma, leukemia; immobility (fractures, spinal cord injury); Paget disease"], ["Increased intake", "Vitamin D overdose, milk-alkali syndrome, excessive calcium supplements"], ["Decreased excretion", "Thiazide diuretics (hydrochlorothiazide), lithium"], ["Medication effect", "Hypercalcemia increases digoxin toxicity"]], "management": [["==Isotonic IV fluids (0.9% NaCl)== (Med-Surg slides)", "dilutes calcium and sodium promotes calcium excretion by the kidneys; corrects the dehydration"], ["Calcitonin (Miacalcin)", "inhibits bone resorption and increases urinary calcium excretion; lowers calcium within about 2 hours"], ["Phosphate (PO or IV) (Med-Surg slides)", "phosphate binds calcium (reciprocal drop); IV phosphate used with extreme caution (soft-tissue calcification)"], ["Furosemide after rehydration (Brunner)", "increases calcium excretion; not routine without heart failure or kidney problems (F&P)"], ["Bisphosphonates, corticosteroids; treat the cause (parathyroidectomy, chemotherapy)", "long-term control by blocking bone breakdown"], ["Mobilize; stop calcium-containing fluids, medications, and supplements", "weight bearing keeps calcium in bone"]], "nursing": {"assess": [["==Cardiac rhythm== (bradycardia, heart block, short QT) and digoxin toxicity signs", "lethal dysrhythmias"], ["Level of consciousness, orientation", "CNS depression"], ["I&O, hydration, weight", "polyuria and dehydration; response to saline"], ["DTRs and muscle strength", "trend of neuromuscular depression"], ["Flank pain, hematuria", "kidney stones"], ["Bowel pattern", "constipation"]], "act": [["Cardiac monitoring; report dysrhythmias; watch digoxin clients closely", "the heart is the life threat", 1], ["Give IV 0.9% saline and other ordered medications; monitor for fluid overload", "dilutes and excretes calcium; rapid saline can overload", 1], ["Safety precautions for confusion; handle gently (pathologic fractures)", "fall and fracture risk", 2], ["==Encourage oral fluids (Brunner: 3 to 4 quarts/day, sodium-containing unless contraindicated)== and early, frequent ambulation", "dilutes calcium, prevents stones; weight bearing keeps calcium in bone", 2], ["Increase dietary fiber and fluids", "offsets constipation", 3], ["Reassure the client and family that mental changes are reversible", "reduces anxiety", 3]], "order": "cardiac safety and rehydration come first because dysrhythmias and dehydration drive the danger; then safety, mobility, and bowel care."}, "education": [["Fluids and activity", "drink plenty of fluids and walk often; immobility pulls calcium out of bone"], ["Diet and supplements", "avoid extra calcium, vitamin D, and calcium-containing antacids unless prescribed"], ["Medications", "thiazides raise calcium; report if prescribed; digoxin clients report nausea, vision changes, or palpitations"], ["When to seek help", "severe thirst, confusion, flank pain, constipation with vomiting, or palpitations"]], "complications": ["Dysrhythmias, heart block, cardiac arrest", "Hypercalcemic crisis (acute rise: severe thirst, polyuria, vomiting, confusion, coma)", "Kidney stones and kidney injury", "Pathologic fractures", "Digoxin toxicity", "Soft-tissue calcification (calcium-phosphate product > 70 mg/dL, Brunner)"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Calcium above 14 mg/dL or a rapid rise (==hypercalcemic crisis==: intractable vomiting, severe thirst and polyuria, confusion or coma), bradycardia or heart block, or signs of digoxin toxicity."}, {"type": "book", "label": "Textbook box: Emergency treatment of hypercalcemia", "in": "tx", "text": "F&P: acute hypercalcemia (severe symptoms or > 14 mg/dL) is a medical emergency and ==rehydration is the priority==: IV 0.9% saline, initially 200 to 300 mL/hr, then titrated to urine output of 100 to 150 mL/hr; symptomatic clients also receive calcitonin; bisphosphonates provide long-term control.", "source": "Frandsen & Pennington Ch. 44, Emergency Treatment of Hypercalcemia"}, {"type": "good", "label": "How to tell it from hypocalcemia", "text": "Hypo = **overexcited** (tetany, ↑ DTRs, prolonged QT, diarrhea). Hyper = **depressed** (weakness, ↓ DTRs, short QT, constipation, stones). Direction of excitability and the QT decide."}], "figures": [{"title": "Hormonal regulation of serum calcium", "in": "path", "source": "Frandsen & Pennington Ch. 44, Fig. 44.1; Brunner p. 252 (redrawn)", "steps": ["Serum calcium rises", "PTH secretion falls; calcitonin secretion rises", "Less calcium released from bone; more excreted by kidneys and gut", "Serum calcium returns toward normal"], "caption": "When calcium falls, the reverse happens (PTH ↑). Calcium and phosphate move in opposite directions."}], "sbar": {"title": "Applying SBAR: hypercalcemia of malignancy", "s": "A 62-year-old with metastatic breast cancer is newly confused and lethargic, with vomiting.", "b": "Bone metastases; bedbound for 2 weeks; on hydrochlorothiazide for hypertension; on digoxin.", "a": "Ca²⁺ 14.2 mg/dL; HR 54 with first-degree heart block and shortened QT; dry mucous membranes; urine output 1,800 mL/12 hr; hypoactive reflexes; constipated 5 days.", "r": "I believe this is severe hypercalcemia with digoxin toxicity risk. Please evaluate now. I anticipate IV 0.9% saline, calcitonin, holding the thiazide and possibly digoxin, a digoxin level, and continuous cardiac monitoring."}, "bridge": [["Pathophysiology", "High calcium raises the threshold potential, so nerves and muscles are depressed; bone resorption and kidney effects cause fractures, polyuria, and stones."], ["Med-Surg", "You monitor the heart, hydrate with saline, mobilize, give calcitonin and phosphate as ordered, and watch digoxin clients."]], "drugs": [{"generic": "calcitonin salmon", "brands": ["Miacalcin"], "cls": "Hormone (calcium regulator)", "moa": "Inhibits osteoclast bone resorption and increases urinary excretion of calcium and phosphate, ==lowering serum calcium in about 2 hours== (lasts about 6 to 8 hours).", "indications": ["Hypercalcemia (Med-Surg slides: calcitonin), especially from hyperparathyroidism, immobility, or some cancers", "Useful when the client cannot tolerate a large sodium load (heart disease, kidney injury)"], "dose": [["IM or subcutaneous / intranasal", "Ordered by the provider. Not in the slides or Davis's Drug Guide: look it up. Brunner prefers IM or intranasal because perfusion of subcutaneous tissue is poor in hypercalcemia."]], "assess": {"before": [["Serum calcium", "baseline"], ["==Allergy to salmon or fish==; skin test may be needed (Brunner)", "it is a protein derived from salmon"], ["Emergency equipment available", "systemic allergic reactions"]], "after": [["Serum calcium", "response; resistance can develop (antibodies)"], ["Signs of hypocalcemia (tingling, tetany)", "overcorrection"], ["Allergic reaction", "protein hormone"]]}, "effects": {"common": ["Nausea, flushing", "Injection site reaction", "Nasal irritation (spray)"], "serious": ["**Allergic reaction / anaphylaxis**", "Hypocalcemia with tetany"]}, "avoid": {"contra": ["Allergy to salmon calcitonin"], "interactions": ["Decreases calcium absorption from oral calcium (F&P)"]}, "teach": ["Report flushing, rash, or trouble breathing", "Report tingling or muscle cramps"], "verify": ["dose"]}, {"generic": "sodium and potassium phosphate (oral)", "brands": ["Neutra-Phos", "K-Phos"], "cls": "Phosphate salt", "moa": "Phosphate binds calcium and inhibits its intestinal absorption, increasing calcium deposition in bone; because calcium and phosphate are inversely related, raising phosphate lowers calcium.", "indications": ["Hypercalcemia (Med-Surg slides: phosphate PO or IV), best when phosphate is low and kidneys work (F&P)"], "dose": [["PO", "Ordered by the provider. Not in the slides: look it up in your drug guide. F&P: give only if phosphate < 3 mg/dL and kidney function is normal."]], "assess": {"before": [["Serum phosphate, calcium, creatinine", "avoid soft-tissue calcification"], ["Kidney function", "phosphate accumulates in kidney failure"]], "after": [["Calcium, phosphate, creatinine frequently", "F&P: reduce if phosphate > 4.5 or calcium × phosphate > 60"], ["Signs of hypocalcemia (tetany)", "overcorrection"]]}, "effects": {"common": ["Diarrhea, nausea"], "serious": ["**Soft-tissue (metastatic) calcification** in kidneys, heart, blood vessels", "Hypocalcemia and tetany", "Acute kidney injury and hypotension with IV use (Brunner)"]}, "avoid": {"contra": ["Hyperphosphatemia, kidney failure"], "interactions": ["Calcium and aluminum antacids bind phosphate"]}, "teach": ["Take as directed with water", "Report muscle cramps or tingling"], "verify": ["dose", "names"]}], "procedures": [{"name": "Saline hydration with strict intake and output", "kind": "therapeutic", "indication": "IV 0.9% saline dilutes serum calcium and promotes its renal excretion; it is the ==first priority in acute hypercalcemia==. Strict I&O guards against overload.", "steps": [["Verify the order (solution, rate); use an infusion pump", "F&P: initial 200 to 300 mL/hr, then titrated to urine output 100 to 150 mL/hr"], ["Measure urine output hourly in severe cases", "titration target"], ["Weigh daily; auscultate lungs every few hours", "detect overload"]], "before": [["Baseline lungs, weight, BP, heart failure history, K⁺ and Na⁺", "risk of overload and electrolyte loss"]], "after": [["Monitor K⁺, Na⁺, Mg²⁺ during diuresis", "saline diuresis also loses these"], ["Recheck calcium as ordered", "response"]], "complications": ["Fluid overload, pulmonary edema", "Hypokalemia, hypomagnesemia"], "teach": ["Drink fluids at home as directed (several quarts per day if allowed)"], "verify": ["steps"]}]}, {"id": "hypoMg", "name": "Hypomagnesemia (low Mg²⁺)", "short": "Hypomagnesemia", "group": "Mg²⁺ < 1.5 · more acetylcholine · overexcitable", "cat": "Magnesium Imbalances", "sub": "Low Mg²⁺: more acetylcholine released", "catColor": "#be185d", "color": "#be185d", "pair": "hypoCa", "sig": ["Mg²⁺ < 1.5 mEq/L", "↑ DTRs, tremor", "Chvostek / Trousseau +", "Low K⁺ and Ca²⁺ resist correction"], "hook": "Magnesium normally puts the brakes on acetylcholine at the nerve-muscle junction. Without it, nerves and muscles are overstimulated, and potassium and calcium also fall and refuse to correct until magnesium is replaced.", "patho": {"chain": ["↓ intake or absorption (==chronic alcoholism==, malnutrition, prolonged IV or PN without Mg²⁺, small-bowel resection, malabsorption, chronic diarrhea, pancreatitis), ↑ excretion (diuretics, DKA, aminoglycosides, amphotericin, cisplatin, hyperaldosteronism), or abnormal loss (vomiting, NG suction, fistulas)", "Serum magnesium falls below 1.5 mEq/L (Galen)", "Less Mg²⁺ at the neuromuscular junction → ==more acetylcholine released== → hyperexcitable nerves and muscles", "Na⁺/K⁺ pump activity falls → myocardial K⁺ falls; kidneys waste K⁺; PTH secretion is inhibited → Ca²⁺ falls", "Neuromuscular irritability, dysrhythmias, and coexisting hypokalemia and hypocalcemia"], "compensation": "The kidneys normally conserve magnesium well, and bone releases some stored magnesium, but chronic losses (alcohol, diuretics, GI) outpace them. Because low Mg²⁺ drives renal K⁺ wasting and blocks PTH, the associated low K⁺ and low Ca²⁺ cannot be corrected until Mg²⁺ is replaced.", "tip": "Your Patho slides: magnesium is \"traffic control\" and \"mirrors calcium.\" Too little = chaotic intersections (seizures, tremors, ↑ DTRs, tetany, paresthesias). Rule: **fix Mg before K or Ca.**"}, "manifestations": [["==Neuromuscular irritability==: tremor, twitching, grimacing, muscle cramps, ==hyperactive reflexes==", "extra acetylcholine overstimulates skeletal muscle"], ["==Positive Chvostek and Trousseau signs==, tetany", "hyperexcitability, partly from the accompanying hypocalcemia"], ["Nystagmus, ataxia, dysphagia", "neuromuscular irritability of eye, cerebellar, and swallowing muscles"], ["Seizures", "CNS hyperexcitability"], ["Insomnia, mood changes, apathy, depression, agitation, confusion, hallucinations", "Mg²⁺ has a calming effect on the CNS; losing it causes psychological changes"], ["Cardiac dysrhythmias: PVCs, SVT, torsades de pointes, ventricular fibrillation; increased digoxin toxicity", "Na⁺/K⁺ pump failure lowers myocardial K⁺ and destabilizes the rhythm"], ["Increased blood pressure", "loss of magnesium's vasodilating effect (Med-Surg slides; Brunner)"], ["Anorexia, vomiting", "GI irritability; also part of the cause in many clients"]], "labs": [["Serum magnesium", "==< 1.5 mEq/L== (Galen 1.5 to 2.5); Brunner uses < 1.8 mg/dL"], ["Urine magnesium", "Helps identify renal loss (Med-Surg slides)"], ["ECG", "PVCs, flat or inverted T waves, ST depression, prolonged PR, widened QRS, torsades"], ["K⁺ and Ca²⁺", "==Often low too== (check both)"], ["Albumin", "Low albumin lowers total Mg²⁺ without changing ionized Mg²⁺"]], "risks": [["Chronic alcoholism (major cause)", "Poor intake, poor absorption, increased urinary and fecal loss, vomiting; check Mg²⁺ every 2 to 3 days during alcohol withdrawal (Brunner)"], ["GI", "Diarrhea (lower GI fluid is rich in Mg²⁺), fistulas, NG suction, small-bowel resection, inflammatory bowel disease, malabsorption, pancreatitis"], ["Medications", "Loop and thiazide diuretics, aminoglycosides (gentamicin), amphotericin B, cisplatin, cyclosporine, proton pump inhibitors, digoxin"], ["Nutrition", "Refeeding after starvation, parenteral or enteral nutrition without enough Mg²⁺"], ["Other", "DKA, hyperaldosteronism, critical illness (up to 65% of ICU clients, Brunner)"]], "management": [["Magnesium replacement: ==oral (oxide, gluconate) for mild; IV/IM magnesium sulfate for moderate to severe==", "restores the brake on acetylcholine release and the Na⁺/K⁺ pump"], ["Increase dietary magnesium", "green leafy vegetables, nuts, legumes, whole grains, bananas, oranges, peanut butter"], ["Correct Mg²⁺ before or with K⁺ and Ca²⁺", "otherwise the kidneys keep wasting K⁺ and PTH stays suppressed"], ["Treat the cause (alcohol, diarrhea, diuretics)", "prevents recurrence"]], "nursing": {"assess": [["Cardiac rhythm; digoxin toxicity signs", "torsades and digoxin toxicity are the life threats"], ["DTRs, tremor, Chvostek/Trousseau, swallowing (screen for dysphagia)", "track excitability; aspiration risk"], ["Neuro and mental status", "seizures and confusion"], ["Serum Mg²⁺, K⁺, Ca²⁺", "coexisting deficits"], ["==Urine output before and during IV magnesium==", "magnesium is excreted by the kidneys"]], "act": [["Seizure precautions if severe; aspiration precautions if dysphagic", "hyperexcitable brain; impaired swallowing", 1], ["Cardiac monitoring; report new dysrhythmias", "torsades can be fatal", 1], ["Give IV magnesium sulfate by ==infusion pump with an independent double check==; monitor VS, DTRs, RR, urine output", "overdose has caused death; mg, g, and mEq are not interchangeable", 1], ["Keep calcium gluconate available during IV magnesium", "antidote for hypermagnesemia and treats hypocalcemic tetany", 2], ["Safety precautions for confusion", "fall risk", 2], ["Teach magnesium-rich foods; refer for alcohol use support", "prevents recurrence", 3]], "order": "seizure, airway, and rhythm safety come first; magnesium is then replaced safely (pump, double check, reflexes, urine output), and prevention follows."}, "education": [["Magnesium-rich foods", "green vegetables, nuts, legumes, whole grains, bananas, oranges, peanut butter"], ["Alcohol", "alcohol use is a major cause; offer resources"], ["Oral magnesium", "may cause diarrhea; take as directed"], ["Medications", "diuretics and some antibiotics increase magnesium loss; keep lab appointments"], ["When to seek help", "tremors, muscle twitching, palpitations, confusion, or seizures"]], "complications": ["Seizures", "Torsades de pointes, ventricular fibrillation", "Refractory hypokalemia and hypocalcemia", "Digoxin toxicity", "Aspiration from dysphagia"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Seizure, tetany or laryngeal stridor, new dysrhythmia (especially ==torsades de pointes==), or signs of digoxin toxicity. During IV magnesium: ==absent patellar reflex, RR below 16, hypotension==, or urine output below 100 mL in 4 hours."}, {"type": "book", "label": "Textbook box: Quality and Safety Nursing Alert", "in": "meds", "text": "Inadvertent IV magnesium overdose can cause serious harm and death. Whenever IV magnesium is prescribed, a second nurse independently double-checks the order, the dose calculation, and the pump settings; milligrams, grams, and milliequivalents are not equivalent.", "source": "Brunner Ch. 10, Quality and Safety Nursing Alert, p. 256"}, {"type": "good", "label": "Look-alike: hypomagnesemia vs. hypocalcemia", "text": "Both cause **tetany, Chvostek, Trousseau, ↑ DTRs, seizures**. Clues for Mg²⁺: alcoholism, diuretics, diarrhea, refeeding; tremor, nystagmus, insomnia; hypokalemia that will not correct; tetany that does not respond to calcium."}], "sbar": {"title": "Applying SBAR: hypomagnesemia in alcohol withdrawal", "s": "A 52-year-old admitted for alcohol withdrawal has coarse tremors, twitching, and new runs of PVCs.", "b": "Daily heavy alcohol use for years; poor intake; on IV D5W; furosemide for edema.", "a": "Mg²⁺ 1.1 mEq/L, K⁺ 3.0 despite two KCl doses, Ca²⁺ 8.4; positive Chvostek; hyperactive reflexes; nystagmus; QT prolonged; urine output 50 mL/hr.", "r": "I believe he has significant hypomagnesemia that is keeping the potassium low. Please evaluate; I anticipate IV magnesium sulfate by pump with an independent double check, then recheck K⁺ and Ca²⁺. I have started seizure precautions and continuous monitoring."}, "bridge": [["Pathophysiology", "Low Mg²⁺ removes the brake on acetylcholine release and weakens the Na⁺/K⁺ pump, so muscles are hyperexcitable and K⁺ and Ca²⁺ fall."], ["Med-Surg", "You check reflexes, rhythm, and swallowing, replace magnesium safely with a double check, and replace it before expecting K⁺ or Ca²⁺ to correct."]], "drugs": [{"generic": "magnesium sulfate", "brands": ["No common brand (generic)"], "cls": "Electrolyte replacement (mineral); CNS and neuromuscular depressant", "moa": "Replaces magnesium, restoring its suppression of acetylcholine release at the neuromuscular junction and supporting the Na⁺/K⁺ pump; depresses CNS and smooth, skeletal, and cardiac muscle.", "indications": ["==Moderate to severe hypomagnesemia== (Med-Surg slides: magnesium replacement)", "Torsades de pointes; seizures of eclampsia (other units)"], "dose": [["IM, IV (adults), Davis", "Severe deficiency: 8 to 12 g/day in divided doses; mild deficiency: 1 g every 6 hr for 4 doses, or 250 mg/kg over 4 hr"], ["IV push (Davis)", "Dilute to ≤ 20%; no faster than 150 mg/min (rapid → hypotension, asystole)"], ["Parenteral nutrition (Davis)", "4 to 24 mEq/day"]], "assess": {"before": [["Serum Mg²⁺ and kidney function", "excreted by kidneys; contraindicated in impaired kidney function (F&P)"], ["==Patellar reflex== present", "absent reflex = do not give (toxicity)"], ["Respirations at least 16/min (Davis)", "respiratory depression is a toxicity sign"], ["BP, ECG", "baseline"], ["Independent double check", "high-alert medication"]], "after": [["DTRs before each dose", "loss of reflexes is the first sign of toxicity"], ["RR, BP, ECG frequently", "respiratory depression, hypotension, heart block"], ["Urine output ≥ 100 mL/4 hr (Davis, Brunner)", "ensures excretion"], ["Serum Mg²⁺", "therapeutic on therapy: 3.3 to 6.6 mEq/L (Galen)"]]}, "effects": {"common": ["Flushing, warmth, sweating", "Diarrhea (oral forms)"], "serious": ["**Hypermagnesemia**: loss of DTRs, **respiratory depression**, hypotension, heart block, **cardiac arrest**", "Hypocalcemia worsened (sulfate binds calcium, Brunner)"]}, "avoid": {"contra": ["Impaired kidney function, heart block, coma (F&P)"], "interactions": ["CNS depressants (opioids, sedatives) add to depression", "Neuromuscular blockers potentiated", "Antidote: calcium gluconate at the bedside"]}, "teach": ["Report flushing, weakness, drowsiness, or trouble breathing", "Eat magnesium-rich foods"], "verify": ["names"]}], "procedures": [{"name": "IV magnesium sulfate administration with an independent double check", "kind": "therapeutic", "indication": "Replaces magnesium in moderate to severe deficiency while preventing fatal overdose.", "steps": [["Second nurse ==independently verifies== order, dose calculation (mg vs g vs mEq), concentration, and pump settings", "magnesium dose errors have killed clients"], ["Infuse by pump only", "controls rate"], ["Check patellar reflex, RR, BP, and ECG before and during", "detects toxicity early"], ["Keep calcium gluconate at the bedside", "antidote"]], "before": [["Confirm urine output and kidney function", "magnesium is renally excreted"], ["Baseline DTRs, RR, BP, Mg²⁺", "comparison"]], "after": [["Recheck Mg²⁺, K⁺, Ca²⁺", "response and coexisting deficits"], ["Continue reflex and respiratory checks", "delayed toxicity"]], "complications": ["Absent reflexes, RR < 16, hypotension, heart block (stop infusion, notify)", "Flushing and diaphoresis"], "teach": ["Report warmth, weakness, or breathing difficulty"], "during": [["DTRs and RR per protocol", "toxicity appears in reflexes before breathing"]], "verify": ["steps"]}]}, {"id": "hyperMg", "name": "Hypermagnesemia (high Mg²⁺)", "short": "Hypermagnesemia", "group": "Mg²⁺ > 2.5 · less acetylcholine · depressed", "cat": "Magnesium Imbalances", "sub": "High Mg²⁺: less acetylcholine released", "catColor": "#be185d", "color": "#0f766e", "pair": "hypoMg", "sig": ["Mg²⁺ > 2.5 mEq/L", "↓ / absent DTRs", "Resp depression", "Hypotension, flushing"], "hook": "Too much magnesium blocks acetylcholine release, so the neuromuscular system goes quiet: reflexes fade, muscles go limp, breathing slows, blood vessels dilate, and the heart can block and stop.", "patho": {"chain": ["==↓ excretion (oliguric kidney injury or chronic kidney disease, the most common cause)== and/or ↑ intake (==magnesium antacids and laxatives==, excessive IV magnesium, seawater ingestion); also adrenal insufficiency", "Serum magnesium rises above 2.5 mEq/L (Galen)", "Excess Mg²⁺ suppresses acetylcholine release at neuromuscular junctions and depresses the CNS", "Vascular smooth muscle relaxes (vasodilation); cardiac conduction slows", "Depressed reflexes, flaccid paralysis, respiratory depression, hypotension, bradycardia, heart block, cardiac arrest"], "compensation": "Healthy kidneys excrete magnesium very efficiently, so hypermagnesemia is rare unless kidney function is impaired or a large dose is given. Older adults absorb more from antacids and laxatives and excrete less.", "tip": "Your slides: too much traffic control = traffic jams (respiratory depression, hypotension, ↓ DTRs). Reflexes go first, then breathing (Brunner: respiratory center depressed above about 10 mEq/L)."}, "manifestations": [["==Decreased or absent deep tendon reflexes==", "less acetylcholine at the neuromuscular junction (the earliest objective sign)"], ["Muscle weakness, ==flaccid paralysis==", "neuromuscular transmission blocked"], ["Lethargy, drowsiness, coma", "CNS depression"], ["==Respiratory depression==", "respiratory muscles weaken and the respiratory center is depressed"], ["Hypotension, flushing, diaphoresis, warmth", "peripheral vasodilation"], ["Bradycardia, heart block, dysrhythmias, cardiac arrest", "decreased cardiac conduction and membrane excitability"], ["Nausea, vomiting", "GI smooth muscle and CNS effects"]], "labs": [["Serum magnesium", "==> 2.5 mEq/L== (Galen 1.5 to 2.5; therapeutic on Mg therapy 3.3 to 6.6)"], ["Serum K⁺ and Ca²⁺", "Often increased concurrently (Brunner); check both (Med-Surg slides)"], ["ECG", "Prolonged PR, widened QRS, tall T waves, prolonged QT, AV block"], ["BUN and creatinine", "Kidney function is usually the cause"], ["False elevation", "Hemolyzed sample or a too-tight tourniquet"]], "risks": [["Kidney disease", "Oliguric acute kidney injury and chronic end-stage kidney disease, especially with magnesium-containing medications"], ["Medications", "Magnesium antacids and laxatives (milk of magnesia, magnesium citrate), excessive IV magnesium sulfate (pregnancy hypertension, overcorrection)"], ["Other", "Untreated DKA (cell breakdown with oliguria), adrenal insufficiency, hypothyroidism, lithium toxicity, extensive tissue injury, slowed GI motility (opioids)"], ["Older adults", "Higher risk from regular antacid or laxative use (absorb more, excrete less)"]], "management": [["==Stop all magnesium sources== (supplements, antacids, laxatives, IV)", "removes the source"], ["IV calcium gluconate in emergencies", "calcium antagonizes magnesium's neuromuscular and cardiovascular effects"], ["Isotonic IV fluids (0.9% NaCl or LR) with loop diuretics (furosemide) if kidneys work", "promotes renal magnesium excretion"], ["Ventilatory support for respiratory depression", "protects oxygenation until Mg²⁺ falls"], ["Hemodialysis with magnesium-free dialysate", "fastest removal when kidneys have failed"]], "nursing": {"assess": [["==Respiratory rate and depth==, oxygen saturation", "respiratory depression is the life threat"], ["==Deep tendon reflexes (patellar)==", "the earliest objective sign; guides severity (Med-Surg slides)"], ["BP, heart rate, ECG", "hypotension, bradycardia, heart block"], ["Level of consciousness", "CNS depression"], ["I&O, kidney function", "excretion route"]], "act": [["Support airway and breathing; prepare for ventilatory support", "respiratory depression can be fatal", 1], ["Give IV calcium gluconate as ordered with cardiac monitoring", "immediately antagonizes magnesium", 1], ["Stop magnesium-containing medications and IV fluids; clarify orders", "removes the source", 1], ["Give fluids and furosemide as ordered; monitor I&O; prepare for dialysis", "removes the excess", 2], ["Fall and safety precautions", "weakness and drowsiness", 2], ["Teach to avoid OTC magnesium products with kidney disease", "prevents recurrence", 3]], "order": "breathing and cardiac conduction come first, with calcium as the immediate antidote; then the source is removed and excretion is increased."}, "education": [["Kidney disease", "avoid magnesium-containing antacids, laxatives, and supplements (milk of magnesia, magnesium citrate, Maalox); check with the provider before any OTC product"], ["Older adults", "regular antacid or laxative use can cause toxicity"], ["When to seek help", "unusual weakness, drowsiness, flushing, slow breathing, or a slow heartbeat"]], "complications": ["Respiratory arrest", "Complete heart block and cardiac arrest", "Coma", "Flaccid paralysis", "Bleeding tendency (platelet clumping, delayed thrombin, Brunner)"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "==Absent deep tendon reflexes, respiratory rate below 12 (or below 16 on magnesium therapy per Davis), hypotension, bradycardia or heart block==, or decreasing level of consciousness."}, {"type": "good", "label": "Reflexes are your magnesium gauge", "text": "Low Mg²⁺ → **hyperactive** reflexes; high Mg²⁺ → **diminished to absent** reflexes. ==Check the patellar reflex before each magnesium dose.=="}, {"type": "watch", "label": "Older adults (USLO 1)", "text": "An older adult with reduced kidney function who takes milk of magnesia nightly is a classic hypermagnesemia setup. Ask about **every OTC antacid and laxative**."}], "sbar": {"title": "Applying SBAR: hypermagnesemia in kidney failure", "s": "A 79-year-old with chronic kidney disease is very drowsy with slow, shallow breathing.", "b": "CKD stage 4; has taken magnesium hydroxide nightly for constipation and a magnesium-containing antacid several times a day for 2 weeks.", "a": "RR 9, SpO₂ 90%; BP 86/50; HR 48; patellar reflexes absent; skin flushed and warm; Mg²⁺ 7.9 mEq/L; creatinine 3.4.", "r": "This is severe hypermagnesemia with respiratory depression. Please come now / rapid response. I anticipate IV calcium gluconate, airway support, stopping all magnesium products, and nephrology for urgent dialysis. She is on continuous monitoring with oxygen applied."}, "bridge": [["Pathophysiology", "Excess Mg²⁺ blocks acetylcholine release and depresses the CNS and cardiac conduction, so reflexes, breathing, BP, and heart rate fall."], ["Med-Surg", "You check reflexes and respirations, give calcium as the antidote, stop magnesium sources, and support excretion with fluids, diuretics, or dialysis."]], "drugs": [{"generic": "calcium gluconate", "brands": ["No common brand (generic)"], "cls": "Electrolyte (calcium salt); magnesium antagonist", "moa": "Calcium ==directly antagonizes the neuromuscular and cardiovascular effects of magnesium==, restoring transmission and conduction within minutes while magnesium is removed.", "indications": ["==Severe hypermagnesemia== with respiratory depression or cardiac conduction problems (Med-Surg slides: IV calcium gluconate)"], "dose": [["IV (adults), Davis", "Hypermagnesemia: 7 mEq"], ["Administration (Brunner)", "Slow IV, diluted, by pump, with cardiac monitoring; not with 0.9% NaCl"]], "assess": {"before": [["ECG and heart rate", "baseline conduction"], ["Digoxin use", "calcium increases digoxin toxicity"], ["IV patency", "extravasation causes necrosis"]], "after": [["RR, DTRs, BP, LOC", "therapeutic response"], ["ECG; stop for bradycardia", "rapid calcium can cause arrest"], ["IV site", "infiltration"]]}, "effects": {"common": ["Warmth, tingling, chalky taste"], "serious": ["**Bradycardia, dysrhythmias** with rapid infusion", "Hypotension", "Tissue necrosis if it infiltrates", "Hypercalcemia"]}, "avoid": {"contra": ["Hypercalcemia; digoxin toxicity (caution)"], "interactions": ["Digoxin: ↑ toxicity", "Precipitates with phosphate and bicarbonate"]}, "teach": ["Report burning at the IV site or palpitations"], "verify": ["names"]}, {"generic": "furosemide", "brands": ["Lasix"], "cls": "Loop diuretic", "moa": "Blocks sodium and chloride reabsorption in the loop of Henle and increases renal excretion of magnesium (and calcium, potassium) when kidneys can respond.", "indications": ["Hypermagnesemia with adequate kidney function, given with isotonic IV fluids (Med-Surg slides: loop diuretics)"], "dose": [["IM, IV (adults), Davis", "20 to 40 mg; may repeat in 1 to 2 hr and increase by 20 mg until response"], ["IV push", "Over 1 to 2 minutes (F&P); high doses no faster than 4 mg/min"]], "assess": {"before": [["Kidney function and urine output", "ineffective without urine output (anuria is a contraindication)"], ["K⁺, Na⁺, Ca²⁺", "the drug wastes them too"], ["BP", "hypotension is already a risk"]], "after": [["Mg²⁺ trend, urine output", "response"], ["K⁺ and BP", "hypokalemia, hypotension"], ["Hearing", "ototoxicity"]]}, "effects": {"common": ["Frequent urination", "Dizziness"], "serious": ["**Hypokalemia**, hypovolemia, **hypotension**", "Ototoxicity"]}, "avoid": {"contra": ["Anuria; sulfonamide cross-sensitivity"], "interactions": ["Aminoglycosides ↑ ototoxicity", "Digoxin: low K⁺ ↑ toxicity"]}, "teach": ["Rise slowly", "Report ringing in the ears or muscle weakness"]}], "procedures": [{"name": "Deep tendon reflex (patellar) assessment", "kind": "monitoring", "indication": "Reflexes are the bedside gauge of magnesium: ==diminished or absent reflexes are the earliest sign of toxicity== and must be checked before each magnesium dose.", "steps": [["Position the client sitting with legs dangling or supine with the knee supported and slightly flexed", "relaxed muscle gives a true reflex"], ["Strike the patellar tendon briskly just below the kneecap", "stretches the quadriceps tendon"], ["Observe and grade the knee extension (0 absent to 4+ hyperactive with clonus)", "standard scale"], ["Compare both sides and to the previous result", "trend"]], "before": [["Ask the client to relax; distract if needed (clench teeth)", "tension dampens reflexes"]], "after": [["Report absent (0) reflexes and hold magnesium", "toxicity"], ["Report new hyperreflexia or clonus", "low Mg²⁺ or Ca²⁺"]], "complications": ["Absent reflexes with respiratory depression"], "teach": ["Explain why reflexes are checked repeatedly"], "verify": ["steps"]}, {"name": "Hemodialysis (for severe hypermagnesemia)", "kind": "therapeutic", "indication": "Removes magnesium quickly with a magnesium-free dialysate when kidneys have failed or toxicity is severe.", "steps": [["Confirm vascular access is functional", "needs high blood flow"], ["Dialysis nurse runs treatment with magnesium-free dialysate", "Mg²⁺ diffuses into the dialysate"]], "before": [["Vital signs, weight, labs, access check", "baseline"]], "after": [["Vital signs, reflexes, Mg²⁺", "response"], ["Access site: no BP or draws in the fistula arm; thrill and bruit", "protects the access"]], "complications": ["Hypotension", "Bleeding or infection at the access"], "teach": ["Avoid magnesium-containing OTC products between treatments"], "verify": ["steps", "after", "teach"], "aka": "Dialysis"}]}, {"id": "hypoPhos", "name": "Hypophosphatemia (low PO₄)", "short": "Hypophosphatemia", "group": "Phosphate < 2 (Galen) · ATP shortage · power plant failing", "cat": "Phosphate Imbalances", "sub": "Low phosphate: ATP and 2,3-BPG shortage", "catColor": "#92400e", "color": "#92400e", "pair": "hyperPhos", "sig": ["Phosphate ↓", "Profound weakness", "Resp failure", "Refeeding risk"], "hook": "Phosphate is the raw material for ATP and for 2,3-BPG, which helps hemoglobin release oxygen. When it falls, cells run out of energy and tissues starve for oxygen: muscles (including the diaphragm and heart) weaken, red cells break, and the brain fails.", "patho": {"chain": ["==Shift into cells (refeeding after starvation, TPN, insulin, IV glucose, respiratory alkalosis from hyperventilation)==, ↓ intake or absorption (==chronic alcoholism==, chronic diarrhea, malabsorption, phosphate-binding antacids, vitamin D deficiency), or ↑ excretion (alcohol withdrawal, DKA, diuretics, hyperparathyroidism)", "Serum phosphate falls (Galen sheet: below 2; textbooks: below 2.5 to 2.7 mg/dL); severe below 1 to 1.5 mg/dL", "Cells cannot make enough ATP; red cells lose 2,3-BPG and hold on to oxygen", "Muscle cells (skeletal, diaphragm, heart) weaken and break down; red cells hemolyze; white cells and platelets malfunction; neurons fail", "Generalized energy failure: weakness, respiratory failure, heart failure, confusion, seizures"], "compensation": "PTH falls and the kidneys reabsorb more phosphate; bone releases some phosphate. Compensation is overwhelmed when a malnourished client with depleted stores suddenly receives carbohydrates: insulin surges and drives phosphate into cells (refeeding).", "tip": "Your Patho slides: phosphate is the \"power plant\"; too little = rolling blackouts (weakness, impaired oxygen delivery). Symptoms resemble **hypercalcemia** (calcium and phosphate are inversely related)."}, "manifestations": [["==Muscle weakness==, muscle aches, bone pain and tenderness, rhabdomyolysis", "ATP deficiency in skeletal muscle; calcium-phosphate bone changes (osteomalacia)"], ["==Respiratory failure==", "weak diaphragm and intercostal muscles"], ["Chest pain, ==cardiomyopathy==, decreased left heart function, dysrhythmias", "ATP-starved cardiac muscle contracts poorly"], ["Paresthesias, diminished reflexes", "nerve energy failure"], ["Confusion, apprehension, stupor, seizures, coma, nystagmus", "neurons lack ATP and oxygen delivery is impaired"], ["Hemolysis", "red cells without ATP lose membrane integrity"], ["Increased risk of infection", "white blood cells cannot generate energy to fight bacteria"], ["Anorexia, malaise", "generalized cellular energy deficit"]], "labs": [["Serum phosphate", "==Below normal (Galen sheet 2 to 4.5 mEq/L; slides and textbooks 2.5 to 4.5 mg/dL)=="], ["X-rays and bone density", "Reduced mineralization (osteomalacia) (Med-Surg slides)"], ["Calcium, magnesium, potassium", "Often abnormal together, especially in refeeding"], ["Glucose and insulin therapy", "Lower phosphate (shift into cells)"]], "risks": [["Refeeding after starvation", "Anorexia nervosa, alcoholism, debilitated older adults, cancer cachexia, starting TPN or tube feeding too aggressively"], ["Alcoholism", "Poor intake, vomiting, alcohol withdrawal (renal loss)"], ["GI", "Chronic diarrhea, malabsorption, celiac, Crohn's, phosphate-binding antacids (aluminum, calcium, magnesium)"], ["Shifts", "Respiratory alkalosis (hyperventilation), insulin (DKA treatment), IV glucose, epinephrine"], ["Renal loss", "Diuretics, DKA, hyperparathyroidism, burns (diuretic phase)"]], "management": [["Prevent: ==start nutrition slowly== in malnourished clients and add phosphate to PN", "avoids the insulin-driven shift into cells"], ["Oral phosphate supplements and phosphate-rich foods for mild deficit", "dairy, meats, beans replace stores"], ["IV phosphorus (sodium or potassium phosphate) for severe deficit (Med-Surg slides)", "rapid replacement when < 1 mg/dL or symptomatic"], ["Treat the cause; vitamin D if deficient", "vitamin D enhances absorption of phosphate and calcium"]], "nursing": {"assess": [["==Respiratory effort==, rate, depth, oxygen saturation", "diaphragm weakness can cause respiratory failure"], ["Muscle strength, cardiac function, rhythm", "ATP deficit in skeletal and cardiac muscle"], ["Neuro status (apprehension, confusion, LOC)", "early signs to report (Brunner)"], ["Serum phosphate, calcium, magnesium, K⁺, glucose", "during refeeding and replacement"], ["Signs of infection", "impaired white cell function"]], "act": [["Monitor breathing; prepare to support ventilation if weakening", "respiratory failure is the life threat", 1], ["Give IV phosphate by pump at the ordered rate (Brunner: not above 3 mmol/hr); check the site", "rapid phosphate causes hypocalcemia and calcification; infiltration causes necrosis", 1], ["Monitor serum calcium and phosphate ==every 6 hours== during IV therapy (Brunner)", "phosphate replacement drops calcium", 2], ["Introduce PN or feedings gradually in malnourished clients", "prevents refeeding shifts", 2], ["Decrease exposure to infection (hand hygiene, aseptic line care) (Med-Surg slides)", "impaired immunity", 2], ["Fall precautions; teach phosphate-rich foods and antacid limits", "weakness and prevention", 3]], "order": "breathing comes first because the diaphragm can fail; then phosphate is replaced safely without dropping calcium; infection and fall prevention protect the weakened client."}, "education": [["Phosphate-rich foods", "milk and dairy, organ meats, beans, nuts, fish, poultry, whole grains"], ["Antacids", "avoid long-term use of phosphate-binding antacids unless prescribed"], ["Alcohol", "a major risk factor; offer resources"], ["When to seek help", "severe weakness, trouble breathing, confusion, or fever"]], "complications": ["Respiratory failure", "Heart failure (cardiomyopathy) and dysrhythmias", "Seizures and coma", "Hemolytic anemia", "Rhabdomyolysis", "Infection", "Hypocalcemia and tissue calcification from IV replacement"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Labored or shallow breathing, falling oxygen saturation, new confusion or seizure, chest pain, or signs of heart failure, especially in a ==malnourished client who has just started feeding or PN==."}, {"type": "book", "label": "Textbook box: Refeeding", "in": "risk", "text": "Brunner: feeding a nutritionally deprived client triggers a large insulin release that ==shifts phosphate into cells==; marked hypophosphatemia can follow PN without enough phosphorus. Prevention is introducing calories gradually and monitoring phosphate, magnesium, and potassium.", "source": "Brunner Ch. 10, pp. 256 to 257; Ch. 41, pp. 1314 to 1315"}, {"type": "good", "label": "Link to your slides", "text": "Hypophosphatemia looks like hypercalcemia (weakness, ↓ reflexes) and hyperphosphatemia looks like hypocalcemia (tetany), because calcium and phosphate move in opposite directions."}], "figures": [{"title": "How refeeding causes hypophosphatemia", "in": "path", "source": "Banasik Ch. 24, p. 546; Brunner Ch. 10 and Ch. 41 (redrawn)", "steps": ["Starvation depletes total-body phosphate (serum may look normal)", "Carbohydrate (feeding, PN, IV glucose) is given", "Insulin surges; cells take up glucose and phosphate to make ATP", "Serum phosphate crashes → weakness, respiratory failure, heart failure"], "caption": "Start slow and monitor phosphate, magnesium, and potassium when feeding a malnourished client."}], "sbar": null, "bridge": [["Pathophysiology", "Low phosphate means too little ATP and 2,3-BPG, so muscles (including diaphragm and heart) fail and tissues get less oxygen."], ["Med-Surg", "You watch breathing and the heart, start feedings slowly in malnourished clients, replace phosphate by pump, and check calcium every 6 hours during IV therapy."]], "drugs": [{"generic": "potassium phosphate (IV)", "brands": ["No common brand (generic)", "Sodium phosphate (IV) is an alternative"], "cls": "Electrolyte replacement (phosphate salt)", "moa": "Supplies phosphate for ATP and 2,3-BPG production, restoring muscle, respiratory, cardiac, and red cell function.", "indications": ["==Severe hypophosphatemia== (Brunner: usually < 1 mg/dL or symptomatic) (Med-Surg slides: IV phosphorus)", "Phosphate in parenteral nutrition"], "dose": [["IV", "Ordered by the provider. Brunner: rate ==not to exceed 3 mmol/hr==. Not in the slides; look up the dose in your drug guide."]], "assess": {"before": [["Serum phosphate, calcium, K⁺ (potassium salt), kidney function", "replacement drops calcium; K⁺ salt adds potassium"], ["IV site patency", "tissue sloughing with infiltration"]], "after": [["Calcium and phosphate every 6 hours (Brunner)", "detects hypocalcemia and overcorrection"], ["Tetany, Chvostek/Trousseau", "hypocalcemia"], ["IV site", "necrosis with infiltration"]]}, "effects": {"common": ["Vein irritation"], "serious": ["**Hypocalcemia and tetany**", "**Soft-tissue calcification** (vessels, heart, lungs, kidneys, eyes)", "Hyperkalemia (potassium salt)", "Hyperphosphatemia"]}, "avoid": {"contra": ["Hyperphosphatemia, hypocalcemia, kidney failure; hyperkalemia (potassium salt)"], "interactions": ["Do not mix with calcium-containing solutions (precipitate)"]}, "teach": ["Report tingling, muscle cramps, or burning at the IV site"], "verify": ["dose", "names"]}], "procedures": [{"name": "Parenteral nutrition (PN/TPN) initiation and central line care", "kind": "therapeutic", "indication": "PN supplies calories and phosphate to malnourished clients, but ==starting it too fast causes refeeding hypophosphatemia==. Central line care prevents CLABSI.", "steps": [["Verify the bag against the order with two identifiers; inspect for a cracked (oily) solution or white crystals", "do not hang a damaged or precipitated solution"], ["Use the correct filter (0.22 micron for dextrose/amino acid; 1.2 micron for lipids or 3-in-1)", "removes particulates and precipitates"], ["Confirm central line tip placement by x-ray before first use", "rules out malposition and pneumothorax"], ["Start at a low rate and advance gradually as ordered, by infusion pump", "prevents hyperglycemia and refeeding shifts"], ["Scrub the hub 15 seconds before every access; never use the PN lumen for other purposes", "prevents infection"]], "before": [["Baseline weight, glucose, electrolytes including phosphate, magnesium,
