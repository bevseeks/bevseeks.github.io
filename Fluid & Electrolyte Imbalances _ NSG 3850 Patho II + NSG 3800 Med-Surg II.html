ciprocal relationship)", "Low ionized calcium → neuromuscular hyperexcitability; high calcium × phosphate product → crystals precipitate in soft tissue", "Signs of hypocalcemia plus metastatic (soft-tissue) calcification"], "compensation": "Low calcium stimulates PTH, which pulls calcium from bone and tells healthy kidneys to excrete phosphate. In CKD the kidneys cannot respond, so PTH keeps releasing calcium and phosphate from bone, raising the calcium-phosphate product and the risk of calciphylaxis (calcium-phosphate deposits with skin ulceration, Patho slide notes).", "tip": "Your slides: too much phosphate = \"pollution backup\" (hypocalcemia, tetany). Symptoms are similar to hypocalcemia."}, "manifestations": [["==Tetany==, muscle cramps, hyperactive reflexes, paresthesias, positive Chvostek/Trousseau", "phosphate binds calcium, lowering ionized calcium (same signs as hypocalcemia)"], ["Tachycardia", "hyperexcitability and low calcium effects on the heart"], ["Anorexia, nausea, vomiting", "GI effects; common with kidney failure"], ["==Soft-tissue calcifications== in lungs, heart, kidneys, cornea, arteries", "calcium-phosphate product exceeds solubility and precipitates"], ["==Pruritus (itching)==", "calcium-phosphate crystals in the skin (Patho slide notes)"], ["Aching, stiff joints", "crystal deposits in joints"], ["Conjunctivitis", "crystals deposit in the conjunctiva"], ["Decreased urine output, impaired vision, palpitations (long term)", "calcification in kidneys, eyes, heart (Brunner)"]], "labs": [["Serum phosphate", "==> 4.5== (Galen 2 to 4.5 mEq/L; textbooks > 4.5 mg/dL)"], ["Serum calcium", "↓ (reciprocal); useful for diagnosis and treatment response"], ["BUN, creatinine", "Kidney function (usual cause)"], ["PTH", "↓ in hypoparathyroidism; ↑ in CKD (secondary hyperparathyroidism)"], ["X-rays", "Skeletal changes, soft-tissue calcification (Med-Surg slides)"]], "risks": [["Kidney failure", "Chronic kidney disease (hyperphosphatemia appears at about 40 to 50% loss of function, Brunner) and oliguric acute kidney injury"], ["Intake", "Phosphate-containing laxatives and enemas, excessive phosphate supplements, vitamin D excess, PN"], ["Cell breakdown", "Chemotherapy (tumor lysis syndrome), crush injury, rhabdomyolysis, hemolysis"], ["Other", "Hypoparathyroidism, acidosis, DKA, adrenal insufficiency"]], "management": [["==Treat the underlying cause== (Med-Surg slides)", "correcting kidney function, acidosis, or volume depletion can normalize phosphate"], ["Phosphate binders with meals (calcium acetate or carbonate; sevelamer, lanthanum) (Brunner)", "bind dietary phosphate in the gut so it leaves in the stool"], ["Low-phosphorus diet", "less intake"], ["Loop or saline diuresis if kidneys work; hemodialysis in kidney failure", "removes phosphate"]], "nursing": {"assess": [["Signs of hypocalcemia: tetany, Chvostek/Trousseau, laryngospasm, seizures", "the immediate danger comes from low calcium"], ["Serum phosphate and calcium", "track the reciprocal relationship"], ["==Urine output== (Med-Surg slides) and kidney function", "kidneys are the main exit"], ["Skin (itching, ulcers), eyes, joints", "soft-tissue calcification"], ["Heart rate and rhythm", "tachycardia and hypocalcemia-related dysrhythmias"]], "act": [["Airway and seizure precautions if hypocalcemic signs appear; report", "tetany and laryngospasm can be life-threatening", 1], ["Give phosphate binders ==with meals== as ordered; monitor calcium when using calcium-based binders", "binders work only when food is present; calcium binders can cause hypercalcemia", 2], ["Avoid phosphate-containing enemas and laxatives (Med-Surg slides); clarify such orders", "they add phosphate", 2], ["Monitor urine output during diuresis; prepare for dialysis", "removal route", 2], ["Teach the low-phosphorus diet and signs of hypocalcemia", "prevention and early reporting", 3]], "order": "the airway and neuromuscular danger from low calcium comes first; then intake is reduced and removal is supported; teaching sustains it."}, "education": [["Low-phosphorus diet (if ordered)", "limit hard cheeses, cream, nuts, meats, whole-grain cereals, dried fruits and vegetables, organ meats, sardines, dairy, and many processed foods and colas"], ["Phosphate binders", "take with every meal and snack as prescribed"], ["Avoid phosphate laxatives and enemas (Fleet Phospho-Soda, Fleet enemas)", "they raise phosphate, especially with kidney disease"], ["When to seek help", "muscle cramps, tingling, spasms, or severe itching"]], "complications": ["Hypocalcemic tetany, laryngospasm, seizures", "Metastatic calcification: arteries (MI, stroke, peripheral arterial disease), heart, lungs, kidneys, eyes", "Calciphylaxis (skin necrosis)", "Renal osteodystrophy (bone disease in CKD)"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Tetany, carpopedal spasm, stridor or laryngospasm, seizure, or a sharp fall in serum calcium."}, {"type": "watch", "label": "Dangerous mistake", "text": "Giving a **phosphate-containing enema** (for example, a Fleet enema) or Fleet Phospho-Soda to a client with kidney failure. ==Clarify the order==; your slides list avoiding enemas and laxatives as a key intervention."}, {"type": "info", "label": "SOAPIE (chronic: CKD with hyperphosphatemia)", "text": "**S**: \"My skin itches all the time and my legs cramp at night.\" **O**: phosphate 7.2, calcium 8.1, creatinine 4.6; scratch marks. **A**: hyperphosphatemia from decreased renal excretion with secondary hypocalcemia. **P**: calcium acetate with meals, low-phosphorus diet, dietitian referral. **I**: binder timing taught; client identified high-phosphorus foods. **E**: phosphate 5.6 at 2 weeks; fewer cramps."}], "sbar": null, "bridge": [["Pathophysiology", "Excess phosphate binds calcium (hypocalcemia) and precipitates as calcium phosphate in soft tissues, mostly because failing kidneys cannot excrete it."], ["Med-Surg", "You watch for hypocalcemic signs, give binders with meals, avoid phosphate enemas and laxatives, monitor urine output, and teach a low-phosphorus diet."]], "drugs": [{"generic": "calcium acetate", "brands": ["PhosLo"], "cls": "Phosphate binder (calcium salt)", "moa": "Binds dietary phosphate in the gut to form insoluble calcium phosphate that leaves in the stool, ==lowering serum phosphate==; also supplies calcium.", "indications": ["Hyperphosphatemia in chronic kidney disease (Brunner, F&P; your Med-Surg slides list only \"treat underlying cause\")"], "dose": [["PO (adults), Davis", "1,334 mg with each meal; may increase gradually (in absence of hypercalcemia) to target phosphate (usual 2,001 to 2,668 mg with each meal)"]], "assess": {"before": [["Serum phosphate and calcium", "baseline; calcium binders can cause hypercalcemia"], ["Timing of meals", "must be taken with food"]], "after": [["Phosphate and calcium regularly", "response and hypercalcemia"], ["Constipation, nausea", "GI effects"]]}, "effects": {"common": ["Constipation, nausea"], "serious": ["**Hypercalcemia** (confusion, weakness, constipation, dysrhythmias)"]}, "avoid": {"contra": ["Hypercalcemia"], "interactions": ["Separate from tetracyclines, fluoroquinolones, iron (calcium binds them)", "Digoxin: hypercalcemia ↑ toxicity"]}, "teach": ["==Take with every meal==", "Report nausea, constipation, confusion, or weakness"], "verify": ["names", "indications"]}], "procedures": [{"name": "Phosphate binder administration with meals", "kind": "therapeutic", "indication": "Binders lower phosphate only by trapping phosphate from food, so ==timing with meals is the whole intervention==.", "steps": [["Give the binder with the meal or immediately before/after as ordered", "binder must be in the gut with the food phosphate"], ["Match binder doses to meals and snacks per the order", "each phosphate load needs a binder"], ["Separate interacting oral medications", "binders also bind some drugs"]], "before": [["Check phosphate and calcium", "baseline and hypercalcemia risk"]], "after": [["Monitor phosphate, calcium, bowel pattern", "response and constipation"]], "complications": ["Hypercalcemia with calcium-based binders", "Constipation or impaction"], "teach": ["Take with food every time; never on an empty stomach", "Carry doses for meals away from home"], "verify": ["steps"]}]}], "selfChecks": [{"id": "sc-vol-conc", "after": "hypov", "prompt": "Your client has a sudden 2 kg weight loss, flat neck veins, and orthostatic hypotension, but a serum sodium of 140. Explain why this is a volume problem and not a sodium (concentration) problem.", "model": "Sodium and water were lost together in the same proportion as normal body fluid (isotonic saline), so the amount of extracellular fluid is smaller but its concentration is normal. That is why the weight, neck veins, and blood pressure change while the serum sodium stays normal. A concentration problem would show an abnormal serum sodium and brain signs.", "keys": [{"label": "salt and water lost together (isotonic/saline)", "any": ["together", "same proportion", "isotonic", "saline", "salt and water", "sodium and water"]}, {"label": "amount/volume of ECF is low", "any": ["volume", "amount", "less fluid", "smaller", "ecf"]}, {"label": "concentration stays normal, so Na⁺ normal", "any": ["concentration", "normal sodium", "sodium normal", "na normal", "140"]}, {"label": "concentration problems change Na⁺ and the brain", "any": ["brain", "neuro", "abnormal sodium", "hypernat", "hyponat"]}]}, {"id": "sc-na", "after": "hypoNa", "prompt": "Explain why hyponatremia and hypernatremia both cause confusion and seizures, and why correcting either one too fast is dangerous.", "model": "Sodium sets the concentration of the ECF. In hyponatremia the ECF is dilute, so water moves into brain cells and they swell; in hypernatremia it is concentrated, so water leaves brain cells and they shrink. Either change disturbs neurons and causes confusion and seizures. The brain adapts over time, so a rapid correction swings water the other way: raising a low sodium too fast causes osmotic demyelination, and lowering a high sodium too fast causes cerebral edema.", "keys": [{"label": "low Na⁺ → water into brain cells (swell)", "any": ["swell", "into the cell", "into cells", "edema"]}, {"label": "high Na⁺ → water out of brain cells (shrink)", "any": ["shrink", "shrivel", "out of the cell", "out of cells", "dehydrat"]}, {"label": "osmosis follows concentration", "any": ["osmo", "concentrat", "water follows", "dilute"]}, {"label": "rapid correction swings water back (demyelination / cerebral edema)", "any": ["too fast", "rapid", "demyelin", "cerebral edema", "slow"]}]}, {"id": "sc-k", "after": "hypoK", "prompt": "Both hypokalemia and hyperkalemia cause muscle weakness. Explain the different mechanisms and the ECG clue that tells them apart.", "model": "Potassium sets the resting membrane potential. Low potassium hyperpolarizes muscle cells, moving them farther from threshold, so they are hard to excite. High potassium hypopolarizes them; at first they are overexcitable, but then they sit above threshold, fire once, and cannot repolarize to fire again. On the ECG, hypokalemia shows flat or inverted T waves and a U wave, while hyperkalemia shows tall peaked T waves and later a wide QRS.", "keys": [{"label": "K⁺ sets the resting membrane potential", "any": ["resting", "membrane potential", "polariz", "charge"]}, {"label": "low K⁺ = hyperpolarized, harder to fire", "any": ["hyperpolar", "farther", "harder to fire", "less excitable"]}, {"label": "high K⁺ = hypopolarized, fires then cannot repolarize", "any": ["hypopolar", "depolar", "can't repolar", "cannot repolar", "stuck", "above threshold"]}, {"label": "ECG: low = flat T / U wave; high = peaked T", "any": ["u wave", "peaked", "flat t", "t wave", "inverted"]}]}, {"id": "sc-ca", "after": "hypoCa", "prompt": "A client is 12 hours post total thyroidectomy. Explain why the nurse checks for Chvostek and Trousseau signs and keeps a tracheostomy tray at the bedside.", "model": "The parathyroid glands can be injured or removed with the thyroid, so PTH falls and serum calcium drops. Low calcium lowers the nerve threshold, so nerves and muscles fire too easily; Chvostek and Trousseau signs detect this latent tetany early. The same hyperexcitability can make the laryngeal muscles spasm and block the airway, so emergency airway equipment must be ready.", "keys": [{"label": "parathyroid injury → PTH falls", "any": ["parathyroid", "pth"]}, {"label": "serum calcium drops", "any": ["calcium", "hypocalc", "ca"]}, {"label": "low Ca lowers threshold → nerves fire easily / tetany", "any": ["threshold", "excitab", "tetany", "fire", "irritab"]}, {"label": "laryngospasm threatens the airway", "any": ["laryng", "airway", "stridor", "trach"]}]}, {"id": "sc-mg", "after": "hypoMg", "prompt": "Why does the nurse expect the provider to replace magnesium before (or with) potassium in a client whose low potassium keeps not correcting?", "model": "Low magnesium impairs the sodium-potassium pump and makes the kidneys keep excreting potassium, so potassium given by mouth or IV is lost in the urine. It also suppresses PTH, which keeps calcium low. Until magnesium is replaced, the potassium and calcium deficits will not correct.", "keys": [{"label": "low Mg makes kidneys waste K⁺", "any": ["kidney", "renal", "urine", "excret", "wast"]}, {"label": "Na⁺/K⁺ pump needs Mg", "any": ["pump", "atpase"]}, {"label": "low Mg suppresses PTH → low Ca", "any": ["pth", "parathyroid", "calcium"]}, {"label": "replace Mg first", "any": ["first", "before", "won't correct", "will not correct"]}]}, {"id": "sc-phos", "after": "hypoPhos", "prompt": "A severely malnourished client starts parenteral nutrition at full rate and becomes weak and short of breath on day 2. Explain the mechanism.", "model": "The carbohydrate load triggers a large insulin release, and insulin drives glucose and phosphate into cells to make ATP. The client's phosphate stores were already depleted, so serum phosphate falls sharply. Without phosphate, cells cannot make ATP or 2,3-BPG, so skeletal and diaphragm muscles weaken and oxygen delivery falls, causing respiratory failure. Starting feedings slowly prevents this.", "keys": [{"label": "feeding → insulin surge", "any": ["insulin"]}, {"label": "phosphate shifts into cells", "any": ["into cells", "shift", "into the cell", "intracellular"]}, {"label": "no ATP / 2,3-BPG → weak muscles and diaphragm", "any": ["atp", "energy", "2,3", "diaphragm", "respiratory muscle"]}, {"label": "refeeding: start slowly", "any": ["refeed", "slow", "gradual"]}]}, {"id": "sc-hyperK-tx", "after": "hyperK", "prompt": "Explain why calcium gluconate is given first for hyperkalemia with ECG changes, even though it does not lower the potassium level.", "model": "The immediate danger of hyperkalemia is a lethal dysrhythmia. Calcium antagonizes potassium's effect on the cardiac cell membrane within minutes, restoring a normal threshold and protecting the heart, but the potassium is still high and the effect lasts only about 30 minutes. Insulin with glucose and bicarbonate must then shift potassium into cells, and Kayexalate, diuretics, or dialysis must remove it.", "keys": [{"label": "the threat is the heart / dysrhythmia", "any": ["heart", "cardiac", "dysrhythm", "arrhythm", "arrest"]}, {"label": "calcium stabilizes the membrane / protects the heart", "any": ["stabiliz", "protect", "antagon", "membrane", "threshold"]}, {"label": "it does not lower K⁺ and is short-lived", "any": ["does not lower", "doesn't lower", "temporary", "30 min", "short"]}, {"label": "then shift and remove K⁺", "any": ["insulin", "shift", "kayexalate", "dialysis", "remove"]}]}], "compare": [{"title": "Unit 1 electrolytes at a glance (Galen values)", "columns": ["Electrolyte", "Galen normal", "Main job (slide analogy)", "Organ to watch", "LOW: key signs", "HIGH: key signs"], "rows": [["Sodium (Na⁺)", "135 to 145 mEq/L", "Water distribution (water department)", "**Brain**", "Cells swell: headache, confusion, seizures, coma; N/V", "Cells shrink: thirst, dry sticky mouth, restlessness, seizures"], ["Potassium (K⁺)", "3.5 to 5 mEq/L", "Resting membrane potential (electricity grid)", "**Heart and muscle**", "Weakness, ileus, flat T, **U wave**, PVCs, digoxin toxicity", "Weakness to flaccid paralysis, cramping/diarrhea, **peaked T**, wide QRS, arrest"], ["Calcium (Ca²⁺)", "9 to 10.5 mg/dL", "Threshold, bones, clotting (construction)", "**Nerves: tetany**", "Chvostek, Trousseau, tetany, ↑ DTRs, laryngospasm, **long QT**", "Weakness, ↓ DTRs, constipation, polyuria, stones, fractures, **short QT**"], ["Magnesium (Mg²⁺)", "1.5 to 2.5 mEq/L", "Limits ACh release (traffic control)", "**Reflexes and rhythm**", "↑ DTRs, tremor, tetany, seizures, torsades; low K⁺/Ca²⁺", "↓/absent DTRs, respiratory depression, hypotension, flushing, heart block"], ["Phosphate", "2 to 4.5 mEq/L (Galen sheet)", "ATP and 2,3-BPG (power plant)", "**Energy**", "Weakness, respiratory failure, cardiomyopathy, confusion, hemolysis, infection", "Looks like low Ca²⁺ (tetany), itching, calcifications, conjunctivitis"]], "note": "Your Patho slide summary: ==brain → sodium; heart → potassium; tetany → calcium; reflexes → magnesium; low energy → phosphate.=="}, {"title": "Hypovolemia vs. hypervolemia vs. clinical dehydration: how to tell them apart", "columns": ["Feature", "Hypovolemia (ECV deficit)", "Hypervolemia (ECV excess)", "Clinical dehydration"], "rows": [["**Deciding cue**", "**Normal Na⁺** + deficit signs", "**Normal Na⁺** + overload signs", "**High Na⁺** + deficit signs"], ["Weight", "Sudden loss", "Sudden gain", "Sudden loss"], ["Neck veins", "Flat (supine)", "Distended (upright)", "Flat"], ["Pulse and BP", "Weak, rapid; postural hypotension", "Bounding; BP ↑", "Rapid, thready; postural hypotension"], ["Lungs", "Clear", "Crackles, dyspnea, orthopnea", "Clear"], ["Urine", "Low, concentrated (SG ↑)", "↑ output if kidneys healthy; SG ↓", "Low, concentrated"], ["Hct / BUN", "↑ (concentrated)", "↓ (diluted)", "↑"], ["Brain", "Confusion only if perfusion falls", "Usually unaffected", "Thirst, confusion, lethargy (cells shrink)"], ["First treatment", "Isotonic IV fluid, then hypotonic", "Diuretics, Na⁺ restriction, HOB up", "Restore volume, then lower Na⁺ slowly"]]}, {"title": "Hyponatremia vs. hypernatremia: how to tell them apart", "columns": ["Feature", "Hyponatremia", "Hypernatremia"], "rows": [["**Deciding cue**", "**Na⁺ < 135**; brain cells **swell**", "**Na⁺ > 145**; brain cells **shrink**; **thirst**"], ["Mechanism", "Water excess (dilutional) or salt loss greater than water (depletional)", "Water deficit or salt gain greater than water"], ["Classic causes", "SIADH, D5W, thiazides, psychogenic polydipsia, GI loss replaced with water", "Diabetes insipidus, no access to water, tube feedings without free water, hypertonic saline"], ["Neuro signs", "Headache, N/V, confusion, lethargy, seizures, herniation", "Restlessness, irritability, confusion, lethargy, seizures"], ["Other signs", "Anorexia, muscle cramps; ↑ pulse ↓ BP (depletional)", "Dry sticky tongue, ↑ temp, oliguria (polyuria in DI), pulmonary edema if salt gain"], ["Urine", "SIADH: concentrated (SG > 1.012, Na⁺ > 20)", "Concentrated (except DI: dilute)"], ["Treatment", "Water restriction; Na⁺ replacement; 3% saline slowly for seizures", "Hypotonic fluid (0.45% NaCl) or D5W; desmopressin for DI"], ["Speed limit", "Raise ≤ 12 mEq/L in 24 hr (osmotic demyelination)", "Lower 0.5 to 1 mEq/L per hr (cerebral edema)"]]}, {"title": "Hypokalemia vs. hyperkalemia: both cause weakness", "columns": ["Feature", "Hypokalemia", "Hyperkalemia"], "rows": [["**Deciding cue: ECG**", "**Flat/inverted T, prominent U wave**, ST depression", "**Tall peaked T**, then long PR, lost P, wide QRS"], ["Membrane", "Hyperpolarized (harder to fire)", "Hypopolarized (fires, then cannot repolarize)"], ["Gut", "Ileus, ↓ bowel sounds, constipation, distention", "Intestinal colic, cramping, diarrhea"], ["Kidney", "Polyuria (ADH resistance)", "Usually the cause (oliguria)"], ["Classic causes", "Loop/thiazide diuretics, vomiting, NG suction, diarrhea, steroids, alkalosis, insulin", "Kidney failure, K⁺-sparing diuretics, ACE inhibitors, acidosis, crush injury, rapid IV K⁺"], ["Acid-base", "Alkalosis (K⁺ into cells)", "Acidosis (K⁺ out of cells)"], ["Drug danger", "↑ digoxin toxicity", "Salt substitutes, K⁺ supplements"], ["Treatment", "KCl PO or IV (diluted, pump, never push); replace Mg²⁺", "Calcium gluconate → insulin + glucose, bicarbonate → Kayexalate, furosemide, dialysis"]]}, {"title": "Low calcium vs. low magnesium vs. high phosphate: all cause tetany", "columns": ["Feature", "Hypocalcemia", "Hypomagnesemia", "Hyperphosphatemia"], "rows": [["**Deciding cue**", "**Low Ca²⁺**; neck surgery, citrated blood, pancreatitis, vitamin D lack", "**Low Mg²⁺**; alcoholism, diuretics, diarrhea, refeeding; **tetany that ignores calcium**", "**High phosphate + low Ca²⁺**; kidney failure, phosphate enemas"], ["Mechanism", "Threshold ↓ → nerves fire easily", "More ACh released at the neuromuscular junction; PTH blocked", "Phosphate binds Ca²⁺ → ionized Ca²⁺ ↓"], ["Shared signs", "Chvostek, Trousseau, tetany, ↑ DTRs, seizures", "Chvostek, Trousseau, tetany, ↑ DTRs, seizures", "Same as hypocalcemia"], ["Unique extras", "Laryngospasm, prolonged QT, diarrhea, clotting problems", "Tremor, nystagmus, insomnia, mood changes, torsades, ↑ BP, refractory low K⁺", "Itching, joint aching, conjunctivitis, soft-tissue calcification"], ["Treatment", "IV calcium gluconate; oral Ca²⁺ + vitamin D", "Magnesium sulfate (double check, DTRs, RR)", "Treat cause, phosphate binders with meals, dialysis"]]}, {"title": "IV fluids by tonicity", "columns": ["Fluid", "Tonicity", "Where the water goes", "Used for", "Watch out"], "rows": [["0.9% NaCl (NS)", "Isotonic", "Stays in the ECF (expands volume)", "**Hypovolemia**, shock, with blood, hypercalcemia", "Overload in HF/CKD; hyperchloremic acidosis"], ["Lactated Ringer's", "Isotonic", "Stays in the ECF", "Hypovolemia, burns, GI losses", "Contains K⁺ (avoid in kidney injury); not in lactic acidosis or pH > 7.5"], ["D5W", "Isotonic in bag → hypotonic in body", "Free water: 2/3 into cells", "Hypernatremia (free water)", "Not for resuscitation or head injury; can cause hyponatremia"], ["0.45% NaCl", "Hypotonic", "Into cells", "**Hypernatremia**, cellular dehydration; after isotonic resuscitation", "Not with ↑ ICP or third spacing"], ["3% / 5% NaCl", "Hypertonic", "Out of cells into vessels", "**Severe symptomatic hyponatremia**, cerebral edema", "Slowly, by pump; overload; demyelination if too fast"]]}, {"title": "Unit medications at a glance", "columns": ["Drug", "Condition", "Check before giving", "Hold / report"], "rows": [["Furosemide (loop diuretic)", "Hypervolemia; hypermagnesemia; hyperkalemia; hypercalcemia", "BP, K⁺, urine output, sulfa allergy, digoxin", "K⁺ < 3.5, hypotension, anuria, tinnitus"], ["Hydrochlorothiazide (thiazide)", "Hypervolemia (mild), HTN", "BP, K⁺, Na⁺, Ca²⁺, GFR", "Low K⁺/Na⁺, high Ca²⁺, GFR < 30"], ["Potassium chloride", "Hypokalemia", "K⁺, **urine output**, dilution, pump", "Urine < 20 mL/hr × 2 hr, peaked T; **never IV push**"], ["Calcium gluconate", "Hypocalcemia; hyperkalemia; hypermagnesemia", "ECG, digoxin use, IV site", "Bradycardia, infiltration"], ["Regular insulin + D50", "Hyperkalemia", "Glucose, double check", "Glucose hourly × 5 to 6 hr"], ["Sodium polystyrene sulfonate", "Hyperkalemia", "Bowel sounds, BM pattern", "Ileus, constipation; separate other PO meds 3 hr"], ["Magnesium sulfate", "Hypomagnesemia", "**Patellar reflex, RR ≥ 16**, urine output, double check", "Absent DTRs, RR < 16, hypotension"], ["3% NaCl", "Hyponatremia (severe)", "Na⁺, neuro, lungs", "Na⁺ rise > 12 mEq/L/24 hr, crackles"], ["0.45% NaCl / D5W", "Hypernatremia", "Na⁺, ICP risk", "Fast Na⁺ fall, headache, confusion"], ["Calcitonin salmon", "Hypercalcemia", "Fish/salmon allergy, Ca²⁺", "Allergic reaction, tetany"], ["Potassium phosphate IV", "Hypophosphatemia", "Ca²⁺, phosphate, K⁺, site", "Tetany; rate > 3 mmol/hr"], ["Calcium acetate", "Hyperphosphatemia", "Ca²⁺, phosphate", "Hypercalcemia; give with meals"]]}, {"title": "Drug suffix cheat sheet", "columns": ["Suffix", "Class", "Drugs in this guide"], "rows": [["-thiazide", "Thiazide diuretic", "hydrochlorothiazide"], ["-semide / -etanide (no single suffix)", "Loop diuretic", "furosemide (also bumetanide, torsemide)"], ["-vaptan", "ADH (vasopressin) receptor antagonist", "conivaptan, tolvaptan (Brunner, hyponatremia; not on slides)"]]}], "quiz": [{"step": "Recognize Cues", "q": "A client with 3 days of vomiting has a weight loss of 2 kg since yesterday. What is the best interpretation?", "o": ["A. About 2 kg of body fat and muscle has been lost", "B. About 2 L of fluid has been lost", "C. About 500 mL of fluid has been lost", "D. The weight change is not clinically meaningful"], "a": 1, "w": "Option B is correct: 1 L of fluid weighs about 1 kg, and tissue cannot change that fast, so a 2 kg overnight drop is about 2 L of fluid. Option A is wrong because fat and muscle cannot be lost overnight. Option D ignores the most sensitive measure of fluid status. Option C underestimates: 500 mL corresponds to about 0.5 kg."}, {"step": "Analyze Cues", "q": "Which assessment findings best indicate hypovolemia (ECV deficit)?", "o": ["A. Bounding pulse, distended neck veins, crackles", "B. Peaked T waves and muscle weakness", "C. Serum Na⁺ 152 with thirst and confusion only", "D. Postural BP drop with rising HR, flat neck veins, concentrated low urine output"], "a": 3, "w": "Option D is correct: these are the classic signs of a small vascular volume with kidneys conserving fluid. Option A describes hypervolemia. Option C describes a concentration problem (hypernatremia); without volume signs it is not ECV deficit. Option B describes hyperkalemia."}, {"step": "Take Action", "q": "A hypotensive client with hypovolemia from diarrhea has an IV started. Which fluid does the nurse anticipate first?", "o": ["A. 0.45% sodium chloride", "B. D5W", "C. 0.9% sodium chloride", "D. 3% sodium chloride"], "a": 2, "w": "Option C is correct: isotonic saline stays in the ECF and restores circulating volume; Med-Surg slides say isotonic first, then hypotonic. Option B becomes free water that moves into cells and does not support BP. Option A is hypotonic; it is used after the client is normotensive. Option D is hypertonic and is reserved for severe symptomatic hyponatremia."}, {"step": "Recognize Cues", "q": "An older adult is receiving IV fluids at 150 mL/hr. Which finding requires the nurse's immediate action?", "o": ["A. Skin turgor slow to recoil on the hand", "B. Thirst", "C. Urine output of 60 mL/hr", "D. New crackles in both lung bases and a cough"], "a": 3, "w": "Option D is correct: crackles and cough signal circulatory overload heading toward pulmonary edema; slow the IV, raise the HOB, and notify. Option C is adequate output. Option A is unreliable in older adults because skin loses elasticity. Option B is not urgent and is a deficit sign."}, {"step": "Generate Solutions", "q": "Which nursing intervention is most appropriate for a client with hypervolemia and orthopnea?", "o": ["A. Increase dietary sodium", "B. Encourage 3 L of oral fluid daily", "C. Place the client in semi- to high Fowler's position", "D. Place the client flat with legs elevated"], "a": 2, "w": "Option C is correct: sitting up reduces venous return and allows lung expansion. Option B adds to the overload. Option D increases venous return and worsens dyspnea; it is used for hypotension in hypovolemia. Option A increases fluid retention."}, {"step": "Evaluate Outcomes", "q": "A client with heart failure is teaching back about a low-sodium diet. Which statement shows a need for more teaching?", "o": ["A. \"I'll weigh myself every morning after I urinate.\"", "B. \"I'll season with lemon, onion, and garlic.\"", "C. \"I'll use a salt substitute instead of salt on everything.\"", "D. \"I'll read food labels for sodium.\""], "a": 2, "w": "Option C needs more teaching: most salt substitutes contain potassium and can cause hyperkalemia, especially with potassium-sparing diuretics or kidney disease; the client must check with the provider. Option D, Option B, and Option A are all correct self-care behaviors."}, {"step": "Analyze Cues", "q": "Which finding distinguishes clinical dehydration from pure hypovolemia?", "o": ["A. Flat neck veins", "B. Orthostatic hypotension", "C. Urine specific gravity 1.028", "D. Serum sodium 151 mEq/L"], "a": 3, "w": "Option D is correct: clinical dehydration is ECV deficit plus hypernatremia, so the high sodium is the deciding cue. Option B, Option C, and Option A occur in both conditions because both have a volume deficit."}, {"step": "Analyze Cues", "q": "A client who had surgery yesterday has received D5W at 125 mL/hr and now has a headache, nausea, and confusion. Na⁺ is 122. Which mechanism explains the symptoms?", "o": ["A. Water moved into brain cells, causing them to swell", "B. Sodium accumulated inside brain cells", "C. Water moved out of brain cells, causing them to shrink", "D. Volume depletion reduced cerebral perfusion"], "a": 0, "w": "Option A is correct: D5W becomes free water; with postoperative ADH the ECF becomes dilute, and water moves into brain cells by osmosis (dilutional hyponatremia). Option C describes hypernatremia. Option B is wrong; the problem is water, not sodium entering cells. Option D does not fit: this client gained free water."}, {"step": "Take Action", "q": "A client with Na⁺ 116 mEq/L has a seizure. The provider orders 3% NaCl. Which nursing action is most important?", "o": ["A. Infuse by pump at the ordered rate and monitor Na⁺ and neuro status frequently", "B. Give the 3% saline as a rapid bolus to stop the seizure", "C. Restrict checks to every 12 hours to let the client rest", "D. Encourage oral water to prevent dehydration"], "a": 0, "w": "Option A is correct: hypertonic saline raises sodium quickly in small volumes; Brunner limits the rise to 12 mEq/L in 24 hours to avoid osmotic demyelination. Option B risks overcorrection and overload. Option D adds free water and worsens hyponatremia. Option C misses overcorrection."}, {"step": "Prioritize Hypotheses", "q": "Which client is at greatest risk for hypernatremia?", "o": ["A. A client receiving hydrochlorothiazide", "B. An 88-year-old with dementia on continuous concentrated tube feedings", "C. A client with SIADH from a lung tumor", "D. A 30-year-old marathon runner drinking large amounts of water"], "a": 1, "w": "Option B is correct: older adults have weak thirst, cannot ask for water, and concentrated feedings cause obligatory water loss. Option D is at risk for hyponatremia (water gain with salt loss). Option C retains water (dilutional hyponatremia). Option A: thiazides cause hyponatremia."}, {"step": "Take Action", "q": "A client with hypernatremia (Na⁺ 160) is receiving 0.45% NaCl. Two hours later the client reports a new headache and is more confused. What is the nurse's first action?", "o": ["A. Give acetaminophen and reassess in an hour", "B. Slow the infusion per protocol and notify the provider", "C. Encourage the client to drink more water", "D. Increase the rate to correct the sodium faster"], "a": 1, "w": "Option B is correct: new headache and confusion during correction suggest cerebral edema from lowering sodium too fast (Brunner: 0.5 to 1 mEq/L per hour). Option D worsens the problem. Option A treats a symptom and delays action. Option C adds more free water."}, {"step": "Recognize Cues", "q": "A client with an NG tube to continuous suction for 4 days is most likely to show which pattern?", "o": ["A. Hyperkalemia and metabolic alkalosis", "B. Hypercalcemia and hypermagnesemia", "C. Hyperkalemia, hyperchloremia, metabolic acidosis", "D. Hypokalemia, hypochloremia, metabolic alkalosis"], "a": 3, "w": "Option D is correct: suction removes hydrochloric acid (H⁺ and Cl⁻) and potassium, the classic triad on your Patho slides. Option C is the opposite pattern. Option A: alkalosis shifts K⁺ into cells, so K⁺ falls. Option B is not caused by gastric suction."}, {"step": "Analyze Cues", "q": "Which ECG finding is specific to hypokalemia?", "o": ["A. A widened QRS with absent P waves", "B. A tall, peaked T wave", "C. A prominent U wave", "D. A shortened QT interval"], "a": 2, "w": "Option C is correct: Brunner calls an elevated U wave specific to hypokalemia, along with flat or inverted T waves. Option B and Option A are hyperkalemia changes (peaked T early, wide QRS and lost P late). Option D is seen with hypercalcemia."}, {"step": "Take Action", "q": "The nurse is preparing IV potassium chloride for a client with K⁺ 2.9 mEq/L. Which finding should make the nurse hold the infusion and call the provider?", "o": ["A. Urine output of 15 mL/hr for the last 2 hours", "B. Heart rate of 92 with occasional PVCs", "C. Blood pressure of 110/70", "D. Mild muscle weakness"], "a": 0, "w": "Option A is correct: potassium is excreted by the kidneys; Brunner says to stop and notify if output is below 20 mL/hr for 2 consecutive hours. Option B and Option D are expected with hypokalemia and are reasons to replace. Option C is acceptable."}, {"step": "Take Action", "q": "Which order for potassium chloride should the nurse question?", "o": ["A. KCl 20 mEq IV push over 2 minutes", "B. KCl 10 mEq in 100 mL infused over 1 hour by pump", "C. KCl 20 mEq PO with breakfast", "D. KCl 40 mEq/day PO in two divided doses"], "a": 0, "w": "Option A must be questioned: potassium is never given IV push; a bolus can cause cardiac arrest. Option B is within F&P's peripheral limit (10 mEq/100 mL at 10 mEq/hr). Option C and Option D are within Davis oral dosing (single dose not over 20 mEq)."}, {"step": "Prioritize Hypotheses", "q": "A client taking digoxin and furosemide has K⁺ 3.0. Which concern is the priority?", "o": ["A. Hypernatremia", "B. Fluid volume excess", "C. Hypocalcemia", "D. Digoxin toxicity and dysrhythmias"], "a": 3, "w": "Option D is correct: hypokalemia increases sensitivity to digoxin, raising the risk of toxicity and lethal dysrhythmias. Option B is the reason for the diuretic but not the new danger. Option A and Option C are not caused by low K⁺ or digoxin here."}, {"step": "Take Action", "q": "A client with acute kidney injury has K⁺ 6.9 and peaked T waves. Which medication does the nurse anticipate first?", "o": ["A. Sodium polystyrene sulfonate orally", "B. Potassium chloride", "C. Furosemide IV", "D. IV calcium gluconate"], "a": 3, "w": "Option D is correct: calcium protects the myocardium within minutes when ECG changes are present. Option A removes K⁺ but works over hours. Option C removes K⁺ in urine but depends on kidney function and is slower. Option B would worsen hyperkalemia."}, {"step": "Evaluate Outcomes", "q": "After regular insulin 10 units IV and 50 mL of D50 for hyperkalemia, which assessment is most important over the next several hours?", "o": ["A. Blood glucose every hour", "B. Urine specific gravity", "C. Deep tendon reflexes", "D. Chvostek sign"], "a": 0, "w": "Option A is correct: F&P recommends hourly glucose for 5 to 6 hours because hypoglycemia is the main danger. Option B, Option C, and Option D are not directly affected by this therapy."}, {"step": "Analyze Cues", "q": "A client's K⁺ is reported as 6.8 mEq/L, but the ECG is normal and the client has no symptoms. The sample was drawn above an IV of D5W with 20 mEq KCl. What should the nurse do?", "o": ["A. Request a redraw from the opposite arm and keep the client on the monitor", "B. Discontinue all IV fluids permanently", "C. Give calcium gluconate immediately", "D. Document the result as accurate and continue care"], "a": 0, "w": "Option A is correct: drawing above a potassium infusion can falsely raise K⁺ (pseudohyperkalemia); Brunner says grossly high results with a normal ECG should be verified. Option C treats a possibly false value. Option B is unnecessary. Option D ignores a possibly real or false critical value."}, {"step": "Take Action", "q": "Before giving sodium polystyrene sulfonate (Kayexalate), which finding should the nurse check first?", "o": ["A. Skin turgor", "B. Deep tendon reflexes", "C. Bowel sounds and recent bowel movements", "D. Urine specific gravity"], "a": 2, "w": "Option C is correct: Kayexalate is contraindicated with ileus or abnormal bowel function because of the risk of intestinal necrosis and perforation. Option B, Option D, and Option A do not affect its safety."}, {"step": "Recognize Cues", "q": "Twelve hours after total thyroidectomy, which client statement requires immediate follow-up?", "o": ["A. \"My throat is sore when I swallow.\"", "B. \"I'd like something for my incision pain.\"", "C. \"I'm a little hoarse.\"", "D. \"My lips and fingertips are tingling.\""], "a": 3, "w": "Option D is correct: circumoral and fingertip tingling are early signs of hypocalcemia from parathyroid injury, which can progress to tetany and laryngospasm. Option A, Option C, and Option B are expected after neck surgery (though worsening hoarseness or stridor would be urgent)."}, {"step": "Analyze Cues", "q": "Which finding is consistent with hypocalcemia?", "o": ["A. Hypoactive reflexes and constipation", "B. Kidney stones and polyuria", "C. Shortened QT interval and bradycardia", "D. Positive Trousseau sign and prolonged QT interval"], "a": 3, "w": "Option D is correct: low calcium lowers the threshold (latent tetany) and lengthens the cardiac plateau (prolonged QT). Option A, Option B, and Option C are hypercalcemia findings."}, {"step": "Take Action", "q": "The nurse is giving IV calcium gluconate for hypocalcemia. Which action is correct?", "o": ["A. Mix it with the client's 0.9% NaCl and sodium bicarbonate infusion", "B. Push it rapidly to stop tetany quickly", "C. Infuse slowly by pump with cardiac monitoring and frequent site checks", "D. Give it IM if no IV is available"], "a": 2, "w": "Option C is correct: rapid IV calcium can cause bradycardia and arrest, and infiltration causes necrosis. Option A is wrong: Brunner says saline increases renal calcium loss and bicarbonate causes a precipitate. Option D: F&P says never give parenteral calcium IM. Option B risks cardiac arrest."}, {"step": "Generate Solutions", "q": "Which intervention is most appropriate for a client with hypercalcemia from prolonged immobility?", "o": ["A. Restrict fluids to 1,000 mL/day", "B. Encourage ambulation and 3 to 4 quarts of fluid daily", "C. Encourage calcium-rich foods and vitamin D", "D. Give a thiazide diuretic"], "a": 1, "w": "Option B is correct: weight bearing keeps calcium in bone, and fluids dilute calcium and prevent stones (Med-Surg slides; Brunner). Option C adds calcium. Option A worsens concentration and dehydration. Option D: thiazides decrease calcium excretion and raise calcium."}, {"step": "Recognize Cues", "q": "A client with metastatic cancer is constipated, very thirsty, voiding large volumes, and lethargic. Which electrolyte imbalance does the nurse suspect?", "o": ["A. Hyperkalemia", "B. Hypercalcemia", "C. Hypomagnesemia", "D. Hypocalcemia"], "a": 1, "w": "Option B is correct: malignancy pulls calcium from bone; high calcium depresses neuromuscular activity (constipation, lethargy) and causes polyuria and thirst. Option D causes tetany and diarrhea. Option A causes cramping, diarrhea, and dysrhythmias. Option C causes hyperexcitability."}, {"step": "Take Action", "q": "Which assessment must the nurse complete before each dose of IV magnesium sulfate?", "o": ["A. Chvostek sign", "B. Patellar reflex and respiratory rate", "C. Skin turgor", "D. Bowel sounds"], "a": 1, "w": "Option B is correct: loss of reflexes is the earliest sign of magnesium toxicity, and Davis requires respirations of at least 16/min before each dose. Option A is a sign of deficiency, not toxicity. Option C and Option D do not reflect magnesium toxicity."}, {"step": "Analyze Cues", "q": "A client admitted for alcohol withdrawal has a K⁺ of 3.0 that has not improved after two doses of KCl. Which lab result best explains this?", "o": ["A. Mg²⁺ 1.1 mEq/L", "B. Ca²⁺ 9.4 mg/dL", "C. Phosphate 3.5", "D. Na⁺ 138 mEq/L"], "a": 0, "w": "Option A is correct: low magnesium makes the kidneys waste potassium, so K⁺ will not correct until Mg²⁺ is replaced. Option D, Option B, and Option C are normal (Galen) and do not explain refractory hypokalemia."}, {"step": "Prioritize Hypotheses", "q": "Which client is at highest risk for hypermagnesemia?", "o": ["A. A client receiving furosemide", "B. A client with diarrhea from Crohn's disease", "C. A client with chronic alcoholism", "D. An older adult with chronic kidney disease who takes milk of magnesia nightly"], "a": 3, "w": "Option D is correct: impaired kidney excretion plus a magnesium-containing laxative is the classic setup; older adults absorb more and excrete less. Option C, Option B, and Option A cause hypomagnesemia."}, {"step": "Take Action", "q": "A client with hypermagnesemia has absent patellar reflexes and RR 10. Which medication should the nurse prepare?", "o": ["A. Sodium polystyrene sulfonate", "B. Potassium chloride IV", "C. Calcium gluconate IV", "D. Magnesium sulfate IV"], "a": 2, "w": "Option C is correct: calcium antagonizes magnesium's neuromuscular and cardiac effects. Option D would worsen toxicity. Option B does not treat hypermagnesemia. Option A removes potassium, not magnesium."}, {"step": "Prioritize Hypotheses", "q": "A severely malnourished client started on parenteral nutrition at full rate becomes weak and short of breath on day 2. Which lab value does the nurse expect?", "o": ["A. High potassium", "B. High calcium", "C. Low phosphate", "D. High phosphate"], "a": 2, "w": "Option C is correct: refeeding triggers insulin, which drives phosphate into cells; without ATP the diaphragm weakens. Option D and Option A are not caused by refeeding. Option B is wrong: insulin shifts potassium into cells, lowering it."}, {"step": "Take Action", "q": "A client is receiving parenteral nutrition through a central line. The bag runs out and the pharmacy will not have the next one for 2 hours. What should the nurse do?", "o": ["A. Hang 0.9% NaCl at the PN rate", "B. Hang 10% dextrose at the same rate", "C. Double the rate of the next bag to catch up", "D. Flush the line and leave it clamped"], "a": 1, "w": "Option B is correct: Brunner says to infuse 10% dextrose at the same rate to prevent rebound hypoglycemia. Option D and Option A cause a sudden drop in glucose supply. Option C is never done: rates are not increased to catch up (hyperglycemia, osmotic diuresis)."}, {"step": "Take Action", "q": "A client with chronic kidney disease has phosphate 7.0 and calcium 7.8 and asks for an enema for constipation. Which order should the nurse question?", "o": ["A. Low-phosphorus diet", "B. Sodium phosphate (Fleet) enema", "C. Monitor for Chvostek sign", "D. Calcium acetate with meals"], "a": 1, "w": "Option B should be questioned: phosphate enemas add phosphate, and your slides list avoiding enemas and laxatives in hyperphosphatemia. Option D is a phosphate binder (appropriate). Option A reduces intake. Option C monitors for the hypocalcemia that high phosphate causes."}, {"step": "Evaluate Outcomes", "q": "Which statement by a client taking calcium acetate shows correct understanding?", "o": ["A. \"I take it with my tetracycline so I remember both.\"", "B. \"I take it at bedtime on an empty stomach.\"", "C. \"I take it with every meal.\"", "D. \"I can stop it once my itching goes away.\""], "a": 2, "w": "Option C is correct: phosphate binders work only when they meet dietary phosphate in the gut. Option B removes the food it needs to bind. Option A: calcium binds tetracycline and blocks its absorption. Option D: hyperphosphatemia from kidney disease is chronic; stopping without the provider is unsafe."}, {"step": "Analyze Cues", "q": "Which finding in a client with hyperphosphatemia is explained by calcium-phosphate crystal deposition?", "o": ["A. Tetany", "B. Itching and conjunctivitis", "C. Tachycardia", "D. Positive Trousseau sign"], "a": 1, "w": "Option B is correct: crystals in skin and conjunctiva cause pruritus and conjunctivitis (Patho slides). Option A and Option D come from low ionized calcium, not crystal deposits. Option C is a cardiac effect, not deposition."}, {"step": "Generate Solutions", "q": "Which client teaching is correct for a client starting furosemide?", "o": ["A. Take it in the morning and report ringing in the ears", "B. Stop the drug if you urinate more often", "C. Avoid potassium-rich foods", "D. Take it at bedtime to reduce daytime urination"], "a": 0, "w": "Option A is correct: morning dosing prevents nocturia and falls, and tinnitus signals ototoxicity. Option D causes nighttime urination and falls. Option C is wrong: loop diuretics waste potassium. Option B is wrong: increased urination is the expected effect."}, {"step": "Take Action", "q": "Before giving IV furosemide 40 mg to a client with hypervolemia, which lab value requires the nurse to contact the provider?", "o": ["A. K⁺ 3.1 mEq/L", "B. Na⁺ 139 mEq/L", "C. BUN 15 mg/dL", "D. Glucose 98 mg/dL"], "a": 0, "w": "Option A is correct: below Galen's 3.5 mEq/L; furosemide wastes more potassium and could trigger dysrhythmias. Option B, Option C, and Option D are normal Galen values."}, {"step": "Recognize Cues", "q": "Which finding best indicates that diuretic therapy for hypervolemia is effective?", "o": ["A. New orthostatic dizziness", "B. Heart rate 118", "C. Urine specific gravity 1.035", "D. Weight down 1.5 kg and fewer crackles"], "a": 3, "w": "Option D is correct: weight loss and clearing lungs show the excess fluid is leaving. Option C suggests concentrated urine or overdiuresis. Option B and Option A suggest the client may now be volume depleted from excessive diuresis."}, {"step": "Prioritize Hypotheses", "q": "Four clients have lab results. Which client should the nurse see first?", "o": ["A. Phosphate 4.8 and itching", "B. Ca²⁺ 10.8 and constipation", "C. K⁺ 6.6 with a heart rate of 48", "D. Na⁺ 133 and mild headache"], "a": 2, "w": "Option C is first: hyperkalemia with bradycardia suggests conduction disturbance and imminent arrest. Option D, Option B, and Option A are mild deviations with nonurgent symptoms."}, {"step": "Analyze Cues", "q": "A client has positive Chvostek and Trousseau signs and tetany that does not improve after IV calcium. Which value should the nurse check next?", "o": ["A. Sodium", "B. Glucose", "C. Magnesium", "D. Chloride"], "a": 2, "w": "Option C is correct: low magnesium causes the same signs and blocks PTH, so calcium will not correct until magnesium is replaced (Brunner). Option A, Option B, and Option D do not cause tetany that resists calcium."}, {"step": "Generate Solutions", "q": "Which client needs teaching to AVOID salt substitutes?", "o": ["A. A client taking spironolactone with chronic kidney disease", "B. A client with hypokalemia on KCl who asked the provider", "C. A client with hyponatremia from vomiting", "D. A client taking furosemide with normal kidneys"], "a": 0, "w": "Option A is correct: salt substitutes are potassium chloride; with a potassium-sparing diuretic and reduced kidney function, hyperkalemia is likely. Option D: a loop diuretic wastes K⁺ (still check with the provider). Option B already discussed it with the provider. Option C: sodium, not potassium, is the problem."}, {"step": "Take Action", "q": "An older adult is admitted with new confusion, a dry sticky tongue, and Na⁺ 154. Which intervention is the priority?", "o": ["A. Give 3% NaCl", "B. Encourage a high-sodium diet", "C. Restrict oral fluids", "D. Implement safety and seizure precautions and start ordered hypotonic fluids by pump"], "a": 3, "w": "Option D is correct: protect the confused client and replace free water slowly. Option C worsens the water deficit. Option A raises sodium further. Option B adds sodium."}, {"step": "Evaluate Outcomes", "q": "A client with SIADH is on a fluid restriction. Which finding shows the treatment is working?", "o": ["A. Weight up 1 kg", "B. Na⁺ rising from 124 to 130 over 2 days with improved orientation", "C. Na⁺ rising from 124 to 140 in 12 hours", "D. Urine specific gravity 1.030"], "a": 1, "w": "Option B is correct: a gradual rise with improved orientation shows the water excess is resolving safely. Option A suggests more water retention. Option D means ADH is still concentrating the urine. Option C is too fast (more than 12 mEq/L in 24 hours) and risks osmotic demyelination."}, {"step": "Recognize Cues", "q": "A client with hypokalemia has which gastrointestinal finding?", "o": ["A. Hyperactive bowel sounds", "B. Decreased bowel sounds and abdominal distention", "C. Diarrhea and intestinal colic", "D. Bloody stools"], "a": 1, "w": "Option B is correct: hypokalemia hyperpolarizes smooth muscle, slowing the gut toward paralytic ileus. Option C is the early GI picture of hyperkalemia. Option A fits hypocalcemia or hyperkalemia. Option D is not caused by low K⁺ (though oral KCl can cause GI bleeding)."}, {"step": "Generate Solutions", "q": "Which food should the nurse recommend to a client with hypomagnesemia?", "o": ["A. Spinach, almonds, and peanut butter", "B. White bread and butter", "C. Cola and processed cheese", "D. Cranberry juice and hard candy"], "a": 0, "w": "Option A is correct: green leafy vegetables, nuts, and peanut butter are rich in magnesium (Brunner). Option B is low in magnesium. Option D are low-potassium choices, not magnesium sources. Option C are high in phosphate and sodium."}], "flashcards": [["What fraction of body water is intracellular vs. extracellular?", "About 2/3 intracellular, 1/3 extracellular (all ages except infants)."], ["Major ICF electrolytes vs. major ECF electrolytes?", "ICF: K⁺, Mg²⁺, phosphate, proteins. ECF: Na⁺, Cl⁻, HCO₃⁻."], ["Why is sudden weight change the most sensitive measure of fluid status?", "1 L of fluid ≈ 1 kg; tissue cannot change that fast overnight."], ["\"Hydrostatic ___; oncotic ___.\"", "Hydrostatic pushes (out of the capillary); oncotic pulls (back in, mainly albumin)."], ["Four capillary causes of edema?", "↑ capillary hydrostatic pressure, ↓ plasma oncotic pressure (low albumin), ↑ interstitial oncotic pressure (leaky capillaries), blocked lymph drainage."], ["ADH vs. aldosterone in one line each?", "ADH = free water hormone (dilutes, concentration). Aldosterone = salt water hormone (volume) and wastes K⁺."], ["What distinguishes hypovolemia from clinical dehydration?", "Serum sodium: normal in hypovolemia (ECV deficit); high in clinical dehydration (ECV deficit + hypernatremia)."], ["Orthostatic hypotension definition (Brunner)?", "Systolic drop > 20 mmHg from lying to sitting (with a rising pulse)."], ["Expected BUN to creatinine ratio in volume deficit?", "Greater than 20:1 (normal 10:1) because urea is concentrated."], ["Hypovolemia fluid sequence?", "Isotonic (0.9% NaCl or LR) first to restore volume, then hypotonic once normotensive."], ["D5W: isotonic or hypotonic?", "Isotonic in the bag, hypotonic in the body (dextrose metabolized → free water). Not for resuscitation or head injury."], ["Three signs that IV fluids are overloading a client?", "Crackles, distended neck veins, sudden weight gain (also dyspnea, cough, bounding pulse)."], ["Low sodium does what to brain cells? High sodium?", "Low: water moves in → cells swell. High: water moves out → cells shrink. Both → confusion, seizures."], ["Maximum safe rise of sodium in hyponatremia?", "No more than 12 mEq/L in 24 hours (osmotic demyelination)."], ["Safe rate to lower sodium in hypernatremia?", "About 0.5 to 1 mEq/L per hour (faster → cerebral edema)."], ["Dilutional vs. depletional hyponatremia?", "Dilutional: gained more water than salt (SIADH, D5W). Depletional: lost more salt than water (thiazides, GI loss replaced with water)."], ["First-line treatment of SIADH hyponatremia?", "Fluid (water) restriction; hypertonic saline only for severe neuro symptoms."], ["Diabetes insipidus: serum sodium and urine?", "Hypernatremia with large volumes of very dilute urine (no ADH)."], ["Low K⁺ ECG vs. high K⁺ ECG?", "Low: flat/inverted T, U wave, ST depression. High: tall peaked T → long PR, lost P, wide QRS."], ["Why do both hypo- and hyperkalemia cause weakness?", "Low K⁺ hyperpolarizes (hard to fire); high K⁺ hypopolarizes (fires, then cannot repolarize)."], ["When must IV potassium be stopped (Brunner)?", "Urine output < 20 mL/hr for 2 consecutive hours."], ["Peripheral IV KCl limits (F&P)?", "Max 10 mEq/100 mL at 10 mEq/hr; never IV push or IM."], ["Hyperkalemia emergency sequence?", "Calcium gluconate (protect heart) → insulin + dextrose, bicarbonate (shift in) → Kayexalate, furosemide, dialysis (remove)."], ["What is pseudohyperkalemia?", "A falsely high K⁺ from hemolysis, tight tourniquet, fist clenching, or drawing above a K⁺ infusion."], ["Which acid-base state raises K⁺? Lowers it?", "Acidosis raises serum K⁺ (shift out of cells); alkalosis lowers it (shift in)."], ["Hypocalcemia memory aid?", "CATS: Convulsions, Arrhythmias (long QT), Tetany, Spasms/Stridor."], ["Hypercalcemia memory aid?", "Stones (kidney), bones (pain, fractures), groans (constipation, N/V), moans (lethargy, confusion)."], ["Corrected calcium rule?", "Add about 0.8 mg/dL for each 1 g/dL that albumin is below 4."], ["Highest-risk time for hypocalcemia after thyroidectomy?", "First 24 to 48 hours (parathyroid injury)."], ["Why not run IV calcium with 0.9% NaCl or bicarbonate?", "Saline increases renal calcium loss; bicarbonate and phosphate cause a precipitate."], ["First treatment for acute hypercalcemia?", "Rehydrate with IV 0.9% saline (dilutes and promotes renal calcium excretion), plus calcitonin."], ["Hypo- vs. hypermagnesemia reflexes?", "Low Mg²⁺: hyperactive reflexes. High Mg²⁺: decreased to absent reflexes."], ["Two checks before each IV magnesium dose?", "Patellar reflex present and respirations at least 16/min (plus urine output ≥ 100 mL/4 hr)."], ["Why replace magnesium before potassium or calcium?", "Low Mg²⁺ makes kidneys waste K⁺ and blocks PTH; K⁺ and Ca²⁺ won't correct until Mg²⁺ is replaced."], ["Antidote at the bedside for IV magnesium?", "Calcium gluconate."], ["Major cause of hypomagnesemia? Of hypermagnesemia?", "Hypo: chronic alcoholism. Hyper: kidney failure (plus magnesium antacids/laxatives)."], ["Why does hypophosphatemia cause respiratory failure?", "No phosphate → no ATP → diaphragm and intercostal muscles weaken."], ["Refeeding syndrome?", "Feeding a starved client → insulin surge → phosphate (and K⁺, Mg²⁺) shift into cells → dangerous lows. Start slowly."], ["Hyperphosphatemia looks like which other imbalance?", "Hypocalcemia (phosphate binds calcium): tetany, Chvostek, Trousseau."], ["When should phosphate binders be taken?", "With meals (they bind dietary phosphate in the gut)."], ["Electrolyte → organ summary (Patho slides)?", "Sodium → brain; potassium → heart and muscle; calcium → tetany; magnesium → reflexes; phosphate → energy."], ["Why is skin turgor unreliable in older adults?", "Skin loses elasticity with age; use tongue furrows, mucous membranes, and hand-vein filling instead."]], "glossary": [["ABG", "Arterial blood gas"], ["ACE", "Angiotensin-converting enzyme"], ["ACh", "Acetylcholine"], ["ADH", "Antidiuretic hormone (arginine vasopressin)"], ["AKI", "Acute kidney injury"], ["ANP", "Atrial natriuretic peptide"], ["ARB", "Angiotensin II receptor blocker"], ["ATP", "Adenosine triphosphate"], ["AV", "Atrioventricular"], ["BM", "Bowel movement"], ["BMP", "Basic metabolic panel"], ["BNP", "B-type (brain) natriuretic peptide"], ["BP", "Blood pressure"], ["2,3-BPG", "2,3-bisphosphoglycerate (helps hemoglobin release oxygen)"], ["BUN", "Blood urea nitrogen"], ["Ca²⁺", "Calcium ion"], ["CATS", "Convulsions, Arrhythmias, Tetany, Spasms/Stridor (hypocalcemia memory aid)"], ["CBC", "Complete blood count"], ["CKD", "Chronic kidney disease"], ["CLABSI", "Central line-associated bloodstream infection"], ["Cl⁻", "Chloride ion"], ["CNS", "Central nervous system"], ["CSLO", "Course student learning outcome"], ["CVP", "Central venous pressure"], ["D5W", "Dextrose 5% in water"], ["D50", "Dextrose 50% in water"], ["DI", "Diabetes insipidus"], ["DKA", "Diabetic ketoacidosis"], ["DTR", "Deep tendon reflex"], ["DVT", "Deep vein thrombosis"], ["ECF", "Extracellular fluid"], ["ECG", "Electrocardiogram (also EKG)"], ["EKG", "Electrocardiogram"], ["ECV", "Extracellular fluid volume"], ["GFR", "Glomerular filtration rate"], ["GI", "Gastrointestinal"], ["HCO₃⁻", "Bicarbonate"], ["HCTZ", "Hydrochlorothiazide"], ["Hct", "Hematocrit"], ["Hgb", "Hemoglobin"], ["HF", "Heart failure"], ["HOB", "Head of bed"], ["HR", "Heart rate"], ["HTN", "Hypertension"], ["H⁺", "Hydrogen ion"], ["I&O", "Intake and output"], ["ICF", "Intracellular fluid"], ["ICP", "Intracranial pressure"], ["ICU", "Intensive care unit"], ["ILE", "Intravenous lipid emulsion"], ["IM", "Intramuscular"], ["IV", "Intravenous"], ["K⁺", "Potassium ion"], ["KCl", "Potassium chloride"], ["LOC", "Level of consciousness"], ["LR", "Lactated Ringer's solution"], ["MI", "Myocardial infarction"], ["Mg²⁺", "Magnesium ion"], ["mmol", "Millimole"], ["mOsm", "Milliosmole"], ["N/V", "Nausea and vomiting"], ["Na⁺", "Sodium ion"], ["NaCl", "Sodium chloride"], ["NCJMM", "NCSBN Clinical Judgment Measurement Model"], ["NCLEX", "National Council Licensure Examination"], ["NCSBN", "National Council of State Boards of Nursing"], ["NG", "Nasogastric"], ["NPO", "Nothing by mouth (nil per os)"], ["NS", "Normal saline (0.9% sodium chloride)"], ["NSAID", "Nonsteroidal anti-inflammatory drug"], ["OTC", "Over the counter"], ["PaCO₂", "Partial pressure of arterial carbon dioxide"], ["PAC", "Premature atrial contraction"], ["PICC", "Peripherally inserted central catheter"], ["PN", "Parenteral nutrition"], ["PO", "By mouth"], ["PPN", "Peripheral parenteral nutrition"], ["PTH", "Parathyroid hormone"], ["PVC", "Premature ventricular contraction"], ["QRS", "The ventricular depolarization complex on the ECG"], ["QT", "ECG interval from the start of the QRS to the end of the T wave"], ["QTc", "Corrected QT interval"], ["PR", "ECG interval from the start of the P wave to the start of the QRS"], ["ST", "ECG segment between the QRS and the T wave"], ["RAAS", "Renin-angiotensin-aldosterone system"], ["RR", "Respiratory rate"], ["SBAR", "Situation, Background, Assessment, Recommendation"], ["SBP", "Systolic blood pressure"], ["SG", "Specific gravity (urine)"], ["SIADH", "Syndrome of inappropriate antidiuretic hormone"], ["SOAPIE", "Subjective, Objective, Assessment, Plan, Intervention, Evaluation"], ["SpO₂", "Peripheral oxygen saturation"], ["SPS", "Sodium polystyrene sulfonate"], ["SSRI", "Selective serotonin reuptake inhibitor"], ["SVT", "Supraventricular tachycardia"], ["TNA", "Total nutrient admixture (3-in-1 PN)"], ["TPN", "Total parenteral nutrition"], ["USLO", "Unit student learning outcome"], ["VS", "Vital signs"], ["F&P", "Frandsen & Pennington (Abrams' Clinical Drug Therapy)"], ["PN/TPN", "Parenteral nutrition / total parenteral nutrition"], ["MS", "Med-Surg"], ["PO₄", "Phosphate"], ["JVD", "Jugular venous distention"], ["ORS", "Oral rehydration solution"], ["CO₂", "Carbon dioxide"], ["Fleet", "Brand of sodium phosphate enemas and laxatives"]]};

function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark class="hy">$1</mark>')}
var store={
 get:function(k,d){try{var v=localStorage.getItem('sg:'+ID+':'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set:function(k,v){try{localStorage.setItem('sg:'+ID+':'+k,JSON.stringify(v))}catch(e){}}
};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function find(id){for(var i=0;i<D.conditions.length;i++)if(D.conditions[i].id===id)return D.conditions[i];return D.conditions[0]}
function drugDeck(){
  var out=[],seen={};
  function add(p,a){if(!seen[p]){seen[p]=1;out.push([p,a])}}
  D.conditions.forEach(function(c){(c.drugs||[]).forEach(function(d){
    add('**'+d.generic+'**: what is its drug class'+(d.suffix?' and suffix?':'?'),d.cls+(d.suffix?' ('+d.suffix+')':''));
    add('How does **'+d.generic+'** work?',d.moa);
    if(d.effects&&d.effects.serious&&d.effects.serious.length)add('**'+d.generic+'**: which life-threatening effects must be reported right away?',d.effects.serious.join('; '));
    if(d.assess&&d.assess.before&&d.assess.before.length)add('What do you check **before** giving '+d.generic+'?',d.assess.before.map(function(r){return r[0]}).join('; '));
  })});
  return out;
}
function procDeck(){
  var out=[],seen={};
  function add(p,a){if(!seen[p]){seen[p]=1;out.push([p,a])}}
  D.conditions.forEach(function(c){(c.procedures||[]).forEach(function(p){
    add('Why is **'+p.name+'** done for '+(c.short||c.name)+'?',p.indication);
    add('What must the nurse do **before** '+p.name+'?',p.before.map(function(r){return r[0]}).join('; '));
    add('Which complications must be reported after **'+p.name+'**?',p.complications.join('; '));
  })});
  return out;
}
var ALLCARDS=D.flashcards.concat(drugDeck()).concat(procDeck());
var S={view:HASB?'basics':'study',cond:D.conditions[0].id,sec:'path',cmp:false,c2:null,
 self:store.get('self',false),hy:store.get('hy',true),rev:store.get('rev',{}),theme:store.get('theme','auto'),
 open:store.get('sopen2',{}),gopen:store.get('gopen2',{__readings:false}),
 side:store.get('side',true),drawer:false,dopen:{},dfilter:null,pfilter:null,
 qa:{},card:0,flip:false,deck:ALLCARDS.slice(),bi:store.get('bi',0),ri:store.get('ri',0),ci:0,qi:0};
function rk(c,s){return c+':'+s}
function isMobile(){return window.matchMedia&&window.matchMedia('(max-width:899px)').matches}

/* ---------- visual pathophysiology ---------- */
function arrowSVG(){return '<svg class="pv-arrow" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 1v22M4 16l8 9 8-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function flowNodes(steps,lab){
  lab=lab||{};var n=steps.length;
  return steps.map(function(s,i){
    var txt=typeof s==='string'?s:s.t;
    var kind=i===0?'trigger':(i===n-1?'result':'mid');
    var tag=i===0?(lab.first||'Trigger'):(i===n-1?(lab.last||'Net result'):'Step '+(i+1));
    var pct=n>1?Math.round(8+i/(n-1)*20):16;
    return '<div class="pv-node '+kind+'" style="--p:'+pct+'%"><span class="pv-tag">'+tag+'</span><p>'+md(txt)+'</p></div>'+(i<n-1?arrowSVG():'');
  }).join('');
}
function pathoVisual(c){
  var p=c.patho,h='<div class="pv"><div class="pv-main"><div class="pv-col">'+flowNodes(p.chain)+'</div>';
  if(p.compensation||p.tip){
    h+='<div class="pv-side">';
    if(p.compensation)h+='<div class="pv-comp"><span class="pv-tag">Body compensates</span><p>'+md(p.compensation)+'</p></div>';
    if(p.tip)h+='<div class="pv-tip"><span class="pv-tag">Memory aid</span><p>'+md(p.tip)+'</p></div>';
    h+='</div>';
  }
  h+='</div><div class="pv-signs">'+arrowSVG()+'<span class="pv-tag">What the nurse sees</span><div class="chipsrow">'+
    c.manifestations.map(function(m){return '<span class="chipsign">'+md(m[0])+'</span>'}).join('')+'</div></div></div>';
  return h;
}

/* ---------- drug cards ---------- */
function listUL(a){return a&&a.length?'<ul class="plain">'+a.map(function(x){return '<li>'+md(x)+'</li>'}).join('')+'</ul>':'<p class="muted">Not listed in your materials.</p>'}
function drugKey(c,d){return 'd-'+c.id+'-'+String(d.id||d.generic).replace(/[^a-z0-9]+/gi,'-').toLowerCase()}
function vf(d,f){return d.verify&&d.verify.indexOf(f)>-1?'<span class="vfy" title="Not found in your materials. Verify before relying on it.">\u2691 Verify</span>':''}
function dsec(n,title,badge,body,wide){return '<section class="ds'+(wide?' wide':'')+'"><h5><span class="dnum">'+n+'</span>'+title+badge+'</h5>'+body+'</section>'}
function pairRows(list){return list&&list.length?list.map(function(r){return '<div class="row"><b>'+md(r[0])+'</b>'+(r[1]?'<span class="val">'+md(r[1])+'</span>':'')+'</div>'}).join(''):'<p class="muted">Not listed in your materials.</p>'}
var VLAB={names:'names and class',moa:'mechanism',indications:'indications',dose:'dose and route',assess:'assessments and labs',effects:'side effects',avoid:'contraindications and interactions',teach:'patient education'};
function drugCard(c,d,openFirst){
  var k=drugKey(c,d),isOpen=S.dopen[k]!==undefined?S.dopen[k]:!!openFirst;
  var e=d.effects||{},a=d.assess||{},v=d.avoid||{};
  var h='<details class="card drug" id="'+k+'" style="--c:'+c.color+'"'+(isOpen?' open':'')+'><summary><span class="dn"><b>'+esc(d.generic)+'</b>'+(d.brands&&d.brands.length?'<small>'+esc(d.brands.join(', '))+'</small>':'')+'</span><span class="dpills"><span class="dpill">'+esc(d.cls)+'</span>'+(d.suffix?'<span class="dpill sfx">'+esc(d.suffix)+'</span>':'')+'</span></summary><div class="body">';
  if(e.boxed)h+='<div class="boxed"><b>\u26D4 Black box warning:</b> '+md(e.boxed)+'</div>';
  h+='<div class="dgrid">';
  h+=dsec('1','Names, class, suffix',vf(d,'names'),'<div class="names"><b>Generic</b><span>'+esc(d.generic)+'</span><b>Brand</b><span>'+(d.brands&&d.brands.length?esc(d.brands.join(', ')):'Not listed')+'</span><b>Class</b><span>'+md(d.cls)+'</span><b>Suffix</b><span>'+(d.suffix?esc(d.suffix):'No standard suffix')+'</span></div>');
  h+=dsec('2','Mechanism of action',vf(d,'moa'),'<p>'+md(d.moa)+'</p>');
  h+=dsec('3','Indications: why it is prescribed',vf(d,'indications'),listUL(d.indications));
  h+=dsec('4','Safe dose and route',vf(d,'dose'),'<div>'+(d.dose||[]).map(function(r){return '<div class="drow"><b>'+md(r[0])+'</b><span>'+md(r[1])+'</span></div>'}).join('')+'</div>');
  h+=dsec('5','Key assessments and labs',vf(d,'assess'),'<div class="sub">Before giving</div>'+pairRows(a.before)+'<div class="sub">After giving and ongoing</div>'+pairRows(a.after),true);
  h+=dsec('6','Side effects and adverse reactions',vf(d,'effects'),'<div class="fx"><div class="ok"><h6>Common and expected</h6>'+listUL(e.common)+'</div><div class="no"><h6>Life-threatening: report or hold</h6>'+listUL(e.serious)+'</div></div>',true);
  h+=dsec('7','Contraindications and interactions',vf(d,'avoid'),'<div class="sub">Who should not take it</div>'+listUL(v.contra)+'<div class="sub">Major drug and food clashes</div>'+listUL(v.interactions));
  h+=dsec('8','Patient education: teach and report',vf(d,'teach'),listUL(d.teach));
  h+='</div>';
  if(d.verify&&d.verify.length)h+='<p class="vnote">\u2691 Not found in your materials: '+d.verify.map(function(f){return VLAB[f]||f}).join(', ')+'. Verify against your drug guide before relying on it.</p>';
  return h+'</div></details>';
}
function medsHTML(c){
  if(!hasDrugs(c))return '<p class="muted">No medications are listed for this condition in your materials.</p>';
  return c.drugs.map(function(d,i){return drugCard(c,d,i===0)}).join('');
}

/* ---------- procedure cards ---------- */
var PLAB={indication:'why it is done',steps:'steps',before:'before',during:'during',after:'after',complications:'complications',teach:'patient teaching'};
function procKey(c,p){return 'p-'+c.id+'-'+String(p.id||p.name).replace(/[^a-z0-9]+/gi,'-').toLowerCase()}
function procCard(c,p,openFirst){
  var k=procKey(c,p),isOpen=S.dopen[k]!==undefined?S.dopen[k]:!!openFirst,n=0;
  function num(){n++;return String(n)}
  var h='<details class="card drug proc" id="'+k+'" style="--c:'+c.color+'"'+(isOpen?' open':'')+'><summary><span class="dn"><b>'+esc(p.name)+'</b>'+(p.aka?'<small>'+esc(p.aka)+'</small>':'')+'</span><span class="dpills"><span class="dpill">'+esc(p.kind)+'</span></span></summary><div class="body"><div class="dgrid">';
  h+=dsec(num(),'Why it is done for this condition',vf(p,'indication'),'<p>'+md(p.indication)+'</p>',true);
  h+=dsec(num(),'What happens, step by step',vf(p,'steps'),pairs(p.steps,true),true);
  h+=dsec(num(),'Before: what the nurse does and checks',vf(p,'before'),pairs(p.before,true),true);
  if(p.during&&p.during.length)h+=dsec(num(),'During: what the nurse watches',vf(p,'during'),pairs(p.during,true),true);
  h+=dsec(num(),'After: monitoring and care',vf(p,'after'),pairs(p.after,true),true);
  h+=dsec(num(),'Complications',vf(p,'complications'),'<div class="fx" style="grid-template-columns:1fr"><div class="no"><h6>Report right away</h6>'+listUL(p.complications)+'</div></div>');
  h+=dsec(num(),'Patient education',vf(p,'teach'),listUL(p.teach));
  h+='</div>';
  if(p.verify&&p.verify.length)h+='<p class="vnote">\u2691 Not found in your materials: '+p.verify.map(function(f){return PLAB[f]||f}).join(', ')+'. Verify against your skills lab, your textbook, and your facility policy before you rely on it.</p>';
  return h+'</div></details>';
}
function procsHTML(c){
  if(!hasProcs(c))return '<p class="muted">No procedures are listed for this condition in your materials.</p>';
  return c.procedures.map(function(p,i){return procCard(c,p,i===0)}).join('');
}

/* ---------- section content ---------- */
function pairs(list,reveal){
  return list.map(function(r){
    return '<div class="row'+(reveal?' reveal':'')+'" '+(reveal?'data-a="reveal" tabindex="0"':'')+'><b>'+md(r[0])+'</b>'+
      (r[1]?'<span class="'+(reveal?'why':'val')+'">'+md(r[1])+'</span>':'')+
      (reveal?'<span class="hint">Tap to reveal why</span>':'')+'</div>';
  }).join('');
}
function calloutHTML(x){
  var ty=esc(x.type||'info');
  return '<div class="callout '+ty+'"><span class="lbl">'+(x.type==='book'?'\uD83D\uDCD6 ':'')+esc(x.label)+'</span>'+md(x.text)+(x.source?'<span class="csrc">'+esc(x.source)+'</span>':'')+'</div>';
}
function callouts(c,key){
  return (c.callouts||[]).filter(function(x){return (x.in||'comp')===key}).map(calloutHTML).join('');
}
function figHTML(f,color){
  var body='';
  if(f.image)body='<img src="'+esc(f.image)+'" alt="'+esc(f.alt||f.title||'Textbook figure')+'">';
  else if(f.steps)body='<div class="pv"><div class="pv-col">'+flowNodes(f.steps)+'</div></div>';
  return '<figure class="fig" style="--c:'+color+'"><figcaption class="figt"><span class="figtag">Textbook figure</span>'+esc(f.title||'')+'</figcaption>'+body+
    '<div class="figsrc">'+(f.image?'Image from your textbook, for your own study. Do not share. ':'Redrawn in simple form from your textbook. ')+(f.source?esc(f.source):'')+'</div>'+(f.caption?'<p class="figcap">'+md(f.caption)+'</p>':'')+'</figure>';
}
function figuresHTML(c,key){
  return (c.figures||[]).filter(function(f){return (f.in||'path')===key}).map(function(f){return figHTML(f,c.color)}).join('');
}
function actsHTML(c){
  var acts=c.nursing.act,tiered=acts.some(function(r){return r[2]});
  if(!tiered)return '<div class="sub">Interventions and rationale</div>'+pairs(acts,true);
  var lab={1:'Priority 1: do first',2:'Priority 2: next',3:'Priority 3: ongoing'};
  var h='<div class="sub">Priority interventions and rationale</div>';
  if(c.nursing.order)h+='<div class="note"><b>Why this order:</b> '+md(c.nursing.order)+'</div>';
  [1,2,3].forEach(function(t){
    var g=acts.filter(function(r){return (r[2]||3)===t});
    if(g.length)h+='<div class="tier t'+t+'"><span class="tbadge">'+lab[t]+'</span>'+pairs(g,true)+'</div>';
  });
  return h;
}
function secHTML(c,key){
  var h='';
  if(key==='path')h=pathoVisual(c);
  else if(key==='man'){h=pairs(c.manifestations,true)}
  else if(key==='lab'){h=pairs(c.labs,false)}
  else if(key==='risk'){h=pairs(c.risks,false)}
  else if(key==='tx'){h=pairs(c.management,true)}
  else if(key==='meds'){h=medsHTML(c)}
  else if(key==='proc'){h=procsHTML(c)}
  else if(key==='rn'){h='<div class="sub">Priority assessments</div>'+pairs(c.nursing.assess,true)+actsHTML(c)}
  else if(key==='edu'){h=pairs(c.education,false)}
  else if(key==='comp'){h='<ul class="plain">'+c.complications.map(function(x){return '<li>'+md(x)+'</li>'}).join('')+'</ul>'}
  return h+figuresHTML(c,key)+callouts(c,key);
}
function secTitle(k){for(var i=0;i<SECS.length;i++)if(SECS[i][0]===k)return SECS[i][1]+' '+SECS[i][2];return ''}
function bridgeHTML(c){
  if(!c.bridge||!c.bridge.length)return '';
  return '<div class="bridge" style="--c:'+c.color+'"><div class="bridgehd">\uD83D\uDD17 Connect the courses</div><div class="bridgegrid">'+
    c.bridge.map(function(b){return '<div><b>'+esc(b[0])+'</b><p>'+md(b[1])+'</p></div>'}).join('')+'</div></div>';
}

/* ---------- concept map view ---------- */
function panel(c,key){
  return '<section class="card panel" style="--c:'+c.color+'"><h3>'+esc(c.name)+'<small>'+secTitle(key)+'</small></h3>'+secHTML(c,key)+'</section>';
}
function mapView(){
  var c=find(S.cond),secs=secsFor(c),done=0,h='';
  if(!secs.some(function(s){return s[0]===S.sec}))S.sec='path';
  secs.forEach(function(s){if(S.rev[rk(c.id,s[0])])done++});
  h+='<p class="intro">Pick a condition, then tap any branch. Turn on compare to read two conditions side by side. Use the Topics menu to jump anywhere.</p><div class="chips" role="group" aria-label="Choose a condition">';
  D.conditions.forEach(function(x){h+='<button class="chip" style="--c:'+x.color+'" data-a="cond" data-v="'+x.id+'" aria-pressed="'+(x.id===c.id)+'"><i></i>'+esc(x.short||x.name)+'</button>'});
  h+='</div><div class="card mapbox" style="--c:'+c.color+'"><div class="map"><svg class="spokes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><circle cx="50" cy="50" r="38"/>';
  var n=secs.length,pos=secs.map(function(s,i){var a=(-90+360/n*i)*Math.PI/180;return [50+37*Math.cos(a),50+38*Math.sin(a)]});
  pos.forEach(function(p){h+='<line x1="50" y1="50" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'});
  h+='</svg><div class="center"><h2>'+esc(c.name)+'</h2><div class="sig">'+c.sig.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div></div>';
  secs.forEach(function(s,i){
    var d=S.rev[rk(c.id,s[0])];
    h+='<button class="node'+(d?' done':'')+'" style="'+(n>9?'--w:20%;--mw:112px;':'')+'--c:'+c.color+';--x:'+pos[i][0].toFixed(1)+'%;--y:'+pos[i][1].toFixed(1)+'%" data-a="sec" data-v="'+s[0]+'" aria-pressed="'+(S.sec===s[0])+'"><b>'+s[1]+' '+s[2]+'</b><span>'+s[3]+'</span></button>';
  });
  h+='</div><div class="prog"><span>'+done+' of '+n+' branches reviewed</span><div class="bar"><div style="width:'+(done/n*100)+'%"></div></div></div></div>';
  if(D.conditions.length>1){
    var other=D.conditions.filter(function(x){return x.id!==c.id});
    if(!S.c2||S.c2===c.id)S.c2=(c.pair&&c.pair!==c.id)?c.pair:other[0].id;
    h+='<div class="ctl"><label><input type="checkbox" data-a="cmp" '+(S.cmp?'checked':'')+'> Compare side by side with</label><select data-a="c2" aria-label="Condition to compare">'+
      other.map(function(x){return '<option value="'+x.id+'"'+(x.id===S.c2?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select></div>';
  }
  var two=S.cmp&&D.conditions.length>1;
  h+='<div class="detail'+(two?' two':'')+'" id="detail">'+panel(c,S.sec)+(two?panel(find(S.c2),S.sec):'')+'</div>';
  var isr=!!S.rev[rk(c.id,S.sec)];
  h+='<button class="btn revbtn'+(isr?'':' primary')+'" data-a="rev">'+(isr?'Reviewed. Tap to undo':'Mark this branch as reviewed')+'</button>'+bridgeHTML(c)+readingLinks(c);
  return h;
}

/* ---------- study guide view ---------- */
function normalsHTML(){
  if(!D.normals||!D.normals.length)return '';
  return '<details class="card sec" open style="--c:var(--accent)"><summary><span class="num">\u2713</span> Normal values to know cold ('+esc(D.meta.valuesSource||'Galen Standardized Values')+')</summary><div class="body"><div class="vals">'+
   D.normals.map(function(n){return '<div class="valpill"><b>'+esc(n[0])+'</b><span>'+esc(n[1])+'</span>'+(n[2]?'<small>'+esc(n[2])+'</small>':'')+'</div>'}).join('')+'</div></div></details>';
}

function pager(kind,i,n,labels,bottom){
  var p=i>0?labels(i-1):'',x=i<n-1?labels(i+1):'';
  return '<nav class="pager'+(bottom?' bottom':'')+'" aria-label="Page navigation"><button class="pgbtn" data-a="pg" data-k="'+kind+'" data-v="'+(i-1)+'"'+(i>0?'':' disabled')+'><small>← Previous</small>'+esc(p||'Start')+'</button>'+
   '<span class="pgmid">'+(i+1)+' of '+n+'</span>'+
   '<button class="pgbtn" data-a="pg" data-k="'+kind+'" data-v="'+(i+1)+'"'+(i<n-1?'':' disabled')+'><small>Next →</small>'+esc(x||'End')+'</button></nav>';

function condIndex(id){for(var i=0;i<D.conditions.length;i++)if(D.conditions[i].id===id)return i;return 0}
function condLabel(i){var c=D.conditions[i];return c.short||c.name}
function guideView(){

  h+=bridgeHTML(c)+readingLinks(c);
  secsFor(c).forEach(function(sx,i){
    var id='s-'+c.id+'-'+sx[0],op=S.dopen[id]!==undefined?S.dopen[id]:(i===0);
    h+='<details class="card sec" id="'+id+'" style="--c:'+c.color+'"'+(op?' open':'')+'><summary><span class="num">'+(i+1)+'</span> '+sx[1]+' '+sx[2]+'</summary><div class="body">'+secHTML(c,sx[0])+'</div></details>';
  });
  (D.selfChecks||[]).filter(function(x){return x.after===c.id}).forEach(function(x){h+=selfCheckHTML(x,c.color)});
  if(c.sbar)h+='<div class="sbar" style="--c:'+c.color+'"><div class="hd">'+esc(c.sbar.title||('SBAR: '+c.name))+'</div>'+
    [['Situation',c.sbar.s],['Background',c.sbar.b],['Assessment',c.sbar.a],['Recommendation',c.sbar.r]].map(function(r){return '<div class="seg"><b>'+r[0]+'</b>'+md(r[1])+'</div>'}).join('')+'</div>';
  if(ci===0||S.shownorm){h+=normalsHTML()}else{h+='<button class="lnk" data-a="shownorm" style="margin-top:14px">Show the Galen normal values</button>'}
  h+=pager('cond',ci,D.conditions.length,condLabel,true);
  return h;

/* ---------- drug cards view ---------- */
function suffixRows(){
  var m={},order=[];
  D.conditions.forEach(function(c){(c.drugs||[]).forEach(function(d){
    if(!d.suffix)return;var k=d.suffix+'|'+d.cls;
    if(!m[k]){m[k]={s:d.suffix,c:d.cls,n:[]};order.push(k)}
    if(m[k].n.indexOf(d.generic)<0)m[k].n.push(d.generic);
  })});
  return order.map(function(k){return m[k]});
}
function drugsView(){
