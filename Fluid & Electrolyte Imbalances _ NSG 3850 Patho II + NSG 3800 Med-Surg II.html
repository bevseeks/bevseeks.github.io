.tier.t2 .tbadge{background:var(--warn)}.tier.t3 .tbadge{background:var(--ok)}
body[data-dark="1"] .tbadge{color:#10201a}
/* ---------- textbook callouts, figures, bridge ---------- */
.csrc{display:block;margin-top:4px;font-size:.78rem;color:var(--muted);font-style:italic}
.fig{margin:12px 0;padding:10px 12px;border:1.5px solid var(--book);border-radius:12px;background:color-mix(in srgb,var(--book) 5%,var(--surface))}
.figt{font-weight:700;margin-bottom:8px}

.fig img{max-width:100%;height:auto;border-radius:8px;display:block;margin:0 auto;background:#fff}
.figsrc{font-size:.78rem;color:var(--muted);margin-top:6px}.figcap{margin:6px 0 0}
.bridge{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:12px 0;overflow:hidden}
.bridgehd{background:var(--surface2);padding:7px 14px;font-weight:700;border-bottom:1px solid var(--line)}
.bridgegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.bridgegrid>div{padding:8px 14px;border-top:3px solid var(--c)}.bridgegrid p{margin:2px 0 0}
.muted{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.links .pv-tag{margin:0 4px 0 0}
.rdmeta{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.startcard{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;margin:0 0 14px}
.startcard b{margin-right:4px}
ol.kp{margin:0;padding-left:22px}ol.kp li{margin:6px 0}
.proc .dpill{text-transform:capitalize}.proc .dn b{text-transform:none}

details.drug{margin:12px 0;border-top:5px solid var(--c);overflow:hidden}
details.drug>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
details.drug>summary::-webkit-details-marker{display:none}
details.drug>summary::before{content:"\203A";font-size:1.3rem;transition:transform .2s;opacity:.6}
details.drug[open]>summary::before{transform:rotate(90deg)}
.dn b{font-family:var(--serif);font-size:1.12rem;text-transform:capitalize}
.dn small{display:block;color:var(--muted);font-size:.8rem}
.dpills{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.dpill{border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid var(--c)}
.dpill.sfx{background:var(--c);color:#fff}
details.drug .body{padding:0 16px 14px}
.boxed{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-radius:10px;padding:8px 12px;margin:0 0 12px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ds{border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;background:var(--surface)}
.ds.wide{grid-column:1/-1}
.ds h5{margin:0 0 6px;font-family:var(--sans);font-size:.88rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.ds p{margin:0}
.vfy{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:0 8px}

.names{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.names b{color:var(--muted);font-weight:600}
.sfxtab{margin:0 0 12px;overflow:hidden}.sfxtab summary{padding:10px 14px;font-weight:700;cursor:pointer}.sfxtab .tablewrap{margin:0 12px 12px}

.case{padding:14px;margin-bottom:10px}

@media (max-width:760px){.abg{grid-template-columns:1fr}}

.okmark{color:var(--c);margin-left:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.pager .pgbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;max-width:44%;text-align:left;line-height:1.25}
.pager .pgbtn:last-child{text-align:right}
.pager .pgbtn[disabled]{opacity:.35;cursor:default}
.pager .pgbtn small{display:block;color:var(--muted);font-weight:500;font-size:.75rem}
.pager .pgmid{font-size:.85rem;color:var(--muted);text-align:center;flex:1;min-width:80px}
.pager.bottom{margin:22px 0 0;padding-top:14px;border-top:1px solid var(--line)}

.qdots{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}

.qdots button.ok{background:color-mix(in srgb,var(--ok) 22%,var(--surface))}
.qdots button.no{background:color-mix(in srgb,var(--bad) 22%,var(--surface))}
.cmpsel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%;margin:0 0 12px}
.sidehide{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 9px;font-size:.8rem;font-weight:600}
.rail{display:none}

F", "**Vascular** (plasma, protein-rich), **interstitial** (between cells, few proteins), and **transcellular** (cerebrospinal, pleural, synovial, digestive fluids, secreted by epithelial cells)."], ["How much of you is water", "About **60% of body weight in an adult man, 50% in a woman** (more body fat). Infants are about 75% water. ==Total body water falls with aging==, so older adults have less reserve."], ["1 liter = 1 kilogram", "A liter of fluid weighs about 1 kg (2.2 lb). That is why a ==sudden weight change is the most sensitive sign== of a fluid volume change: you cannot gain or lose a kilogram of fat overnight."], ["Normal output routes", "Urine (largest, controlled by hormones), stool, lungs (exhaled water), and skin (sweat plus insensible loss)."], ["Abnormal loss routes", "Vomiting, diarrhea, nasogastric (NG) suction, fistulas, wounds, burns, hemorrhage, paracentesis, drains."], ["Third spacing", "Fluid shifts into a space where it is trapped and useless (ascites, bowel obstruction, burns). It is still in the body, but the vascular space is short, so the client looks volume depleted, often with **no weight loss**."]], "keyTerms": [["Body fluid", "water within the body plus the particles dissolved in it"], ["Insensible loss", "water lost through skin and lungs that cannot be seen or measured directly"], ["Third spacing", "fluid moved into a body space where it cannot support circulation"]], "whyItMatters": "Every imbalance in this unit is a problem of **which compartment** has too much or too little. Potassium, magnesium, and phosphate are mostly inside cells, so a serum level only shows the small part in the ECF; sodium rules the ECF, so it decides where water goes.", "check": {"prompt": "Why is a sudden overnight weight change a better measure of fluid status than the dietary history?", "model": "One liter of fluid weighs about one kilogram, and nobody gains or loses a kilogram of fat or muscle overnight. So a sudden change in weight is almost entirely one → volume excess and hypokalemia; too little (adrenal insufficiency) → volume deficit and hyperkalemia.=="], ["Renin-angiotensin-aldosterone system (RAAS)", "Low kidney perfusion → renin → angiotensin I → (ACE, angiotensin-converting enzyme) → **angiotensin II**, which constricts arteries and triggers aldosterone."], ["Natriuretic peptides (ANP, BNP)", "Released when the heart is **stretched** by too much volume. They cause sodium and water excretion (natriuresis) and oppose aldosterone. **BNP** is measured as a marker of heart failure and fluid overload (Galen: < 100 pg/mL)."], ["Thirst", "Triggered by high osmolality (osmoreceptors), low blood volume (baroreceptors and angiotensin II), and a dry mouth. ==Osmoreceptor thirst weakens with aging==, so older adults may not feel thirsty while dehydrating."], ["Parathyroid hormone (PTH) and calcitonin", "PTH raises serum calcium (pulls it from bone, increases gut and kidney absorption) and lowers phosphate. Calcitonin from the thyroid lowers calcium."]], "keyTerms": [["Osmoreceptor", "hypothalamic sensor that detects a rise in serum concentration"], ["Natriuresis", "excretion of sodium in the urine"], ["SIADH", "syndrome of inappropriate antidiuretic hormone: too much ADH, water retained, sodium diluted"]], "whyItMatters": "Most of this unit follows from two hormones: ==ADH problems are sodium (concentration) problems; aldosterone problems are volume and potassium problems.== Heart failure, cirrhosis, Cushing's, and steroids all keep aldosterone-like effects switched on, which is why they cause both edema and low potassium.", "check": {"prompt": "Explain the difference between what ADH does and what aldosterone does, and predict which electrolyte problem each one causes when there is too much of it.", "model": "ADH makes the kidneys keep plain water, so it dilutes the blood; too much ADH causes dilutional hyponatremia. Aldosterone makes the kidneys keep sodium and water together, which expands volume without changing the concentration, and it makes the kidneys excrete potassium; too much aldosterone causes volume excess and hypokalemia.", "keys": [{"label": "ADH keeps water only", "any": ["adh", "antidiuretic", "water"]}, {"label": "too much ADH → low sodium (dilution)", "any": ["hyponat", "dilut", "low sodium", "na low", "low na"]}, {"label": "aldosterone keeps sodium + water (volume)", "any": ["aldosterone", "sodium and water", "salt", "saline", "volume"]}, {"label": "aldosterone wastes potassium", "any": ["potassium", "k+", "hypokal", "excrete k"]}]}, "figures": [{"title": "Fluid regulation cycle (ADH and RAAS)", "in": "path", "source": "Brunner Ch. 10, Fig. 10-5 and RAAS text, pp. 236 to 238 (redrawn)", "steps": ["ECF volume ↓ or osmolality ↑", "Osmoreceptors → thirst + ADH release; low renal perfusion → renin", "Angiotensin II → vasoconstriction + aldosterone", "Kidneys reabsorb water (ADH) and sodium + water (aldosterone)", "BP and volume rise; urine output falls and becomes concentrated"], "caption": "When the cycle is working, ==a small volume of concentrated urine (specific gravity > 1.020) is a healthy response to a volume deficit==, not kidney failure."}], "links": ["hypoNa", "hyperNa", "hyperv", "hypoK"]}, {"id": "ivfluids", "title": "IV fluid tonicity: isotonic, hypotonic, hypertonic", "cat": "Fluid Volume & Concentration", "summary": "An IV fluid's **tonicity** compared with plasma decides where the water goes once it enters the vein. Isotonic fluids stay in the ECF and expand volume; hypotonic fluids move water **into cells**; hypertonic fluids pull water **out of cells**.", "parts": [["Isotonic: 0.9% NaCl (normal saline), lactated Ringer's (LR)", "Same osmolality as plasma (Brunner: 0.9% NaCl is 308 mOsm/L). ==Expands ECF volume without shifting water into or out of cells== → first choice for hypovolemia and hypotension. Normal saline is the **only** solution given with blood products. Watch for overload in heart failure and kidney disease."], ["Lactated Ringer's specifics", "Contains potassium and calcium; lactate is converted to bicarbonate. Avoid in lactic acidosis, pH > 7.5, and kidney injury (it contains potassium)."], ["D5W (5% dextrose in water)", "==Isotonic in the bag but hypotonic in the body==: the dextrose is metabolized and leaves free water that moves into cells. Use it to give free water (hypernatremia); do not use it for resuscitation or with head injury (cerebral swelling)."], ["Hypotonic: 0.45% NaCl (half-normal saline)", "Fewer particles than plasma, so water shifts **into cells**. Treats cellular dehydration and hypernatremia. ==Avoid in increased intracranial pressure and third spacing.=="], ["Hypertonic: 3% or 5% NaCl, mannitol", "More particles than plasma, so water is pulled **out of cells** into the vessels. Used for severe symptomatic hyponatremia and cerebral edema, given ==slowly, by pump, with close monitoring== (risk of overload and pulmonary edema). Often needs a central line."], ["Colloids: albumin, dextran", "Large particles stay in the vessels and add oncotic pull; used as plasma expanders. Crystalloids (saline, LR) exert no oncotic pressure, so about 3 L of crystalloid replaces 1 L of blood loss (Brunner)."], ["Pure water IV", "Never given: it enters red blood cells and makes them burst (hemolysis)."]], "keyTerms": [["Tonicity", "the effect a solution's particle concentration has on water movement and cell size"], ["Crystalloid", "water with dissolved mineral salts (saline, LR)"], ["Colloid", "solution with large particles (proteins) that exert oncotic pressure"]], "whyItMatters": "Choosing the fluid is choosing where water goes. Hypovolemia needs isotonic volume; hypernatremia needs free water slowly; hyponatremia with seizures needs a little hypertonic saline, slowly. ==Correcting sodium too fast in either direction injures the brain.==", "check": {"prompt": "Why does the provider start isotonic saline, not D5W, for a hypotensive client with hypovolemia?", "model": "Isotonic saline has the same concentration as plasma, so it stays in the extracellular space and expands the vascular volume to raise blood pressure. D5W becomes free water once the dextrose is used, so most of it moves into the cells instead of staying in the vessels, and it can lower the sodium and cause hyperglycemia.", "keys": [{"label": "isotonic stays in the ECF / vessels", "any": ["stay", "extracellular", "vascular", "vessel", "ecf", "plasma"]}, {"label": "expands volume and raises BP", "any": ["expand", "volume", "bp", "blood pressure", "perfus"]}, {"label": "D5W becomes free water", "any": ["free water", "metaboliz", "hypotonic", "dextrose is used", "sugar is used"]}, {"label": "free water moves into cells, not the vessels", "any": ["into cell", "intracellular", "cells", "leaves the vessel"]}]}, "links": ["hypov", "hyperNa", "hypoNa", "dehyd"]}, {"id": "excite", "title": "Electrolytes and excitable cells: the body's utility system", "cat": "Potassium Imbalances", "summary": "Nerve, skeletal muscle, smooth muscle, and heart cells fire because of the electrical difference across their membranes. **Potassium sets the resting charge, calcium sets the firing threshold, and magnesium controls how much acetylcholine is released** at the nerve-muscle junction. Phosphate supplies the energy (ATP). Change any one and excitability changes in a predictable direction.", "flow": ["Sodium-potassium pump (3 Na⁺ out, 2 K⁺ in) uses ATP", "High K⁺ inside / high Na⁺ outside sets the resting membrane potential", "Ionized Ca²⁺ sets the threshold the cell must reach to fire", "Mg²⁺ limits acetylcholine release at the neuromuscular junction", "Normal, coordinated nerve, muscle, and heart activity"], "parts": [["The city analogy (your Patho slides)", "**Sodium = water department** (where water goes), **potassium = electricity grid** (keeps the heart's lights on), **calcium = construction company** (bones, clotting, muscle alarms), **magnesium = traffic control** (keeps signals in sync), **phosphate = power plant** (ATP)."], ["Potassium and the resting potential", "Low K⁺ **hyperpolarizes** cells (farther from firing → sluggish), high K⁺ **hypopolarizes** them (closer to firing, then stuck unable to fire again). ==Both cause weakness and dysrhythmias, by opposite mechanisms.=="], ["Calcium and the threshold", "Low Ca²⁺ **lowers** the threshold, so nerves fire too easily (tingling, twitching, tetany). High Ca²⁺ **raises** it, so nerves and muscles are sluggish (weakness, constipation, low reflexes)."], ["Magnesium and acetylcholine", "Mg²⁺ normally holds back acetylcholine (ACh) release. Low Mg²⁺ → **more ACh** → hyperexcitable. High Mg²⁺ → **less ACh** → depressed reflexes and breathing. ==Magnesium mirrors calcium.=="], ["Phosphate and ATP", "Phosphate builds ATP and 2,3-BPG (which helps hemoglobin release oxygen). Low phosphate → cells run out of energy and tissues get less oxygen."], ["Plasma vs. total body", "Because K⁺, Mg²⁺, and phosphate live mostly inside cells (the \"electrolyte pools\"; bone stores Ca²⁺, Mg²⁺, phosphate), a serum level can change by a **shift** without any gain or loss. Insulin, epinephrine, and alkalosis push K⁺ and phosphate into cells; acidosis and cell destruction push K⁺ out."], ["How any electrolyte goes wrong (Banasik)", "Every excess is ↑ intake/absorption, a shift out of the pools, or ↓ excretion. Every deficit is ↓ intake/absorption, a shift into the pools, ↑ excretion, or loss through an abnormal route."]], "keyTerms": [["Resting membrane potential", "the electrical charge across a cell membrane at rest, set mainly by the K⁺ gradient"], ["Threshold potential", "the charge a cell must reach to fire an action potential; calcium changes it"], ["Acetylcholine (ACh)", "the neurotransmitter that makes skeletal muscle contract"]], "whyItMatters": "Your slides' summary rule comes straight from this: ==brain → sodium, heart → potassium, tetany → calcium, reflexes → magnesium, low energy → phosphate.== If you know which way excitability moves, you can predict every sign in the electrolyte conditions.", "check": {"prompt": "Both hypocalcemia and hypomagnesemia cause twitching, tetany, and hyperactive reflexes. Explain the mechanism for each.", "model": "Low calcium lowers the threshold potential, so nerve and muscle cells fire too easily. Low magnesium removes the normal brake on acetylcholine release at the neuromuscular junction, so more acetylcholine is released and the muscle is overstimulated. Both end in increased neuromuscular excitability, which is why the signs look the same.", "keys": [{"label": "low Ca lowers the threshold", "any": ["threshold", "fire easier", "fire more easily", "lower thresh"]}, {"label": "low Mg releases more acetylcholine", "any": ["acetylcholine", "ach", "neurotransmitter"]}, {"label": "both increase excitability", "any": ["excitab", "irritab", "overexcit", "hyperexcit", "overstimul"]}, {"label": "calcium and magnesium act alike", "any": ["same", "mirror", "both", "similar"]}]}, "figures": [{"title": "Magnesium and acetylcholine at the neuromuscular junction", "in": "path", "source": "Banasik Ch. 24, Fig. 24.11, p. 545 (redrawn)", "steps": ["Nerve impulse reaches the motor nerve ending", "Normal Mg²⁺ suppresses acetylcholine release to a normal amount", "Low Mg²⁺ → extra acetylcholine → twitching, tremor, hyperreflexia, tetany", "High Mg²⁺ → too little acetylcholine → weak reflexes, flaccid paralysis, respiratory depression"], "caption": "This is why ==you check deep tendon reflexes to track magnesium.=="}], "links": ["hypoK", "hyperK", "hypoCa", "hypoMg", "hyperMg", "hypoPhos"]}, {"id": "clues", "title": "Telling the look-alikes apart: which electrolyte, which direction?", "cat": "Calcium Imbalances", "summary": "Many electrolyte imbalances share signs (weakness, dysrhythmias, tetany, confusion). Exams test the **one deciding cue** for each. Use your Patho slides' clue table: the organ that is most affected names the electrolyte, and the direction of excitability names hypo versus hyper.", "parts": [["Confusion, seizures, coma", "==Think sodium.== Both hyponatremia (cells swell) and hypernatremia (cells shrink) cause the same brain signs; the **serum sodium, thirst, and volume picture** decide which."], ["Heart rhythm changes", "==Think potassium first== (also magnesium and calcium). The **T wave** separates them: low K⁺ → flat or inverted T and a **U wave**; high K⁺ → **tall, peaked T**."], ["Tetany, Chvostek and Trousseau signs", "==Think low calcium; also low magnesium and high phosphate== (high phosphate binds calcium). If tetany does not respond to calcium, check magnesium."], ["Deep tendon reflex (DTR) changes", "==Think magnesium (also calcium).== Low Mg²⁺ and low Ca²⁺ → hyperactive reflexes; high Mg²⁺ and high Ca²⁺ → depressed reflexes."], ["Low energy, profound weakness, respiratory muscle failure", "==Think low phosphate== (no ATP), especially after refeeding or with alcoholism."], ["Weakness that begins in the legs and ascends", "Potassium, high **or** low. Look at the bowel: **low K⁺ → ileus, constipation, distention**; **high K⁺ → cramping, diarrhea**."], ["Weakness with constipation, polyuria, kidney stones, bone pain", "==Think high calcium== (\"stones, bones, groans, moans\" is a common memory aid)."], ["The magnesium-first rule", "Low magnesium makes the kidneys waste potassium and blocks PTH, so ==hypokalemia and hypocalcemia will not correct until magnesium is replaced.=="]], "keyTerms": [["Chvostek sign", "twitching of the facial muscles when the facial nerve in front of the ear is tapped"], ["Trousseau sign", "carpal (hand) spasm within 2 to 5 minutes of inflating a blood pressure cuff above systolic pressure"], ["Tetany", "sustained muscle spasm from increased neural excitability; the hallmark of low calcium and low magnesium"]], "whyItMatters": "Look-alike questions are where students lose points. Before choosing an answer, name the organ (brain, heart, reflexes, energy) and the direction (overexcited or depressed); that usually leaves one electrolyte standing.", "check": {"prompt": "A client has a positive Trousseau sign and hyperactive reflexes, and the tetany does not improve after IV calcium. What electrolyte should be checked next, and why?", "model": "Magnesium. Low magnesium also causes tetany and hyperreflexia because it increases acetylcholine release, and it blocks parathyroid hormone so calcium stays low. Calcium will not correct until the magnesium is replaced.", "keys": [{"label": "check magnesium", "any": ["magnesium", "mg"]}, {"label": "low Mg also causes tetany/hyperreflexia", "any": ["tetany", "reflex", "excit", "acetylcholine", "same signs"]}, {"label": "low Mg blocks PTH / keeps Ca low", "any": ["pth", "parathyroid", "calcium won't", "calcium will not", "keeps calcium low"]}, {"label": "replace Mg first", "any": ["first", "before", "replace mag", "correct mag"]}]}, "links": ["hypoCa", "hypoMg", "hyperPhos", "hypoK", "hyperK", "hyperCa"]}], "readings": [{"id": "bru10a", "chapter": "Chapter 10", "short": "Ch. 10 Fluid & Electrolytes", "book": "Med-Surg: Brunner & Suddarth", "title": "Fluid and Electrolytes (fundamentals, fluid volume, and electrolyte imbalances)", "source": "Hinkle & Cheever, Brunner & Suddarth's Textbook of Medical-Surgical Nursing, 15th ed., Ch. 10, pp. 224 to 258 (syllabus)", "summary": "Brunner builds from chemistry (osmosis, diffusion, filtration, the sodium-potassium pump) to the organs and hormones that keep fluid balanced, then walks through each imbalance with the same headings: pathophysiology, manifestations, diagnostics, medical management, nursing management. Its tables (10-4, 10-6 to 10-11) are the fastest review of causes, signs, and lab findings, and its Quality and Safety Nursing Alerts are the nursing priorities most likely to be tested.", "keyPoints": ["About 60% of adult weight is fluid; ==2/3 is intracellular, 1/3 extracellular==. Third spacing makes the vascular space short without weight loss; the earliest sign is **falling urine output despite adequate intake**.", "Hydrostatic pressure pushes fluid out of capillaries; albumin's oncotic pressure pulls it back. Isotonic fluids expand plasma, hypotonic fluids hydrate cells, hypertonic fluids pull water out of cells.", "Labs: in **hypovolemia**, Hct, BUN (BUN to creatinine ratio above 20:1), urine specific gravity, and osmolality rise; in **hypervolemia** they fall from dilution. Urine specific gravity normal 1.005 to 1.030.", "==Weight: 1 kg (2.2 lb) gained or lost acutely ≈ 1 L of fluid.== Monitor I&O at least every 8 hours; orthostatic hypotension is a systolic drop of more than 20 mmHg from lying to sitting.", "Treat hypovolemia with **isotonic fluid first, then hypotonic** once the client is normotensive; treat hypervolemia with **diuretics, sodium and fluid restriction, semi-Fowler position**, and skin care for edema.", "==Never raise sodium more than 12 mEq/L in 24 hours== (osmotic demyelination); lower a high sodium no faster than 0.5 to 1 mEq/L per hour (cerebral edema).", "Potassium: ==never IV push or IM==; by infusion pump only, after urine output is confirmed; stop and report if output falls below 20 mL/hr for 2 hours. Hypokalemia increases **digoxin toxicity**.", "Hyperkalemia emergency: **IV calcium gluconate** protects the heart (does not lower K⁺); insulin with dextrose, sodium bicarbonate, and beta-2 agonists shift K⁺ into cells; cation exchange resins, diuretics, and dialysis remove it. Rule out **pseudohyperkalemia** (hemolyzed sample).", "Calcium: assess **Chvostek and Trousseau**; correct calcium for low albumin; give IV calcium slowly, never with normal saline or bicarbonate. Hypercalcemia: fluids, mobilize, calcitonin.", "Magnesium mirrors calcium (deficit → irritability; excess → depressed reflexes and breathing); ==IV magnesium needs an independent double check==. Phosphate deficit = ATP deficit (refeeding); phosphate excess = low calcium and soft-tissue calcification (kidney disease)."], "keyTerms": [["Starling's law of capillary forces", "fluid movement across a capillary depends on the balance of hydrostatic and osmotic pressure"], ["Pseudohyperkalemia", "a falsely high potassium from a hemolyzed or poorly drawn sample"], ["Osmotic demyelination", "brain injury (myelin destruction) from correcting low sodium too fast"]], "links": ["hypov", "hyperv", "dehyd", "hypoNa", "hyperNa", "hypoK", "hyperK", "hypoCa", "hyperCa", "hypoMg", "hyperMg", "hypoPhos", "hyperPhos"], "callouts": [{"type": "info", "label": "Note on normal values", "text": "Brunner lists calcium 8.8 to 10.4 mg/dL, magnesium 1.8 to 2.6 mg/dL, phosphorus 2.7 to 4.5 mg/dL, and serum osmolality 275 to 290 mOsm/kg. ==Use Galen's values on exams== (calcium 9 to 10.5, magnesium 1.5 to 2.5 mEq/L, osmolality 285 to 295). Chloride imbalances are in this chapter but are not on your Unit 1 slides."}]}, {"id": "bru10b", "chapter": "Chapter 10", "short": "Ch. 10 Parenteral fluid therapy", "book": "Med-Surg: Brunner & Suddarth", "title": "Fluid and Electrolytes (parenteral fluid therapy)", "source": "Hinkle & Cheever, Brunner & Suddarth 15th ed., Ch. 10, pp. 264 to 269 (syllabus)", "summary": "IV fluids are given to meet daily needs, replace losses, and deliver medications. This section classifies solutions by tonicity, explains D5W's switch from isotonic to hypotonic, and then covers the nurse's job: preventing and managing systemic complications (fluid overload, air embolism, infection) and local ones (phlebitis, infiltration, extravasation, thrombophlebitis, hematoma, clotting).", "keyPoints": ["Isotonic fluids expand the ECF; ==about 3 L of crystalloid is needed to replace 1 L of blood==. Watch clients with heart failure or hypertension for overload.", "**D5W** is isotonic in the bag but becomes free water; avoid it in resuscitation and in clients at risk for increased intracranial pressure. Dextrose 50% and other strongly hypertonic fluids go into **central veins**.", "==Fluid overload==: crackles, cough, restlessness, distended neck veins, edema, weight gain, dyspnea, rapid shallow breathing. Slow the IV, sit the client in **high Fowler's**, check vital signs and lungs, notify the provider.", "**Air embolism**: dyspnea, cyanosis, hypotension, chest pain. Clamp the line, place the client on the ==left side in Trendelenburg==, give oxygen.", "**Phlebitis** (most common complication): redness, warmth, pain along the vein. Remove the IV, restart elsewhere, apply a warm moist compress.", "**Infiltration**: cool, swollen, pale site with slowing flow. Stop the infusion, remove the catheter, elevate. **Extravasation** (vesicants such as potassium or calcium) is grade 4: stop, notify, follow the antidote protocol.", "Prevent complications by checking the site hourly, using infusion pumps, choosing the right catheter size, and avoiding areas of flexion. ==Blood return does not prove the catheter is in the vein.=="], "keyTerms": [["Infiltration", "nonvesicant IV fluid leaking into the surrounding tissue"], ["Extravasation", "a vesicant or irritant leaking into tissue; can cause blistering and necrosis"], ["Phlebitis", "inflammation of a vein from chemical, mechanical, or bacterial irritation"]], "links": ["hypov", "hyperv", "hypoK", "hypoCa"]}, {"id": "bru41", "chapter": "Chapter 41", "short": "Ch. 41 Parenteral nutrition", "book": "Med-Surg: Brunner & Suddarth", "title": "Management of Patients with Intestinal and Rectal Disorders (parenteral nutrition)", "source": "Hinkle & Cheever, Brunner & Suddarth 15th ed., Ch. 41, pp. 1313 to 1318 (syllabus)", "summary": "Parenteral nutrition (PN, also called total parenteral nutrition or TPN) delivers protein, dextrose, fat, electrolytes, vitamins, and trace elements by vein when a client cannot meet needs orally or enterally. Because full PN is very hypertonic, it goes into a central vein. The nurse prevents infection, keeps the rate steady, monitors glucose and electrolytes, and watches for the refeeding shifts that drop phosphate, potassium, and magnesium.", "keyPoints": ["Indicated when a client cannot take at least half of needs for **7 days** (well nourished) or **3 to 5 days** (malnourished); enteral feeding is preferred when the gut works.", "Central PN is about 2000 mOsm/L, so it goes into the superior vena cava; ==dextrose above 10% must not go through a peripheral vein== (phlebitis). Peripheral PN is limited to about 5 to 7 days.", "Start slowly and advance; monitor weight, I&O, glucose, CBC, and chemistry including ==magnesium, phosphorus==, and triglycerides. Starting too fast in a malnourished client drives phosphate into cells (refeeding).", "Inspect the bag: a cracked (oily, separated) solution or white crystals means ==do not hang it==. Use the correct filter (0.22 micron for 2-in-1, 1.2 micron for lipids or 3-in-1).", "Do not speed up or slow down to \"catch up\"; if the bag runs out, hang **10% dextrose** at the same rate to prevent hypoglycemia. Wean gradually to prevent **rebound hypoglycemia**.", "Complications to know: pneumothorax, air embolism, clotted or displaced catheter, sepsis (central line infection), hyperglycemia, fluid overload, rebound hypoglycemia.", "Dressing: transparent dressing changed every 7 days (or gauze every 48 hours) or sooner if damp, loose, or soiled; scrub the hub for 15 seconds before every access."], "keyTerms": [["PICC", "peripherally inserted central catheter; enters an arm vein and ends in the superior vena cava"], ["CLABSI", "central line-associated bloodstream infection"], ["Refeeding syndrome", "dangerous electrolyte shifts (especially low phosphate) when a starved client is fed"]], "links": ["hypoPhos", "hypoMg", "hypoK"]}, {"id": "fp34", "chapter": "F&P Chapter 34", "short": "F&P 34 Fluid volume excess drugs", "book": "Pharmacology: Frandsen & Pennington", "title": "Drug Therapy for Fluid Volume Excess (furosemide, hydrochlorothiazide)", "source": "Frandsen & Pennington, Abrams' Clinical Drug Therapy, 13th ed. (2025), Ch. 34; syllabus assigns nursing implications, furosemide, hydrochlorothiazide", "summary": "Diuretics remove excess fluid by blocking sodium reabsorption in the kidney tubule, and water follows the sodium. Loop diuretics (furosemide) act on the loop of Henle and are the strongest and fastest, the choice for pulmonary edema and when kidney function is reduced. Thiazides (hydrochlorothiazide) act on the distal tubule, are milder, and are used long term for hypertension and edema; they stop working when kidney function is poor.", "keyPoints": ["==Furosemide (loop)==: IV onset about 5 minutes, peak 30 minutes, lasts about 2 hours; oral onset 30 to 60 minutes, lasts 6 to 8 hours. Up to 10 times the sodium loss of a thiazide.", "Give IV furosemide over 1 to 2 minutes; high-dose infusions no faster than 4 mg/min to prevent ==ototoxicity== (assess hearing and tinnitus).", "==Hydrochlorothiazide (thiazide)==: oral, onset about 2 hours, lasts 6 to 24 hours; ineffective when the glomerular filtration rate (GFR) is below 30 mL/min. Do not give the morning of surgery.", "Both are **potassium-wasting**: monitor K⁺, sodium, and magnesium; hypokalemia raises the risk of **digoxin toxicity**. Thiazides also **raise** calcium, glucose, and uric acid.", "Both are sulfonamide-related: ask about **sulfa allergy**. Contraindicated in **anuria**.", "Teach: take in the **morning**, weigh at the same time of day, rise slowly, limit sodium, eat potassium-rich foods (unless told otherwise), use sunscreen, report dizziness or muscle weakness.", "Assess for therapeutic effect: less edema, more urine, lower blood pressure, and fewer crackles and less dyspnea in heart failure."], "links": ["hyperv", "hyperK", "hyperMg", "hyperCa"]}, {"id": "fp35", "chapter": "F&P Chapter 35", "short": "F&P 35 Minerals & electrolytes", "book": "Pharmacology: Frandsen & Pennington", "title": "Nutritional Support Products, Vitamins, and Mineral Supplements (potassium, magnesium, sodium polystyrene sulfonate, glucose and insulin, calcium gluconate)", "source": "Frandsen & Pennington, Abrams' Clinical Drug Therapy, 13th ed. (2025), Ch. 35; syllabus assigns the potassium, magnesium, sodium polystyrene sulfonate, glucose and insulin, and calcium gluconate sections", "summary": "This chapter covers replacing what is low and removing what is high. Potassium chloride is the drug of choice for hypokalemia and must be diluted and pumped, never pushed. Magnesium salts treat hypomagnesemia. For hyperkalemia, the chapter lays out the emergency sequence: calcium gluconate to protect the heart, insulin with glucose and sodium bicarbonate to shift potassium into cells, and cation-exchange resins to remove it.", "keyPoints": ["**Potassium chloride** is preferred because potassium and chloride are usually lost together. Oral: give with or after meals in at least 120 mL of fluid; do not crush extended-release tablets.", "==IV potassium: never undiluted, never IV push.== Peripheral line maximum concentration 10 mEq/100 mL at 10 mEq/hr; check serum K⁺ and **adequate urine output first**.", "Hyperkalemia risk rises with ACE inhibitors, potassium-sparing diuretics, salt substitutes (potassium chloride), and potassium penicillin.", "**Magnesium**: oral oxide or hydroxide for mild deficit (diarrhea is the main side effect); IV/IM magnesium sulfate for moderate to severe deficit. Contraindicated in impaired kidney function.", "==Calcium gluconate 1,000 mg (10 mL of 10%) over 2 to 3 minutes with continuous cardiac monitoring== protects the heart in hyperkalemia; repeat after 5 minutes if ECG changes persist.", "**Regular insulin 10 units IV followed immediately by 50 mL of 50% dextrose** shifts K⁺ into cells; check glucose every hour for 5 to 6 hours.", "**Sodium bicarbonate** treats the acidosis that drives K⁺ out of cells; it is not used alone. **Sodium polystyrene sulfonate (Kayexalate)** removes K⁺ in stool; risk of intestinal necrosis, so it is no longer given with sorbitol."], "links": ["hypoK", "hyperK", "hypoMg", "hypoCa", "hyperMg", "dehyd"]}, {"id": "fp44", "chapter": "F&P Chapter 44", "short": "F&P 44 Calcium & bone", "book": "Pharmacology: Frandsen & Pennington", "title": "Drug Therapy to Regulate Calcium and Bone Metabolism", "source": "Frandsen & Pennington, Abrams' Clinical Drug Therapy, 13th ed. (2025), Ch. 44", "summary": "Three hormones (PTH, calcitonin, and vitamin D) keep serum calcium normal, and calcium and phosphate move in opposite directions. Oral calcium and vitamin D treat chronic low calcium; IV calcium treats acute symptomatic hypocalcemia, a medical emergency. Hypercalcemia is treated with saline rehydration, calcitonin, bisphosphonates, and sometimes phosphate.", "keyPoints": ["PTH raises calcium (bone, gut, kidney) and lowers phosphate; calcitonin lowers calcium; vitamin D increases calcium absorption. ==Calcium and phosphate are inversely related.==", "**IV calcium**: dilute, give slowly with pulse, blood pressure, and ECG monitoring (too fast → dysrhythmias, hypotension); watch the site (irritating); ==never IM==.", "**Oral calcium**: with or after meals; separate from iron, tetracycline, fluoroquinolones, and phenytoin by about 2 hours; bran, spinach, rhubarb, and whole grains reduce absorption.", "Calcium plus **digoxin** raises the risk of digoxin toxicity and dysrhythmias. Thiazides and vitamin D increase calcium; corticosteroids, phosphates, and calcitonin decrease it.", "Check **magnesium** in hypocalcemia: ==hypomagnesemia must be treated before hypocalcemia can be corrected.==", "**Calcitonin** (Miacalcin) lowers calcium in about 2 hours and lasts 6 to 8 hours; best for hypercalcemia from hyperparathyroidism, immobility, or some cancers.", "Hypercalcemia above 14 mg/dL or with severe symptoms is an emergency: ==IV 0.9% saline first== (200 to 300 mL/hr, then titrated to urine output 100 to 150 mL/hr), plus calcitonin; bisphosphonates for long-term control."], "links": ["hypoCa", "hyperCa", "hyperPhos"], "callouts": [{"type": "watch", "label": "Source conflict", "text": "F&P defines hypocalcemia as below 8.5 mg/dL and lists a prolonged QT for hypercalcemia. Galen sets normal at ==9 to 10.5 mg/dL==, and Brunner and your Patho slides tie the **prolonged QT to hypocalcemia** (hypercalcemia shortens the QT). Use Galen and Brunner."}]}, {"id": "ban24", "chapter": "Chapter 24 (Patho)", "short": "Banasik 24 F&E homeostasis", "book": "Patho: Banasik", "title": "Fluid and Electrolyte Homeostasis and Imbalances", "source": "Banasik, Pathophysiology 7th ed., Ch. 24, pp. 531 to 549 (cited on your Patho slides)", "summary": "Banasik organizes everything as intake and absorption, distribution, excretion, and loss through abnormal routes, so every imbalance can be reasoned from those four processes. Fluid problems split into volume (saline) imbalances and concentration (water) imbalances, which can combine as clinical dehydration. Electrolyte signs come from three mechanisms: potassium changes the resting membrane potential, calcium changes the threshold, magnesium changes acetylcholine release, and phosphate changes ATP.", "keyPoints": ["==ECV (extracellular volume) imbalances are saline problems with a normal serum sodium; sodium imbalances are water (concentration) problems.== Clinical dehydration = ECV deficit plus hypernatremia.", "ADH is the **free water** hormone; aldosterone is the **salt water** hormone; natriuretic peptides promote saline excretion.", "==Sudden weight change is the most sensitive measure of ECV imbalance==; postural blood pressure drop with a rising heart rate shows vascular depletion; flat neck veins (deficit) versus distended neck veins and crackles (excess).", "Hyponatremia **swells** brain cells and hypernatremia **shrivels** them; both cause confusion, lethargy, seizures, coma. Speed of change matters as much as the number.", "Edema has four capillary causes: ↑ hydrostatic pressure, ↑ interstitial oncotic pressure, blocked lymph drainage, ↓ plasma oncotic pressure (low albumin).", "Low K⁺ hyperpolarizes and high K⁺ hypopolarizes muscle: ==both cause ascending weakness, flaccid paralysis, and dysrhythmias==. Low K⁺ also causes ileus and polyuria; high K⁺ causes cramping and diarrhea.", "Low Ca²⁺ lowers the threshold (Trousseau, Chvostek, tetany, laryngospasm); high Ca²⁺ raises it (weakness, constipation, polyuria, kidney stones, fractures).", "Low Mg²⁺ → more acetylcholine (hyperexcitable) and it worsens low K⁺ and low Ca²⁺; high Mg²⁺ → less acetylcholine (depressed reflexes, respiratory depression). Low phosphate → ATP and 2,3-BPG shortage; high phosphate → low calcium and calcium phosphate deposits (itching, joint pain, conjunctivitis).", "Older adults: less body water, weaker thirst, less ability to concentrate urine, **unreliable skin turgor**, higher risk of hypernatremia with tube feeding and hypermagnesemia from antacids and laxatives."], "keyTerms": [["ECV deficit", "too little isotonic saline in the vascular and interstitial spaces (normal sodium)"], ["Dilutional hyponatremia", "low sodium from gaining more water than salt"], ["Depletional hyponatremia", "low sodium from losing more salt than water"]], "links": ["hypov", "hyperv", "dehyd", "hypoNa", "hyperNa", "hypoK", "hyperK", "hypoCa", "hyperCa", "hypoMg", "hyperMg", "hypoPhos", "hyperPhos"], "callouts": [{"type": "book", "label": "Textbook table: Summary of signs and symptoms (Table 24.2)", "in": "comp", "text": "Banasik's summary table sorts every fluid and electrolyte imbalance by organ (heart, vessels, interstitium, brain, lungs, skeletal muscle, neuromuscular excitability, gut, kidneys). Use it as a self-test: cover the rows and predict each organ's sign from the mechanism.", "source": "Banasik Ch. 24, Table 24.2, pp. 548 to 549"}]}, {"id": "ban25", "chapter": "Chapter 25 (Patho)", "short": "Banasik 25 Acid-base (bridge)", "book": "Patho: Banasik", "title": "Acid-Base Homeostasis and Imbalances (bridge to Unit 2)", "source": "Banasik, Pathophysiology 7th ed., Ch. 25, pp. 551 to 559 (cited on your Unit 1 Patho slides; tested with acid-base in Unit 2)", "summary": "Your Unit 1 slides list Chapters 24 and 25 together because fluid, electrolyte, and acid-base balance are tied together: the same losses (vomiting, NG suction, diarrhea) change all three. Chapter 25 explains the bicarbonate buffer (normal 20:1 bicarbonate to carbonic acid ratio), the lungs' control of carbon dioxide, the kidneys' control of bicarbonate and metabolic acid, and the four primary imbalances.", "keyPoints": ["The lungs excrete carbonic acid (as carbon dioxide); the kidneys excrete metabolic acid and keep or excrete bicarbonate.", "Lungs compensate for metabolic problems; kidneys compensate for respiratory problems. Compensation brings pH toward normal but leaves PaCO₂ and HCO₃⁻ abnormal.", "==Unit 1 link: acidosis shifts K⁺ out of cells (hyperkalemia); alkalosis shifts K⁺ into cells (hypokalemia) and lowers ionized calcium.==", "NG suction removes hydrochloric acid, so it causes the classic triad your Patho slides stress: ==hypokalemia + hypochloremia + metabolic alkalosis.==", "Diarrhea removes bicarbonate-rich intestinal fluid and contributes to metabolic acidosis.", "Full acid-base content is in your Unit 2 guide (Acid-Base Imbalances & Anemias)."], "links": ["hypoK", "hyperK", "hypoCa"]}], "conditions": [{"id": "hypov", "name": "Hypovolemia (volume deficit)", "short": "Hypovolemia", "group": "Volume (saline) deficit · serum Na⁺ normal", "cat": "Fluid Volume & Concentration", "sub": "Volume (saline) imbalances", "catColor": "#b45309", "color": "#b45309", "pair": "hyperv", "sig": ["Weight ↓ (acute)", "HR ↑ / BP ↓ (postural)", "Flat neck veins", "Urine ↓, SG ↑"], "hook": "Salt water (isotonic saline) has left the vascular and interstitial spaces faster than it came in. The concentration is normal; there is simply not enough of it, so perfusion falls and the body fights to hold on to every drop.", "patho": {"chain": ["A **sodium-containing fluid** is lost: vomiting, diarrhea, GI suction, fistulas, diuretics, hemorrhage, burns, sweating, or third spacing", "Water and sodium leave **in the same proportion**, so the ECF shrinks while the ==serum sodium stays normal==", "Vascular volume falls → less venous return → stroke volume and blood pressure fall", "Interstitial volume falls → skin and tongue lose turgor, mucous membranes dry", "Kidneys get less blood flow → oliguria with concentrated urine; if prolonged, the kidney itself can be injured", "A small, under-filled circulation that can progress to hypovolemic shock"], "compensation": "Within seconds, **baroreceptors** fire the sympathetic nervous system: heart rate rises and vessels constrict (cool, clammy skin). Within minutes to hours, **RAAS and aldosterone** retain sodium and water and **ADH** retains water, so urine output falls and specific gravity rises above 1.020. Thirst increases intake (blunted in older adults). Compensation fails when more than about 25% of the intravascular volume is lost or the loss is rapid (Brunner), producing shock.", "tip": "Think **\"dry and fast\"**: dry mouth, less urine, faster pulse, lower pressure (your Patho slides)."}, "manifestations": [["==Acute weight loss== (most sensitive measure)", "1 L of saline weighs 1 kg, and you cannot lose a kilogram of tissue overnight, so a sudden drop is fluid"], ["==Postural (orthostatic) hypotension with a rising heart rate==, lightheadedness, dizziness, syncope", "standing pools blood in the legs; with a small vascular volume the blood pressure drops and the heart speeds up to compensate"], ["Weak, rapid (thready) pulse", "a small stroke volume makes a weak pulse, and the sympathetic response makes it fast"], ["==Flat neck veins== when supine; slow filling of hand veins; prolonged capillary refill", "there is too little volume in the venous system to distend the veins"], ["Oliguria (< 400 mL/day) with dark, concentrated urine", "ADH and aldosterone make the kidneys conserve water and sodium (a healthy response if the kidneys work)"], ["Decreased skin turgor, dry mucous membranes, extra longitudinal furrows in the tongue, sunken eyes", "interstitial fluid is depleted, so tissue loses its plumpness and elasticity"], ["Cool, clammy, pale skin", "sympathetic vasoconstriction shunts blood away from the skin to vital organs"], ["Muscle cramps, weakness, thirst", "reduced perfusion and electrolyte shifts irritate muscle; low volume and angiotensin II trigger thirst"], ["Confusion, delirium (especially older adults)", "less cerebral perfusion; often the first sign an older adult shows"], ["Temperature changes", "Med-Surg slides list increased temperature and also say monitor for hypothermia: fever can cause the deficit, while the deficit itself often lowers temperature unless infection is present (Brunner)"]], "labs": [["Hemoglobin and hematocrit", "==↑ Hct (hemoconcentration)==: the same red cells in less plasma (Galen Hct M 42 to 52%, F 37 to 47%). Exception: Hct falls if the loss is hemorrhage."], ["BUN and creatinine", "==BUN ↑ out of proportion to creatinine (ratio > 20:1)== because urea is concentrated (Galen BUN 10 to 20 mg/dL)"], ["Urine specific gravity", "↑ (> 1.020) as the kidneys conserve water (Galen 1.005 to 1.030). Low specific gravity in a dry client suggests diabetes insipidus or kidney damage."], ["Serum and urine osmolality", "↑ (concentrated)"], ["Urine sodium", "↓ because aldosterone is conserving sodium"], ["Serum Na⁺ and K⁺", "Na⁺ usually normal in pure ECV deficit; K⁺ may be low (GI or renal loss) or high (adrenal insufficiency). Check both."], ["Health history and physical assessment", "Identify the route of loss and the risk factors (Med-Surg slides)"]], "risks": [["GI loss of sodium-containing fluid", "Vomiting (emesis), diarrhea or laxative abuse, gastric suction (NG), fistula drainage"], ["Renal loss", "Diuretics, adrenal insufficiency (no aldosterone), salt-wasting kidney disease, osmotic diuresis (uncontrolled diabetes), bed rest"], ["Other losses", "Hemorrhage, burns, massive diaphoresis, fever, paracentesis, third spacing (ascites, bowel obstruction)"], ["Decreased intake", "Nausea, anorexia, no access to fluids, impaired swallowing or cognition"], ["Older adults", "Less body water, weak thirst, less ability to concentrate urine, multiple medications, bowel preps and laxatives; some restrict fluids to avoid incontinence"]], "management": [["==Isotonic IV replacement first== (0.9% NaCl or lactated Ringer's), then hypotonic (0.45% NaCl) once normotensive", "isotonic fluid stays in the ECF and restores circulating volume; once pressure is restored, hypotonic fluid supplies free water so the kidneys can excrete wastes"], ["Oral rehydration if the deficit is mild and the client can drink", "safest route; oral rehydration solutions replace water, glucose, and electrolytes in absorbable amounts"], ["Correct the cause (antiemetics, antidiarrheals, stop bleeding, adjust diuretics)", "replacement cannot keep up if the loss continues"], ["Prevent shock: blood for hemorrhage, fluid challenge to test the kidneys", "losing more than about 25% of volume causes shock; a fluid challenge (for example 100 to 200 mL NS over 15 minutes, per Brunner) shows whether low output is from low flow (output rises) or kidney injury (it does not)"]], "nursing": {"assess": [["Vital signs closely, including ==orthostatic blood pressure== and pulse", "a systolic drop of more than 20 mmHg from lying to sitting, with a rising pulse, shows vascular depletion (Brunner)"], ["==Daily weight== (same scale, time, clothing) and I&O at least every 8 hours (hourly if critical)", "0.5 kg lost ≈ 500 mL of fluid; I&O reveals ongoing losses"], ["Urine output and specific gravity", "output < 0.5 mL/kg/hr or < 30 mL/hr signals poor renal perfusion; specific gravity > 1.020 confirms concentration"], ["Skin turgor (sternum, forehead), tongue furrows, mucous membranes", "interstitial depletion; tongue turgor is not affected by age, skin turgor is unreliable in older adults"], ["Level of consciousness and behavior", "confusion signals falling cerebral perfusion"], ["Temperature, capillary refill, skin color", "hypothermia and cool extremities reflect low perfusion"]], "act": [["Maintain IV access and give isotonic fluids as ordered by infusion pump", "restores circulating volume and perfusion to the brain, heart, and kidneys", 1], ["Position flat or with legs raised if hypotensive; implement fall precautions; rise slowly", "orthostatic hypotension causes syncope and falls", 1], ["Report urine output < 30 mL/hr, SBP < 90, rising HR, or new confusion immediately", "these are signs of progression toward hypovolemic shock", 1], ["Give antiemetics or antidiarrheals as ordered; offer small frequent oral fluids and mouth care", "controls the source of loss and makes oral replacement tolerable", 2], ["Monitor for fluid overload while replacing (lungs, neck veins, weight), especially in older adults or heart disease", "rapid replacement can overshoot into circulatory overload", 2], ["Identify at-risk clients and perform a functional assessment in older adults (can they reach, swallow, and ask for fluids?)", "prevention depends on removing the barrier to intake", 3]], "order": "circulation comes first (volume and blood pressure), then safety from falls; once perfusion is protected, the nurse stops the source of loss and prevents overcorrection."}, "education": [["Replace losses early", "during vomiting, diarrhea, fever, or heat, drink small amounts often; oral rehydration solutions are better than plain water"], ["Daily weight at home", "same time, scale, and clothing; report a loss of more than 1 to 2 lb (0.5 to 1 kg) in a day"], ["Rise slowly", "sit on the edge of the bed before standing to prevent dizziness and falls"], ["Older adults", "drink on a schedule rather than waiting for thirst; plan bathroom access instead of limiting fluids"], ["When to seek help", "dizziness or fainting, very little or dark urine, confusion, or a fast weak pulse"]], "complications": ["Hypovolemic shock (fatal if volume is not replaced)", "Acute kidney injury: prerenal azotemia progressing to acute tubular necrosis", "Falls and injury from orthostatic hypotension", "Delirium in older adults", "Electrolyte imbalances from the same losses (low K⁺, abnormal Na⁺)"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Systolic BP below 90 or a drop of more than 20 mmHg on standing with a rising heart rate, urine output below 30 mL/hr, new confusion, or cool clammy skin with a thready pulse: these suggest progression to ==hypovolemic shock==."}, {"type": "book", "label": "Textbook box: Quality and Safety Nursing Alert", "in": "rn", "text": "Brunner's alerts for fluid deficit: watch for a **weak, rapid pulse and orthostatic hypotension** (systolic drop > 20 mmHg lying to sitting), and remember ==an acute loss of 0.5 kg represents about 500 mL of fluid==. When fluid balance is critical, record and compare every route of gain and loss.", "source": "Brunner Ch. 10, Quality and Safety Nursing Alerts, pp. 230 and 241"}, {"type": "good", "label": "Older adults (USLO 1)", "text": "Skin turgor is not reliable in older adults because skin loses elasticity with age; check **tongue furrows, mucous membranes, and hand-vein filling** instead. A deficit may not trigger thirst and may show first as **delirium**."}, {"type": "watch", "label": "Do not confuse", "text": "**Hypovolemia** (fluid volume deficit) is loss of water and sodium together, so serum sodium is normal. **Dehydration** in Brunner and **clinical dehydration** in Banasik add a high sodium (water lost in excess). Check the sodium to tell them apart."}], "figures": [{"title": "Extracellular fluid volume deficit", "in": "path", "source": "Banasik Ch. 24, Fig. 24.4, p. 535 (redrawn)", "steps": ["Saline (sodium + water) is lost", "Vascular volume ↓ and interstitial volume ↓", "Osmolality stays normal", "Intracellular volume is unchanged (no osmotic shift)"], "caption": "The cells are spared because the concentration did not change: ECV deficit is a volume problem, not a sodium problem."}], "sbar": {"title": "Applying SBAR: postoperative client becoming hypovolemic", "s": "A 74-year-old on postoperative day 1 is dizzy on standing and newly confused.", "b": "Bowel resection; NG tube to low intermittent suction with 1,400 mL out in 12 hours; IV 0.45% NaCl at 75 mL/hr; NPO.", "a": "BP 118/70 lying, 92/58 sitting; HR 108 and thready; urine 20 mL/hr for 2 hours, dark amber, specific gravity 1.030; weight down 1.5 kg from yesterday; tongue furrowed; BUN 34, creatinine 1.1, Hct 51%.", "r": "I think she is volume depleted from NG losses. Please evaluate now. Request an order for an isotonic fluid bolus and replacement of NG output, a repeat BMP for K⁺ and Na⁺, and hourly urine output. I have her flat with fall precautions."}, "bridge": [["Pathophysiology", "Saline is lost in equal parts, so the ECF shrinks while sodium stays normal; baroreceptors, RAAS, and ADH raise heart rate and conserve fluid."], ["Med-Surg", "You see that compensation as tachycardia, orthostatic hypotension, flat neck veins, and concentrated low urine; you weigh daily, trend I&O and orthostatic vitals, and give isotonic fluid first."]], "drugs": [{"generic": "sodium chloride 0.9% (normal saline)", "brands": ["Normal saline (NS)", "0.9% NaCl"], "cls": "Isotonic crystalloid IV solution (154 mEq/L Na⁺ and Cl⁻, 308 mOsm/L)", "moa": "Has the same osmolality as plasma, so it ==stays in the extracellular space== and expands vascular volume without moving water into or out of cells. Restores preload, blood pressure, and kidney perfusion.", "indications": ["==First-line fluid for hypotensive hypovolemia== (Med-Surg slides: isotonic replacement first)", "Shock and resuscitation; mild sodium deficit; also used with blood products (the only compatible solution)"], "dose": [["IV", "Rate and volume ordered by the provider from the severity of loss and the hemodynamic response. Brunner's fluid challenge example: 100 to 200 mL over 15 minutes. Use your facility protocol."]], "assess": {"before": [["Blood pressure (including orthostatic), heart rate, urine output", "baseline to judge the response"], ["Lung sounds, neck veins, edema, history of heart failure or kidney disease", "these clients overload easily"], ["Serum Na⁺, Cl⁻, K⁺, BUN, creatinine", "saline supplies extra sodium and chloride"]], "after": [["Lung sounds, respiratory rate, oxygen saturation, weight", "crackles, rising RR, or sudden gain mean fluid overload"], ["Urine output and blood pressure", "should rise as perfusion returns"], ["Chloride and acid-base", "large volumes can cause hyperchloremic acidosis"]]}, "effects": {"common": ["Mild edema", "Local discomfort at the IV site"], "serious": ["**Fluid volume excess and pulmonary edema** (especially heart failure, kidney failure, older adults)", "Hypernatremia or hyperchloremic metabolic acidosis with large volumes", "Phlebitis or infiltration at the IV site"]}, "avoid": {"contra": ["Heart failure, pulmonary edema, renal impairment, or sodium retention (use cautiously)"], "interactions": ["Do not give with calcium infusions for hypocalcemia (increases renal calcium loss, per Brunner)", "No food interactions"]}, "teach": ["Explain the reason for the IV and the pump", "Report shortness of breath, cough, or swelling", "Report pain, swelling, or coolness at the IV site"], "verify": ["dose"]}], "procedures": [{"name": "Orthostatic (postural) vital signs", "kind": "diagnostic", "indication": "Shows whether the vascular volume is too small to maintain blood pressure when the client stands. ==A systolic drop > 20 mmHg with a rising pulse supports hypovolemia.==", "steps": [["Have the client lie flat for a few minutes, then measure BP and pulse", "establishes a resting baseline"], ["Sit the client up (legs dangling), wait briefly, repeat BP and pulse", "gravity pools blood in the legs; a depleted circulation cannot compensate"], ["If tolerated, stand the client with support and repeat", "standing is the strongest challenge"], ["Stop and return the client to bed if dizzy or faint", "prevents a fall"], ["Record each position's values", "the change between positions is the finding"]], "before": [["Check fall risk and have a second person or gait belt ready", "dizziness is expected in the very client you are testing"], ["Explain the steps", "cooperation and safety"]], "after": [["Return to a safe position and keep fall precautions", "the client may stay hypotensive until volume is replaced"], ["Report a positive result with the other findings (urine output, weight)", "supports the provider's fluid order"]], "complications": ["Syncope or fall during the test", "Symptomatic hypotension (dizziness, pallor, diaphoresis)"], "teach": ["Change positions slowly at home", "Sit down at once if lightheaded"], "during": [["Watch for dizziness, pallor, sweating", "signals inadequate cerebral perfusion"]], "verify": ["steps"]}, {"name": "Peripheral IV fluid therapy: site and complication monitoring", "kind": "therapeutic", "indication": "Isotonic and then hypotonic IV fluids restore the deficit. The nurse protects the client from the systemic and local complications of IV therapy (Brunner pp. 264 to 269).", "steps": [["Verify the order (solution, rate) and use an infusion pump", "accurate rate prevents under-replacement and overload"], ["Inspect the site at least hourly and per policy", "early detection of phlebitis and infiltration"], ["Compare the site with the opposite limb for swelling and coolness", "infiltration is not always obvious; blood return does not rule it out"], ["Reassess lungs, vital signs, and I&O during the infusion", "detects circulatory overload early"]], "before": [["Allergy history and baseline vital signs, lungs, weight", "baseline for complications"], ["Choose the smallest suitable catheter, avoid areas of flexion", "reduces phlebitis and infiltration"]], "after": [["Phlebitis: remove, restart elsewhere, warm moist compress", "inflammation resolves once the irritant is removed"], ["Infiltration: stop, remove, elevate; extravasation of a vesicant: stop, notify, follow the antidote protocol", "limits tissue injury"], ["Fluid overload: slow the IV, high Fowler's, check vitals and lungs, notify the provider", "reduces venous return and work of breathing"]], "complications": ["Circulatory overload (crackles, distended neck veins, dyspnea)", "Air embolism: dyspnea, cyanosis, hypotension (clamp, left side Trendelenburg, oxygen)", "Phlebitis, infiltration, thrombophlebitis, hematoma, infection"], "teach": ["Report pain, swelling, redness, or coolness at the site", "Do not adjust the pump or tubing"], "verify": ["steps"]}]}, {"id": "hyperv", "name": "Hypervolemia (volume excess)", "short": "Hypervolemia", "group": "Volume (saline) excess · serum Na⁺ normal", "cat": "Fluid Volume & Concentration", "sub": "Volume (saline) imbalances", "catColor": "#b45309", "color": "#1d4ed8", "pair": "hypov", "sig": ["Weight ↑ (acute)", "Edema", "JVD + crackles", "BP ↑, bounding pulse"], "hook": "Too much isotonic salt water is in the vascular and interstitial spaces. The concentration is normal; the tank is overfilled, so pressure rises, fluid is pushed into the tissues and lungs, and the heart is stretched.", "patho": {"chain": ["Saline is **added** (excess isotonic IV fluid, high sodium intake) or **retained** (heart failure, cirrhosis, kidney disease, hyperaldosteronism, Cushing's, corticosteroids)", "Sodium and water accumulate in the same proportion, so the ECF expands while the ==serum sodium stays normal==", "Vascular volume rises → venous pressure and capillary hydrostatic pressure rise", "Fluid is pushed into the interstitium (edema) and, if the left heart cannot keep up, into the lungs (crackles, dyspnea)", "Overloaded circulation with edema that can progress to pulmonary edema"], "compensation": "The stretched atria and ventricles release **ANP and BNP**, which cause sodium and water excretion and oppose aldosterone; ADH and aldosterone fall, so a client with healthy kidneys produces **more urine** (Med-Surg slides: increased urine output). In heart failure and cirrhosis, low effective perfusion keeps **RAAS switched on**, so the kidneys keep retaining sodium despite the overload, which is why these clients stay overloaded.", "tip": "Think **\"wet and full\"**: weight up, edema, JVD, crackles, bounding pulse, BP up."}, "manifestations": [["==Acute weight gain== (most sensitive measure)", "1 kg gained overnight ≈ 1 L of retained saline"], ["Edema: pitting, dependent (ankles if walking, ==sacrum if in bed==); ascites", "raised capillary hydrostatic pressure pushes fluid into the interstitium"], ["==Distended neck veins (JVD)== when upright; increased central venous pressure (CVP)", "the venous system is overfilled"], ["Crackles, dyspnea, orthopnea, cough; increased respiratory rate", "fluid backs up into the pulmonary interstitium and alveoli; lying flat redistributes fluid to the lungs"], ["Bounding pulse, increased blood pressure", "more volume in the arteries raises stroke volume and pressure"], ["Increased urine output (if kidneys and heart are healthy)", "natriuretic peptides and suppressed ADH and aldosterone promote excretion"], ["Severe: frothy pink sputum, cyanosis, accessory muscle use", "pulmonary edema: alveoli flood and gas exchange fails"]], "labs": [["Hemoglobin and hematocrit", "==↓ (hemodilution)==: the same red cells in more plasma"], ["Serum osmolality", "↓ or normal (diluted); in kidney disease sodium and osmolality fall from water retention"], ["Urine sodium and specific gravity", "Urine Na⁺ ↑ when healthy kidneys excrete the excess (normal when aldosterone is driving retention, as in heart failure or cirrhosis); ==specific gravity ↓== (dilute urine)"], ["BUN", "↓ from dilution (rises if kidney failure is the cause)"], ["BNP", "Galen: > 100 pg/mL suggests heart failure (> 300 mild, > 600 moderate, > 900 severe); a marker of ventricular stretch"], ["Chest x-ray", "Pulmonary congestion or edema"], ["Health history and assessment", "Heart, kidney, and liver disease; IV fluids received; sodium intake; steroid use"]], "risks": [["Excess sodium-containing IV fluids", "Normal saline, Ringer's, lactated Ringer's, especially in older adults and clients with heart or kidney disease"], ["Renal retention of sodium and water", "Heart failure, cirrhosis, acute glomerulonephritis, chronic kidney disease, hyperaldosteronism, Cushing's disease, corticosteroid therapy"], ["Diet and medications", "High salt intake; NSAIDs, estrogens, corticosteroids; sodium-rich over-the-counter products (Alka-Seltzer)"], ["Older adults", "Less cardiac reserve and kidney function: overload develops faster and with smaller volumes"]], "management": [["==Loop diuretics (furosemide)== for severe overload; thiazides (hydrochlorothiazide) for mild to moderate", "they block sodium reabsorption in the kidney tubule and water follows the sodium out; loops act on the loop of Henle (20 to 30% of sodium) and are stronger, thiazides on the distal tubule (5 to 10%)"], ["Sodium restriction (and fluid restriction as ordered)", "salt, not water alone, holds the extra fluid in the ECF; less sodium means less retention"], ["Treat the cause; stop excess IV fluids", "if the overload came from IV fluids, stopping them may be all that is needed"], ["Dialysis or continuous renal replacement therapy", "removes fluid and sodium when the kidneys cannot respond to diuretics"], ["Increase protein if albumin is low (as ordered)", "raising oncotic pressure pulls fluid from tissues back into vessels"]], "nursing": {"assess": [["==Breath sounds== (crackles), respiratory rate, oxygen saturation, dyspnea and orthopnea", "the lungs show the most dangerous consequence first"], ["==Daily weight== and I&O at regular intervals", "1 kg (2.2 lb) gain ≈ 1 L retained; a gain of 1 to 2 lb in 24 hours is a red flag"], ["Edema: dependent areas (feet, ankles, sacrum), pitting scale 1+ to 4+, limb circumference", "tracks interstitial fluid and response to diuretics"], ["Neck veins, blood pressure, pulse quality", "reflect vascular volume"], ["Electrolytes, especially K⁺, Na⁺, Mg²⁺, during diuresis", "diuretics waste potassium and magnesium; diuresis can lower sodium"]], "act": [["Elevate the head of the bed (semi- to high Fowler's) if dyspneic or orthopneic; give oxygen as ordered", "upright position lowers venous return and lets the lungs expand", 1], ["If overload develops on IV fluids: slow the infusion, assess lungs and vitals, notify the provider", "stops adding to the overload while the provider reassesses", 1], ["Give diuretics as ordered and monitor response (urine output, weight, lungs, BP, K⁺)", "removes the excess; potassium can fall quickly", 2], ["Restrict sodium and fluids as ordered; use an infusion pump for all IV fluids", "limits further gain", 2], ["Turn and reposition at least every 2 hours; protect edematous skin; elevate edematous limbs", "edematous tissue breaks down easily", 3], ["Teach diet, daily weights, and when to call", "most causes are chronic and need self-monitoring", 3]], "order": "breathing comes first because overload kills by flooding the lungs; then the excess is removed and limited, and skin and teaching protect the client over time."}, "education": [["Low-sodium diet", "read labels for sodium; avoid processed, canned, and salty foods; season with lemon, onion, garlic; check salt substitutes with the provider (most contain potassium)"], ["Hidden sodium", "over-the-counter medicines such as Alka-Seltzer, water softeners, and some bottled water"], ["Daily weight", "same time and scale each morning; report a gain of 2 lb (1 kg) in a day or 5 lb in a week, or as the provider directs"], ["Diuretics", "take in the morning; rise slowly; report muscle cramps or weakness (low potassium)"], ["When to seek help", "new shortness of breath, needing more pillows to breathe, cough, or rapid swelling"]], "complications": ["Pulmonary edema and respiratory failure", "Heart failure (worsening)", "Skin breakdown over edematous areas", "Electrolyte imbalances from diuretic treatment (hypokalemia, hyponatremia, hypomagnesemia)", "Dilutional hyponatremia (water excess) and low hematocrit"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "New or rising crackles, dyspnea or orthopnea, falling oxygen saturation, frothy (pink) sputum, or a weight gain of more than 1 kg in 24 hours: these signal ==pulmonary edema==. Raise the head of the bed and stop or slow IV fluids while you call."}, {"type": "book", "label": "Textbook box: Quality and Safety Nursing Alert", "in": "rn", "text": "When giving fluids to clients with cardiovascular disease, watch for circulatory overload: **cough, dyspnea, distended neck veins, dependent edema, a 1 to 2 lb gain in 24 hours**, and auscultate the lungs for crackles. ==An acute 1 kg gain ≈ 1 L of fluid.==", "source": "Brunner Ch. 10, Quality and Safety Nursing Alerts, pp. 242 and 248"}, {"type": "good", "label": "Older adults (USLO 1)", "text": "Decreased cardiac reserve and kidney function mean older adults develop overload faster and with smaller IV volumes. Run every IV on a pump and reassess lungs during infusions."}, {"type": "info", "label": "SOAPIE (chronic overload: heart failure at home)", "text": "**S**: \"My shoes are tight and I sleep on three pillows.\" **O**: weight up 2.5 kg in 4 days, 2+ ankle edema, crackles at bases. **A**: fluid volume excess related to sodium retention. **P**: diuretic as ordered, 2 g sodium diet, daily weights. **I**: furosemide given, diet teaching, K⁺ checked. **E**: weight down 1 kg, fewer crackles; client states three hidden sodium sources."}], "figures": [{"title": "Four ways edema forms", "in": "path", "source": "Banasik Ch. 24, Fig. 24.9, p. 538 (redrawn)", "steps": ["↑ Capillary hydrostatic pressure (volume excess, venous congestion)", "↑ Interstitial oncotic pressure (inflammation leaks protein)", "Blocked lymphatic drainage (tumor, lymph node removal)", "↓ Capillary oncotic pressure (low albumin)", "Net result: more fluid in the interstitium = edema"], "caption": "Only the first cause is volume excess. Low albumin causes edema even when the vascular space is depleted."}], "sbar": {"title": "Applying SBAR: circulatory overload during IV therapy", "s": "An 81-year-old receiving IV fluids is short of breath and coughing.", "b": "Admitted for pneumonia with heart failure history; 0.9% NaCl at 125 mL/hr for 24 hours; home furosemide held on admission.", "a": "RR 28, SpO₂ 89% on room air, crackles halfway up both lungs, JVD at 45 degrees, BP 168/94, bounding pulse, weight up 1.8 kg since admission, 2+ sacral edema.", "r": "I believe she is fluid overloaded. I have slowed the IV to keep-open, raised the head of the bed, and started oxygen per protocol. Please come evaluate now; I anticipate an order for IV furosemide, a chest x-ray, BNP, and electrolytes."}, "bridge": [["Pathophysiology", "Saline is retained or added, so capillary hydrostatic pressure rises and fluid is pushed into tissues and lungs; RAAS keeps retaining sodium in heart failure and cirrhosis."], ["Med-Surg", "You find weight gain, edema, JVD, and crackles; you sit the client up, give diuretics, restrict sodium, weigh daily, and watch potassium."]], "drugs": [{"generic": "furosemide", "brands": ["Lasix"], "cls": "Loop diuretic", "moa": "Blocks sodium and chloride reabsorption in the ==ascending loop of Henle==; water follows the sodium out. Also increases loss of potassium, magnesium, and calcium. Works even when kidney function is reduced.", "indications": ["==Hypervolemia== with edema from heart failure, liver, or kidney disease (Med-Surg slides)", "Acute pulmonary edema (fast IV onset)", "Hypertension"], "dose": [["PO (adults), edema", "20 to 80 mg/day as a single dose initially; may repeat in 6 to 8 hr and increase by 20 to 40 mg until response (Davis)"], ["IM, IV (adults)", "20 to 40 mg; may repeat in 1 to 2 hr and increase by 20 mg until response (Davis)"], ["IV administration", "IV push over 1 to 2 minutes (F&P) at no more than 20 mg/min (Davis); high-dose infusion no faster than 4 mg/min to prevent ototoxicity"]], "assess": {"before": [["Blood pressure, pulse, weight, I&O, lung sounds, edema", "baseline to judge response and detect hypotension"], ["Serum K⁺ (Galen 3.5 to 5 mEq/L), Na⁺, Mg²⁺, BUN, creatinine, glucose", "the drug wastes potassium and magnesium; low K⁺ causes dysrhythmias"], ["Sulfonamide allergy; digoxin use", "cross-sensitivity; low K⁺ raises digoxin toxicity"]], "after": [["Urine output, weight, edema, crackles, dyspnea", "therapeutic response: IV onset 5 min, peak 30 min"], ["BP and orthostatic changes", "excessive diuresis causes hypotension and falls"], ["K⁺ and other electrolytes", "hypokalemia, hyponatremia, hypomagnesemia"], ["Hearing and tinnitus", "ototoxicity with rapid or high-dose IV use"]]}, "effects": {"common": ["Frequent urination", "Dizziness, orthostatic hypotension", "Hyperglycemia, increased uric acid"], "serious": ["**Hypokalemia** (dysrhythmias) and hypomagnesemia", "**Hypovolemia / dehydration** and hypotension", "**Ototoxicity** (hearing loss, tinnitus)", "Severe skin reactions (Stevens-Johnson syndrome)"]}, "avoid": {"contra": ["Anuria", "Hypersensitivity; possible cross-sensitivity with sulfonamides and thiazides", "Hepatic coma (use cautiously in severe liver disease)"], "interactions": ["Digoxin: low K⁺ ↑ toxicity", "Corticosteroids and amphotericin B ↑ potassium loss", "Aminoglycosides ↑ ototoxicity and nephrotoxicity", "NSAIDs ↓ diuretic effect", "Lithium levels ↑ (toxicity)", "Licorice and some herbs alter diuretic effect"]}, "teach": ["Take in the morning (second dose no later than 5 PM) to avoid nighttime urination", "Weigh daily; report a rapid gain or loss", "Eat potassium-rich foods unless told otherwise; report cramps or weakness", "Rise slowly; report ringing in the ears or hearing loss", "Limit sodium; use sunscreen"]}, {"generic": "hydrochlorothiazide", "brands": ["Microzide", "HCTZ"], "cls": "Thiazide diuretic", "moa": "Blocks sodium and chloride reabsorption in the distal convoluted tubule, where only 5 to 10% of sodium is normally reabsorbed, so diuresis is milder than with a loop diuretic. Decreases calcium excretion (raises serum calcium).", "indications": ["Mild to moderate hypervolemia and edema (Med-Surg slides)", "Long-term management of hypertension and heart failure"], "dose": [["PO (adults)", "12.5 to 100 mg/day in 1 to 2 divided doses; not above 50 mg/day for hypertension; doses above 25 mg have more electrolyte effects (Davis)"]], "assess": {"before": [["Blood pressure, weight, edema", "baseline"], ["K⁺, Na⁺, Ca²⁺, glucose, uric acid, kidney function", "thiazides lower K⁺ and Na⁺ and raise Ca²⁺, glucose, uric acid"], ["Kidney function (GFR)", "ineffective when GFR is below 30 mL/min"], ["Sulfonamide allergy", "cross-sensitivity"]], "after": [["BP, weight, edema", "therapeutic response (onset about 2 hr)"], ["K⁺ and Na⁺", "hypokalemia and hyponatremia"], ["Blood glucose in diabetes", "may need more antidiabetic medication"]]}, "effects": {"common": ["Dizziness, orthostatic hypotension", "Increased urination", "Photosensitivity"], "serious": ["**Hypokalemia**, **hyponatremia**, hypochloremia", "**Hypercalcemia**", "Hyperglycemia, hyperuricemia (gout)", "Hypersensitivity reactions"]}, "avoid": {"contra": ["Anuria or kidney decompensation", "Sulfonamide-derived drug allergy", "Not the morning of surgery (labile BP under anesthesia)"], "interactions": ["Digoxin and corticosteroids: ↑ hypokalemia", "Lithium levels ↑", "NSAIDs ↓ effect", "Alcohol, opioids ↑ orthostatic hypotension", "Cholestyramine ↓ absorption"]}, "teach": ["Take in the morning", "Rise slowly; avoid alcohol", "Use sunscreen", "Report weakness, cramps, or dizziness", "Diabetic clients: check glucose more often"], "verify": ["names"], "suffix": "-thiazide"}], "procedures": [{"name": "Daily weight and intake and output (I&O) monitoring", "kind": "monitoring", "indication": "Weight is the most sensitive measure of fluid gain or loss and shows whether diuresis is working.", "steps": [["Weigh at the ==same time each day (morning, after voiding, before breakfast), on the same scale, with the same clothing==", "removes variables so the change reflects fluid"], ["Record all intake: oral, IV, tube feedings, flushes", "every route counts"], ["Record all output: urine, drains, emesis, NG, stool", "every route counts"], ["Compare weight to yesterday and I&O totals each shift", "a trend shows retention or loss"]], "before": [["Calibrate and zero the scale", "accuracy"], ["Explain the purpose and ask the client to save urine", "cooperation"]], "after": [["Report a gain of more than 1 kg (2.2 lb) in 24 hours", "≈ 1 L of retained fluid"], ["Correlate with lung sounds and edema", "confirms clinical significance"]], "complications": ["Rapid weight gain with new crackles (pulmonary edema)", "Output well below intake for consecutive shifts"], "teach": ["Weigh daily at home and keep a log", "Know your reporting threshold"], "verify": ["steps"]}, {"name": "Pitting edema assessment", "kind": "monitoring", "indication": "Grades interstitial fluid in dependent areas to track the volume excess and the response to diuretics.", "steps": [["Press firmly with a thumb over a bony prominence (top of the foot, ankle, shin, or sacrum in bedbound clients) for a few seconds", "displaces interstitial fluid"], ["Release and observe the depth of the pit and how long it takes to rebound", "deeper and slower = more fluid"], ["Grade from 1+ (minimal) to 4+ (severe) per your facility scale", "standard language for the trend"], ["Measure limb circumference at a marked point", "objective trend"]], "before": [["Position: ambulatory → feet and ankles; bedbound → sacrum", "fluid collects in the lowest areas"]], "after": [["Document grade, location, and symmetry", "unilateral edema suggests a local cause (clot, lymph)"], ["Inspect skin over edema", "stretched skin breaks down"]], "complications": ["Unilateral swelling, pain, or warmth (possible DVT)", "Skin breakdown over edematous areas"], "teach": ["Elevate swollen legs", "Report shoes or rings becoming tight"], "verify": ["steps"]}]}, {"id": "dehyd", "name": "Clinical dehydration", "short": "Clinical dehydration", "group": "Volume AND concentration · Na⁺ ↑", "cat": "Fluid Volume & Concentration", "sub": "Volume + concentration combined", "catColor": "#b45309", "color": "#9a3412", "pair": "hypov", "sig": ["ECV deficit signs", "Na⁺ > 145", "Thirst", "Confusion"], "hook": "Two imbalances at once: too little extracellular volume (saline deficit) and body fluids that are too concentrated (hypernatremia). It happens when someone loses hypotonic fluid, such as diarrhea and vomiting, and cannot replace the salt and the water.", "patho": {"chain": ["Vomiting, diarrhea, fever, or sweating remove fluid that is **hypotonic** (isotonic saline plus extra water)", "Loss of the saline portion → ==ECV deficit== (vascular and interstitial volume ↓)", "Loss of the extra water → ==hypernatremia== (ECF too concentrated)", "High ECF osmolality pulls water out of cells by osmosis → brain cells shrink", "Small, concentrated ECF with shrunken cells: clinical dehydration"], "compensation": "Thirst and ADH rise to retain water; RAAS and aldosterone retain sodium and water; the sympathetic system raises the heart rate. Infants and older adults are at highest risk because they cannot reliably express or act on thirst.", "tip": "**Dehydration = hypovolemia + hypernatremia.** Add the signs of both lists."}, "manifestations": [["Sudden weight loss, postural hypotension with ↑ heart rate, flat neck veins, rapid thready pulse", "the ECV deficit portion (small vascular volume)"], ["Oliguria with concentrated urine, prolonged capillary refill and sm
