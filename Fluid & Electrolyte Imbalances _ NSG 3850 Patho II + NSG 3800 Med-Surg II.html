/* ---------- ABG interpreter (Galen ranges) ---------- */
var ABG={ph:7.40,co2:40,hco3:24,show:{}};
var CASES=(D.abgCases&&D.abgCases.length)?D.abgCases:[
 ['Post-op client on opioid PCA, RR 8',7.28,58,26],
 ['Client with type 1 diabetes, deep rapid breathing',7.29,30,15],
 ['Panic attack, tingling fingers',7.52,28,24],
 ['NG suction for 3 days, K⁺ 2.9',7.53,48,36],
 ['Long-standing COPD, stable clinic visit',7.37,58,33],
 ['Severe diarrhea for 4 days',7.30,40,17],
 ['Patho slide: pH 7.28, HCO₃⁻ 16, PaCO₂ 40',7.28,40,16],
 ['Patho slide: compensated metabolic acidosis',7.36,30,17],
 ['Cardiac arrest during resuscitation',7.12,60,16],
 ['Overuse of antacids',7.49,42,33]
];
function interp(ph,co2,hco3){
 var st=[],pd=ph<7.35?'acid':ph>7.45?'alk':'norm';
 var cd=co2>45?'acid':co2<35?'alk':'norm';
 var hd=hco3<22?'acid':hco3>28?'alk':'norm';
 function w(x){return x==='acid'?'acidosis':x==='alk'?'alkalosis':'normal'}
 st.push('pH '+ph.toFixed(2)+': '+(pd==='norm'?'within 7.35 to 7.45':pd==='acid'?'below 7.35, so <b>acidosis</b>':'above 7.45, so <b>alkalosis</b>')+'.');
 st.push('PaCO₂ '+co2+' mmHg: '+(cd==='norm'?'normal (35 to 45)':cd==='acid'?'high, the lungs are pushing toward acidosis':'low, the lungs are pushing toward alkalosis')+'.');
 st.push('HCO₃⁻ '+hco3+' mEq/L: '+(hd==='norm'?'normal (22 to 28, Galen)':hd==='acid'?'low, the kidneys/metabolism are pushing toward acidosis':'high, pushing toward alkalosis')+'.');
 var name,comp;
 if(pd==='norm'){
  if(cd==='norm'&&hd==='norm'){return {name:'Normal ABG',steps:st.concat(['All three values are within Galen ranges.'])}}
  var dir=ph<7.40?'acid':'alk';
  if(cd!=='norm'&&hd!=='norm'&&cd!==hd){
   var prim=cd===dir?'Respiratory':'Metabolic';
   name='Fully compensated '+prim.toLowerCase()+' '+w(dir);
   st.push('pH is normal but both other values are abnormal, so the body has fully compensated. pH '+(dir==='acid'?'below':'at or above')+' 7.40 points to an original '+w(dir)+', and the '+(prim==='Respiratory'?'PaCO₂':'HCO₃⁻')+' matches that direction, so it is the primary problem.');
   return {name:name,steps:st};
  }
  return {name:'Check values',steps:st.concat(['pH is normal with only one abnormal value. Recheck the numbers or consider a lab or early-change situation.'])};
 }
 var r=cd===pd,m=hd===pd;
 if(r&&m){name='Mixed respiratory and metabolic '+w(pd);st.push('Both PaCO₂ and HCO₃⁻ push the pH the same way, so two problems are present at once. This is dangerous: no system is compensating.');return {name:name,steps:st}}
 if(!r&&!m){return {name:'Check values',steps:st.concat(['Neither PaCO₂ nor HCO₃⁻ explains this pH. Recheck the numbers.'])}}
 var prim2=r?'Respiratory':'Metabolic',other=r?hd:cd;
 comp=other==='norm'?'Uncompensated':'Partially compensated';
 st.push((r?'PaCO₂':'HCO₃⁻')+' matches the pH direction, so the primary problem is <b>'+prim2.toLowerCase()+'</b>. ROME: '+(r?'Respiratory Opposite (pH and PaCO₂ move opposite).':'Metabolic Equal (pH and HCO₃⁻ move the same way).'));
 st.push(other==='norm'?('The '+(r?'HCO₃⁻':'PaCO₂')+' is normal, so the '+(r?'kidneys':'lungs')+' have not compensated yet: <b>uncompensated</b>.'):('The '+(r?'HCO₃⁻':'PaCO₂')+' is moving the opposite way to pull pH back, but pH is still abnormal: <b>partially compensated</b>.'));
 return {name:comp+' '+prim2.toLowerCase()+' '+w(pd),steps:st};
}
function tagv(v,lo,hi){return v<lo?'<span class="tagv lo">LOW</span>':v>hi?'<span class="tagv hi">HIGH</span>':'<span class="tagv ok">NORMAL</span>'}
function abgOut(){
 var r=interp(ABG.ph,ABG.co2,ABG.hco3);
 return '<h3>'+r.name+'</h3><ol>'+r.steps.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>';
}
function slider(id,label,min,max,step,val,lo,hi,unit){
 return '<div class="sl"><label for="'+id+'"><span>'+label+'</span><span id="'+id+'v">'+val+' '+unit+' '+tagv(val,lo,hi)+'</span></label><input type="range" id="'+id+'" data-abg="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"><small>Normal '+lo+' to '+hi+' '+unit+'</small></div>';
}
function abgView(){
 var h='<p class="intro">Move the sliders and read the step-by-step interpretation. Ranges are Galen Standardized Values (HCO₃⁻ 22 to 28). Then try the practice cases: decide first, then reveal.</p><div class="abg"><div class="card">'+
  slider('ph','pH',6.9,7.8,0.01,ABG.ph.toFixed(2),7.35,7.45,'')+slider('co2','PaCO₂',15,90,1,ABG.co2,35,45,'mmHg')+slider('hco3','HCO₃⁻',8,50,1,ABG.hco3,22,28,'mEq/L')+
  '<div class="note"><b>Steps:</b> 1) pH: acid or base? 2) PaCO₂: lung. 3) HCO₃⁻: kidney. 4) Which one matches the pH? That is the primary. 5) Is the other moving opposite? That is compensation.</div></div>'+
  '<div class="card res" id="abgres">'+abgOut()+'</div></div><div class="ttl">Practice cases</div>';
 CASES.forEach(function(c,i){
  var r=interp(c[1],c[2],c[3]);
  h+='<div class="card case"><b>'+(i+1)+'. '+esc(c[0])+'</b><div class="vals2">pH '+c[1].toFixed(2)+' · PaCO₂ '+c[2]+' · HCO₃⁻ '+c[3]+'</div><button class="btn" data-a="abgshow" data-v="'+i+'">'+(ABG.show[i]?'Hide answer':'Reveal answer')+'</button>'+
   (ABG.show[i]?'<div class="note"><b>'+r.name+'.</b> '+r.steps.slice(3).join(' ')+'</div>':'')+' <button class="btn" data-a="abgload" data-v="'+i+'">Load into sliders</button></div>';
 });
 return h;
}

  if(ci===0||S.shownorm){h+=normalsHTML()}else{h+='<button class="lnk" data-a="shownorm" style="margin-top:14px">Show the Galen normal values</button>'}
  h+=pager('cond',ci,D.conditions.length,condLabel,true);
  return h;
}

/* ---------- explain-it-back grading (meaning, not wording) ---------- */
var SC={drafts:{},res:{},busy:{}};
try{SC.drafts=JSON.parse(localStorage.getItem('sg:'+ID+':scd')||'{}')||{}}catch(e){}
var CHECKS={};
(D.selfChecks||[]).forEach(function(x,i){if(!x.id)x.id='sc-'+(x.after||'x')+'-'+i});
(D.basics||[]).forEach(function(b){if(b.check&&!b.check.id)b.check.id='bc-'+b.id});
(D.selfChecks||[]).forEach(function(x){if(x.id)CHECKS[x.id]=x});
(D.basics||[]).forEach(function(b){if(b.check&&b.check.id)CHECKS[b.check.id]=b.check});
var SAMPLE=null,SAMPLE_OFF=false;
try{if(window.claude&&claude.use)claude.use('sample').then(function(s){SAMPLE=s}).catch(function(){})}catch(e){}
function selfCheckHTML(chk,color){
  var id=chk.id||'',r=SC.res[id];
  return '<div class="selfcheck" style="--c:'+color+'"><b>Stop and explain it back</b><p>'+md(chk.prompt)+'</p>'+
   '<textarea data-sc="'+esc(id)+'" placeholder="Explain it in your own words. Your wording does not need to match; the reasoning does." aria-label="Your explanation">'+esc(SC.drafts[id]||'')+'</textarea>'+
   '<div class="scbtns"><button class="btn primary" data-a="scgrade" data-v="'+esc(id)+'">Check my answer</button><button class="btn" data-a="model">Show model answer</button></div>'+
   '<div class="model note">'+md(chk.model)+'</div>'+
   '<div class="scres" id="scres-'+esc(id)+'" aria-live="polite">'+(r?scResHTML(r):'')+'</div></div>';
}
function scResHTML(r){
  var lab={correct:['ok','✓ Correct','Your reasoning matches. Wording does not have to be exact.'],partly:['warn','Almost there',''],not_yet:['bad','Not yet',''],unknown:['','Self-check','']}[r.verdict]||['warn','Checked',''];
  var h='<div class="scv '+lab[0]+'"><b>'+lab[1]+'</b> '+esc(r.feedback||lab[2]);
  if(r.missing&&r.missing.length&&r.verdict!=='correct')h+='<div class="scmiss">Add: '+r.missing.map(esc).join('; ')+'</div>';
  if(r.how)h+='<small>'+esc(r.how)+'</small>';
  return h+'</div>';
}
function norm(t){return ' '+String(t).toLowerCase().replace(/[₀-₉]/g,function(c){return String(c.charCodeAt(0)-8320)}).replace(/[⁺]/g,'+').replace(/[^a-z0-9+]+/g,' ')+' '}
function localGrade(text,chk){
  var t=norm(text),keys=chk.keys||[],hit=[],miss=[];
  if(!keys.length)return {verdict:'unknown',feedback:'Compare your explanation with the model answer below. If the reasoning matches, count it as correct.',missing:[],how:'No key ideas were provided for offline checking.'};
  keys.forEach(function(k){(k.any.some(function(w){return t.indexOf(norm(w).trim())>-1})?hit:miss).push(k.label)});
  var ratio=keys.length?hit.length/keys.length:0,words=t.trim().split(' ').length;
  var v=words<5?'not_yet':ratio>=0.6?'correct':ratio>=0.34?'partly':'not_yet';
  return {verdict:v,feedback:v==='correct'?'Your explanation covers the key ideas.':v==='partly'?'You have part of the reasoning.':'Your explanation is missing most of the key ideas.',missing:v==='correct'?[]:miss,how:'Checked offline by key ideas. Compare with the model answer.'};
}
function gradePrompt(chk,ans){
  return 'You are a supportive nursing instructor grading a student\'s "explain it back" answer for a pathophysiology/med-surg study guide.\n'+
   'Judge MEANING, not wording. The student does not need to match the model answer word for word. Mark "correct" when the core reasoning is right and the main mechanism is present, even if phrased differently, simplified, or missing minor details. Mark "partly" only if a central idea is missing or there is a real error. Mark "not_yet" if the reasoning is wrong or absent.\n\n'+
   'QUESTION: '+chk.prompt.replace(/\*\*|==/g,'')+'\n\nMODEL ANSWER: '+chk.model.replace(/\*\*|==/g,'')+'\n\nKEY IDEAS: '+(chk.keys||[]).map(function(k){return k.label}).join('; ')+'\n\nSTUDENT ANSWER: '+ans.slice(0,3000)+'\n\n'+
   'Reply with only JSON: {"verdict":"correct"|"partly"|"not_yet","feedback":"1-2 warm, specific sentences addressed to the student","missing":["short phrases for key ideas still missing; empty if correct"]}';
}
function scGrade(id,btn){
  var chk=CHECKS[id],ta=document.querySelector('textarea[data-sc="'+id+'"]'),out=document.getElementById('scres-'+id);
  if(!chk||!ta||SC.busy[id])return;
  var ans=ta.value.trim();
  if(ans.length<10){out.innerHTML='<div class="scv warn">Type your explanation first, then check it.</div>';return}
  function done(r){SC.res[id]=r;SC.busy[id]=false;btn.disabled=false;btn.textContent='Check my answer';var o=document.getElementById('scres-'+id);if(o)o.innerHTML=scResHTML(r)}
  if(!SAMPLE||SAMPLE_OFF){done(localGrade(ans,chk));return}
  SC.busy[id]=true;btn.disabled=true;btn.textContent='Checking…';out.innerHTML='<div class="scv">Thinking…</div>';
  SAMPLE.json(gradePrompt(chk,ans),{modelTier:'quick'}).then(function(j){
    var v=(j&&j.verdict)||'partly';if(['correct','partly','not_yet'].indexOf(v)<0)v='partly';
    done({verdict:v,feedback:String(j.feedback||''),missing:Array.isArray(j.missing)?j.missing.map(String).slice(0,4):[],how:'Checked by Claude for meaning, not exact wording.'});
  }).catch(function(e){
    var code=e&&e.code;if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(code)>-1)SAMPLE_OFF=true;
    var r=localGrade(ans,chk);if(code==='rate_limited')r.how='Claude is busy right now, so this was checked offline by key ideas.';done(r);
  });
}
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.sc!==undefined){SC.drafts[t.dataset.sc]=t.value;try{localStorage.setItem('sg:'+ID+':scd',JSON.stringify(SC.drafts))}catch(x){}}});
document.addEventListener('click',function(e){var t=e.target.closest('[data-a="scgrade"]');if(t)scGrade(t.dataset.v,t)});

/* ---------- glossary ---------- */
function glossView(){
  return '<p class="intro">Every abbreviation used in this guide, spelled out.</p><input class="search" id="gs" type="search" placeholder="Search the glossary" aria-label="Search the glossary"><div class="tablewrap"><table id="gt"><thead><tr><th>Abbreviation</th><th>Meaning</th></tr></thead><tbody>'+
   D.glossary.map(function(g){return '<tr><td><b>'+esc(g[0])+'</b></td><td>'+esc(g[1])+'</td></tr>'}).join('')+'</tbody></table></div>';
}

/* ---------- sidebar ---------- */
function startSide(){return ''}
function sideCondHTML(c){
  var secs=secsFor(c),done=0,op=!!S.open[c.id],h='';
  secs.forEach(function(s){if(S.rev[rk(c.id,s[0])])done++});
  var cur=c.id===S.cond&&S.view==='study';
  h+='<div class="sc'+(cur?' cur':'')+'" style="--c:'+c.color+'"><button class="scb" data-a="sc" data-v="'+c.id+'" aria-expanded="'+op+'"><i></i><span class="scn">'+esc(c.short||c.name)+'</span><small>'+done+'/'+secs.length+'</small><span class="chev"></span></button>';
  if(op){
    h+='<ul class="sbr">';
    secs.forEach(function(s){
      var cs=cur&&S.sec===s[0],d=S.rev[rk(c.id,s[0])];
      h+='<li><button class="sbb'+(cs?' cur':'')+(d?' done':'')+'" data-a="go" data-c="'+c.id+'" data-s="'+s[0]+'"'+(cs?' aria-current="true"':'')+'><span aria-hidden="true">'+s[1]+'</span> '+s[2]+'</button></li>';
    });
    h+='</ul>';
  }
  return h+'</div>';
}
function sideHTML(){
  var h='<div class="sidehd"><b>Menu</b><span><button class="lnk" data-a="expall">Expand all</button><button class="lnk" data-a="colall">Collapse all</button><button class="sidehide" data-a="sidehide" aria-label="Hide the topics menu">« Hide</button></span></div>';
  var cats=[],ci={};
  D.conditions.forEach(function(c){var k=c.cat||c.group||'Conditions';if(!(k in ci)){ci[k]=cats.length;cats.push({n:k,color:c.catColor||c.color,subs:[],si:{}})}var g=cats[ci[k]],sk=c.sub||'';if(!(sk in g.si)){g.si[sk]=g.subs.length;g.subs.push({n:sk,items:[]})}g.subs[g.si[sk]].items.push(c)});
  cats.forEach(function(g){
    var key='cat:'+g.n,go=S.gopen[key]!==false,cnt=g.subs.reduce(function(a,s){return a+s.items.length},0);
    h+='<div class="cat" style="--c:'+g.color+'"><button class="catb" data-a="sgrp" data-v="'+esc(key)+'" aria-expanded="'+go+'"><span class="catn">'+esc(g.n)+'</span><small>'+cnt+' topics</small><span class="chev"></span></button>';
    if(go){
      h+='<div class="catbody">';
      var bs=(D.basics||[]).filter(function(b){return b.cat===g.n});
      if(bs.length){
        h+='<div class="subh">Basics: start here</div><ul class="sbr basics">'+bs.map(function(b){var cur=S.view==='basics'&&D.basics[S.bi]===b;return '<li><button class="sbb'+(cur?' cur':'')+'" data-a="jump" data-w="basics" data-v="b-'+esc(b.id)+'"><span aria-hidden="true">📘</span> '+esc(b.title)+'</button></li>'}).join('')+'</ul>';
      }
      g.subs.forEach(function(s){
        if(s.n)h+='<div class="subh">'+esc(s.n)+'</div>';
        s.items.forEach(function(c){h+=sideCondHTML(c)});
      });
      h+='</div>';
    }
    h+='</div>';
  });
  if(HASR){
    var rk0='__readings',ro=S.gopen[rk0]!==false;
    h+='<div class="cat" style="--c:var(--accent)"><button class="catb" data-a="sgrp" data-v="'+rk0+'" aria-expanded="'+ro+'"><span class="catn">Required readings</span><small>'+D.readings.length+' chapters</small><span class="chev"></span></button>';
    if(ro){
      var books=[],bi={};
      D.readings.forEach(function(r,i){var b=r.book||'Readings';if(!(b in bi)){bi[b]=books.length;books.push({n:b,items:[]})}books[bi[b]].items.push([r,i])});
      h+='<div class="catbody">'+books.map(function(b){return '<div class="subh">'+esc(b.n)+'</div><ul class="sbr basics">'+b.items.map(function(x){var r=x[0],cur=S.view==='readings'&&S.ri===x[1];return '<li><button class="sbb'+(cur?' cur':'')+'" data-a="jump" data-w="readings" data-v="r-'+esc(r.id)+'">'+esc(r.chapter)+': '+esc(r.short||r.title)+'</button></li>'}).join('')+'</ul>'}).join('')+'</div>';
    }
    h+='</div>';
  }
  var other=(D.basics||[]).filter(function(b){return !b.cat});
  if(other.length)h+='<div class="subh">Other basics</div><ul class="sbr basics">'+other.map(function(b){return '<li><button class="sbb" data-a="jump" data-w="basics" data-v="b-'+esc(b.id)+'">'+esc(b.title)+'</button></li>'}).join('')+'</ul>';
  return h;
}

/* ---------- render ---------- */
function applyTheme(){
  var r=document.documentElement;
  if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
  var dark=S.theme==='dark'||(S.theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.body.setAttribute('data-dark',dark?'1':'0');
  $('#themebtn').textContent='Theme: '+S.theme;
}
function setHdr(){var hd=$('header.top');if(hd)document.documentElement.style.setProperty('--hdr',hd.offsetHeight+'px')}
function render(keep){
  var y=window.scrollY,sy=$('#side')?$('#side').scrollTop:0;
  $('#ttl').innerHTML=esc(D.meta.title)+'<small>'+esc(D.meta.course+' \u00B7 '+D.meta.unit+(D.meta.source?' \u00B7 Built from '+D.meta.source:''))+'</small>';
  $('#tabs').innerHTML=TABS.map(function(t){return '<button role="tab" data-a="tab" data-v="'+t[0]+'" aria-selected="'+(S.view===t[0])+'">'+t[1]+'</button>'}).join('');
  $('#side').innerHTML=sideHTML();
  var v=S.view,h=v==='study'?studyView():v==='map'?mapView():v==='guide'?guideView():v==='drugs'?drugsView():v==='procs'?procsView():v==='basics'?basicsView():v==='readings'?readingsView():v==='cmp'?cmpView():v==='quiz'?quizView():v==='cards'?cardsView():v==='abg'?abgView():glossView();
  $('#app').innerHTML=h+'<footer>Study aid built from your course materials. Not clinical advice. Doses and drug facts are for studying only: check anything unclear against your slides, your drug guide, and your instructor.</footer>';
  document.body.classList.toggle('self',S.self);
  document.body.classList.toggle('nohy',!S.hy);
  document.body.classList.toggle('noside',!S.side);
  document.body.classList.toggle('drawer',S.drawer);
  $('#selftest').checked=S.self;$('#hytoggle').checked=S.hy;
  var open=isMobile()?S.drawer:S.side;
  $('#topicsbtn').setAttribute('aria-expanded',open?'true':'false');
  applyTheme();setHdr();
  if(keep){window.scrollTo(0,y);$('#side').scrollTop=sy}
}
function goTo(cid,sec){
  S.cond=cid;S.sec=sec;S.open[cid]=true;store.set('sopen2',S.open);S.drawer=false;
  var target=null;
  S.view='study';S.dopen['s-'+cid+'-'+sec]=true;target='s-'+cid+'-'+sec;
  render(false);
  var el=target&&document.getElementById(target);
  if(el)el.scrollIntoView({block:'start'});else window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a;
  if(a==='reveal'){t.classList.toggle('shown');return}
  if(a==='model'){var mm=t.closest('.selfcheck');mm=mm&&mm.querySelector('.model');if(mm){mm.classList.toggle('show');t.textContent=mm.classList.contains('show')?'Hide model answer':'Show model answer'}return}
  if(a==='pg'){var k=t.dataset.k,v=+t.dataset.v;if(k==='cond'){S.cond=D.conditions[v].id;S.open[S.cond]=true;store.set('sopen2',S.open)}else if(k==='basics'){S.bi=v;store.set('bi',v)}else if(k==='readings'){S.ri=v;store.set('ri',v)}else if(k==='cmp'){S.ci=v}else if(k==='quiz'){S.qi=v}render(false);window.scrollTo(0,0);return}
  if(a==='sidehide'){if(isMobile()){S.drawer=false}else{S.side=false;store.set('side',false)}render(true);return}
  if(a==='sideshow'){S.side=true;store.set('side',true);render(true);return}
  if(a==='shownorm'){S.shownorm=true;render(true);return}
  if(a==='tab'){S.view=t.dataset.v;S.drawer=false;render(false);window.scrollTo(0,0)}
  else if(a==='cond'){S.cond=t.dataset.v;S.c2=null;S.open[S.cond]=true;store.set('sopen2',S.open);render(true)}
  else if(a==='sec'){S.sec=t.dataset.v;var sid='s-'+S.cond+'-'+S.sec;S.dopen[sid]=true;render(true);var se=document.getElementById(sid);if(se)se.scrollIntoView({block:'start',behavior:'smooth'})}
  else if(a==='rev'){var k=rk(S.cond,t.dataset.s||S.sec);S.rev[k]=!S.rev[k];store.set('rev',S.rev);render(true)}
  else if(a==='opt'){var q=+t.dataset.q;if(S.qa[q]===undefined){S.qa[q]=+t.dataset.o;render(true)}}
  else if(a==='qreset'){S.qa={};render(false)}
  else if(a==='flip'){S.flip=!S.flip;render(true)}
  else if(a==='cnext'){S.card=(S.card+1)%S.deck.length;S.flip=false;render(true)}
  else if(a==='cprev'){S.card=(S.card-1+S.deck.length)%S.deck.length;S.flip=false;render(true)}
  else if(a==='cshuf'){S.deck=shuffle(ALLCARDS);S.card=0;S.flip=false;render(true)}
  else if(a==='sc'){var id=t.dataset.v;if(S.view!=='study'||S.cond!==id){S.view='study';S.cond=id;S.c2=null;S.open[id]=true;S.drawer=false;store.set('sopen2',S.open);render(false);window.scrollTo(0,0)}else{S.open[id]=!S.open[id];store.set('sopen2',S.open);render(true)}}
  else if(a==='sgrp'){var g=t.dataset.v;S.gopen[g]=S.gopen[g]===false;store.set('gopen2',S.gopen);render(true)}
  else if(a==='expall'||a==='colall'){var ex=(a==='expall');D.conditions.forEach(function(c){S.open[c.id]=ex;S.gopen['cat:'+(c.cat||c.group||'Conditions')]=ex});S.gopen.__readings=ex;store.set('sopen2',S.open);store.set('gopen2',S.gopen);render(true)}
  else if(a==='go'){goTo(t.dataset.c,t.dataset.s)}
  else if(a==='scrim'){S.drawer=false;render(true)}
  else if(a==='dfilter'){S.dfilter=t.dataset.v;render(false);window.scrollTo(0,0)}
  else if(a==='pfilter'){S.pfilter=t.dataset.v;render(false);window.scrollTo(0,0)}
  else if(a==='goc'){goTo(t.dataset.v,'path')}
  else if(a==='jump'){var jid=t.dataset.v,w=t.dataset.w;S.view=w;S.drawer=false;var key=jid.slice(2);if(w==='basics'){D.basics.forEach(function(b,k){if(b.id===key){S.bi=k;store.set('bi',k)}})}else if(w==='readings'){D.readings.forEach(function(r,k){if(r.id===key){S.ri=k;store.set('ri',k)}})}render(false);window.scrollTo(0,0)}
  else if(a==='bexp'||a==='bcol'){D.basics.forEach(function(b){S.dopen['b-'+b.id]=(a==='bexp')});render(true)}
  else if(a==='rexp'||a==='rcol'){D.readings.forEach(function(r){S.dopen['r-'+r.id]=(a==='rexp')});render(true)}
  else if(a==='gexp'||a==='gcol'){D.conditions.forEach(function(c){secsFor(c).forEach(function(s){S.dopen['s-'+c.id+'-'+s[0]]=(a==='gexp')})});render(true)}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='selftest'){S.self=t.checked;store.set('self',S.self);render(true)}
  else if(t.id==='hytoggle'){S.hy=t.checked;store.set('hy',S.hy);render(true)}
  else if(t.dataset&&t.dataset.a==='cmp'){S.cmp=t.checked;render(true)}
  else if(t.dataset&&t.dataset.a==='c2'){S.c2=t.value;render(true)}
  else if(t.id==='condsel'){S.cond=t.value;S.open[S.cond]=true;store.set('sopen2',S.open);render(false);window.scrollTo(0,0)}
  else if(t.id==='cmpsel'){S.ci=+t.value;render(false);window.scrollTo(0,0)}
});
document.addEventListener('toggle',function(e){
  var el=e.target;if(el&&el.tagName==='DETAILS'&&el.id&&(el.classList.contains('sec')||el.classList.contains('drug')))S.dopen[el.id]=el.open;
},true);
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='gs'){var q=e.target.value.toLowerCase();document.querySelectorAll('#gt tbody tr').forEach(function(r){r.style.display=r.textContent.toLowerCase().indexOf(q)>-1?'':'none'})}
  else if(id==='ps'){var q3=e.target.value.toLowerCase();document.querySelectorAll('#pl details.drug').forEach(function(r){var hit=r.textContent.toLowerCase().indexOf(q3)>-1;r.style.display=hit?'':'none';if(hit&&q3)r.open=true})}
  else if(id==='ds'){var q2=e.target.value.toLowerCase();document.querySelectorAll('#dl details.drug').forEach(function(r){var hit=r.textContent.toLowerCase().indexOf(q2)>-1;r.style.display=hit?'':'none';if(hit&&q2)r.open=true})}
});
document.addEventListener('keydown',function(e){
  var el=e.target;
  if(el&&el.matches&&el.matches('.row.reveal')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.classList.toggle('shown')}
  if(e.key==='Escape'&&S.drawer){S.drawer=false;render(true)}
});
$('#topicsbtn').addEventListener('click',function(){
  if(isMobile()){S.drawer=!S.drawer}else{S.side=!S.side;store.set('side',S.side)}
  render(true);
});
$('#themebtn').addEventListener('click',function(){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';store.set('theme',S.theme);applyTheme()});
window.addEventListener('resize',setHdr);
render(false);
})();
