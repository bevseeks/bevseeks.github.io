all-vein filling", "kidneys conserve water; poor perfusion"], ["Dry mouth and mucous membranes, decreased skin turgor, sunken eyes, tongue furrows, no tears or sweat, hard stools", "interstitial fluid depleted"], ["==Thirst==", "high osmolality stimulates hypothalamic osmoreceptors"], ["==Confusion, lethargy==, progressing to coma", "brain cells shrivel as water leaves them (hypernatremia portion)"], ["Hypovolemic shock if severe", "vascular volume can no longer maintain perfusion"]], "labs": [["Serum Na⁺", "==> 145 mEq/L== (Galen 135 to 145)"], ["Serum osmolality", "↑ (Galen 285 to 295 mOsm/kg)"], ["Hct, BUN", "↑ (hemoconcentration)"], ["Urine specific gravity and osmolality", "↑ (concentrated) if the kidneys are responding"]], "risks": [["Gastroenteritis", "Vomiting and diarrhea without replacing both salt and water"], ["Age", "Infants and older adults (dependent on others for fluids, weak thirst in older adults, high insensible loss in infants)"], ["Heat, fever, exertion", "Large sweat and insensible losses"], ["Impaired access", "Cognitive impairment, immobility, dysphagia"]], "management": [["Oral rehydration solution (ORS) for mild to moderate cases", "replaces water, sodium, and glucose together; glucose speeds sodium and water absorption in the gut"], ["IV fluids as ordered: restore volume first, then correct the sodium gradually with hypotonic fluid", "volume protects perfusion; slow sodium correction prevents cerebral edema"], ["Treat the cause (antiemetics, antidiarrheals, antipyretics)", "stops the ongoing hypotonic loss"]], "nursing": {"assess": [["Vital signs with orthostatic BP, weight, I&O", "volume status"], ["==Neurologic status== (orientation, level of consciousness)", "tracks the sodium and the speed of its correction"], ["Serum Na⁺ trend", "too-fast fall causes cerebral edema"], ["Mucous membranes, tongue, urine color and specific gravity", "quick bedside trend"]], "act": [["Support circulation: IV access and fluids as ordered; fall precautions", "hypovolemia threatens perfusion first", 1], ["Seizure and safety precautions if confused", "shrunken brain cells can cause seizures", 1], ["Offer ORS in small, frequent amounts; give antiemetic first if nauseated", "small amounts are tolerated and absorbed", 2], ["Monitor sodium during correction; report a rapid fall or new headache or confusion", "rapid correction swells brain cells", 2], ["Mouth care and skin care", "comfort and integrity", 3]], "order": "circulation and brain safety come first; then the losses are replaced at a safe pace and comfort is maintained."}, "education": [["Replace salt AND water during vomiting or diarrhea", "use an oral rehydration solution rather than plain water or sugary drinks"], ["Caregivers of infants and older adults", "offer fluids on a schedule; watch diapers or urine color"], ["When to seek help", "no urine for 8 hours, confusion, extreme thirst, dizziness, or a dry mouth with sunken eyes"]], "complications": ["Hypovolemic shock", "Seizures and coma from brain cell shrinkage", "Cerebral edema if the sodium is corrected too fast", "Acute kidney injury"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "New confusion, lethargy, or seizure; systolic BP below 90 or a large orthostatic drop; urine output below 30 mL/hr."}, {"type": "book", "label": "Textbook box: Signs and symptoms of clinical dehydration (Box 24.5)", "in": "man", "text": "Banasik's list combines the volume-deficit signs (sudden weight loss, postural hypotension with a rising pulse, flat neck veins, oliguria, poor turgor, no tears or sweat, hard stools, sunken eyes, tongue furrows) with the concentration signs (**thirst, high serum sodium, confusion, lethargy, coma**).", "source": "Banasik Ch. 24, Box 24.5, p. 539"}, {"type": "good", "label": "The question your instructor asks", "text": "\"Is it a volume problem, a concentration problem, or both?\" ==Check the serum sodium==: normal sodium with deficit signs = hypovolemia; high sodium with deficit signs = clinical dehydration."}], "figures": [{"title": "Clinical dehydration", "in": "path", "source": "Banasik Ch. 24, Fig. 24.8, p. 538 (redrawn)", "steps": ["Hypotonic fluid lost (vomiting, diarrhea, sweat)", "Vascular volume ↓ and interstitial volume ↓", "ECF osmolality ↑", "Water leaves cells → cells shrivel"], "caption": "Unlike pure ECV deficit, the cells shrink too, which is where the neurologic signs come from."}], "sbar": null, "bridge": [["Pathophysiology", "Hypotonic losses remove saline (ECV deficit) and extra water (hypernatremia), so the ECF shrinks and cells shrivel."], ["Med-Surg", "You treat both: restore volume to protect perfusion, then correct sodium slowly while watching neurologic status."]], "drugs": [{"generic": "oral rehydration solution", "brands": ["Pedialyte", "Rehydralyte"], "cls": "Oral multiple-electrolyte solution with dextrose", "moa": "Supplies sodium, potassium, chloride, and a small amount of glucose in concentrations the gut absorbs well; glucose-sodium co-transport pulls water across the intestine.", "indications": ["Mild to moderate dehydration from vomiting and diarrhea, especially in children and older adults"], "dose": [["PO", "Amount calculated and prescribed by the provider (F&P). Not in the slides: follow the order and product label."]], "assess": {"before": [["Ability to swallow, nausea, level of consciousness", "aspiration risk; oral route only if alert and tolerating"], ["Kidney function", "use cautiously in impaired kidney function (F&P)"]], "after": [["Urine output, weight, mucous membranes, heart rate", "response"], ["Serum Na⁺ and K⁺ if ordered", "avoid overcorrection"]]}, "effects": {"common": ["Nausea if taken too fast"], "serious": ["Electrolyte excess if over-given or mixed incorrectly"]}, "avoid": {"contra": ["Severe dehydration or shock (needs IV therapy)", "Impaired kidney function (caution)"], "interactions": ["Do not mix with milk or fruit juice (F&P)"]}, "teach": ["Sip small amounts often", "Do not dilute or mix with other drinks", "Seek care if vomiting continues or urine stops"], "verify": ["dose", "names"]}], "procedures": [{"name": "Urine specific gravity measurement", "kind": "diagnostic", "indication": "Shows how well the kidneys are conserving water. In dehydration it should be ==above 1.020==; a low value in a dehydrated client suggests the kidneys cannot concentrate (diabetes insipidus, kidney damage).", "steps": [["Collect a fresh urine sample (about 20 mL for the lab, or a dipstick sample per policy)", "fresh urine gives an accurate reading"], ["Test with the dipstick or send to the lab", "measures urine density versus water (1.000)"], ["Compare to Galen's normal 1.005 to 1.030 and to previous results", "the trend shows whether rehydration is working"]], "before": [["Note glucose or protein in the urine", "they falsely raise specific gravity"]], "after": [["Report persistently high values despite fluids, or low values with signs of deficit", "suggests ongoing loss or a kidney concentrating problem"]], "complications": ["Persistently concentrated urine with falling output"], "teach": ["Pale yellow urine is a home sign of good hydration"], "verify": ["steps"]}]}, {"id": "hypoNa", "name": "Hyponatremia (low Na⁺)", "short": "Hyponatremia", "group": "Concentration problem · ECF too dilute · cells swell", "cat": "Sodium Imbalances (water balance)", "sub": "Too dilute: water excess", "catColor": "#0e7490", "color": "#0e7490", "pair": "hyperNa", "sig": ["Na⁺ < 135", "Osmolality ↓", "Brain cells swell", "Think BRAIN"], "hook": "The ECF has too much water for its sodium, so it is too dilute. Water rushes into cells by osmosis, and the cells that cannot tolerate swelling inside a rigid skull, the brain cells, produce the signs.", "patho": {"chain": ["Gain of relatively more water than salt (==dilutional==: excess ADH or SIADH, excess D5W, hypotonic irrigations, tap-water enemas, compulsive water drinking) **or** loss of more salt than water (==depletional==: diuretics, especially thiazides, salt-wasting kidney disease, adrenal insufficiency, GI losses replaced with plain water, burns)", "Serum sodium falls below 135 mEq/L and serum osmolality falls", "The ECF is now more dilute than the inside of cells", "Water moves **into cells** by osmosis; brain cells and glial cells swell inside the skull", "Cerebral edema with central nervous system (CNS) dysfunction, up to herniation"], "compensation": "ADH should switch off so the kidneys excrete dilute urine, and brain cells slowly push solutes out to limit swelling over about 48 hours. That brain adaptation is why chronic hyponatremia must be corrected slowly: a rapid rise shrinks the adapted cells and destroys myelin (osmotic demyelination). In SIADH, ADH stays on inappropriately and the kidneys keep retaining water.", "tip": "Your Patho slides: \"THINK BRAIN.\" Sodium imbalances show up as neurologic signs. Remember \"water follows sodium\"; when sodium is low, water goes where the particles are, into cells."}, "manifestations": [["Anorexia, nausea, vomiting, abdominal cramping", "early nonspecific CNS and GI response to falling osmolality"], ["==Headache==, malaise, weakness, muscle cramps", "brain cells begin to swell; muscle excitability changes"], ["==Confusion, lethargy, dizziness==", "worsening cerebral edema; a frequently overlooked cause of confusion in older adults"], ["==Seizures, coma==", "severe or rapid fall (Brunner: signs of increased intracranial pressure when Na⁺ < 115 mEq/L)"], ["Cerebral herniation", "swelling compresses the brainstem: fatal"], ["Increased pulse, decreased BP (depletional) OR weight gain and no edema (dilutional/SIADH)", "the volume picture depends on the cause: salt loss shrinks volume; water gain expands it, mostly inside cells"]], "labs": [["Serum sodium", "==< 135 mEq/L== (Galen 135 to 145); may be < 100 in SIADH"], ["Serum osmolality", "↓ (Galen 285 to 295 mOsm/kg)"], ["Urine sodium", "< 20 mEq/L when the cause is nonrenal loss or low intake (kidneys conserving); ==> 20 mEq/L in SIADH== or renal salt wasting"], ["Urine specific gravity", "Low (1.002 to 1.004) with sodium lack; high (> 1.012) in SIADH (concentrated urine despite dilute blood)"], ["Health history", "IV fluids running, medications (thiazides, SSRIs, carbamazepine), recent surgery, lung tumor, polydipsia"]], "risks": [["Dilutional (water gain)", "Excess ADH: SIADH (head injury, brain surgery, small-cell lung tumor, mechanical ventilation, postoperative pain and nausea), excessive D5W, hypotonic irrigations, tap-water enemas, psychogenic polydipsia, beer potomania, SSRIs"], ["Depletional (salt loss)", "Thiazide diuretics (especially older women), salt-wasting kidney disease, adrenal insufficiency, NG suction, vomiting, diarrhea, burns, heavy sweating replaced with plain water"], ["Athletes", "Marathon and endurance athletes who drink large amounts of water while losing sodium in sweat"], ["Older adults", "Decreased kidney ability to excrete water, multiple medications"]], "management": [["==Water (fluid) restriction== when volume is normal or high (dilutional, SIADH)", "removes the excess water so sodium concentration rises; safer than adding sodium to a volume-loaded client"], ["Sodium replacement: oral, NG, or IV isotonic saline / lactated Ringer's for depletional", "replaces the sodium that was lost"], ["Hypertonic saline (3%) only for severe neurologic symptoms, given slowly with close monitoring", "pulls water out of swollen brain cells; small volumes raise sodium quickly"], ["Limit correction: no more than 12 mEq/L in 24 hours (Brunner); aim only to relieve neuro signs (about 125 mEq/L)", "too fast a rise causes osmotic demyelination: dysarthria, paralysis, coma"], ["Treat the cause; ADH (vasopressin) receptor antagonists in hospital (Brunner)", "stopping the water gain or salt loss prevents recurrence"]], "nursing": {"assess": [["==Neurologic status== (orientation, LOC, headache, twitching) frequently", "the brain shows the severity and the response to correction"], ["Serum Na⁺ trend (and urine Na⁺, specific gravity as ordered)", "detects worsening and too-rapid correction"], ["I&O and daily weight", "identifies water excess or loss"], ["GI signs: anorexia, nausea, cramping", "early warning"], ["Current IV fluids and medication history", "D5W, hypotonic fluids, thiazides, SSRIs are common culprits"]], "act": [["==Seizure precautions== and airway protection for Na⁺ < 125 or neuro changes", "swollen brain cells can seize; the airway is at risk", 1], ["Give hypertonic saline only by infusion pump, slowly, with frequent Na⁺ checks and neuro checks", "small volumes change sodium quickly; overcorrection injures the brain", 1], ["Enforce fluid restriction as ordered; spread allowed fluids over the day; mouth care", "removes the excess water while keeping the client comfortable", 2], ["Encourage high-sodium foods if allowed (broth, tomato juice) for depletional causes", "replaces lost sodium orally", 2], ["Safety: fall precautions for confusion or dizziness", "confusion and orthostasis cause falls", 2], ["Avoid excess free water with hypotonic tube feedings; flush with the ordered amount", "free water adds to the dilution", 3]], "order": "the airway and seizure risk come first because brain swelling kills; then the sodium is corrected at a safe speed and the source of excess water is removed."}, "education": [["Fluid restriction", "measure and spread allowed fluids; ice chips and sugarless gum help thirst"], ["Athletes", "do not overdrink water during long events; electrolyte drinks are better; salt tablets are not recommended (Brunner)"], ["Medications", "thiazides and some antidepressants can lower sodium; report headache, nausea, or confusion"], ["When to seek help", "confusion, severe headache, vomiting, muscle twitching, or seizures"]], "complications": ["Seizures, coma, cerebral herniation", "Osmotic demyelination from correcting too fast", "Falls from confusion", "Fluid overload from hypertonic saline (pulmonary edema)"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Seizure, new or worsening confusion or lethargy, severe headache with vomiting, or a sodium that is falling fast or is below 125 mEq/L. Also report a sodium that ==rises more than 12 mEq/L in 24 hours== during treatment."}, {"type": "book", "label": "Textbook box: Quality and Safety Nursing Alert", "in": "tx", "text": "Highly hypertonic sodium solutions (2% to 23%) must be ==given slowly with close monitoring==, because only small volumes are needed to raise the serum sodium. Brunner notes 1 L of 3% saline holds 513 mEq of sodium.", "source": "Brunner Ch. 10, Quality and Safety Nursing Alert, p. 245"}, {"type": "watch", "label": "Dangerous mistake", "text": "Treating dilutional hyponatremia (SIADH) by giving sodium alone: the kidneys excrete the sodium, the volume rises, and the problem does not fix. Restrict water instead, unless severe neuro signs require hypertonic saline."}, {"type": "good", "label": "The question your instructor always asks", "text": "\"Dilutional or depletional?\" Dilutional = **too much water** (SIADH, D5W); depletional = **lost more salt than water** (thiazides, GI loss replaced with water). The volume picture and urine sodium tell you which."}], "figures": [{"title": "Effect of a low sodium on brain cells", "in": "path", "source": "Banasik Fig. 24.6, p. 537; Brunner Fig. 10-7 (redrawn)", "steps": ["ECF sodium and osmolality ↓", "Inside of the cell is relatively more concentrated", "Water moves into the cell by osmosis", "Brain cells swell inside the rigid skull → headache, confusion, seizures"], "caption": "Low sodium = swollen brain cells. The faster the drop, the worse the swelling."}], "sbar": {"title": "Applying SBAR: postoperative dilutional hyponatremia", "s": "A 58-year-old 1 day after spinal surgery is confused and vomited twice; she just had a 30-second tonic-clonic seizure.", "b": "Receiving D5W at 125 mL/hr overnight; on sertraline; IV morphine for pain.", "a": "Na⁺ 118 (128 yesterday); serum osmolality 250; urine specific gravity 1.020; weight up 1.2 kg; no edema; now drowsy but responds to voice; airway clear.", "r": "I have stopped the D5W, placed her on her side with seizure precautions and suction ready. Please evaluate now. I anticipate orders for fluid restriction, possibly 3% saline by pump, and sodium checks every 2 to 4 hours with neuro checks."}, "bridge": [["Pathophysiology", "Too much water for the sodium makes the ECF dilute, so water moves into brain cells and they swell."], ["Med-Surg", "You watch the brain (neuro checks, seizure precautions), restrict water or replace sodium as ordered, and never let the sodium rise more than 12 mEq/L in 24 hours."]], "drugs": [{"generic": "sodium chloride 3% (hypertonic saline)", "brands": ["3% NaCl"], "cls": "Hypertonic IV solution (513 mEq/L Na⁺, about 1026 mOsm/L)", "moa": "Much more concentrated than plasma, so it ==pulls water out of swollen cells== (including brain cells) into the vascular space and raises serum sodium quickly.", "indications": ["==Severe symptomatic hyponatremia== (seizures, coma, delirium) (Med-Surg slides: hypertonic solutions)", "Cerebral edema"], "dose": [["IV", "Small volumes ordered by the provider; given slowly by infusion pump. Brunner: goal is only to relieve neuro signs (sodium about 125) and no more than a 12 mEq/L rise in 24 hours. Use your facility protocol."]], "assess": {"before": [["Serum Na⁺ and osmolality", "baseline for the rate of correction"], ["Neuro status", "baseline to judge improvement"], ["Lung sounds, heart failure history", "risk of volume overload"], ["IV access (often central)", "highly concentrated solutions irritate veins"]], "after": [["Serum Na⁺ frequently (often every 2 to 4 hours)", "prevents overcorrection"], ["Neuro checks", "should improve; new weakness, trouble speaking, or swallowing can mean demyelination"], ["Lungs, respiratory rate, weight", "pulmonary edema from volume load"], ["IV site", "phlebitis, infiltration"]]}, "effects": {"common": ["Thirst", "Vein irritation"], "serious": ["**Osmotic demyelination** if sodium rises too fast", "**Fluid overload, pulmonary edema**", "Hypernatremia"]}, "avoid": {"contra": ["Hypernatremia; caution in heart failure and fluid overload"], "interactions": ["None with food (IV use)"]}, "teach": ["Explain frequent blood draws and neuro checks", "Report shortness of breath, headache, or trouble speaking or swallowing"], "verify": ["dose", "names"]}], "procedures": [{"name": "Seizure precautions", "kind": "therapeutic", "indication": "Swollen brain cells can seize. Precautions protect the airway and prevent injury in severe or rapidly developing hyponatremia.", "steps": [["Bed low and locked, side rails padded per policy", "prevents injury during a seizure"], ["Suction and oxygen set up and working at the bedside", "airway clearance and oxygenation after a seizure"], ["IV access in place", "needed for emergency medications and hypertonic saline"], ["If a seizure occurs: turn the client to the side, do not restrain or put anything in the mouth, time it", "keeps the airway open and prevents aspiration and injury"]], "before": [["Check the order and facility policy", "precautions vary by facility"], ["Explain to the client and family", "reduces fear and encourages call-light use"]], "after": [["After a seizure: assess airway, breathing, oxygen saturation, neuro status; notify the provider", "the sodium may be falling further"], ["Document duration and features", "guides treatment"]], "complications": ["==Status epilepticus==", "Aspiration", "Injury"], "teach": ["Call for help at the first warning sign (headache, twitching)"], "verify": ["steps"]}]}, {"id": "hyperNa", "name": "Hypernatremia (high Na⁺)", "short": "Hypernatremia", "group": "Concentration problem · ECF too concentrated · cells shrink", "cat": "Sodium Imbalances (water balance)", "sub": "Too concentrated: water deficit", "catColor": "#0e7490", "color": "#a21caf", "pair": "hypoNa", "sig": ["Na⁺ > 145", "Osmolality ↑", "Thirst", "Brain cells shrink"], "hook": "The ECF has too little water for its sodium, so it is too concentrated. Water is pulled out of cells, brain cells shrivel, and thirst, the body's main defense, is often exactly what the client cannot act on.", "patho": {"chain": ["Gain of more salt than water (hypertonic saline, hypertonic tube feedings, salt tablets, near-drowning in salt water, sodium bicarbonate) **or** loss of more water than salt (==diabetes insipidus==, osmotic diuresis, prolonged vomiting, diarrhea, or sweating without water replacement)", "Often combined with ==no access to water or inability to respond to thirst== (infants, older adults, unconscious or cognitively impaired clients)", "Serum sodium rises above 145 mEq/L and osmolality rises above about 300", "Water moves **out of cells** by osmosis; brain cells shrink", "Shrunken, dysfunctional brain cells: confusion to seizures and coma"], "compensation": "Thirst is a strong defender: hypernatremia rarely develops in someone who is alert and has water. ADH rises so the kidneys excrete small, concentrated urine (except in diabetes insipidus, where there is no ADH effect and urine stays dilute). Brain cells slowly make their own solutes to pull water back in, which is why correction must be gradual: lowering sodium too fast makes those adapted cells swell (cerebral edema).", "tip": "Still \"THINK BRAIN\", but add **thirst** and a **dry, sticky mouth**. Low sodium swells; high sodium shrinks."}, "manifestations": [["==Thirst==; dry, swollen, sticky tongue and mucous membranes", "high osmolality stimulates osmoreceptors; cells and tissues lose water"], ["Elevated body temperature (mild)", "cellular dehydration affects heat regulation; returns to normal once corrected"], ["==Restlessness, irritability, confusion, lethargy, hallucinations==", "brain cells shrink and function poorly"], ["Muscle twitching, hyperreflexia, tonic-clonic seizures, coma", "neuronal dehydration increases irritability, then fails"], ["Oliguria (except diabetes insipidus, which causes polyuria)", "ADH makes the kidneys conserve water"], ["Increased BP and pulse; pulmonary edema when caused by sodium gain", "a sodium load pulls water into the vessels and expands volume (Med-Surg slides list pulmonary edema and ↑ BP)"]], "labs": [["Serum sodium", "==> 145 mEq/L== (Galen 135 to 145)"], ["Serum osmolality", "↑ (often > 300 mOsm/kg; Galen normal 285 to 295)"], ["Urine sodium", "↓ as the kidneys conserve"], ["Urine specific gravity and osmolality", "↑ (concentrated), ==except in diabetes insipidus: very dilute urine (osmolality < 250)== despite concentrated blood"], ["Health history and assessment", "Access to water, tube feedings, IV fluids, diabetes insipidus, fever, burns"]], "risks": [["Gain of salt", "Hypertonic saline, hypertonic tube feedings without enough water, overuse of salt tablets, sodium bicarbonate, saltwater near-drowning, dialysis errors"], ["Loss of water", "Diabetes insipidus (no ADH), osmotic diuresis (hyperglycemia), prolonged vomiting, watery diarrhea, heavy sweating, hyperventilation, burns, heatstroke"], ["Cannot drink", "No access to water, cannot respond to thirst, difficulty swallowing, unconscious"], ["Age", "Older adults (weak thirst, especially with tube feedings) and infants (formula mixed too strong)"]], "management": [["==Hypotonic IV fluid replacement== (0.45% NaCl) or D5W when water must be replaced without sodium", "free water dilutes the ECF and moves back into cells"], ["Lower sodium gradually: about 0.5 to 1 mEq/L per hour (Brunner)", "too fast makes brain cells swell (cerebral edema); 0.45% NaCl is safer than D5W because it lowers sodium more gradually"], ["Treat the cause: desmopressin (synthetic ADH) for diabetes insipidus; diuretics if sodium excess", "stops the ongoing water loss or removes extra sodium"], ["Free-water flushes with tube feedings", "the higher the feeding's osmolality, the more water the client needs"]], "nursing": {"assess": [["==Neurologic status== and behavior (restlessness, disorientation, lethargy)", "tracks brain cell shrinkage and the safety of correction"], ["Serial serum Na⁺ during treatment", "confirms a slow, steady fall"], ["Thirst, temperature, mucous membranes", "clinical trend"], ["I&O, daily weight, urine specific gravity", "water balance; polyuria with dilute urine suggests diabetes insipidus"], ["Medication history including OTC sodium (Alka-Seltzer)", "hidden sodium sources"]], "act": [["Seizure precautions and safety measures for confusion", "shrunken brain cells can seize", 1], ["Give hypotonic fluids by infusion pump at the ordered rate; ==report a rapid fall in sodium or new headache, confusion, or seizure during correction==", "rapid correction causes cerebral edema", 1], ["Offer oral fluids at regular intervals to clients who cannot perceive or act on thirst", "prevention: replaces free water", 2], ["Give adequate free-water flushes with tube feedings as ordered", "prevents the obligatory water loss of concentrated feedings", 2], ["Mouth care for dry, sticky mucous membranes", "comfort and mucosal integrity", 3]], "order": "brain safety (seizures, too-fast correction) comes first; then water is replaced and future deficits are prevented."}, "education": [["Caregivers", "offer fluids regularly to anyone who cannot ask (older adults, people with dementia, infants)"], ["Tube feeding at home", "give the ordered water flushes between feedings"], ["Infant formula", "mix exactly as directed; never add extra powder"], ["Sodium sources", "avoid high-sodium OTC products; report heavy sweating, vomiting, or diarrhea that you cannot replace"], ["Diabetes insipidus", "take desmopressin as directed and report excessive urination or thirst"]], "complications": ["Seizures, coma, death", "Cerebral edema if corrected too fast", "Pulmonary edema when caused by a sodium load", "Intracranial bleeding from shrunken brain pulling on vessels (severe)"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "Seizure, decreasing level of consciousness, or worsening confusion; during treatment, a ==sodium dropping faster than ordered== or a new headache, vomiting, or confusion (cerebral edema)."}, {"type": "book", "label": "Textbook box: Dysnatremia in athletes (Chart 10-1)", "in": "risk", "text": "Brunner describes exertional dysnatremia: athletes who lose large amounts of water in sweat can become **hypernatremic**, and those who lose sodium and replace with water become **hyponatremic**. Both cause confusion, disorientation, and stupor; ==only blood and urine tests tell them apart==.", "source": "Brunner Ch. 10, Chart 10-1, p. 246"}, {"type": "good", "label": "Older adults (USLO 1)", "text": "Dehydration with hypernatremia is often overlooked as the cause of new confusion in older adults, who also have a weaker thirst response. Tube-fed older adults are at highest risk."}], "figures": [{"title": "Effect of a high sodium on brain cells", "in": "path", "source": "Banasik Fig. 24.7, p. 538; Brunner Fig. 10-7 (redrawn)", "steps": ["ECF sodium and osmolality ↑", "ECF is more concentrated than the cell interior", "Water leaves the cell by osmosis", "Brain cells shrivel → confusion, lethargy, seizures"], "caption": "High sodium = shrunken brain cells. Correct slowly so the cells are not over-swelled on the way back."}], "sbar": {"title": "Applying SBAR: tube-fed resident with hypernatremia", "s": "An 86-year-old nursing home resident on continuous tube feeding is more agitated and now lethargic.", "b": "Stroke with dysphagia; high-calorie feeding at 60 mL/hr; free-water flushes missed for 2 days; febrile yesterday.", "a": "Na⁺ 156; serum osmolality 318; temperature 99.8°F; dry, sticky tongue; urine output 300 mL in 12 hours, dark; BP 104/62, HR 104.", "r": "I believe she has hypernatremia from inadequate free water. Please evaluate and give orders for hypotonic IV fluid, a free-water flush schedule, and sodium checks so we can lower it slowly. I have started seizure and fall precautions."}, "bridge": [["Pathophysiology", "Too little water for the sodium makes the ECF concentrated, so water leaves brain cells and they shrink."], ["Med-Surg", "You watch the brain, replace free water with hypotonic fluid slowly (0.5 to 1 mEq/L per hour), and prevent it by offering fluids and water flushes."]], "drugs": [{"generic": "sodium chloride 0.45% (half-normal saline)", "brands": ["0.45% NaCl", "½ NS"], "cls": "Hypotonic IV solution (77 mEq/L Na⁺, 154 mOsm/L)", "moa": "Has fewer particles than plasma, so it supplies ==free water that moves into dehydrated cells== while giving a little sodium. Lowers serum sodium more gradually than D5W.", "indications": ["==Hypernatremia== and hypertonic dehydration (Med-Surg slides: hypotonic IV replacement)", "Second-phase fluid after isotonic resuscitation in hypovolemia"], "dose": [["IV", "Rate ordered by the provider; Brunner: lower sodium no faster than 0.5 to 1 mEq/L per hour. Use an infusion pump."]], "assess": {"before": [["Serum Na⁺ and osmolality", "sets the correction rate"], ["Neuro status, BP", "baseline"], ["History of head injury or increased intracranial pressure", "hypotonic fluid can worsen brain swelling (contraindicated)"]], "after": [["Serial Na⁺", "confirms a slow, steady fall"], ["Neuro status", "headache, vomiting, or confusion can mean cerebral edema"], ["Lungs and BP", "overload or cardiovascular collapse with too much"]]}, "effects": {"common": ["Mild fluid shift symptoms"], "serious": ["**Cerebral edema / increased intracranial pressure** if given too fast", "Cardiovascular collapse from fluid shifts (Brunner)", "Hyponatremia with excessive volume"]}, "avoid": {"contra": ["Increased intracranial pressure; third-space fluid shifts (Brunner)"], "interactions": ["None with food (IV use)"]}, "teach": ["Explain frequent sodium checks", "Report headache, nausea, or confusion"], "verify": ["dose", "names"]}, {"generic": "dextrose 5% in water", "brands": ["D5W"], "cls": "Isotonic in the bag, physiologically hypotonic (free water)", "moa": "The dextrose is quickly metabolized, leaving pure free water that spreads one third into the ECF and two thirds into cells. Supplies about 170 kcal/L.", "indications": ["Hypernatremia when water must be replaced without sodium (Brunner)"], "dose": [["IV", "Rate ordered by the provider; use an infusion pump. Not in the slides."]], "assess": {"before": [["Serum Na⁺, glucose", "baseline"], ["Head injury or increased intracranial pressure", "contraindicated (cerebral swelling)"]], "after": [["Na⁺ trend", "can drop sodium too fast"], ["Blood glucose", "hyperglycemia"], ["Neuro status", "cerebral edema"]]}, "effects": {"common": ["Hyperglycemia", "Vein irritation"], "serious": ["**Cerebral edema** from rapid sodium fall", "**Water intoxication / hyponatremia** with excess (classic postoperative cause)", "Hypokalemia with prolonged electrolyte-free use"]}, "avoid": {"contra": ["Head injury, increased ICP; not for fluid resuscitation; caution in early postoperative period (high ADH)"], "interactions": ["None with food"]}, "teach": ["Report headache or confusion"], "verify": ["dose", "names"]}], "procedures": [{"name": "Free-water flushes with enteral (tube) feedings", "kind": "therapeutic", "indication": "Concentrated tube feedings cause an obligatory water loss in the urine; scheduled water flushes prevent hypernatremia, especially in older adults.", "steps": [["Verify the ordered flush volume and frequency", "free water needs are individualized"], ["Confirm tube placement per policy before flushing", "prevents aspiration"], ["Flush with water by gravity or gentle push as ordered", "delivers free water and keeps the tube patent"], ["Record flush volumes as intake", "accurate I&O"]], "before": [["Check the last serum Na⁺ and BUN", "the flush plan should keep both normal"], ["Elevate the head of the bed at least 30 degrees", "reduces aspiration risk"]], "after": [["Monitor Na⁺, weight, I&O, and urine color", "shows whether water intake is enough"]], "complications": ["Rising sodium or BUN", "Aspiration (coughing, dyspnea during feeding)"], "teach": ["Caregivers: give every scheduled flush; report reduced urine or new confusion"], "verify": ["steps", "teach"]}]}, {"id": "hypoK", "name": "Hypokalemia (low K⁺)", "short": "Hypokalemia", "group": "Potassium < 3.5 · cells hyperpolarized · \"no action\"", "cat": "Potassium Imbalances", "sub": "Low K⁺: cells hyperpolarized (sluggish)", "catColor": "#b91c1c", "color": "#3f6212", "pair": "hyperK", "sig": ["K⁺ < 3.5", "Flat/inverted T, U wave", "Weakness, ileus", "Digoxin toxicity risk"], "hook": "The thin slice of potassium outside cells falls. Muscle and nerve cells become hyperpolarized, farther from firing, so skeletal muscle weakens, the gut slows, and the heart becomes electrically unstable.", "patho": {"chain": ["↓ intake (NPO, anorexia, IV fluids without K⁺), ↑ renal loss (==loop and thiazide diuretics==, corticosteroids, hyperaldosteronism, Cushing's, black licorice, low magnesium), GI loss (==vomiting, NG suction, diarrhea, laxatives==), or a shift into cells (alkalosis, insulin, beta-adrenergic stimulation)", "Serum K⁺ falls below 3.5 mEq/L (98% of the body's potassium is inside cells, so the ECF slice is small)", "The intracellular to extracellular K⁺ ratio widens, so the resting membrane potential becomes more negative (hyperpolarized)", "Skeletal and smooth muscle respond less to stimuli; cardiac repolarization slows and ectopic beats arise", "Weak muscles, sluggish gut, and dysrhythmias up to ventricular fibrillation or asystole"], "compensation": "The kidneys try to conserve potassium, but they conserve potassium poorly (unlike sodium), so urine K⁺ loss continues even when the body is deficient. K⁺ shifts out of cells to support the serum level, so a mild serum change can hide a large total-body deficit. Low magnesium makes the kidneys keep wasting K⁺, so the K⁺ will not correct until magnesium is replaced.", "tip": "Your Patho slides: low K⁺ = \"no action\" (brownout in the electricity grid). Remember the slide's triad: NG suction → hypokalemia + hypochloremia + metabolic alkalosis."}, "manifestations": [["Fatigue, ==skeletal muscle weakness==, leg cramps; ascending weakness starting in the legs; decreased DTRs", "hyperpolarized muscle cells are harder to excite; weakness can reach the respiratory muscles"], ["==Decreased bowel motility==: abdominal distention, decreased bowel sounds, constipation, paralytic ileus", "smooth muscle of the gut is also hyperpolarized"], ["Anorexia, nausea, vomiting", "slowed gut motility"], ["==Cardiac dysrhythmias==: ectopic beats (PVCs, PACs), weak irregular pulse, ventricular fibrillation up to asystole", "slowed repolarization, faster diastolic depolarization, and altered refractory periods destabilize the heart"], ["Postural hypotension / decreased BP", "weakened vascular smooth muscle tone"], ["Polyuria, nocturia, thirst", "low K⁺ blocks the kidney's response to ADH, so urine cannot be concentrated"], ["Paresthesias", "altered nerve membrane excitability"], ["Glucose intolerance", "potassium depletion suppresses insulin release (Brunner)"]], "labs": [["Serum potassium", "==< 3.5 mEq/L== (Galen 3.5 to 5); clinical signs usually below 3 mEq/L"], ["ECG", "==Flat or inverted T waves, prominent U wave (specific to hypokalemia)==, ST depression, prolonged PR"], ["ABG", "Often ↑ pH and HCO₃⁻ (metabolic alkalosis) with vomiting or NG suction"], ["Magnesium", "Often low too; check it"], ["Digoxin level if prescribed", "hypokalemia increases sensitivity to digoxin"], ["24-hour urine K⁺", "> 20 mEq/day with hypokalemia suggests the kidneys are the source"]], "risks": [["Medications", "Loop and thiazide diuretics (potassium-wasting), corticosteroids, amphotericin B, some penicillins, laxative abuse, insulin"], ["GI losses", "Vomiting, NG suction, diarrhea (up to 30 mEq/L K⁺), ileostomy, fistulas"], ["Hormones and conditions", "Hyperaldosteronism, Cushing's, heart failure and cirrhosis (secondary aldosteronism), hypomagnesemia, alkalosis, DKA treatment with insulin, high-carbohydrate parenteral nutrition"], ["Poor intake", "NPO with K⁺-free IV fluids, eating disorders (also vomiting and laxatives), alcoholism, debilitated older adults"], ["Other", "Excessive black licorice (glycyrrhizin), heavy sweating"]], "management": [["Increase dietary potassium", "foods supply K⁺ for prevention and mild deficits"], ["==Oral potassium chloride== for mild to moderate deficits", "well absorbed; replaces both potassium and chloride lost together"], ["IV potassium (diluted, by pump) when severe or the client cannot take it by mouth", "faster replacement while protecting the heart from a sudden rise"], ["Replace magnesium if low", "low Mg²⁺ keeps the kidneys wasting K⁺"], ["Treat the cause; consider potassium-sparing diuretic", "stops the ongoing loss"]], "nursing": {"assess": [["==Cardiac monitoring (ECG)==: rate, rhythm, T and U waves", "the heart is the life threat"], ["Muscle strength, respiratory effort, DTRs", "weakness can progress to respiratory muscles"], ["Bowel sounds, distention, constipation", "ileus signals significant depletion"], ["Serum K⁺, Mg²⁺, ABG; digoxin level and toxicity signs", "guides replacement; low K⁺ increases digoxin toxicity"], ["==Urine output before and during IV potassium==", "the kidneys are the only safe exit if too much is given"]], "act": [["Place on continuous cardiac monitoring for IV replacement or severe deficit; report new ectopy", "dysrhythmias can be lethal", 1], ["Give IV KCl only diluted, by infusion pump, never IV push or IM; peripheral line max 10 mEq/100 mL at 10 mEq/hr (F&P)", "a bolus of potassium stops the heart", 1], ["Confirm adequate urine output before giving K⁺; stop and notify if output < 20 mL/hr for 2 hours (Brunner)", "without urine output, potassium accumulates to dangerous levels", 1], ["Give oral KCl with food and a full glass of fluid; do not crush extended-release forms", "reduces GI irritation and small bowel injury", 2], ["Check the IV site often", "potassium irritates veins (phlebitis, extravasation)", 2], ["Teach potassium-rich foods and safe medication use", "prevents recurrence, especially on diuretics", 3]], "order": "the heart comes first (monitoring and safe IV technique), then kidney function as the safety valve for replacement; diet and teaching prevent the next episode."}, "education": [["Potassium-rich foods", "bananas, melon, citrus (oranges, orange juice), fresh and frozen vegetables (not canned), lean meats, milk, whole grains, legumes"], ["Diuretics and digoxin", "take as prescribed; do not stop potassium supplements without asking; report palpitations, weakness, or cramps"], ["Oral potassium", "take with or after meals with at least 120 mL of fluid; swallow extended-release tablets whole; report abdominal pain or black stools"], ["Avoid misuse", "laxative and diuretic abuse; large amounts of black licorice"], ["Keep lab appointments", "levels must be checked while on supplements"]], "complications": ["Ventricular dysrhythmias, ventricular fibrillation, cardiac arrest", "Respiratory muscle weakness and respiratory arrest", "Paralytic ileus", "Digoxin toxicity", "Rhabdomyolysis and kidney damage (chronic)", "Hyperkalemia from overcorrection"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "New dysrhythmia or frequent PVCs, K⁺ ≤ 2.5 mEq/L, weakness affecting breathing, or ==urine output below 20 mL/hr for 2 hours during IV potassium== (stop the infusion)."}, {"type": "book", "label": "Textbook box: Quality and Safety Nursing Alerts", "in": "rn", "text": "Brunner: ==Potassium is never given IV push or IM==; it must go on an infusion pump with cardiac monitoring. Hypokalemia increases sensitivity to digitalis. Oral potassium can cause small-bowel lesions, so assess for distention, pain, and GI bleeding.", "source": "Brunner Ch. 10, Quality and Safety Nursing Alerts, pp. 249 to 250"}, {"type": "good", "label": "The NG suction triad (Patho slides)", "text": "Suction removes **H⁺ (acid), Cl⁻, K⁺, Na⁺, and water**: expect hypokalemia + hypochloremia + metabolic alkalosis. Alkalosis then shifts more K⁺ into cells, making it worse."}, {"type": "info", "label": "SOAPIE (chronic: diuretic-induced hypokalemia)", "text": "**S**: \"My legs feel heavy and I'm constipated.\" **O**: on furosemide 40 mg daily, K⁺ 3.1, flat T waves, hypoactive bowel sounds. **A**: hypokalemia from potassium-wasting diuretic. **P**: oral KCl as ordered, diet teaching. **I**: KCl given with breakfast; client chose three high-K⁺ foods. **E**: K⁺ 3.8 in 3 days; bowel movement; states to report weakness."}], "figures": [{"title": "Effect of potassium on the ECG", "in": "lab", "source": "Brunner Ch. 10, Fig. 10-8, p. 251 (redrawn)", "steps": ["Normal: upright T wave, no U wave", "Hypokalemia: T wave flattens and a U wave appears", "Worse hypokalemia: further flattening, prominent U wave, ST depression", "Hyperkalemia (compare): tall peaked T, then wide QRS and lost P waves"], "caption": "Your Patho slide rule: low K⁺ → flat/inverted T; high K⁺ → peaked T. A U wave is specific to low K⁺."}], "sbar": {"title": "Applying SBAR: hypokalemia with ectopy", "s": "A 66-year-old on telemetry has frequent new PVCs and says his legs feel weak.", "b": "Heart failure; furosemide 80 mg IV twice daily for 2 days; on digoxin; vomited twice today.", "a": "K⁺ 2.8, Mg²⁺ 1.3; ECG shows flat T waves with U waves; BP 100/60 with orthostatic drop; bowel sounds hypoactive; urine output 60 mL/hr.", "r": "I'm concerned about hypokalemia with digoxin toxicity risk. Please evaluate. I anticipate orders for IV KCl by pump, magnesium replacement, a digoxin level, repeat K⁺ after the infusion, and review of the diuretic dose. I'll keep him on continuous monitoring."}, "bridge": [["Pathophysiology", "Low ECF potassium hyperpolarizes muscle cells, so skeletal muscle, gut, and heart are less excitable and the heart becomes electrically unstable."], ["Med-Surg", "You monitor the ECG for flat T and U waves, confirm urine output, and replace KCl safely (diluted, pumped, never pushed), especially in clients on diuretics or digoxin."]], "drugs": [{"generic": "potassium chloride", "brands": ["K-Dur", "Klor-Con"], "cls": "Electrolyte replacement (potassium supplement)", "moa": "Replaces potassium, restoring the normal resting membrane potential in nerve, skeletal muscle, smooth muscle, and heart cells; the chloride replaces chloride lost with it.", "indications": ["==Hypokalemia== (Med-Surg slides: potassium supplementation)", "Prevention of hypokalemia during potassium-wasting diuretic or digoxin therapy"], "dose": [["PO (adults), prevention during diuretics", "20 to 40 mEq/day in 1 to 2 divided doses; single dose should not exceed 20 mEq (Davis)"], ["PO (adults), treatment", "40 to 100 mEq/day in divided doses (Davis)"], ["IV (adults)", "Peripheral line: ==maximum 10 mEq/100 mL at 10 mEq/hr== (F&P); central line: higher concentrations and up to 40 mEq/hr per protocol (F&P). Davis also states not to exceed 10 mEq/hr when K⁺ > 2.5 mEq/L. Follow the order and facility protocol. Never IV push, never IM."]], "assess": {"before": [["Serum K⁺ (Galen 3.5 to 5 mEq/L) and Mg²⁺", "confirms the deficit; low Mg must be corrected too"], ["Urine output and BUN/creatinine", "the kidneys must be able to excrete excess potassium"], ["ECG rhythm", "baseline for changes during replacement"], ["IV site and dilution of the bag", "concentrated potassium burns veins"]], "after": [["Repeat serum K⁺ as ordered", "prevents overcorrection"], ["ECG: peaked T waves mean too much", "early sign of hyperkalemia"], ["IV site for pain, burning, phlebitis", "potassium is a vesicant-like irritant"], ["Abdominal pain, distention, GI bleeding (oral)", "small-bowel lesions"]]}, "effects": {"common": ["Nausea, vomiting, abdominal discomfort, diarrhea (oral)", "Burning or pain at the IV site"], "serious": ["**Hyperkalemia**: peaked T waves, dysrhythmias, **cardiac arrest** (rapid IV or kidney failure)", "GI ulceration or bleeding with oral tablets", "Phlebitis and extravasation"]}, "avoid": {"contra": ["Hyperkalemia", "Severe kidney impairment, oliguria", "Untreated Addison disease, acute dehydration (F&P)"], "interactions": ["Potassium-sparing diuretics (spironolactone), ACE inhibitors, ARBs raise K⁺", "Salt substitutes contain KCl", "Potassium penicillin adds K⁺"]}, "teach": ["Take with or after meals with at least 120 mL of water or juice", "Swallow extended-release tablets whole", "Do not use salt substitutes unless approved", "Report palpitations, weakness, slow pulse, or black stools", "Keep lab appointments"], "verify": ["names"]}], "procedures": [{"name": "IV potassium chloride administration", "kind": "therapeutic", "indication": "Replaces potassium when the deficit is severe or the client cannot take it by mouth, while preventing a sudden dangerous rise.", "steps": [["Verify the order, concentration, and rate; use a ==premixed, diluted bag==", "concentrations range from 10 to 40 mEq/100 mL; the wrong bag can be fatal"], ["Confirm serum K⁺ and adequate urine output", "the kidneys must be able to clear K⁺"], ["Program an infusion pump (never gravity, never push)", "controls the rate"], ["Use continuous cardiac monitoring per policy", "detects peaked T waves or dysrhythmias early"], ["Monitor the site frequently; slow or stop for burning and notify", "potassium irritates veins"]], "before": [["Check facility policy on maximum concentration and rate", "policies vary by peripheral vs central line"], ["Assess IV patency", "infiltration of potassium injures tissue"]], "after": [["Recheck K⁺ as ordered", "confirms correction, prevents overshoot"], ["Monitor urine output hourly", "stop if < 20 mL/hr for 2 hours (Brunner)"]], "complications": ["Hyperkalemia: peaked T waves, bradycardia, dysrhythmias", "Phlebitis, infiltration, extravasation", "Cardiac arrest from rapid infusion"], "teach": ["Report burning at the site", "Report palpitations or weakness"], "during": [["Watch rhythm and site; ask about burning", "early warning of overcorrection or vein injury"]], "verify": ["steps"]}, {"name": "Continuous cardiac (ECG) monitoring", "kind": "monitoring", "indication": "Potassium imbalances show on the ECG before they kill. Monitoring guides how fast replacement can go.", "steps": [["Place electrodes per lead placement and confirm a clear tracing", "accurate rhythm interpretation"], ["Set alarms on", "rapid detection"], ["Review strips per policy: T wave shape, U waves, ST segment, ectopy", "tracks the potassium effect"]], "before": [["Explain monitoring and skin prep", "cooperation and good contact"]], "after": [["Report new dysrhythmias, peaked T, or wide QRS", "signals dangerous K⁺ change"]], "complications": ["Ventricular dysrhythmias", "Skin irritation from electrodes"], "teach": ["Report palpitations, dizziness, or chest discomfort"], "verify": ["steps"]}]}, {"id": "hyperK", "name": "Hyperkalemia (high K⁺)", "short": "Hyperkalemia", "group": "Potassium > 5 · cells hypopolarized · \"too much action\"", "cat": "Potassium Imbalances", "sub": "High K⁺: cells hypopolarized (fire, then stall)", "catColor": "#b91c1c", "color": "#b91c1c", "pair": "hypoK", "sig": ["K⁺ > 5", "Tall peaked T", "Flaccid paralysis", "Cardiac arrest risk"], "hook": "Potassium accumulates outside cells. Muscle and heart cells sit closer to their firing point, discharge, and then cannot repolarize to fire again, so muscles go flaccid and the heart slows, widens, and can stop. It is less common than hypokalemia but more dangerous.", "patho": {"chain": ["↑ intake (rapid or concentrated IV K⁺, massive transfusion of stored blood, salt substitutes, potassium penicillin), ==↓ excretion== (oliguric kidney injury or CKD, potassium-sparing diuretics, ACE inhibitors/ARBs, adrenal insufficiency), or a ==shift out of cells== (acidosis, insulin deficiency, crush injury, burns, tumor lysis)", "Serum K⁺ rises above 5 mEq/L", "The K⁺ gradient narrows, so the resting membrane potential becomes less negative (hypopolarized)", "Mild: smooth muscle is overexcitable (cramping, diarrhea); severe: cells sit above threshold, fire once, and cannot repolarize (flaccid paralysis)", "Cardiac action potentials shorten and conduction slows: peaked T, prolonged PR, lost P, wide QRS, ventricular fibrillation, asystole"], "compensation": "Healthy kidneys excrete the excess (aldosterone rises with high K⁺ and increases urinary and colonic K⁺ excretion). This fails in kidney injury, which is why most hyperkalemia occurs with kidney dysfunction or drugs that block aldosterone. Clients with chronic end-stage kidney disease may adapt and tolerate levels that would disable others.", "tip": "Your Patho slides: high K⁺ = \"too much action\" (power surge). Treatment order memory aid: **C BIG K D**: Calcium gluconate (protect the heart), Bicarbonate, Insulin + Glucose (shift in), Kayexalate (remove), Diuretics/Dialysis."}, "manifestations": [["==Cardiac dysrhythmias==: tachycardia → bradycardia, heart block, ventricular fibrillation, ==cardiac arrest==", "shortened action potentials and slowed conduction (the most important consequence)"], ["Skeletal muscle weakness, ascending ==flaccid paralysis==, decreased reflexes", "cells hypopolarized above threshold cannot fire again"], ["Paresthesias (tingling), muscle twitching early", "altered nerve membrane excitability"], ["Intestinal colic, abdominal cramping and distention, diarrhea", "early smooth-muscle overexcitability"], ["Irritability, anxiety", "neuromuscular excitability"], ["Often few symptoms until the ECG changes", "why a high K⁺ is always checked on the monitor first"]], "labs": [["Serum potassium", "==> 5 mEq/L== (Galen 3.5 to 5); ECG changes usually start above 6, almost always present at 8 or more (Brunner)"], ["==ECG==", "Earliest: tall, narrow, peaked T waves, ST depression, short QT; then prolonged PR, absent P waves, widened QRS, sine-wave pattern, ventricular fibrillation"], ["Repeat K⁺ to rule out pseudohyperkalemia", "hemolyzed sample, tight tourniquet with fist clenching, drawing above a K⁺ infusion; a very high K⁺ with a normal ECG should be redrawn"], ["ABG", "Metabolic or respiratory acidosis (correcting acidosis helps correct K⁺)"], ["BUN, creatinine, glucose", "kidney function and insulin need"]], "risks": [["Decreased excretion", "Acute kidney injury or chronic kidney disease (oliguria), adrenal insufficiency / Addison disease, hypoaldosteronism"], ["Medications (> 60% of episodes, Brunner)", "Potassium-sparing diuretics (spironolactone), ACE inhibitors, ARBs, NSAIDs, beta-blockers, heparin, cyclosporine, tacrolimus, KCl"], ["Increased intake", "Rapid or poorly mixed IV potassium, large transfusion of stored blood, salt substitutes"], ["Shift out of cells", "Acidosis, insulin deficiency (DKA), crush injury, burns, rhabdomyolysis, tumor lysis after chemotherapy"], ["Older adults", "Lower renin and aldosterone, more cardiac comorbidities"]], "management": [["Obtain an ==ECG immediately==; continuous monitoring", "the heart decides how urgent this is"], ["IV calcium gluconate (protects the heart)", "calcium antagonizes K⁺'s effect on the myocardium within minutes but does not lower the K⁺; effect lasts about 30 minutes"], ["IV regular insulin with dextrose", "insulin drives K⁺ into cells within about 30 minutes; dextrose prevents hypoglycemia"], ["Sodium bicarbonate (if acidotic)", "raises pH so H⁺ leaves cells and K⁺ moves back in; temporary"], ["Beta-2 agonist (albuterol) per Brunner", "also shifts K⁺ into cells; stopgap"], ["Loop diuretics (furosemide); sodium polystyrene sulfonate (Kayexalate); dialysis", "these actually remove K⁺ from the body (urine, stool, dialysate)"], ["Restrict dietary K⁺; stop K⁺ supplements, salt substitutes, and K⁺-raising drugs", "removes the source"]], "nursing": {"assess": [["==Continuous ECG==; apical pulse", "peaked T and wide QRS signal imminent arrest"], ["Muscle strength, paresthesias, respiratory effort", "ascending weakness can reach breathing muscles"], ["Serum K⁺ (repeat), BUN, creatinine, glucose, ABG", "confirms true hyperkalemia, guides shift vs. removal"], ["I&O", "oliguria is the most common cause; output is the main exit"], ["Bowel sounds before Kayexalate", "resins are contraindicated with ileus (perforation, necrosis)"]], "act": [["==Place on continuous cardiac monitoring and have emergency equipment ready==", "the life threat is the heart", 1], ["Give IV calcium gluconate as ordered with monitoring; stop for bradycardia", "stabilizes the myocardium first", 1], ["Give insulin + dextrose as ordered; check glucose hourly for 5 to 6 hours (F&P)", "shifts K⁺ in; prevents hypoglycemia", 2], ["Give Kayexalate, diuretics, or prepare for dialysis as ordered", "removes K⁺ from the body", 2], ["Hold K⁺ supplements, salt substitutes, and K⁺-sparing drugs; clarify orders", "stops the source", 2], ["Draw repeat K⁺ from a vein without a K⁺ infusion, with minimal tourniquet time", "avoids pseudohyperkalemia", 3], ["Teach a low-potassium diet", "prevents recurrence in kidney disease", 3]], "order": "protect the heart first (monitor, calcium), then move potassium into cells, then remove it from the body; preventing recurrence and false lab results follows."}, "education": [["Low-potassium diet (if ordered)", "limit many fruits and vegetables, legumes, whole grains, lean meat, milk, eggs, coffee, tea, cocoa; low-K⁺ choices include cranberry juice, ginger ale, hard candy, butter, honey (Brunner)"], ["Salt substitutes contain potassium", "do not use them with K⁺ supplements, potassium-sparing diuretics, or kidney disease"], ["Medications", "know which drugs raise K⁺ (spironolactone, ACE inhibitors, ARBs, NSAIDs); keep lab appointments"], ["When to seek help", "muscle weakness, tingling, palpitations, slow or irregular pulse"]], "complications": ["Ventricular fibrillation, asystole, cardiac arrest", "Flaccid paralysis including respiratory muscles", "Hypoglycemia from insulin treatment", "Intestinal necrosis from Kayexalate", "Hypokalemia from overtreatment"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately (rapid response)", "text": "K⁺ above 6 mEq/L or any ==peaked T waves, widened QRS, lost P waves, bradycardia, or new dysrhythmia==; ascending weakness or paresthesias; any hyperkalemia in a client who is oliguric."}, {"type": "book", "label": "Textbook box: Quality and Safety Nursing Alert", "in": "risk", "text": "Potassium supplements are ==extremely dangerous with impaired kidney function==, and IV potassium even more so, because serum levels rise very quickly. Any client's renal tolerance can be exceeded by rapid IV potassium or large oral doses.", "source": "Brunner Ch. 10, Quality and Safety Nursing Alert, p. 251"}, {"type": "watch", "label": "Dangerous mistake", "text": "Thinking **calcium gluconate lowers potassium**. It does not; it only protects the heart for about 30 minutes. Shift (insulin + glucose, bicarbonate) and remove (Kayexalate, diuretics, dialysis) must follow. Also: never treat a single high K⁺ with a normal ECG without redrawing (pseudohyperkalemia)."}, {"type": "good", "label": "Both low and high K⁺ cause weakness: how to tell them apart", "text": "Low K⁺: **hyperpolarized**, sluggish gut (ileus, constipation), **flat T, U wave**. High K⁺: **hypopolarized**, cramping and diarrhea, **peaked T, wide QRS**. The ECG and the bowel decide."}], "figures": [{"title": "Progressive ECG changes as potassium rises", "in": "lab", "source": "Brunner Ch. 10, Fig. 10-8 and text, pp. 251 to 252 (redrawn)", "steps": ["K⁺ > 6: tall, narrow, peaked T waves; ST depression; short QT", "PR interval lengthens", "P waves disappear", "QRS widens and decomposes", "Ventricular fibrillation or asystole"], "caption": "The first ECG sign of hyperkalemia is the peaked T wave."}], "sbar": {"title": "Applying SBAR: hyperkalemia in acute kidney injury", "s": "A 70-year-old with acute kidney injury has new tall peaked T waves and says her legs feel heavy.", "b": "Admitted for sepsis; on lisinopril and spironolactone at home (still ordered); urine output 80 mL in 8 hours.", "a": "K⁺ 6.8 (repeat from a clean draw confirms); BUN 64, creatinine 3.9; HR 52; ECG: peaked T, widening QRS; lower-extremity weakness; bowel sounds present.", "r": "This is life-threatening hyperkalemia. Please come now. I anticipate IV calcium gluconate, regular insulin with D50 and hourly glucose, possibly sodium bicarbonate, holding lisinopril and spironolactone, and a nephrology consult for dialysis. She is on continuous monitoring with the crash cart at the bedside."}, "bridge": [["Pathophysiology", "High ECF potassium hypopolarizes cells; they fire and cannot repolarize, causing flaccid weakness and slowed, widened cardiac conduction."], ["Med-Surg", "You get an ECG first, protect the heart with calcium, shift K⁺ in with insulin and glucose, remove it with Kayexalate, diuretics, or dialysis, and stop every potassium source."]], "drugs": [{"generic": "calcium gluconate", "brands": ["No common brand (generic)"], "cls": "Electrolyte replacement (calcium salt); cardiac membrane stabilizer in hyperkalemia", "moa": "Raises extracellular calcium, which ==restores the normal threshold of cardiac cells and antagonizes potassium's effect on the myocardium== within minutes. Does not lower serum K⁺.", "indications": ["==Hyperkalemia with ECG changes== (Med-Surg slides: IV calcium gluconate)"], "dose": [["IV (adults), F&P", "1,000 mg (10 mL of 10% solution) over 2 to 3 minutes with constant cardiac monitoring; may repeat after 5 minutes if ECG changes persist"], ["IV (adults), Davis", "Hyperkalemia with cardiac toxicity: 2.25 to 14 mEq; may repeat in 1 to 2 min"]], "assess": {"before": [["ECG and heart rate", "confirms cardiac toxicity; baseline"], ["Digoxin use", "calcium sensitizes the heart to digoxin (toxicity)"], ["IV patency", "calcium is irritating; infiltration causes tissue injury"]], "after": [["Continuous ECG: stop for bradycardia", "too-rapid calcium can cause bradycardia and arrest"], ["Blood pressure", "rapid IV calcium can cause hypotension"], ["IV site", "extravasation"], ["Repeat K⁺; plan for shift/removal therapy", "the protective effect lasts only about 30 minutes"]]}, "effects": {"common": ["Tingling, warmth, chalky taste", "Local burning"], "serious": ["**Bradycardia, dysrhythmias, cardiac arrest** if given too fast", "**Hypotension**", "Tissue necrosis if it infiltrates", "Hypercalcemia"]}, "avoid": {"contra": ["Hypercalcemia", "Ventricular fibrillation", "Digoxin toxicity (use with extreme caution)"], "interactions": ["Digoxin: ↑ toxicity", "Do not mix with sodium bicarbonate or phosphate (precipitate)", "Not interchangeable with calcium chloride (more calcium per mL)"]}, "teach": ["Explain the monitor and expected warmth", "Report chest pain, palpitations, or burning at the IV site"], "verify": ["names"]}, {"generic": "insulin regular (IV) with dextrose 50%", "brands": ["Humulin R", "Novolin R", "D50"], "cls": "Hormone (short-acting insulin) given with hypertonic glucose", "moa": "Insulin activates the Na⁺/K⁺ pump and drives potassium into cells within about 30 minutes, lasting several hours; dextrose prevents the hypoglycemia insulin would cause.", "indications": ["Moderate to severe hyperkalemia (Med-Surg slides: IV insulin)"], "dose": [["IV (adults), F&P", "Regular insulin 10 units IV bolus followed immediately by 50 mL of 50% dextrose (25 g); experts may follow with 10% dextrose at 50 to 75 mL/hr to prevent hypoglycemia"]], "assess": {"before": [["Blood glucose", "baseline; diabetic clients may need less dextrose"], ["K⁺ and ECG", "baseline"], ["IV patency (D50 is hypertonic)", "extravasation injures tissue"], ["Independent double check (insulin is high alert)", "dose errors are dangerous"]], "after": [["Blood glucose every hour for 5 to 6 hours (F&P)", "hypoglycemia is the main danger"], ["Repeat K⁺", "effect is temporary; K⁺ can rebound"], ["Signs of hypoglycemia: sweating, shakiness, confusion", "early treatment"]]}, "effects": {"common": ["Temporary drop in glucose", "Vein irritation from D50"], "serious": ["**Hypoglycemia**", "Hypokalemia from overshoot", "Hyperglycemia if dextrose given without enough insulin"]}, "avoid": {"contra": ["Hypoglycemia (adjust dextrose)"], "interactions": ["Beta-blockers may mask hypoglycemia signs", "Corticosteroids raise glucose"]}, "teach": ["Report sweating, shakiness, hunger, or confusion"], "verify": ["names"]}, {"generic": "sodium bicarbonate", "brands": ["No common brand (generic)"], "cls": "Alkalinizing agent", "moa": "Raises blood pH; H⁺ moves out of cells and K⁺ moves back in to keep charge balanced. Also supplies sodium that antagonizes K⁺'s cardiac effects. Temporary (onset 30 to 60 minutes).", "indications": ["Hyperkalemia with metabolic acidosis (Med-Surg slides); not recommended as the only therapy (F&P)"], "dose": [["IV (adults), F&P", "150 mEq in 1 L of D5W over 2 to 4 hours; guided by the ABG and bicarbonate level"]], "assess": {"before": [["ABG and serum HCO₃⁻", "confirms acidosis (Galen HCO₃⁻ 22 to 28 mEq/L)"], ["Na⁺, fluid status, lung sounds", "sodium load can overload"], ["Ionized calcium", "alkalinizing lowers ionized calcium"]], "after": [["Repeat ABG and K⁺", "response and overshoot"], ["Lungs and edema", "circulatory overload"], ["Tetany or tingling", "low ionized calcium"]]}, "effects": {"common": ["Fluid retention"], "serious": ["**Metabolic alkalosis**", "**Hypernatremia and circulatory overload** with large amounts", "Hypokalemia from overshoot"]}, "avoid": {"contra": ["Alkalosis; caution in heart failure and kidney failure"], "interactions": ["Do not mix with calcium in the same line (precipitate)"]}, "teach": ["Report swelling, shortness of breath, or tingling"], "verify": ["names"]}, {"generic": "sodium polystyrene sulfonate", "brands": ["Kayexalate", "SPS"], "cls": "Cation-exchange resin", "moa": "In the colon it exchanges sodium for potassium; the potassium-loaded resin leaves in the stool, removing K⁺ from the body (slow: hours).", "indications": ["Hyperkalemia that is not immediately life-threatening (Med-Surg slides: Kayexalate)"], "dose": [["PO (adults)", "15 g 1 to 4 times daily in water (up to 40 g 4 times daily) (Davis)"], ["Rectal (adults)", "30 to 50 g as a retention enema; repeat as needed every 6 hr (Davis)"]], "assess": {"before": [["Bowel sounds and bowel function", "contraindicated in ileus or no recent BM (intestinal necrosis, perforation)"], ["K⁺, Na⁺, Ca²⁺, Mg²⁺, renal function", "it removes other cations too"], ["Heart failure, edema, hypertension", "sodium load"]], "after": [["Serum K⁺ daily", "notify when K⁺ falls to 4 to 5 mEq/L (Davis)"], ["Stools: 1 to 2 watery stools/day expected; stop if constipated", "impaction blocks the effect"], ["Fluid overload signs", "sodium retention"]]}, "effects": {"common": ["Constipation, nausea, vomiting, anorexia"], "serious": ["**Intestinal necrosis** (higher with sorbitol)", "Hypokalemia, hypocalcemia, hypomagnesemia", "Sodium retention and fluid overload"]}, "avoid": {"contra": ["Life-threatening hyperkalemia (use faster measures)", "Ileus, bowel obstruction, abnormal bowel function, postoperative with no BM"], "interactions": ["Give at least 3 hours apart from other oral drugs (binds them)", "Sorbitol co-administration not recommended (necrosis)", "Calcium or magnesium antacids reduce effect"]}, "teach": ["Expect loose stools; report constipation or abdominal pain", "Retain the enema as directed"]}], "procedures": [{"name": "Repeat potassium draw to rule out pseudohyperkalemia", "kind": "diagnostic", "indication": "A falsely high K⁺ from a hemolyzed or poorly drawn sample can lead to dangerous overtreatment. A very high K⁺ with a normal ECG and no symptoms should be verified.", "steps": [["Draw from a vein ==not infusing potassium== (opposite arm if possible)", "infusion contaminates the sample"], ["Minimize tourniquet time; no fist clenching", "muscle contraction and stasis release K⁺"], ["Use proper needle size and gentle technique; send promptly", "prevents red cell hemolysis"]], "before": [["Check the ECG and symptoms", "if the ECG shows changes, treat; do not wait for the redraw"]], "after": [["Report the confirmed value and ECG together", "drives treatment urgency"]], "complications": ["True hyperkalemia missed by assuming a false result"], "teach": ["Explain why the test is repeated"], "verify": ["steps"]}, {"name": "Hemodialysis (overview for hyperkalemia)", "kind": "therapeutic", "indication": "Removes potassium (and fluid, waste, acid) when the kidneys cannot, or when hyperkalemia is not transient.", "steps": [["Confirm vascular access (fistula, graft, or dialysis catheter) is functional", "dialysis needs high blood flow"], ["Dialysis nurse connects and runs the treatment with a low-K⁺ dialysate", "K⁺ diffuses from blood to dialysate"]], "before": [["Weigh; take vital signs; check K⁺ and other labs", "baseline"], ["Hold medications that will be dialyzed or that lower BP, per order", "prevents loss of drug and hypotension"]], "after": [["Weigh, take vital signs, check K⁺", "response; hypotension and dysequilibrium are common"], ["Assess access: no BP or blood draws in the fistula arm; feel thrill, hear bruit", "protects the access"]], "complications": ["Hypotension, cramps", "Dysequilibrium (headache, confusion)", "Bleeding or infection at the access"], "teach": ["Protect the access arm", "Follow fluid and potassium restrictions between treatments"], "verify": ["steps", "after", "complications", "teach"], "aka": "Dialysis"}]}, {"id": "hypoCa", "name": "Hypocalcemia (low Ca²⁺)", "short": "Hypocalcemia", "group": "Ca²⁺ < 9 · threshold ↓ · nerves overexcitable", "cat": "Calcium Imbalances", "sub": "Low Ca²⁺: threshold lowered (overexcitable)", "catColor": "#6d28d9", "color": "#6d28d9", "pair": "hypoMg", "sig": ["Ca²⁺ < 9 mg/dL", "Chvostek / Trousseau +", "Tetany, ↑ DTRs", "Prolonged QT"], "hook": "Too little ionized calcium lowers the threshold that nerve and muscle cells must reach to fire. They fire too easily, producing tingling, spasm, tetany, seizures, and a dangerous spasm of the larynx.", "patho": {"chain": ["↓ intake or absorption (vitamin D deficiency, CKD with no activated vitamin D, malabsorption, chronic diarrhea, pancreatitis), ↓ physiologic availability (==hypoparathyroidism, often after thyroid or neck surgery==, massive transfusion of ==citrated blood==, high phosphate, low magnesium, alkalosis), or ↑ loss (steatorrhea, pancreatitis)", "Ionized (active) serum calcium falls; total Ca²⁺ below 9 mg/dL (Galen)", "Low calcium lowers the threshold potential of nerve and muscle membranes", "Sensory and motor nerves discharge spontaneously; the cardiac plateau phase lengthens", "Neuromuscular hyperexcitability (tetany, seizures, laryngospasm) and a prolonged QT interval"], "compensation": "The parathyroid glands sense low ionized calcium and release PTH, which pulls calcium from bone, increases intestinal absorption (with vitamin D), and increases renal reabsorption, while making the kidneys excrete phosphate. Compensation fails when the parathyroids are injured or removed, when vitamin D is lacking, or when magnesium is low (low Mg²⁺ blocks PTH secretion).", "tip": "Your Patho slides: calcium is the \"construction company\"; too little = crumbling foundations (tetany, fractures). Memory aid **CATS**: Convulsions, Arrhythmias (prolonged QT), Tetany, Spasms and Stridor (laryngospasm)."}, "manifestations": [["==Numbness and tingling (paresthesias) of fingers, toes, and around the mouth (circumoral)==", "sensory nerves fire spontaneously at a lowered threshold"], ["==Positive Trousseau sign== (carpal spasm with BP cuff inflated above systolic for about 3 minutes) and ==positive Chvostek sign== (facial twitch when the facial nerve is tapped)", "latent tetany: motor nerves discharge with minimal stimulus"], ["Muscle cramps, twitching, carpopedal spasm, tetany, hyperactive deep tendon reflexes", "increased neuromuscular excitability"], ["Laryngospasm, bronchospasm, stridor, dyspnea", "the laryngeal muscles spasm: an airway emergency"], ["Seizures, irritability, anxiety, confusion, depression", "central nervous system hyperexcitability"], ["Prolonged QT interval, dysrhythmias (torsades de pointes), decreased BP, heart failure", "the cardiac action potential plateau lengthens and contractility falls"], ["Diarrhea, hyperactive bowel sounds", "smooth muscle hyperexcitability"], ["Impaired clotting, bone pain, fractures (chronic), dry brittle hair and nails", "calcium is a clotting factor and the main bone mineral"]], "labs": [["Serum calcium (total)", "==< 9 mg/dL== (Galen 9 to 10.5). Brunner uses < 8.8."], ["Serum albumin and corrected calcium", "Low albumin lowers total calcium without changing ionized Ca²⁺; ==add about 0.8 mg/dL for each 1 g/dL albumin below 4== (Brunner Chart 10-2). Ionized calcium is the best measure."], ["Magnesium and phosphate", "Check both: low Mg²⁺ and high phosphate cause hypocalcemia"], ["ECG", "Prolonged QT (prolonged ST segment)"], ["PT / clotting times", "May be impaired (Med-Surg slides)"], ["Arterial pH", "Alkalosis increases protein binding and lowers ionized calcium"]], "risks": [["Parathyroid", "Hypoparathyroidism, especially after thyroidectomy, parathyroidectomy, or radical neck dissection (first 24 to 48 hours)"], ["Absorption and intake", "Vitamin D deficiency, chronic kidney disease, malabsorption, chronic diarrhea, laxative overuse, alcoholism"], ["Binding and shifts", "Massive transfusion of citrated blood, high phosphate (kidney injury), low magnesium, alkalosis, low albumin"], ["Pancreatitis", "Calcium binds undigested fats (soaps) and necrotic tissue and is lost in stool"], ["Medications", "Loop diuretics, aminoglycosides, corticosteroids, proton pump inhibitors, phosphates, aluminum antacids"], ["Older adults and immobility", "Increased bone resorption, low intake"]], "management": [["==IV calcium gluconate== for acute symptomatic hypocalcemia (a medical emergency)", "rapidly restores ionized calcium and raises the firing threshold back to normal"], ["Oral calcium (carbonate or citrate) and vitamin D", "chronic replacement; vitamin D is needed to absorb calcium from the gut"], ["Increase dietary calcium and vitamin D", "milk products, leafy greens, canned salmon and sardines, fortified foods"], ["Correct magnesium first if low; lower phosphate (binders) in CKD", "calcium will not stay up while Mg²⁺ is low or phosphate is high"], ["Note: Med-Surg slides list \"PO calcium chloride\"", "Brunner and F&P describe calcium chloride as an IV salt; clarify this with your instructor"]], "nursing": {"assess": [["==Airway: stridor, laryngospasm, dyspnea==", "laryngospasm can obstruct the airway"], ["Chvostek and Trousseau signs, paresthesias, DTRs", "bedside trend of neuromuscular excitability"], ["Cardiac rhythm and QT interval", "prolonged QT predisposes to torsades"], ["Serum Ca²⁺ with albumin, Mg²⁺, phosphate", "true severity and the cause"], ["After neck surgery: tingling around the mouth and fingers in the first 24 to 48 hours", "parathyroid injury"]], "act": [["Keep ==emergency airway equipment (tracheostomy tray, suction)== available when at risk; report stridor immediately", "laryngospasm is the fastest killer", 1], ["Initiate seizure precautions if severe (Med-Surg slides)", "hyperexcitable brain can seize", 1], ["Give IV calcium slowly, diluted, by pump, with cardiac monitoring; check the site often", "too-rapid calcium causes bradycardia and arrest; infiltration causes necrosis", 1], ["Confusion and fall precautions", "mental changes and tetany raise injury risk", 2], ["Give oral calcium with vitamin D as ordered; separate from interacting drugs", "chronic correction", 2], ["Teach diet, avoiding laxative and phosphate antacid overuse, and limiting alcohol and caffeine", "prevents recurrence (Med-Surg slides)", 3]], "order": "airway first (laryngospasm), then seizure safety and cardiac safety during IV replacement; long-term replacement and teaching follow."}, "education": [["Calcium-rich foods", "milk, yogurt, cheese, leafy greens, canned salmon and sardines, fortified juice and cereals; vitamin D sources"], ["Supplements", "take in divided doses (no more than 500 mg at a time) with meals; separate from iron, tetracycline, fluoroquinolones, and phenytoin by about 2 hours"], ["Avoid", "overuse of laxatives and phosphate-containing antacids; high alcohol and caffeine intake; smoking (increases urinary calcium loss)"], ["When to seek help", "tingling around the mouth or fingers, muscle spasms, noisy breathing, or seizures"]], "complications": ["Laryngospasm and airway obstruction", "Seizures", "Torsades de pointes and cardiac arrest (prolonged QT)", "Heart failure (reduced contractility)", "Osteoporosis and fractures (chronic total-body deficit)", "Tissue necrosis from IV calcium extravasation"], "callouts": [{"type": "emergency", "label": "Notify the provider immediately", "text": "==Stridor, noisy breathing, or laryngospasm==, seizure, carpopedal spasm or tetany, or a new prolonged QT or dysrhythmia. After thyroid or parathyroid surgery, report any tingling around the mouth or in the fingers."}, {"type": "book", "label": "Textbook box: Quality and Safety Nursing Alert", "in": "meds", "text": "==Too-rapid IV calcium can cause cardiac arrest, preceded by bradycardia.== Dilute calcium in D5W and give it as a slow bolus or slow infusion by pump. Do not use 0.9% NaCl (increases renal calcium loss), and do not mix with phosphate or bicarbonate (precipitate).", "source": "Brunner Ch. 10, Quality and Safety Nursing Alert, p. 254"}, {"type": "book", "label": "Textbook box: Calculating corrected serum calcium (Chart 10-2)", "in": "lab", "text": "When albumin is low, total calcium underestimates the active calcium. Quick method: for every 1 g/dL that albumin is below 4, add about 0.8 mg/dL to the reported calcium. Brunner's example: albumin 2.5, calcium 10.5 → corrected about 11.7 mg/dL.", "source": "Brunner Ch. 10, Chart 10-2, p. 253"}, {"type": "good", "label": "The question your instructor always asks", "text": "Tetany that does not respond to IV calcium → check magnesium. Low Mg²⁺ causes the same signs and blocks PTH, so calcium will not correct until magnesium is replaced."}], "figures": [{"title": "Chvostek and Trousseau signs", "in": "man", "source": "Brunner Ch. 10, Fig. 10-9, p. 253; Banasik p. 543 (described)", "steps": ["Chvostek: tap the facial nerve just in front of the ear (below the zygomatic arch)", "Positive: twitching of the facial muscles at the mouth and cheek", "Trousseau: inflate a BP cuff about 20 mmHg above systolic for 2 to 5 minutes", "Positive: carpal spasm (wrist and thumb flex, fingers extend)"], "caption": "Both show latent tetany from increased neuromuscular excitability (low Ca²⁺ or low Mg²⁺). Chvostek can be positive in normal newborns."}], "sbar": {"title": "Applying SBAR: hypocalcemia after thyroidectomy", "s": "A 45-year-old 18 hours after total thyroidectomy reports tingling around her mouth and fingertips; I see facial twitching.", "b": "Total thyroidectomy yesterday for multinodular goiter; no calcium ordered yet.", "a": "Positive Chvostek and Trousseau signs; mild hand cramping; voice normal, no stridor yet; HR 88; QTc prolonged on the monitor; Ca²⁺ 7.4 mg/dL, albumin 4.0.", "r": "I believe she has hypocalcemia from parathyroid injury. Please evaluate now; I anticipate an order for IV calcium gluconate with cardiac monitoring and a magnesium level. The tracheostomy tray and suction are at the bedside and seizure precautions are on."}, "bridge": [["Pathophysiology", "Low ionized calcium lowers the firing threshold, so nerves and muscles discharge too easily (tetany, seizures, laryngospasm) and the QT lengthens."], ["Med-Surg", "You protect the airway, check Chvostek and Trousseau, give IV calcium slowly on a monitor, correct magnesium, and teach calcium and vitamin D intake."]], "drugs": [{"generic": "calcium gluconate", "brands": ["No common brand (generic)"], "cls": "Electrolyte replacement (calcium salt)", "moa": "Supplies ionized calcium, raising the threshold potential back to normal so nerves and muscles stop firing spontaneously; restores clotting and cardiac contractility.", "indications": ["==Acute symptomatic hypocalcemia== (tetany, seizures, laryngospasm) (Med-Surg slides: IV calcium gluconate)", "Also used for hyperkalemia and hypermagnesemia"], "dose": [["IV (adults), Davis", "Emergency hypocalcemia: 7 to 14 mEq; hypocalcemic tetany: 4.5 to 16 mEq, repeat until controlled"], ["Administration (Brunner)", "Dilute in D5W; slow IV bolus or slow infusion by pump. ==Not with 0.9% NaCl; never IM.=="]], "assess": {"before": [["Serum Ca²⁺, albumin, Mg²⁺, phosphate", "confirms the deficit and finds the cause"], ["ECG and heart rate", "baseline QT and rhythm"], ["Digoxin use", "calcium potentiates digoxin (toxicity)"], ["IV patency, large vein", "extravasation causes necrosis"]], "after": [["ECG; stop for bradycardia", "rapid calcium can cause arrest"], ["Blood pressure; keep in bed during infusion", "orthostatic hypotension (Brunner)"], ["Chvostek, Trousseau, paresthesias", "therapeutic response"], ["IV site frequently", "infiltration, cellulitis, necrosis"], ["Serum Ca²⁺ every 4 to 6 hours (F&P)", "avoid hypercalcemia"]]}, "effects": {"common": ["Tingling, warmth, chalky taste", "Local irritation"], "serious": ["**Bradycardia, dysrhythmias, cardiac arrest** (rapid push)", "**Hypotension**", "Tissue necrosis with extravasation", "Hypercalcemia"]}, "avoid": {"contra": ["Hypercalcemia, ventricular fibrillation", "Digoxin toxicity (extreme caution)", "Kidney stones (F&P)"], "interactions": ["Digoxin: ↑ toxicity", "Precipitates with phosphate and bicarbonate", "Calcium chloride is not interchangeable (more calcium per mL; more irritating)"]}, "teach": ["Report burning at the IV site, palpitations, or dizziness", "Stay in bed during the infusion"], "verify": ["names"]}, {"generic": "calcium carbonate", "brands": ["Tums", "Os-Cal"], "cls": "Oral calcium supplement (40% elemental calcium)", "moa": "Supplies calcium for absorption in the small intestine (with vitamin D and PTH help) to restore serum and bone calcium over time.", "indications": ["Chronic, nonemergent hypocalcemia and prevention of deficiency (F&P)", "Also an antacid"], "dose": [["PO (adults), Davis", "Prevention of hypocalcemia, treatment of depletion: 1 to 2 g/day (calcium salts)"], ["F&P teaching", "Often 500 mg twice daily; Brunner: divided doses of no more than 500 mg for absorption"]], "assess": {"before": [["Serum Ca²⁺, phosphate, kidney function", "baseline"], ["Other oral medications", "calcium blocks absorption of several drugs"]], "after": [["Serum Ca²⁺", "response"], ["Constipation, anorexia, nausea, thirst, polyuria", "signs of excess (hypercalcemia)"]]}, "effects": {"common": ["Constipation", "Gas, bloating"], "serious": ["**Hypercalcemia**", "Kidney stones", "Milk-alkali syndrome with very high intake"]}, "avoid": {"contra": ["Hypercalcemia, kidney stones, hypophosphatemia, ventricular fibrillation (F&P)"], "interactions": ["Tetracyclines, fluoroquinolones, iron, phenytoin, atenolol: separate by about 2 hours", "Thiazides and vitamin D ↑ calcium", "Bran, spinach, rhubarb, whole grains ↓ absorption", "Digoxin: ↑ toxicity risk"]}, "teach": ["Take with or after meals with a full glass of water", "Separate from iron and antibiotics", "Report constipation, nausea, excessive thirst or urination"], "verify": ["indications"]}], "procedures": [{"name": "Chvostek and Trousseau sign assessment", "kind": "diagnostic", "indication": "Bedside tests for ==latent
