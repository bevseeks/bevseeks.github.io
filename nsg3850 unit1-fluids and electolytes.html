<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NSG 3850 · Unit 1 Interactive Concept Maps</title>
<meta name="description" content="Interactive concept maps for Fluid and Electrolyte Homeostasis and Imbalances: NSG 3850 Pathophysiology II, Unit 1.">
<style>
:root{
  --bg:#f4f6fb;--surface:#ffffff;--surface2:#eef1f8;--text:#161b27;--muted:#566079;--border:#dfe3ee;
  --hypo:#1d4ed8;--hyper:#b91c1c;--ok:#15803d;--bad:#b91c1c;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);
  --ac:#2563eb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420;--surface:#171e2e;--surface2:#1e2638;--text:#e8ecf6;--muted:#9aa5bf;--border:#2a3550;
    --hypo:#8fb0ff;--hyper:#ff9a9a;--ok:#4ade80;--bad:#ff9a9a;--shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420;--surface:#171e2e;--surface2:#1e2638;--text:#e8ecf6;--muted:#9aa5bf;--border:#2a3550;
  --hypo:#8fb0ff;--hyper:#ff9a9a;--ok:#4ade80;--bad:#ff9a9a;--shadow:0 1px 2px rgba(0,0,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;font-size:16px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 0 10px}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:0;font-size:1.25rem;line-height:1.2}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tab{border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:999px;font-weight:600;font-size:.9rem}
.tab[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.9rem}
.prog{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:.8rem;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed,#16a34a,#ea580c);border-radius:99px;transition:width .3s}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:2px solid var(--border);background:var(--surface);border-radius:14px;padding:8px 12px;font-weight:700;font-size:.92rem;box-shadow:var(--shadow)}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--ac)}
.chip[aria-pressed="true"]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--surface))}
.chip small{color:var(--muted);font-weight:600}

/* banner */
.banner{margin:10px 0 14px;border:1px solid var(--border);border-radius:16px;padding:14px 16px;background:var(--surface);
  background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 20%,var(--surface)),var(--surface) 70%);box-shadow:var(--shadow)}
.banner h2{margin:0 0 2px;font-size:1.3rem;color:color-mix(in srgb,var(--ac) 70%,var(--text))}
.normal{display:inline-block;margin:4px 0 6px;padding:3px 10px;border-radius:99px;background:var(--ac);color:#fff;font-weight:700;font-size:.85rem}
.hook{margin:4px 0 0;color:var(--text)}

/* layout */
.grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:900px){.grid{grid-template-columns:400px 1fr}.hubcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.hubcard{padding:10px}
.hubcard svg{width:100%;height:auto;max-width:420px;display:block;margin:0 auto}
.hubnote{text-align:center;font-size:.8rem;color:var(--muted);margin:2px 0 6px}
.hubbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:4px 0 6px}

/* svg hub */
.spoke{stroke:var(--ac);stroke-width:2.5;opacity:.45}
.center{fill:var(--ac)}
.ctext{fill:#fff;font-weight:800;text-anchor:middle}
.node{cursor:pointer;outline:none}
.node circle.n{fill:var(--surface);stroke:var(--ac);stroke-width:3.5;transition:all .15s}
.node:hover circle.n{fill:color-mix(in srgb,var(--ac) 18%,var(--surface))}
.node.active circle.n{fill:var(--ac)}
.node:focus-visible circle.n{stroke-width:6}
.node text.emo{font-size:23px;text-anchor:middle;dominant-baseline:central}
.node text.lbl{fill:var(--text);font-size:12.5px;font-weight:700;text-anchor:middle}
.node.active text.lbl{fill:color-mix(in srgb,var(--ac) 75%,var(--text))}
.node circle.ck{fill:#16a34a;stroke:var(--surface);stroke-width:2}
.node text.ckt{fill:#fff;font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:central}

/* panel */
.panelwrap{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{padding:14px 14px 16px;scroll-margin-top:150px;min-width:0}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pnum{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.phead h3{margin:0;font-size:1.1rem;flex:1;min-width:160px}
.btn{border:1px solid var(--border);background:var(--surface2);padding:6px 11px;border-radius:10px;font-weight:600;font-size:.85rem}
.btn:hover{border-color:var(--ac)}
.btn.done{background:#16a34a;border-color:#16a34a;color:#fff}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:7px 13px;font-weight:700;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.seg button.sh[aria-pressed="true"]{background:var(--hypo);color:#fff}
.seg button.sy[aria-pressed="true"]{background:var(--hyper);color:#fff}
:root[data-theme="dark"] .seg button.sh[aria-pressed="true"],:root[data-theme="dark"] .seg button.sy[aria-pressed="true"]{color:#0f1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.sh[aria-pressed="true"],:root:not([data-theme="light"]) .seg button.sy[aria-pressed="true"]{color:#0f1420}}
.filterrow{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.filterrow span{font-size:.8rem;color:var(--muted);font-weight:600}

.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.group{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:0}
.group.span{grid-column:1/-1}
.group h4{margin:0 0 8px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:color-mix(in srgb,var(--ac) 70%,var(--text))}
.badge{font-size:.7rem;padding:2px 9px;border-radius:99px;font-weight:800;color:#fff;letter-spacing:.02em}
.badge.hypo{background:#1d4ed8}.badge.hyper{background:#b91c1c}
.list{margin:0;padding-left:20px}.list li{margin:4px 0}
.flow{margin:0;padding:0;list-style:none}
.flow li::after{content:"↓";display:block;text-align:center;color:var(--ac);font-weight:800;line-height:1.1;margin:3px 0}
.flow li:last-child::after{display:none}
.step{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.step .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-size:.75rem;font-weight:800;display:grid;place-items:center;margin-top:1px}
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 11px}
.pa{font-weight:700}
.mech{margin-top:3px;color:var(--muted);font-size:.93rem}
.mech .lab{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--ac);margin-right:4px}
.hint{display:none;margin-top:3px;font-size:.82rem;color:var(--ac);font-weight:700}
.recall .pair{cursor:pointer}
.recall .pair:not(.shown) .mech{display:none}
.recall .pair:not(.shown) .hint{display:block}
.recall .pair:not(.shown){border-style:dashed}
.recall .pair:hover{border-color:var(--ac)}
.pnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}

/* self-test */
.quiz{max-width:760px;margin:16px auto}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:14px 0}
.score{display:flex;gap:14px;font-weight:700}
.score b{font-size:1.1rem}
.qcard{padding:18px}
.qtag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--ac);color:#fff;margin-bottom:8px}
.qtext{font-size:1.08rem;font-weight:700;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 13px;border-radius:12px;border:2px solid var(--border);background:var(--surface2);font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.fb{margin-top:10px;font-weight:700}
.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}

/* quick ref */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin:10px 0 22px}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:.9rem}
th,td{padding:9px 11px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--surface2);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.k{font-weight:800;white-space:nowrap}
.refh{margin:20px 0 0;font-size:1.1rem}
.star{color:#d97706;font-weight:800}
.facbadge{font-size:.66rem;padding:2px 8px;border-radius:99px;background:#d97706;color:#fff;font-weight:800;letter-spacing:.02em}
.legend{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.note{font-size:.9rem;color:var(--muted);margin:6px 0 12px}
td.w{font-weight:700}
.bl{margin:6px 0 4px;padding-left:20px}.bl li{margin:4px 0}
footer{color:var(--muted);font-size:.78rem;text-align:center;padding:26px 0 30px}
</style>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>{s=String(s);let pre='';if(s.charAt(0)==='★'){pre='<span class="star" title="Added in the faculty deck">★</span> ';s=s.replace(/^★\s*/,'')}return pre+esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const G=(side,title,items,t,fac)=>({side,title,items,t,fac});
const P=(a,b,fac)=>({a,b,fac});

/* ---------- block metadata ---------- */
const BL=[
  {n:'Core Pathophysiology',short:'Core Patho',icon:'🧬',def:'flow'},
  {n:'Expected Clinical Manifestations',short:'Signs & Sx',icon:'🩺',def:'pairs',lab:'Mechanism'},
  {n:'Labs & Diagnostic Parameters',short:'Labs / Dx',icon:'🧪',def:'list'},
  {n:'Risk Factors & Causes',short:'Risk Factors',icon:'⚠️',def:'list'},
  {n:'Priority Nursing Interventions',short:'Nursing Rx',icon:'💉',def:'pairs',lab:'Rationale'},
  {n:'Complications / Late-Stage',short:'Complications',icon:'🚨',def:'list'}
];

/* ---------- content (built from the Unit 1 slides) ---------- */
const MAPS=[
/* 0 — FVD */
{sym:'FVD',short:'Volume Deficit',title:'Fluid Volume Deficit (Hypovolemia)',color:'#2563eb',split:false,
 normal:'Isotonic loss → serum Na⁺ stays 135–145 mEq/L',
 hook:'Water AND sodium leave together. Acute weight loss is the most sensitive indicator (1 L of saline = 1 kg); the body defends perfusion with SNS, RAAS and ADH.',
 blocks:[
  [G('both','Etiology → Pathogenesis → Resulting state',[
     'Loss of a **sodium-containing (isotonic) fluid** through GI, renal, or "other" routes',
     'Water and sodium lost together → serum Na⁺ stays normal, but total **ECF volume shrinks**',
     'Plasma volume ↓ → venous return ↓ → stroke volume ↓ → **cardiac output ↓**',
     'Tissue/organ perfusion ↓ (kidneys, brain, skin are hit first)'],'flow'),
   G('both','Compensatory mechanisms',[
     '**SNS activation:** baroreceptors sense ↓BP → ↑ heart rate + vasoconstriction to protect perfusion',
     '**RAAS:** ↓ renal perfusion → renin → angiotensin II → aldosterone → renal Na⁺ and water retention',
     '**ADH release:** ↓ volume / ↑ osmolality → renal water reabsorption → oliguria (a compensation, not the primary problem)'],'list'),
   G('both','Faculty pearls',[
     '**1 L of saline weighs 1 kg.** Losing 1 kg in 24 h = 1 L excreted or lost abnormally (you cannot lose 1 kg of fat overnight)',
     'Two categories of fluid imbalance: **ECF volume (saline) imbalances** vs **body fluid concentration (water) imbalances**',
     'Too much ECV deficit → **hypovolemic shock**, fatal without immediate volume replacement'],'list',true)],
  [G('both','Signs & symptoms',[
     P('Acute weight loss — MOST SENSITIVE measure','Direct reflection of fluid lost: 1 L of saline = 1 kg (you cannot lose 1 kg of fat overnight)',true),
     P('Furrows in the tongue','↓ interstitial / mucosal fluid content'),
     P('Postural hypotension','Circulating volume too low to hold BP against gravity when position changes'),
     P('↑ Heart rate','Compensatory SNS response keeping cardiac output up despite ↓ stroke volume'),
     P('Flat neck veins','↓ central venous / vascular volume → ↓ jugular venous pressure'),
     P('Lightheaded, dizziness or syncope','Cerebral hypoperfusion from ↓ circulating volume and BP'),
     P('Oliguria','RAAS + ADH conserving sodium and water to restore volume'),
     P('Poor skin turgor','Loss of the interstitial fluid reservoir')])],
  [G('both','Key parameters',[
     'Serum Na⁺ usually **normal (135–145 mEq/L)**: isotonic loss',
     '**BUN : creatinine > 20:1**: prerenal azotemia',
     '**↑ Hematocrit**: hemoconcentration from plasma loss',
     '**↑ Urine specific gravity**: ADH-driven concentration',
     '**Daily weights**: best trending tool'])],
  [G('both','GI loss',['Emesis','GI suction','Fistulas','Diarrhea']),
   G('both','Renal excretion',['Adrenal insufficiency','Diuretic use','Bed rest']),
   G('both','Other causes',['Paracentesis','Hemorrhage','Third spacing','Burns','Massive diaphoresis'])],
  [G('both','Priority interventions',[
     P('Daily weights + strict I&O','Weight is the most sensitive indicator; a 1 kg change ≈ 1 L of fluid'),
     P('Orthostatic vital signs before ambulation','Detects volume-dependent BP drop and prevents syncope or falls'),
     P('Isotonic IV fluids as ordered (0.9% NS, LR)','Replaces lost isotonic fluid in the vascular space without causing osmotic fluid shifts'),
     P('Monitor urine output closely','Oliguria reflects severity plus RAAS/ADH activity; guides resuscitation')])],
  [G('both','If compensation fails',[
     '**Hypovolemic shock** when SNS / RAAS / ADH are overwhelmed: fatal if volume is not replaced immediately',
     '**Prerenal AKI** from sustained renal hypoperfusion',
     'Cerebral hypoperfusion (altered LOC) and myocardial ischemia'])]
 ]},

/* 1 — FVE */
{sym:'FVE',short:'Volume Excess',title:'Fluid Volume Excess (Hypervolemia) & Edema',color:'#0891b2',split:false,
 normal:'Isotonic expansion → Na⁺ usually normal; weight ↑',
 hook:'Retained sodium holds water. Weight gain comes first; crackles + JVD + bounding pulses mean the volume has reached lungs and vessels.',
 blocks:[
  [G('both','Etiology → Pathogenesis → Resulting state',[
     'Sodium and water **added or retained** → isotonic expansion of the ECF',
     'Plasma volume ↑ → **capillary hydrostatic pressure ↑**',
     'Fluid filters out of capillaries faster than lymphatics / oncotic pressure can return it',
     'Interstitial fluid accumulates → **edema** (local or generalized)',
     'Lungs: fluid crosses into interstitium and alveoli → **pulmonary edema**'],'flow'),
   G('both','Edema: 3 root mechanisms',[
     '**↑ Capillary hydrostatic pressure:** ↑ ECV, ↑ local capillary flow with inflammation, venous congestion → pushes fluid out',
     '**↑ Interstitial oncotic pressure:** inflammation ↑ vascular permeability → proteins leak into the interstitium and pull fluid out',
     '**Blocked lymphatic drainage:** tumor or surgical removal of lymph nodes → lymphedema',
     'Related: ↓ plasma oncotic pressure (hypoalbuminemia) has the same net effect. **Hydrostatic pushes; oncotic pulls.**'],'list'),
   G('both','Compensatory mechanisms',[
     '**ANP / BNP** released from stretched atria and ventricles → natriuresis and diuresis',
     'Baroreceptors try to suppress RAAS and ADH, but in HF, cirrhosis and renal disease RAAS stays pathologically activated and worsens retention'],'list'),
   G('both','Faculty: why each cause retains fluid',[
     '**Hyperaldosteronism:** excess aldosterone → Na⁺ and water retention, hypertension, low K⁺',
     '**Chronic HF:** heart cannot pump effectively. Left-sided is most common: systolic (HFrEF, EF ≤ 40%) or diastolic (HFpEF, EF ≥ 50%)',
     "**Cushing's:** prolonged excess cortisol → Na⁺/water retention (HTN, edema) and ↑ K⁺ excretion (hypokalemia)",
     '**Glomerulonephritis:** inflamed, damaged glomeruli → excess fluid is not filtered into the urine',
     '**Renal disease:** kidneys cannot remove excess fluid as they should',
     '**Steroid therapy (prednisone):** retain Na⁺, lose K⁺ → fluid retention, weight gain, bloating'],'list',true)],
  [G('both','Signs & symptoms',[
     P('Weight gain — MOST SENSITIVE indicator','Direct reflection of retained fluid'),
     P('Edema','↑ hydrostatic pressure pushes fluid into the interstitium faster than lymphatics can clear it'),
     P('Bounding pulses','Expanded intravascular volume ↑ stroke volume against the arterial wall'),
     P('Neck vein distention','↑ central venous volume and pressure'),
     P('Crackles, dyspnea, orthopnea','Fluid in the pulmonary interstitium/alveoli; worse supine because venous return ↑'),
     P('Severe pulmonary edema: SOA, accessory muscle use, cyanosis, ↓ capillary refill','Pulmonary capillary hydrostatic pressure exceeds oncotic/lymphatic capacity → alveolar flooding → impaired gas exchange (cyanosis, ↑ work of breathing, poor perfusion)',true)])],
  [G('both','Key parameters',[
     '**↓ Hematocrit**: hemodilution (opposite of FVD)',
     '**↓ BUN**: dilutional',
     '**↑ BNP**: ventricular stretch, especially in heart failure',
     '**Chest X-ray:** pulmonary vascular congestion, interstitial edema, pleural effusion',
     '**Lung auscultation:** crackles',
     '**Daily weight:** most sensitive trend'])],
  [G('both','Addition / retention of sodium',['Excessive infusion of isotonic solutions']),
   G('both','Renal retention',['Hyperaldosteronism','Chronic heart failure','Cirrhosis',"Cushing's disease",'Glomerulonephritis','Renal disease','Steroid therapy'])],
  [G('both','Priority interventions',[
     P('Daily weights (same time, scale, clothing)','Most sensitive trend for ongoing retention'),
     P('Auscultate lungs; monitor dyspnea and orthopnea each shift','Catches fluid entering the pulmonary interstitium before frank pulmonary edema'),
     P('Semi-Fowler\'s / high-Fowler\'s position','↓ venous return to heart and lungs; eases dyspnea and orthopnea'),
     P('Restrict sodium and fluid; give diuretics as ordered','Removes the volume driving ↑ hydrostatic pressure at the capillary')])],
  [G('both','If untreated',[
     '**Acute pulmonary edema** → impaired oxygenation → respiratory failure',
     '**HF exacerbation:** ↑ preload / afterload burden',
     '**Anasarca** (generalized edema)'])]
 ]},

/* 2 — Sodium */
{sym:'Na⁺',short:'Sodium',title:'Sodium Imbalances',color:'#7c3aed',split:true,hypoName:'Hyponatremia',hyperName:'Hypernatremia',
 normal:'Na⁺ 135–145 mEq/L',
 hook:'THINK BRAIN. Sodium problems are WATER problems: hypo → brain cells swell, hyper → brain cells shrink. Too much Na⁺ = flooding (edema, HTN); too little = drought (confusion, seizures, cerebral edema, hypotension).',
 blocks:[
  [G('hypo','Water shifts INTO cells',[
     'Relatively more water than salt gained (dilutional) OR more salt than water lost (depletional)',
     'Serum Na⁺ falls → **ECF osmolality ↓**',
     'Water moves **INTO cells** by osmosis (ICF is now relatively hypertonic)',
     '**Cells swell**; brain neurons are the dangerous ones',
     'Cerebral edema → ↑ ICP → seizures, coma, herniation'],'flow'),
   G('hyper','Water shifts OUT of cells',[
     'Relatively more salt than water gained, OR more water than salt lost, OR no water access',
     'Serum Na⁺ rises → **ECF osmolality ↑**',
     'Water pulled **OUT of cells** by osmosis',
     '**Cells shrink**; neurons shrivel and thirst centers fire',
     'CNS dysfunction: confusion, lethargy, seizures, coma'],'flow'),
   G('hypo','Compensation',['↓ ADH release → kidneys excrete free water','↑ Aldosterone (RAAS) → renal Na⁺ retention'],'list'),
   G('hyper','Compensation',['**Thirst:** hypothalamic osmoreceptors drive water intake','**ADH** release → renal water conservation (oliguria, concentrated urine)'],'list'),
   G('both','Faculty: THINK BRAIN',[
     '**Any sodium imbalance needs neuro monitoring.** Headache, dizziness, confusion, seizures, coma = fluid balance is off in the brain',
     'Treatment must be considered **slowly, not fast** (e.g., 3% NaCl is used cautiously)',
     'GI tract is salty: **diarrhea** often → hyponatremia, especially if replaced with plain water',
     '**Severe dehydration** → hypernatremia when water loss exceeds sodium loss'],'list',true)],
  [G('hypo','Hyponatremia: cell swelling',[

function nextQ(){
  if(S.quiz.scope==='all'&&Math.random()<0.18){
    const c=CLUES[Math.floor(Math.random()*CLUES.length)];
    S.quiz.q={clue:true,a:c[0],b:c[1],why:c[2],m:{color:'#334155',sym:'Clue'},opts:shuffle(['Sodium','Potassium','Calcium','Magnesium','Phosphate'])};
    S.quiz.answered=false;S.quiz.pick=-1;return;
  }
  const p=pool(S.quiz.scope);
  const q=Object.assign({},p[Math.floor(Math.random()*p.length)]);
  const opts=[q.b];
  const add=list=>{for(const x of shuffle(list)){if(opts.length>=4)break;if(x.bi===q.bi&&!opts.includes(x.b))opts.push(x.b)}};
  add(p);add(pool('all'));
  q.opts=shuffle(opts);
  S.quiz.q=q;S.quiz.answered=false;S.quiz.pick=-1;
}

function refView(){
  return `<h3 class="refh">Electrolytes at a glance</h3>
  <div class="tablewrap"><table><thead><tr><th>Ion</th><th>Normal</th><th>LOW →</th><th>HIGH →</th><th>Exam clue</th></tr></thead><tbody>
  ${REF.map(r=>`<tr><td class="k">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td><b>${esc(r[4])}</b></td></tr>`).join('')}
  </tbody></table></div>
  <h3 class="refh">Fluid volume deficit vs excess</h3>
  <div class="tablewrap"><table style="min-width:520px"><thead><tr><th></th><th>Deficit (FVD)</th><th>Excess (FVE)</th></tr></thead><tbody>
  ${VOL.map(r=>`<tr><td class="k">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}
  </tbody></table></div>
  <h3 class="refh">Patterns to memorize</h3>
  <div class="tablewrap"><table style="min-width:520px"><tbody>
  <tr><td class="k">Excitability</td><td><b>Low</b> Ca²⁺ and <b>low</b> Mg²⁺ → nerves hyperexcitable (Chvostek, Trousseau, tetany). <b>High</b> Ca²⁺ / Mg²⁺ → depressed (↓ DTRs, constipation, bradycardia).</td></tr>
  <tr><td class="k">Membrane potential</td><td>K⁺ is the resting-potential ion: low K⁺ hyperpolarizes (weak, ileus); high K⁺ depolarizes (peaked T, arrest).</td></tr>
  <tr><td class="k">Water shifts</td><td>Hyponatremia: water moves <b>into</b> cells (swell). Hypernatremia: water moves <b>out</b> (shrink).</td></tr>
  <tr><td class="k">Reciprocal pair</td><td>Phosphate ↑ ↔ calcium ↓ (and the reverse). Low phosphate also means low ATP.</td></tr>
  <tr><td class="k">Most sensitive</td><td>Weight change is the most sensitive indicator for both fluid deficit and excess.</td></tr>
  </tbody></table></div>`;
}

/* ---------- render ---------- */
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
}
function render(keepScroll=true){
  const y=window.scrollY;
  document.documentElement.classList.toggle('recall',S.recall);
  applyTheme();
  const total=MAPS.length*6;
  const n=Object.keys(S.done).filter(k=>S.done[k]).length;
  $('#app').innerHTML=headerHTML(n,total)+`<main class="wrap">${S.view==='maps'?mapsView():S.view==='quiz'?quizView():S.view==='found'?foundView():refView()}<footer>Built from the NSG 3850 Unit 1 student slides + faculty-added content (W26) · study aid, not clinical advice</footer></main>`;
  if(keepScroll)window.scrollTo(0,y);
}
function scrollToPanel(){
  if(window.matchMedia('(max-width:899px)').matches){
    const el=document.querySelector('.panel');
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
function step(d){
  if(S.all)return;
  let b=S.block+d,m=S.map;
  if(b>5){if(m<MAPS.length-1){m++;b=0}else b=5}
  if(b<0){if(m>0){m--;b=5}else b=0}
  if(m!==S.map){S.map=m;S.side='both'}
  S.block=b;render(false);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='reveal'){t.classList.toggle('shown');return}
  if(a==='revealall'){
    const ps=[...document.querySelectorAll('.pair')];
    const allShown=ps.every(p=>p.classList.contains('shown'));
    ps.forEach(p=>p.classList.toggle('shown',!allShown));return;
  }
  if(a==='view'){S.view=t.dataset.v;if(S.view==='quiz')S.quiz.q=null;render(false);window.scrollTo(0,0)}
  else if(a==='map'){S.map=+t.dataset.i;S.block=0;S.side='both';S.quiz.q=null;render(false);}
  else if(a==='block'){S.block=+t.dataset.i;S.all=false;render(false);scrollToPanel()}
  else if(a==='side'){S.side=t.dataset.s;render()}
  else if(a==='all'){S.all=!S.all;render(false)}
  else if(a==='done'){const k=doneKey(S.map,+t.dataset.i);S.done[k]=!S.done[k];store.set('done',S.done);render()}
  else if(a==='step'){step(+t.dataset.d)}
  else if(a==='recall'){S.recall=!S.recall;store.set('recall',S.recall);render()}
  else if(a==='theme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';store.set('theme',S.theme);render()}
  else if(a==='qscope'){S.quiz.scope=t.dataset.s;S.quiz.q=null;render()}
  else if(a==='opt'){
    const Q=S.quiz;if(Q.answered)return;
    Q.answered=true;Q.pick=+t.dataset.i;Q.total++;
    if(Q.q.opts[Q.pick]===Q.q.b){Q.score++;Q.streak++}else Q.streak=0;
    render();
  }
  else if(a==='qnext'){nextQ();render()}
  else if(a==='qreset'){Object.assign(S.quiz,{score:0,total:0,streak:0});nextQ();render()}
});
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(el&&el.matches&&el.matches('.pair,.node')&&(e.key==='Enter'||e.key===' ')){
    e.preventDefault();el.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;
  }
  if(S.view==='maps'&&!(el&&el.matches&&el.matches('input,textarea,select'))){
    if(e.key==='ArrowRight')step(1);
    else if(e.key==='ArrowLeft')step(-1);
  }
});

render(false);
</script>
